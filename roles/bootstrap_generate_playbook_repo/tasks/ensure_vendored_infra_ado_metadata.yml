---
# Controller jobs resolve infra.automation_development_office.* FQCN roles from the vendored collection
# tree in the git project. Ansible requires galaxy.yml at the collection root.
# Contoller project sync installs this via collections/requirements.yml
# (type: dir). Galaxy/Hub must NOT resolve runtime dependencies (e.g. amazon.aws)
# from that install — lab Hub TLS often fails and stock EEs already provide
# those collections. Always write dependencies: {} into the vendored metadata.

- name: Generate playbook repo | Ensure vendored infra.automation_development_office galaxy.yml and ansible.cfg
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    import json
    from pathlib import Path

    import yaml

    dest_root = Path("{{ bootstrap_generate_playbook_repo_dest_resolved }}")
    src_root = Path("{{ (role_path | dirname | dirname) }}")
    vendored = dest_root / "collections" / "ansible_collections" / "infra" / "automation_development_office"
    vendored.mkdir(parents=True, exist_ok=True)

    fallback = yaml.safe_load(
        Path("{{ role_path }}/files/vendored_galaxy.yml").read_text()
    )
    if not isinstance(fallback, dict):
        fallback = {
            "namespace": "infra",
            "name": "automation_development_office",
            "version": "1.3.1",
            "readme": "README.md",
            "authors": ["Automation Development Office"],
            "description": (
                "Automation Development Office roles vendored into the bootstrap "
                "playbook repo for disconnected Controller job runs."
            ),
            "license_file": "LICENSE",
            "dependencies": {},
        }

    src_galaxy = src_root / "galaxy.yml"
    if src_galaxy.is_file():
        galaxy_data = yaml.safe_load(src_galaxy.read_text()) or {}
        if not isinstance(galaxy_data, dict):
            galaxy_data = dict(fallback)
    else:
        galaxy_data = dict(fallback)
        manifest = src_root / "MANIFEST.json"
        files_json = src_root / "FILES.json"
        version = str(galaxy_data.get("version") or "1.3.1")
        if manifest.is_file():
            try:
                info = json.loads(manifest.read_text()).get("collection_info") or {}
                version = str(info.get("version") or version)
            except json.JSONDecodeError:
                pass
        elif files_json.is_file():
            try:
                info = json.loads(files_json.read_text()).get("collection_info") or {}
                version = str(info.get("version") or version)
            except json.JSONDecodeError:
                pass
        galaxy_data["version"] = version
        galaxy_data.setdefault("namespace", "infra")
        galaxy_data.setdefault("name", "automation_development_office")
        galaxy_data.setdefault("readme", "README.md")
        galaxy_data.setdefault("authors", ["Automation Development Office"])
        galaxy_data.setdefault("license_file", "LICENSE")

    # Offline Contoller install: never ask Galaxy/Hub for amazon.aws etc.
    galaxy_data["dependencies"] = {}
    galaxy_data.setdefault("description", fallback.get("description"))

    galaxy_path = vendored / "galaxy.yml"
    galaxy_path.write_text(
        yaml.safe_dump(galaxy_data, sort_keys=False, default_flow_style=False)
    )
    galaxy_path.chmod(0o644)

    # rsync may copy MANIFEST.json from an installed collection; strip deps there
    # too so ansible-galaxy type:dir does not resolve them from Hub.
    for meta_name in ("MANIFEST.json",):
        meta_path = vendored / meta_name
        if not meta_path.is_file():
            continue
        try:
            meta = json.loads(meta_path.read_text())
        except json.JSONDecodeError:
            continue
        info = meta.get("collection_info")
        if isinstance(info, dict):
            info["dependencies"] = {}
            meta_path.write_text(json.dumps(meta, indent=4) + "\n")
            meta_path.chmod(0o644)

    ansible_cfg = dest_root / "ansible.cfg"
    ansible_cfg.write_text(
        "\n".join(
            [
                "[defaults]",
                "host_key_checking = False",
                "retry_files_enabled = False",
                "stdout_callback = default",
                "interpreter_python = auto_silent",
                (
                    "collections_paths = /runner/project/collections:"
                    "/workspace/collections:./collections:"
                    "/usr/share/ansible/collections"
                ),
                "",
            ]
        )
    )
    ansible_cfg.chmod(0o644)

    print(
        f"vendored_galaxy_yml={galaxy_path} "
        f"version={galaxy_data.get('version', '')} "
        f"dependencies=none "
        f"ansible_cfg={ansible_cfg}"
    )
    PYCODE
  args:
    executable: /bin/bash
  register: bootstrap_generate_playbook_repo_vendored_metadata
  changed_when: true
  when: not (bootstrap_generate_playbook_repo_use_hub_galaxy | bool)

- name: Generate playbook repo | Assert vendored galaxy.yml exists for Controller
  ansible.builtin.stat:
    path: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/collections/ansible_collections/infra/automation_development_office/galaxy.yml
  register: bootstrap_generate_playbook_repo_vendored_galaxy_stat
  when: not (bootstrap_generate_playbook_repo_use_hub_galaxy | bool)

- name: Generate playbook repo | Fail when vendored galaxy.yml is missing
  ansible.builtin.assert:
    that:
      - bootstrap_generate_playbook_repo_vendored_galaxy_stat.stat.exists | bool
    fail_msg: >-
      Bootstrap did not write collections/ansible_collections/infra/automation_development_office/galaxy.yml
      into the playbook repo. Controller jobs cannot resolve infra.automation_development_office.* roles
      without it.
  when: not (bootstrap_generate_playbook_repo_use_hub_galaxy | bool)
