---
# yamllint disable rule:line-length
- name: Generate playbook repo | Resolve destination
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_dest_resolved: >-
      {{
        bootstrap_generate_playbook_repo_dest
        | default(playbook_dir, true)
      }}

- name: Generate playbook repo | Ensure repo root exists
  ansible.builtin.file:
    path: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    state: directory
    mode: "0755"

- name: Generate playbook repo | Ensure playbooks directory exists
  ansible.builtin.file:
    path: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/playbooks
    state: directory
    mode: "0755"

- name: Generate playbook repo | Ensure configs directory exists
  ansible.builtin.file:
    path: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/configs
    state: directory
    mode: "0755"

- name: Generate playbook repo | Copy seed repo content
  ansible.builtin.copy:
    src: "{{ bootstrap_generate_playbook_repo_seed_src }}/"
    dest: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/"
    mode: preserve
    force: >-
      {{ bootstrap_generate_playbook_repo_force | default(false) | bool }}
  when: bootstrap_generate_playbook_repo_seed_src is defined

- name: Generate playbook repo | Ensure collections directory exists
  ansible.builtin.file:
    path: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/collections"
    state: directory
    mode: "0755"

- name: Generate playbook repo | Controller collections always from Hub (never vendored in git)
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_use_hub_galaxy: true

- name: Generate playbook repo | Load Hub collections manifest for requirements
  ansible.builtin.include_tasks: load_hub_collections_manifest.yml

- name: Generate playbook repo | Render collection requirements for Hub/Galaxy
  ansible.builtin.template:
    src: requirements.yml.j2
    dest: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/collections/requirements.yml
    mode: "0644"

- name: Generate playbook repo | Write ansible.cfg (Galaxy cert verify follows preflight)
  ansible.builtin.template:
    src: ansible.cfg.j2
    dest: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/ansible.cfg"
    mode: "0644"
    force: true

- name: Generate playbook repo | Remove vendored collection trees from git
  ansible.builtin.include_tasks: remove_vendored_collections_from_git.yml

- name: Generate playbook repo | Assert git repo has Hub requirements only
  ansible.builtin.include_tasks: assert_hub_requirements.yml

- name: Generate playbook repo | Load RHEL system roles catalog into maps
  ansible.builtin.include_tasks: load_rhel_system_roles_catalog.yml

- name: Generate playbook repo | Normalize component selector
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_component_effective: >-
      {{
        component
        | default(playbook_component, true)
        | default(bootstrap_generate_playbook_repo_component, true)
        | default('all', true)
      }}

- name: Generate playbook repo | Resolve selected apps from component
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_apps: >-
      {{
        (
          bootstrap_generate_playbook_repo_selected_components
          + (
              ['rhel']
              if (
                'patching'
                in bootstrap_generate_playbook_repo_selected_components
              )
              else []
            )
          if (
            bootstrap_generate_playbook_repo_selected_components is defined
            and (
              bootstrap_generate_playbook_repo_selected_components
              | length > 0
            )
          )
          else
          bootstrap_generate_playbook_repo_component_map[
            bootstrap_generate_playbook_repo_component_effective
          ] | default([])
        )
        | unique
        | list
      }}

- name: Generate playbook repo | Validate component selector
  ansible.builtin.assert:
    that:
      - >-
        bootstrap_generate_playbook_repo_component_effective
        in bootstrap_generate_playbook_repo_component_map
    fail_msg: >-
      Invalid component
      '{{ bootstrap_generate_playbook_repo_component_effective }}'.
      Valid components:
      {{ bootstrap_generate_playbook_repo_component_map.keys() | list }}

- name: Generate playbook repo | Select playbooks by component
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_playbooks: >-
      {{
        bootstrap_generate_playbook_repo_generated_playbooks
        if (
          bootstrap_generate_playbook_repo_component_effective == 'all'
          and (
            bootstrap_generate_playbook_repo_selected_components
            is not defined
            or (
              bootstrap_generate_playbook_repo_selected_components
              | length == 0
            )
          )
        )
        else
        bootstrap_generate_playbook_repo_generated_playbooks
        | selectattr(
            'app',
            'in',
            bootstrap_generate_playbook_repo_selected_apps
          )
        | list
      }}

# Match Contoller workflow/JT gates: cert_manager app covers four playbooks, but
# Default Ingress alone must not pull IdM ACME / AWSPCA; those follow mode.
# Skip when dumping the full catalog (component=all, no selected_components).
- name: Generate playbook repo | Resolve cert_manager mode and ingress flag
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_cert_manager_mode: >-
      {{
        bootstrap_controller_cert_manager_mode
        | default(ocp_cert_manager_mode | default('cert', true), true)
      }}
    bootstrap_generate_playbook_repo_update_default_ingress: >-
      {{
        bootstrap_controller_update_default_ingress
        | default(update_default_ingress | default(false), true)
        | bool
      }}
    bootstrap_generate_playbook_repo_cert_manager_gate: >-
      {{
        not (
          bootstrap_generate_playbook_repo_component_effective == 'all'
          and (
            bootstrap_generate_playbook_repo_selected_components is not defined
            or (
              bootstrap_generate_playbook_repo_selected_components
              | length == 0
            )
          )
        )
      }}

- name: Generate playbook repo | Drop IdM ACME unless mode is idm_acme
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_playbooks: >-
      {{
        bootstrap_generate_playbook_repo_selected_playbooks
        | rejectattr(
            'dest',
            'equalto',
            'playbooks/cert-manager/ado-configure-idm-acme-clusterissuer.yml'
          )
        | rejectattr(
            'dest',
            'equalto',
            'playbooks/cert-manager/configure-idm-acme-clusterissuer-tasks.yml'
          )
        | list
      }}
  when:
    - bootstrap_generate_playbook_repo_cert_manager_gate | bool
    - >-
      bootstrap_generate_playbook_repo_cert_manager_mode | default('cert')
      != 'idm_acme'

- name: Generate playbook repo | Drop AWSPCA unless mode is aws_pca
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_playbooks: >-
      {{
        bootstrap_generate_playbook_repo_selected_playbooks
        | rejectattr(
            'dest',
            'equalto',
            'playbooks/cert-manager/ado-install-and-configure-awspca-bootstrap.yml'
          )
        | list
      }}
  when:
    - bootstrap_generate_playbook_repo_cert_manager_gate | bool
    - >-
      bootstrap_generate_playbook_repo_cert_manager_mode | default('cert')
      != 'aws_pca'

- name: Generate playbook repo | Drop default ingress unless enabled
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_playbooks: >-
      {{
        bootstrap_generate_playbook_repo_selected_playbooks
        | rejectattr(
            'dest',
            'equalto',
            'playbooks/cert-manager/ado-update-default-ingress-cert-bootstrap.yml'
          )
        | list
      }}
  when:
    - bootstrap_generate_playbook_repo_cert_manager_gate | bool
    - >-
      not (
        bootstrap_generate_playbook_repo_update_default_ingress
        | default(false)
        | bool
      )

- name: Generate playbook repo | Build selected playbook directories
  ansible.builtin.set_fact:
    bootstrap_generate_playbook_repo_selected_dirs: >-
      {{
        bootstrap_generate_playbook_repo_selected_playbooks
        | map(attribute='dest')
        | map('dirname')
        | map('basename')
        | unique
        | list
      }}

- name: Generate playbook repo | Find existing playbook component directories
  ansible.builtin.find:
    paths: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/playbooks"
    file_type: directory
    recurse: false
  register: bootstrap_generate_playbook_repo_existing_dirs

- name: Generate playbook repo | Remove stale playbook component directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{
      bootstrap_generate_playbook_repo_existing_dirs.files
      | default([])
    }}
  when:
    - item.path | basename not in bootstrap_generate_playbook_repo_selected_dirs

- name: Generate playbook repo | Find existing playbook files
  ansible.builtin.find:
    paths: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/playbooks"
    file_type: file
    patterns: "*.yml"
    recurse: true
  register: bootstrap_generate_playbook_repo_existing_files

- name: Generate playbook repo | Remove playbooks dropped by mode or selection
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{
      bootstrap_generate_playbook_repo_existing_files.files
      | default([])
    }}
  vars:
    bootstrap_generate_playbook_repo_selected_dests: >-
      {{
        bootstrap_generate_playbook_repo_selected_playbooks
        | map(attribute='dest')
        | list
      }}
    bootstrap_generate_playbook_repo_existing_rel: >-
      {{
        item.path
        | regex_replace('^.*/playbooks/', 'playbooks/')
      }}
  when:
    - item.path is search('/playbooks/')
    - >-
      bootstrap_generate_playbook_repo_existing_rel
      not in bootstrap_generate_playbook_repo_selected_dests

- name: Generate playbook repo | Ensure playbook component directories exist
  ansible.builtin.file:
    path: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/{{ item.dest | dirname }}
    state: directory
    mode: "0755"
  loop: "{{ bootstrap_generate_playbook_repo_selected_playbooks }}"

- name: >-
    Generate playbook repo | Copy selected playbooks into existing
    playbooks directory
  ansible.builtin.copy:
    src: "playbooks/{{ item.src }}"
    dest: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/{{ item.dest }}
    mode: "0644"
    force: >-
      {{ bootstrap_generate_playbook_repo_force | default(false) | bool }}
  loop: "{{ bootstrap_generate_playbook_repo_selected_playbooks }}"

- name: Generate playbook repo | Write local execution catalog
  ansible.builtin.copy:
    content: "{{ bootstrap_generate_playbook_repo_selected_playbooks | to_nice_json }}"
    dest: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/.component-catalog.json"
    mode: "0644"

- name: Generate playbook repo | Copy local component runner
  ansible.builtin.copy:
    src: local_components.py
    dest: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/local_components.py"
    mode: "0644"

- name: Generate playbook repo | Build local component execution plan
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/local_components.py"
      - --repo
      - "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
      - --build
      - "{{ bootstrap_generate_playbook_repo_dest_resolved }}/.component-catalog.json"
      - --controller-role
      - "{{ role_path }}/../bootstrap_controller"
      - --environment
      - "{{ env }}"
  register: bootstrap_generate_playbook_repo_local_plan
  changed_when: "bootstrap_generate_playbook_repo_local_plan.stdout == 'updated'"

- name: >-
    Generate playbook repo | Render controller project config from
    repo URL when provided
  ansible.builtin.template:
    src: controller_projects.yml.j2
    dest: >-
      {{
        bootstrap_generate_playbook_repo_dest_resolved
      }}/configs/controller_projects.yml
    mode: "0644"
  when: bootstrap_generate_playbook_repo_git_url | default('') | length > 0

- name: Generate playbook repo | Show generated repo summary
  ansible.builtin.debug:
    msg:
      - >-
        Repo root:
        {{ bootstrap_generate_playbook_repo_dest_resolved }}
      - >-
        Playbooks directory:
        {{ bootstrap_generate_playbook_repo_dest_resolved }}/playbooks
      - >-
        Configs directory:
        {{ bootstrap_generate_playbook_repo_dest_resolved }}/configs
      - >-
        Component:
        {{ bootstrap_generate_playbook_repo_component_effective }}
      - >-
        Selected apps:
        {{ bootstrap_generate_playbook_repo_selected_apps }}
      - >-
        Generated playbooks:
        {{
          bootstrap_generate_playbook_repo_selected_playbooks
          | map(attribute='dest')
          | list
        }}

- name: Generate playbook repo | Git init  # noqa command-instead-of-module
  ansible.builtin.command: >-
    git init -b
    {{ bootstrap_generate_playbook_repo_git_branch | default('main') }}
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    creates: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/.git"
  changed_when: false
  when: bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'

- name: Generate playbook repo | Configure git credential helper (basic auth)
  ansible.builtin.shell: |
    set -euo pipefail
    git config credential.helper store
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: false
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_token | default('') | length > 0
    - bootstrap_generate_playbook_repo_git_auth_mode | default('basic') != 'bearer'

- name: Generate playbook repo | Write git credentials (basic auth)
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME | default('/tmp') }}/.git-credentials"
    mode: "0600"
    content: >-
      {{
        bootstrap_generate_playbook_repo_git_url
        | regex_replace(
            '^(https?://)(.*)$',
            '\\1'
            ~
            (
              bootstrap_generate_playbook_repo_git_username
              | default('oauth2')
              | urlencode
            )
            ~ ':'
            ~ (bootstrap_generate_playbook_repo_git_token | urlencode)
            ~ '@\\2'
          )
      }}
  no_log: true
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_url | default('') | length > 0
    - bootstrap_generate_playbook_repo_git_token | default('') | length > 0
    - bootstrap_generate_playbook_repo_git_auth_mode | default('basic') != 'bearer'

- name: Generate playbook repo | Configure Bearer auth header (Bitbucket)
  community.general.git_config:
    name: http.extraHeader
    value: "Authorization: Bearer {{ bootstrap_generate_playbook_repo_git_token }}"
    scope: local
    repo: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
  no_log: true
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_token | default('') | length > 0
    - bootstrap_generate_playbook_repo_git_auth_mode | default('basic') == 'bearer'

- name: Generate playbook repo | Disable git terminal prompts
  community.general.git_config:
    name: core.askPass
    value: "true"
    scope: local
    repo: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
  when: bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'

- name: Generate playbook repo | Configure git remote
  ansible.builtin.shell: |
    set -euo pipefail
    remote_name={{
      bootstrap_generate_playbook_repo_git_remote
      | default('origin')
      | quote
    }}
    remote_url={{ bootstrap_generate_playbook_repo_git_url | quote }}

    if git remote | grep -qx "$remote_name"; then
      git remote set-url "$remote_name" "$remote_url"
    else
      git remote add "$remote_name" "$remote_url"
    fi
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: true
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_url | default('') | length > 0

- name: Generate playbook repo | Generate optional delivery artifacts
  ansible.builtin.include_tasks: generate_delivery.yml
  when: env is defined

- name: Generate playbook repo | Ignore plaintext preflight secrets
  ansible.builtin.blockinfile:
    path: "{{ bootstrap_generate_playbook_repo_dest_resolved }}/.gitignore"
    create: true
    mode: "0644"
    marker: "# {mark} ADO preflight secrets"
    block: |
      ado-preflight-*.json
      !ado-preflight-*.json.vault.yml
      ado-extra-vars.json
      .vault_pass
      .vault_pass.*
  when: bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'

- name: Generate playbook repo | Untrack plaintext preflight JSON if previously committed
  ansible.builtin.shell: |
    set -euo pipefail
    git ls-files -z -- 'ado-preflight-*.json' 'ado-extra-vars.json' '.vault_pass' 2>/dev/null \
      | while IFS= read -r -d '' f; do
          case "$f" in
            *.json.vault.yml) continue ;;
          esac
          git rm -f --cached -- "$f" || true
        done
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: true
  when: bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'

- name: Generate playbook repo | Commit generated files
  ansible.builtin.shell: |
    set -euo pipefail
    git add -A
    git diff --cached --quiet || \
      git commit -m "Generate bootstrap playbook repo"
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: true
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'

- name: Generate playbook repo | Sync remote branch before push
  ansible.builtin.shell: |
    set -euo pipefail
    remote_name={{
      bootstrap_generate_playbook_repo_git_remote
      | default('origin')
      | quote
    }}
    branch_name={{
      bootstrap_generate_playbook_repo_git_branch
      | default('main')
      | quote
    }}

    if git ls-remote \
      --exit-code \
      --heads \
      "$remote_name" \
      "$branch_name" \
      >/dev/null; then
      git fetch "$remote_name" "$branch_name"
      git rebase FETCH_HEAD
    else
      rc=$?
      if [ "$rc" -eq 2 ]; then
        echo "Remote branch $remote_name/$branch_name does not exist yet;"
        echo "skipping sync."
      else
        exit "$rc"
      fi
    fi
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: >-
    'Current branch'
    not in bootstrap_generate_playbook_repo_git_sync_result.stdout
  register: bootstrap_generate_playbook_repo_git_sync_result
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_url | default('') | length > 0
    - >-
      bootstrap_generate_playbook_repo_git_sync_before_push
      | default(true)
      | bool

- name: Generate playbook repo | Push generated repo
  ansible.builtin.shell: |
    set -euo pipefail
    git push \
      {{ bootstrap_generate_playbook_repo_git_remote | default('origin') }} \
      {{ bootstrap_generate_playbook_repo_git_branch | default('main') }}
  args:
    chdir: "{{ bootstrap_generate_playbook_repo_dest_resolved }}"
    executable: /bin/bash
  changed_when: >-
    'up-to-date'
    not in bootstrap_generate_playbook_repo_git_push_result.stderr
  register: bootstrap_generate_playbook_repo_git_push_result
  when:
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'push'
    - bootstrap_generate_playbook_repo_git_url | default('') | length > 0

- name: Generate playbook repo | Pause for manual git push
  ansible.builtin.pause:
    prompt: >-
      {{
        bootstrap_generate_playbook_repo_pause_prompt
        | default(
              'Playbooks were generated. Push them to Git now, '
              ~ 'then press ENTER to continue.'
          )
      }}
  when:
    - >-
      bootstrap_generate_playbook_repo_pause_after_generate
      | default(false)
      | bool
    - bootstrap_generate_playbook_repo_git_mode | default('manual') == 'manual'
