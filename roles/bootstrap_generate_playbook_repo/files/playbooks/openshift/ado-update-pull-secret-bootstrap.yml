---
# Outside Controller, from the bootstrap repo:
# ansible-playbook \
#   playbooks/openshift/ado-update-pull-secret-bootstrap.yml \
#   -e env=<env>
# Uses group_vars for that env. No Controller object is required.
- name: ADO | Update OpenShift pull secret
  hosts: localhost
  gather_facts: false
  vars:
    component: pull_secret
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks: null
  roles:
    - role: infra.automation_development_office.ocp_pull_secrets
