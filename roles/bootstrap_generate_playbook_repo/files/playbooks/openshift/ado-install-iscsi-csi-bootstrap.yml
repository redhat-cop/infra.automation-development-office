---
- name: ADO | Install Synology iSCSI CSI storage driver
  hosts: localhost
  gather_facts: false
  vars:
    component: openshift
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host) }}"
    K8S_AUTH_API_KEY: "{{ token }}"
    K8S_AUTH_VERIFY_SSL: >-
      {{ (verify_ssl | default(false) | bool) | ternary('yes', 'no') }}
  roles:
    - role: infra.automation_development_office.ocp_iscsi_storage
      vars:
        ocp_iscsi_storage_connection:
          host: "{{ host }}"
          api_key: "{{ token }}"
          validate_certs: "{{ verify_ssl | default(false) | bool }}"
