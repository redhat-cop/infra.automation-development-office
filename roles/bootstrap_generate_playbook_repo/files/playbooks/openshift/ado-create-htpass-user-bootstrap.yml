---
- name: ADO | Configure htpass-admin-user
  hosts: localhost
  gather_facts: false
  vars:
    component: htpass_admin
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_openshift.yml"
    # Load dedicated htpasswd vault LAST so it wins over any stale
    # vault_openshift htpasswd_users (and over the admin_htpasswd stub name).
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_admin_htpasswd.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_admin_htpasswd.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: >-
      {{ (verify_ssl | bool) | ternary('yes', 'no') }}
  pre_tasks:
    - name: >-
        ADO | Resolve vars for component from framework defaults + env
        overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
  roles:
    - infra.ado.ocp_htpasswd_admin
