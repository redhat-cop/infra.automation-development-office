---
- name: ADO | Configure OpenShift OAuth with RHBK
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component
    - name: ADO | Normalize OIDC vars from RHBK form
      ansible.builtin.set_fact:
        ocp_rhbk_hostname: >-
          {{
            (
              ocp_rhbk_hostname
              | default(rhbk_hostname, true)
              | default(rhbk_host, true)
              | default(hostname, true)
              | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))), true)
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        rhbk_hostname: >-
          {{
            (
              rhbk_hostname
              | default(ocp_rhbk_hostname, true)
              | default(rhbk_host, true)
              | default(hostname, true)
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        ocp_rhbk_realm: "{{ ocp_rhbk_realm | default(rhbk_realm | default(realm | default('rhlab', true), true), true) }}"
        rhbk_realm: "{{ rhbk_realm | default(ocp_rhbk_realm | default(realm | default('rhlab', true), true), true) }}"
        ocp_rhbk_admin_user: "{{ ocp_rhbk_admin_user | default(rhbk_admin_user | default('admin', true), true) }}"
        ocp_rhbk_admin_password: "{{ ocp_rhbk_admin_password | default(rhbk_admin_password | default('redhat123', true), true) }}"
        openshift_oidc_auth: >-
          {{
            {
              'keycloak_client_id': (openshift_oidc_client_id | default(rhbk_client | default(''))),
              'openshift_oidc_idp_name': (openshift_oidc_idp_name | default('Keycloak')),
              'openshift_oidc_mapping_method': 'claim',
              'openshift_oauth_resource_name': 'cluster'
            }
            | combine(openshift_oidc_auth | default({}), recursive=True)
          }}
      no_log: "{{ ocp_rhbk_no_log | default(true) | bool }}"
  roles:
    - role: infra.automation_development_office.ocp_oidc_auth
