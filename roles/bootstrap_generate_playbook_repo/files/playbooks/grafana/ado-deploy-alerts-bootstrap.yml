---
- name: ADO | Upload Grafana alerts
  hosts: localhost
  gather_facts: false
  vars:
    component: grafana
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host) | default(omit) }}"
    K8S_AUTH_API_KEY: "{{ token | default(omit) }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | default(false) | bool) | ternary('yes', 'no') }}"
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Enable alerts when alerts JT is launched
      ansible.builtin.set_fact:
        grafana_alerts_enabled: true
  roles:
    - role: infra.ado.grafana_upload_alerts
