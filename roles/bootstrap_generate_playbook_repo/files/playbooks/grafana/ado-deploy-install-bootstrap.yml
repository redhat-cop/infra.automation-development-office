---
- name: ADO | Deploy Grafana on OpenShift (operator + instance)
  hosts: localhost
  gather_facts: false
  vars:
    component: grafana
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Normalize Grafana OpenShift hostname
      ansible.builtin.set_fact:
        # Prefer OpenShift route hostname over any poisoned standalone VM hostname.
        grafana_hostname: >-
          {{
            (
              hostname
              | default(grafana_hostname, true)
              | default(grafana_install_hostname, true)
              | default(install_grafana_hostname, true)
              | default('')
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        grafana_install_hostname: >-
          {{
            (
              hostname
              | default(grafana_install_hostname, true)
              | default(grafana_hostname, true)
              | default(install_grafana_hostname, true)
              | default('')
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        install_grafana_hostname: >-
          {{
            (
              hostname
              | default(install_grafana_hostname, true)
              | default(grafana_hostname, true)
              | default('')
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
    - name: ADO | Force Grafana OLM channel v5 (catalog has v5, not version pins)
      ansible.builtin.set_fact:
        operator_channel: v5
        operator_name: grafana-operator
        operator_source: community-operators
        operator_source_namespace: openshift-marketplace
        operator_csv_contains: grafana-operator
        operator_name_substring: grafana-operator
    - name: ADO | Install operator/instance only (OIDC/email are separate optional JTs)
      ansible.builtin.set_fact:
        grafana_install_scope: install
        grafana_install_include_oidc: false
        grafana_install_include_email: false
        oidc: "{{ (oidc | default({})) | combine({'enabled': false}, recursive=True) }}"
  roles:
    - role: infra.ado.ocp_namespace
    - role: infra.ado.ocp_operatorgroups
    - role: infra.ado.ocp_operator_subscription
    - role: infra.ado.ocp_wait_operator
    - role: infra.ado.grafana_install
    - role: infra.ado.ocp_wait_pods
