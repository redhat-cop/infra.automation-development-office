---
# yamllint disable rule:line-length
- name: ADO | Terraform plan
  hosts: localhost
  gather_facts: false
  vars:
    component: terraform
    terraform_action: plan
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_aws.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_aws.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_terraform.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_terraform.yml"
  tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component

    - name: ADO | Plan the Terraform stack
      ansible.builtin.include_role:
        name: infra.ado.terraform
# yamllint enable rule:line-length
