---
# Seed playbook: wire NetBox OIDC to Keycloak / RHBK.
- name: ADO | Configure NetBox OIDC (Keycloak / RHBK)
  hosts: localhost
  gather_facts: false
  vars:
    component: netbox
    netbox_oidc_state: "{{ state | default('present') }}"
    netbox_oidc_validate_certs: "{{ not (skip_tls_verify | default(true) | bool) }}"
    netbox_oidc_client_id: "{{ netbox_oidc_client_id | default(oidc_client_id | default('netbox', true), true) }}"
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_netbox.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_netbox.yml"
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host) }}"
    K8S_AUTH_API_KEY: "{{ token }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | bool) | ternary('yes', 'no') }}"
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
  roles:
    - role: infra.ado.netbox_oidc
