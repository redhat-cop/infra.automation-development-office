---
- name: ADO | Deploy Kafka Operator via framework
  hosts: localhost
  gather_facts: false
  vars:
    component: kafka
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component
    - name: ADO | Enable Kafka CR + route by default for bootstrap
      ansible.builtin.set_fact:
        kafka_install_create_cr: "{{ kafka_install_create_cr | default(true) | bool }}"
        kafka_install_create_route: "{{ kafka_install_create_route | default(true) | bool }}"
        kafka_install_route_domain: >-
          {{
            kafka_install_route_domain
            | default(apps_domain)
            | default(app_domain)
            | default('')
          }}
        kafka_install_replicas: >-
          {{ (kafka_install_replicas | default(1)) | int }}
        kafka_install_image: >-
          {{ kafka_install_image | default('confluentinc/cp-server:7.6.0') }}
  roles:
    - role: infra.automation_development_office.ocp_namespace
    - role: infra.automation_development_office.ocp_operatorgroups
    - role: infra.automation_development_office.ocp_operator_subscription
    - role: infra.automation_development_office.kafka_install
    - role: infra.automation_development_office.ocp_routes
