---
# yamllint disable rule:line-length
# RHBK OpenShift deploy / uninstall.
# Present: namespace → OG → Subscription → wait operator → Keycloak CR → pods/routes → realm/fed/mapper.
# Absent: Keycloak CR → Subscription → OG → namespace (do NOT wait for CSV).
- name: ADO | Deploy and Configure RHBK
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
    # OpenShift Deploy RHBK JT must never take the RHEL/standalone zip path.
    # Preflight UI always ships standalone_hostname defaults; those must not
    # flip install_rhbk_platform to rhel for this playbook.
    install_rhbk_platform: openshift
    rhbk_platform: openshift
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    # set_fact beats group_vars — even if overlay still wrote rhel / UI defaults.
    - name: ADO | Force OpenShift platform (never standalone zip on this JT)
      ansible.builtin.set_fact:
        install_rhbk_platform: openshift
        rhbk_platform: openshift
    # Prefer OpenShift route host. Never keep UI/default VM standalone_hostname
    # (e.g. keycloak-ado.server.lab) when ocp_rhbk_hostname / hostname is set.
    - name: ADO | Normalize RHBK OpenShift install vars
      ansible.builtin.set_fact:
        rhbk_hostname: >-
          {{
            (
              ocp_rhbk_hostname
              | default(hostname, true)
              | default(rhbk_hostname, true)
              | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))), true)
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        ocp_rhbk_hostname: >-
          {{
            (
              ocp_rhbk_hostname
              | default(hostname, true)
              | default(rhbk_hostname, true)
              | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))), true)
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        # LDAP federation / IdP / mapper roles expect rhbk_host (same value as hostname/URL).
        rhbk_host: >-
          {{
            (
              ocp_rhbk_hostname
              | default(hostname, true)
              | default(rhbk_host, true)
              | default(rhbk_hostname, true)
              | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))), true)
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        ocp_rhbk_tls_secret_name: >-
          {{
            ocp_rhbk_tls_secret_name
            | default(rhbk_tls_secret_name)
            | default('keycloak-tls-secret')
          }}
        cert_manager: "{{ cert_manager | default(false) | bool }}"
        # Prefer explicit tls_mode / flags from preflight; default remains edge.
        ocp_rhbk_use_default_ingress_cert: >-
          {{
            false if (cert_manager | default(false) | bool)
            else (ocp_rhbk_use_default_ingress_cert | default(false) | bool)
          }}
        ocp_rhbk_http_edge: >-
          {{
            false if (cert_manager | default(false) | bool)
            else (
              false if (ocp_rhbk_use_default_ingress_cert | default(false) | bool)
              else (ocp_rhbk_http_edge | default(true) | bool)
            )
          }}
        ocp_rhbk_issuer_kind: >-
          {{ ocp_rhbk_issuer_kind | default('ClusterIssuer') }}
        ocp_rhbk_issuer_name: >-
          {{ ocp_rhbk_issuer_name | default('idm-acme') }}

  tasks:
    # ----- present: install -----
    - name: ADO | Ensure RHBK namespace exists
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      when: (state | default('present')) == 'present'

    - name: ADO | Create RHBK OperatorGroup
      ansible.builtin.include_role:
        name: infra.ado.ocp_operatorgroups
      when: (state | default('present')) == 'present'

    - name: ADO | Subscribe RHBK operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_operator_subscription
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for RHBK operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_operator
      when: (state | default('present')) == 'present'

    - name: ADO | Install RHBK Keycloak CR (OpenShift)
      ansible.builtin.include_role:
        name: infra.ado.install_rhbk
      vars:
        install_rhbk_platform: openshift
        rhbk_platform: openshift
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for RHBK pods
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_pods
      when: (state | default('present')) == 'present'

    - name: ADO | Configure RHBK routes
      ansible.builtin.include_role:
        name: infra.ado.ocp_routes
      when: (state | default('present')) == 'present'

    - name: ADO | Configure RHBK realm
      ansible.builtin.include_role:
        name: infra.ado.rhbk_realm
      when: (state | default('present')) == 'present'

    - name: ADO | Configure RHBK LDAP federation
      ansible.builtin.include_role:
        name: infra.ado.rhbk_manage_federation
      when: (state | default('present')) == 'present'

    - name: ADO | Configure RHBK LDAP mappers
      ansible.builtin.include_role:
        name: infra.ado.rhbk_setup_mapper
      when: (state | default('present')) == 'present'

    # ----- absent: CR → subscription → OG → namespace (never wait for CSV) -----
    - name: ADO | Delete RHBK Keycloak CR / operator resources
      ansible.builtin.include_role:
        name: infra.ado.install_rhbk
      vars:
        install_rhbk_platform: openshift
        rhbk_platform: openshift
      when: (state | default('present')) == 'absent'

    - name: ADO | Unsubscribe RHBK operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_operator_subscription
      when: (state | default('present')) == 'absent'

    - name: ADO | Delete RHBK OperatorGroup
      ansible.builtin.include_role:
        name: infra.ado.ocp_operatorgroups
      when: (state | default('present')) == 'absent'

    - name: ADO | Delete RHBK namespace
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      when: (state | default('present')) == 'absent'
