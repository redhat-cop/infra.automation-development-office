---
- name: ADO | Manage RHBK client
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  no_log: false
  pre_tasks:
    - name: ADO | RHBK API pre_tasks
      ansible.builtin.import_tasks: ado-rhbk-api-pre_tasks.yml

    - name: ADO | Build client work list from rhbk_clients dict when present
      ansible.builtin.set_fact:
        rhbk_client_work_items: >-
          {{
            rhbk_clients | dict2items
            if (rhbk_clients is defined and (rhbk_clients | length) > 0)
            else (
              [{'key': rhbk_client, 'value': {}}]
              if (rhbk_client is defined and (rhbk_client | string | length) > 0)
              else []
            )
          }}
  tasks:
    - name: ADO | Ensure each RHBK client
      ansible.builtin.include_role:
        name: infra.automation_development_office.rhbk_client
      vars:
        rhbk_client: "{{ item.key }}"
        rhbk_client_name: "{{ item.value.rhbk_client_name | default(item.value.name | default(item.key)) }}"
        rhbk_description: "{{ item.value.rhbk_description | default(omit) }}"
        rhbk_service_accounts_enabled: "{{ item.value.rhbk_service_accounts_enabled | default(false) }}"
        rhbk_public_client: "{{ item.value.rhbk_public_client | default(false) }}"
        rhbk_standard_flow_enabled: "{{ item.value.rhbk_standard_flow_enabled | default(true) }}"
        rhbk_direct_access_grants_enabled: "{{ item.value.rhbk_direct_access_grants_enabled | default(false) }}"
        rhbk_redirect_uris: "{{ item.value.rhbk_redirect_uris | default(item.value.redirect_uris | default(omit)) }}"
        rhbk_web_origins: "{{ item.value.rhbk_web_origins | default(item.value.web_origins | default(omit)) }}"
        rhbk_root_url: "{{ item.value.rhbk_root_url | default(omit) }}"
        rhbk_base_url: "{{ item.value.rhbk_base_url | default(omit) }}"
        rhbk_client_secret: "{{ item.value.rhbk_client_secret | default(omit) }}"
        rhbk_protocol: "{{ item.value.rhbk_protocol | default('openid-connect') }}"
        rhbk_default_client_scopes: >-
          {{
            item.value.rhbk_default_client_scopes
            | default(rhbk_oidc_default_client_scopes | default(['groups']))
          }}
        rhbk_attach_default_client_scopes: >-
          {{ item.value.rhbk_attach_default_client_scopes | default(true) }}
      loop: "{{ rhbk_client_work_items }}"
      loop_control:
        label: "{{ item.key }}"
      when: (rhbk_client_work_items | length) > 0
