---
# One-shot: ensure the RHBK realm used by lab OIDC apps is enabled.
# Fixes Keycloak "Realm not enabled" for Grafana/Quay/etc.
- name: ADO | Enable RHBK Realm
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  pre_tasks:
    - name: ADO | RHBK API pre_tasks
      ansible.builtin.import_tasks: ado-rhbk-api-pre_tasks.yml
    - name: ADO | Force realm enabled
      ansible.builtin.set_fact:
        rhbk_enabled: true
        state: present
  roles:
    - role: infra.automation_development_office.rhbk_realm
