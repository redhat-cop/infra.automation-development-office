---
# yamllint disable rule:line-length
# Bootstrap entry for EC2 delete: load env vault/vars, then import collection playbook.
- name: ADO | EC2 instance delete - load bootstrap vars
  hosts: localhost
  gather_facts: false
  vars:
    component: ec2_instance
  vars_files:
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/vault_aws.yml"
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component

    - name: ADO | Promote vars for imported delete playbook
      ansible.builtin.include_tasks: tasks/promote-ec2-instance-facts.yml

- ansible.builtin.import_playbook: infra.automation_development_office.aws.ec2.ado_ec2_instance_delete
# yamllint enable rule:line-length
