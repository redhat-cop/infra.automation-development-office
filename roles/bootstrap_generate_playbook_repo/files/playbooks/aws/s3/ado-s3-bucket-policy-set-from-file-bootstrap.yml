---
# yamllint disable rule:line-length
# Bootstrap entry: load env vault/vars, then import collection playbook.
- name: ADO | S3 bucket policy set from file - load bootstrap vars
  hosts: localhost
  gather_facts: false
  vars:
    component: s3_bucket_policy
  vars_files:
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/vault_aws.yml"
    - "{{ playbook_dir }}/../../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component

    - name: ADO | Default policy file to seeded project sample when unset
      ansible.builtin.set_fact:
        s3_bucket_policy_file: >-
          {{
            s3_bucket_policy_file
            if (s3_bucket_policy_file | default('') | string | length) > 0
            else (playbook_dir ~ '/policies/allow_list_and_read.json')
          }}

    - name: ADO | Promote vars for imported set-from-file playbook
      ansible.builtin.include_tasks: tasks/promote-s3-bucket-policy-facts.yml

- ansible.builtin.import_playbook: infra.automation_development_office.aws.s3.ado_s3_bucket_policy_set_from_file
# yamllint enable rule:line-length
