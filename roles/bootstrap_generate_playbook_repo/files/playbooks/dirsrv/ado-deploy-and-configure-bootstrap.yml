---
- name: ADO | Deploy 389 Directory Server via framework
  hosts: localhost
  gather_facts: false
  vars:
    # Registry key in components_defaults (flat operator/app vars live here).
    component: 389ds
  vars_files:
    # GitLab bootstrap-sample historically names these vault_dirsrv / vars_dirsrv
    # (not vault_389ds). Load those so passwords under dirsrv: are available.
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_dirsrv.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_dirsrv.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host | default("")) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
  roles:
    - role: infra.ado.ocp_namespace
    - role: infra.ado.install_dirsrv
