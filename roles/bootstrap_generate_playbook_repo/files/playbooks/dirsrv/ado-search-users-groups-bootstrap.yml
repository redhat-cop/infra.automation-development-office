---
- name: ADO | List LDAP users/groups from 389-DS
  hosts: localhost
  gather_facts: false
  vars:
    component: 389ds
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_dirsrv.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_dirsrv.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks: null
  roles:
    - role: infra.ado.ocp_search_dirsrv
