---
- name: ADO | Deploy BookStack documentation platform
  hosts: localhost
  gather_facts: false
  vars:
    component: bookstack
    # Map Contoller survey `state` into the role; other bookstack_* vars come from
    # survey/extra_vars, resolve_component, vars_bookstack.yml, and role defaults.
    bookstack_state: "{{ state | default('present') }}"
    bookstack_validate_certs: "{{ not (skip_tls_verify | default(true) | bool) }}"
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_bookstack.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_bookstack.yml"
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host) }}"
    K8S_AUTH_API_KEY: "{{ token }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | bool) | ternary('yes', 'no') }}"
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Resolve BookStack OIDC issuer from RHBK
      ansible.builtin.set_fact:
        bookstack_oidc_issuer: >-
          {{
            bookstack_oidc_issuer
            | default(oidc_issuer | default(''))
            | default(
                'https://'
                ~ (ocp_rhbk_hostname | default(rhbk_hostname | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))))))
                ~ '/realms/'
                ~ (ocp_rhbk_realm | default(rhbk_realm | default('rhlab'))),
                true
              )
          }}
  roles:
    - role: infra.ado.bookstack_openshift
