---
- name: Apply RHEL STIG hardening
  hosts: rhel_servers
  become: true
  gather_facts: true

  vars:
    rhel_stig_env: "{{ env | default('prod') }}"
    rhel_stig_env_dir: >-
      {{ playbook_dir }}/../../group_vars/all/{{ rhel_stig_env }}
    rhel_stig_vars_files:
      - "{{ rhel_stig_env_dir }}/vars_rhel.yml"
      - "{{ rhel_stig_env_dir }}/vars_stig.yml"
    rhel_stig_profile_map:
      RHEL 8 STIG: stig
      RHEL 9 STIG: stig
      RHEL 10 STIG: stig
    rhel_stig_compliance_profile: >-
      {{
        compliance_profile
        | default(components_env.rhel.compliance_profile | default('STIG'))
      }}
    rhel_stig_profile_label: >-
      {{
        stig_profile
        | default(components_env.rhel.stig_profile | default('RHEL 9 STIG'))
      }}
    rhel_stig_profile_value: >-
      {{
        rhel_stig_profile_map[rhel_stig_profile_label]
        | default(rhel_stig_profile_label)
      }}
    rhel_stig_engine: >-
      {{
        stig_engine
        | default(components_env.rhel.stig_engine | default('system_role'))
      }}
    rhel_stig_cac_remediate_effective: >-
      {{
        rhel_stig_cac_remediate
        | default(components_env.rhel.rhel_stig_cac_remediate | default(true))
        | bool
      }}

  pre_tasks:
    - name: Check for generated RHEL STIG vars
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ rhel_stig_vars_files }}"
      register: rhel_stig_vars_file_stats
      delegate_to: localhost
      run_once: true

    - name: Load generated RHEL STIG profile vars
      ansible.builtin.include_vars:
        file: "{{ item.stat.path }}"
      loop: "{{ rhel_stig_vars_file_stats.results }}"
      when: item.stat.exists

    - name: Confirm STIG hardening profile
      ansible.builtin.debug:
        msg:
          - "Compliance profile: {{ rhel_stig_compliance_profile }}"
          - "STIG profile: {{ rhel_stig_profile_label }}"
          - "STIG engine: {{ rhel_stig_engine }}"
          - "CaC remediate: {{ rhel_stig_cac_remediate_effective }}"
          - "RHEL system role profile: {{ rhel_stig_profile_value }}"

  roles:
    - role: infra.automation_development_office.rhel_stig_cac
      when: rhel_stig_engine == 'cac'
      vars:
        rhel_stig_cac_profile_label: "{{ rhel_stig_profile_label }}"
        rhel_stig_cac_remediate: "{{ rhel_stig_cac_remediate_effective }}"

    - role: infra.automation_development_office.rhel_ext_system_roles
      when: rhel_stig_engine != 'cac'
      vars:
        sr_apply:
          - stig
        sr_vars:
          stig:
            stig_profile: "{{ rhel_stig_profile_value }}"
