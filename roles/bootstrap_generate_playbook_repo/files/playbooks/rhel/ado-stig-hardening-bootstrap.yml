---
- name: Apply RHEL STIG hardening
  hosts: rhel_servers
  become: true
  gather_facts: true

  vars:
    rhel_stig_env: "{{ env | default('prod') }}"
    rhel_stig_env_dir: >-
      {{ playbook_dir }}/../../group_vars/all/{{ rhel_stig_env }}
    rhel_stig_vars_files:
      - "{{ rhel_stig_env_dir }}/vars_rhel.yml"
      - "{{ rhel_stig_env_dir }}/vars_stig.yml"
    rhel_stig_profile_map:
      RHEL 8 STIG: stig
      RHEL 9 STIG: stig
      RHEL 10 STIG: stig
    rhel_stig_compliance_profile: >-
      {{
        compliance_profile
        | default(components_env.rhel.compliance_profile | default('STIG'))
      }}
    rhel_stig_profile_label: >-
      {{
        stig_profile
        | default(components_env.rhel.stig_profile | default('RHEL 9 STIG'))
      }}
    rhel_stig_profile_value: >-
      {{
        rhel_stig_profile_map[rhel_stig_profile_label]
        | default(rhel_stig_profile_label)
      }}
    # cac only reads the host in audit mode. system_role always applies changes,
    # so it is gated below.
    rhel_stig_engine: >-
      {{
        stig_engine
        | default(components_env.rhel.stig_engine | default('cac'))
      }}
    # audit (default) | prepare | remediate | verify
    rhel_stig_mode: "{{ stig_mode | default('audit') }}"
    rhel_stig_remediation_approved: >-
      {{ stig_remediation_approved | default(false) | bool }}
    rhel_stig_recovery_confirmed: >-
      {{ stig_recovery_confirmed | default(false) | bool }}
    # The JT survey sends a string (commas, semicolons, or whitespace);
    # preflight sends a list.
    rhel_stig_controls_raw: "{{ stig_controls | default([]) }}"
    rhel_stig_controls: >-
      {{
        (
          (rhel_stig_controls_raw | replace(',', ' ')
           | replace(';', ' ')).split()
          if rhel_stig_controls_raw is string
          else rhel_stig_controls_raw
        ) | map('trim') | select | list
      }}
    rhel_stig_allow_protected_raw: "{{ stig_allow_protected | default([]) }}"
    rhel_stig_allow_protected: >-
      {{
        (
          (rhel_stig_allow_protected_raw | replace(',', ' ')
           | replace(';', ' ')).split()
          if rhel_stig_allow_protected_raw is string
          else rhel_stig_allow_protected_raw
        ) | map('trim') | select | list
      }}

  pre_tasks:
    - name: Check for generated RHEL STIG vars
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ rhel_stig_vars_files }}"
      register: rhel_stig_vars_file_stats
      delegate_to: localhost
      run_once: true

    - name: Load generated RHEL STIG profile vars
      ansible.builtin.include_vars:
        file: "{{ item.stat.path }}"
      loop: "{{ rhel_stig_vars_file_stats.results }}"
      when: item.stat.exists

    - name: Require approval before the system_role engine changes hosts
      ansible.builtin.assert:
        that:
          - rhel_stig_remediation_approved | bool
          - rhel_stig_recovery_confirmed | bool
        fail_msg: >-
          stig_engine=system_role applies STIG changes to the host and cannot
          audit first. It was not started. Use stig_engine=cac with
          stig_mode=audit to inspect hosts, or set
          stig_remediation_approved=true and stig_recovery_confirmed=true
          (a snapshot or backup exists) to apply the RHEL system role.
        quiet: true
      when: rhel_stig_engine != 'cac'

    - name: Confirm STIG hardening profile
      ansible.builtin.debug:
        msg:
          - "Compliance profile: {{ rhel_stig_compliance_profile }}"
          - "STIG profile: {{ rhel_stig_profile_label }}"
          - "STIG engine: {{ rhel_stig_engine }}"
          - "STIG mode: {{ rhel_stig_mode }}"
          - "Remediation approved: {{ rhel_stig_remediation_approved }}"
          - "Controls: {{ rhel_stig_controls | length }} selected"
          - "RHEL system role profile: {{ rhel_stig_profile_value }}"

  roles:
    - role: infra.automation_development_office.rhel_stig_cac
      when: rhel_stig_engine == 'cac'
      vars:
        rhel_stig_cac_profile_label: "{{ rhel_stig_profile_label }}"
        rhel_stig_cac_mode: "{{ rhel_stig_mode }}"
        rhel_stig_cac_remediation_approved: >-
          {{ rhel_stig_remediation_approved }}
        rhel_stig_cac_recovery_confirmed: >-
          {{ rhel_stig_recovery_confirmed }}
        rhel_stig_cac_controls: "{{ rhel_stig_controls }}"
        rhel_stig_cac_allow_protected: "{{ rhel_stig_allow_protected }}"

    - role: infra.automation_development_office.rhel_ext_system_roles
      when: rhel_stig_engine != 'cac'
      vars:
        sr_apply:
          - stig
        sr_vars:
          stig:
            stig_profile: "{{ rhel_stig_profile_value }}"
