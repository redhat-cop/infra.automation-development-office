---
- name: Patch RHEL servers
  # Contoller JTs use ask_inventory_on_launch — target every host in the
  # selected inventory (same pattern as Register Host to Satellite).
  # Limit the job in Contoller when you only want a subset.
  hosts: all
  gather_facts: true
  become: true
  vars:
    rhel_patching_update_cache: true
    rhel_patching_package_cleanup: true
  roles:
    - role: infra.automation_development_office.rhel_patching
