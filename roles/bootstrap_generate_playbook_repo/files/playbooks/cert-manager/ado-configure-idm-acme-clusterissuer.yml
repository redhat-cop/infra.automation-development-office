---
- name: ADO | Step 02d - IdM ACME ClusterIssuer with IdM CA bundle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    component: cert_manager
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host | default("")) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'', ''no'') }}'
  pre_tasks:
    - name: ADO | Fail if host/token missing
      ansible.builtin.fail:
        msg:
          - host/token missing for env={{ env }}.
          - 'Expected vault_{{ component }}.yml / infra_config_vars.yml to define:'
          - '  host or api_host: https://api....:6443'
          - '  token: <long bearer token>'
      when: >-
        ((host | default(api_host | default('')) | string | length) == 0)
        or (token is not defined)
  tasks:
    - name: ADO | Configure IdM ACME ClusterIssuer
      ansible.builtin.include_tasks: configure-idm-acme-clusterissuer-tasks.yml
