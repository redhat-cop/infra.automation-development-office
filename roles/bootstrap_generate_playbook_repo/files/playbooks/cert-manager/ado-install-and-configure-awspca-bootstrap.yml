---
- name: ADO | Configure AWS PCA ClusterIssuer
  hosts: localhost
  gather_facts: false
  vars:
    component: cert_manager
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_aws.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Apply shared AWS vault credentials for PCA
      ansible.builtin.set_fact:
        ocp_awspca_access_key_id: >-
          {{
            vault_aws_access_key_id
            | default(ocp_awspca_access_key_id | default(''))
          }}
        ocp_awspca_secret_access_key: >-
          {{
            vault_aws_secret_access_key
            | default(ocp_awspca_secret_access_key | default(''))
          }}
      when:
        - (vault_aws_access_key_id | default('') | length > 0)
          or (vault_aws_secret_access_key | default('') | length > 0)
  tasks:
    - name: ADO | Create AWS PCA ClusterIssuer
      ansible.builtin.include_role:
        name: infra.ado.ocp_awspca
