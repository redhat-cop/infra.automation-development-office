---
# yamllint disable rule:line-length
- name: ADO | Install {{ component_friendly_name }}
  hosts: localhost
  gather_facts: false
  vars:
    component: cert_manager
    component_friendly_name: Cert Manager
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component

    - name: ADO | Map cert-manager operator vs operand namespaces
      ansible.builtin.set_fact:
        # Operand (webhook/controller) = name_space/cert-manager.
        # Operator/OLM = cert-manager-operator (must not collapse onto operand).
        bootstrap_cert_manager_operand_namespace: >-
          {{
            (name_space | default('', true) | string | trim)
            if ((name_space | default('', true) | string | trim) | length) > 0
            else 'cert-manager'
          }}
        bootstrap_cert_manager_operator_namespace: >-
          {{
            (
              operator_namespace
              | default(operator_subscription_namespace, true)
              | default('', true)
              | string
              | trim
            )
            if (
              (
                operator_namespace
                | default(operator_subscription_namespace, true)
                | default('', true)
                | string
                | trim
              ) | length
            ) > 0
            and (
              (
                operator_namespace
                | default(operator_subscription_namespace, true)
                | default('', true)
                | string
                | trim
              )
              != (
                (name_space | default('', true) | string | trim)
                if ((name_space | default('', true) | string | trim) | length) > 0
                else 'cert-manager'
              )
            )
            else 'cert-manager-operator'
          }}

    - name: ADO | Resolve cert-manager OperatorGroup name (no self-ref)
      ansible.builtin.set_fact:
        bootstrap_cert_manager_operatorgroup: >-
          {{
            (
              (operatorgroup | default('') | string | trim)
              if ((operatorgroup | default('') | string | trim) | length) > 0
              else bootstrap_cert_manager_operator_namespace
            )
          }}

    - name: ADO | Show cert-manager operator vs operand namespaces
      ansible.builtin.debug:
        msg: >-
          state={{ state | default('present') }}
          operator_ns={{ bootstrap_cert_manager_operator_namespace }}
          operand_ns={{ bootstrap_cert_manager_operand_namespace }}
          operatorgroup={{ bootstrap_cert_manager_operatorgroup }}

  tasks:
    # ----- present: install -----
    - name: ADO | Ensure cert-manager operator namespace exists
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      vars:
        ocp_namespace_name: "{{ bootstrap_cert_manager_operator_namespace }}"
        name_space: "{{ bootstrap_cert_manager_operator_namespace }}"
        state: present
      when: (state | default('present')) == 'present'

    - name: ADO | Create cert-manager OperatorGroup
      ansible.builtin.include_role:
        name: infra.ado.ocp_operatorgroups
      vars:
        name_space: "{{ bootstrap_cert_manager_operator_namespace }}"
        operator_namespace: "{{ bootstrap_cert_manager_operator_namespace }}"
        operatorgroup: "{{ bootstrap_cert_manager_operatorgroup }}"
        state: present
      when: (state | default('present')) == 'present'

    - name: ADO | Subscribe cert-manager operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_operator_subscription
      vars:
        name_space: "{{ bootstrap_cert_manager_operator_namespace }}"
        operator_namespace: "{{ bootstrap_cert_manager_operator_namespace }}"
        operator_subscription_namespace: "{{ bootstrap_cert_manager_operator_namespace }}"
        state: present
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for cert-manager operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_operator
      vars:
        operator_namespace: "{{ bootstrap_cert_manager_operator_namespace }}"
        name_space: "{{ bootstrap_cert_manager_operator_namespace }}"
      when: (state | default('present')) == 'present'

    - name: ADO | Ensure cert-manager operand namespace exists
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      vars:
        ocp_namespace_name: "{{ bootstrap_cert_manager_operand_namespace }}"
        name_space: "{{ bootstrap_cert_manager_operand_namespace }}"
        state: present
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for cert-manager operand pods
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_pods
      vars:
        name_space: "{{ bootstrap_cert_manager_operand_namespace }}"
      when: (state | default('present')) == 'present'

    - name: ADO | Configure cert-manager
      ansible.builtin.include_role:
        name: infra.ado.ocp_cert_manager
      vars:
        name_space: "{{ bootstrap_cert_manager_operand_namespace }}"
        state: present
      when: (state | default('present')) == 'present'

    # Preflight Cert Manager → IdM ACME must create ClusterIssuer idm-acme.
    - name: ADO | Configure IdM ACME ClusterIssuer when mode is idm_acme
      ansible.builtin.include_tasks: configure-idm-acme-clusterissuer-tasks.yml
      when:
        - (state | default('present')) == 'present'
        - >-
          (ocp_cert_manager_mode | default(mode | default('cert'), true) | string)
          == 'idm_acme'

    - name: ADO | Manage cert-manager routes
      ansible.builtin.include_role:
        name: infra.ado.ocp_routes
      when: (state | default('present')) == 'present'

    # ----- absent: full uninstall (see uninstall-cert-manager-tasks.yml) -----
    - name: ADO | Uninstall cert-manager
      ansible.builtin.include_tasks: uninstall-cert-manager-tasks.yml
      when: (state | default('present')) == 'absent'
