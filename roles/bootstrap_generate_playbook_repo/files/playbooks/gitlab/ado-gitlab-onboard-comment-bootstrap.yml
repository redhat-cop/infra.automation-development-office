---
# yamllint disable rule:line-length
# Shared GitLab connection settings come from group_vars/all/vars.yml + vault.
- name: ADO | GitLab onboard comment
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/vault_gitlab_manage.yml"
  vars:
    gitlab_manage_action: "{{ gitlab_manage_action | default('issue_comment') }}"

  roles:
    - role: gitlab_manage
