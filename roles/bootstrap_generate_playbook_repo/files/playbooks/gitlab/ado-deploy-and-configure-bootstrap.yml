---
- name: ADO | Install GitLab
  hosts: localhost
  gather_facts: false
  vars:
    component: gitlab
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Normalize GitLab OpenShift install vars
      ansible.builtin.set_fact:
        # Prefer OpenShift route hostname over any poisoned standalone VM hostname.
        gitlab_install_hostname: >-
          {{
            (
              hostname
              | default(gitlab_install_hostname, true)
              | default(gitlab_hostname, true)
              | default('')
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        gitlab_hostname: >-
          {{
            (
              hostname
              | default(gitlab_hostname, true)
              | default(gitlab_install_hostname, true)
              | default('')
            )
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
          }}
        gitlab_install_chart_version: >-
          {{ gitlab_install_chart_version | default(chart_version) | default('10.3.1') }}
        gitlab_install_storage_size: >-
          {{ gitlab_install_storage_size | default(storage_size) | default('20Gi') }}
        gitlab_install_storage_class: >-
          {{
            gitlab_install_storage_class
            | default(storage)
            | default(storage_class)
            | default(openshift_default_storage_class)
            | default('')
          }}
        gitlab_install_root_password: >-
          {{
            gitlab_install_root_password
            | default(root_password)
            | default('redhat123')
          }}
        gitlab_install_admin_user: >-
          {{ gitlab_install_admin_user | default(admin_user) | default('gitlab') }}
        gitlab_install_admin_password: >-
          {{
            gitlab_install_admin_password
            | default(admin_password)
            | default(gitlab_install_root_password)
            | default('redhat123')
          }}
  roles:
    - role: infra.ado.ocp_namespace
    - role: infra.ado.ocp_operatorgroups
    - role: infra.ado.ocp_operator_subscription
    - role: infra.ado.ocp_wait_operator
    - role: infra.ado.gitlab_install
    - role: infra.ado.ocp_wait_pods
    - role: infra.ado.ocp_routes
