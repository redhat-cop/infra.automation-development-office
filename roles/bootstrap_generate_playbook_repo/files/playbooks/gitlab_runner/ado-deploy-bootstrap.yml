---
- name: ADO | Deploy GitLab Runner on OpenShift
  hosts: localhost
  gather_facts: false
  vars:
    component: gitlab_runner
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Require GitLab Runner registration token
      ansible.builtin.assert:
        that:
          - runner_token is defined
          - (runner_token | string | length) > 0
        fail_msg: >-
          gitlab_runner requires runner_token in vault_gitlab_runner.yml
          (set via preflight component_config.gitlab_runner.runner_token).
  roles:
    - role: infra.ado.ocp_namespace
    - role: infra.ado.ocp_gitlab_runner
