---
- name: ADO | Configure Quay OIDC
  hosts: localhost
  gather_facts: false
  vars:
    component: quay
    quay_install_scope: oidc
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Enable Quay OIDC configuration
      ansible.builtin.set_fact:
        quay_oidc_enabled: true
        quay_oidc_configure_after_install: true
        quay_oidc_client_id: >-
          {{ quay_oidc_client_id | default(oidc.client_id | default('quay')) }}
        quay_keycloak_realm: >-
          {{
            quay_keycloak_realm
            | default(rhbk_realm | default(ocp_rhbk_realm | default('rhlab')))
          }}
  roles:
    - role: infra.ado.ocp_quay
