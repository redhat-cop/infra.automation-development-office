---
- name: ADO | Configure Zabbix SAML SSO (Keycloak)
  hosts: localhost
  gather_facts: false
  vars:
    component: zabbix
    zabbix_install_scope: saml
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_rhbk.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
    - name: ADO | Enable Zabbix SAML configuration
      ansible.builtin.set_fact:
        zabbix_saml_enabled: true
  roles:
    - role: infra.ado.ocp_zabbix
