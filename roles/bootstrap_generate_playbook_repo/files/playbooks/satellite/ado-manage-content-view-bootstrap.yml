---
# yamllint disable rule:line-length
# API job: talks to Satellite from the controller EE. Do not pin this to
# Satellite-Server-Inventory (that inventory is only created for install/OIDC).
- name: ADO | Manage Satellite content views
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_satellite.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_satellite.yml"
  roles:
    - role: infra.ado.satellite_content_view
