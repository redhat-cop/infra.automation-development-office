---
- name: ADO | Configure Satellite Keycloak OIDC
  hosts: all
  gather_facts: true
  become: true
  vars:
    satellite_oidc_state: "{{ state | default('present') }}"
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_satellite.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_satellite.yml"
  roles:
    - role: infra.automation_development_office.satellite_oidc
