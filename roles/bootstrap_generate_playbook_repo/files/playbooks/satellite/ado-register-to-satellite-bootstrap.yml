---
- name: ADO | Register host to Satellite
  hosts: all
  gather_facts: true
  become: true
  vars:
    # Contoller survey may set state/env; role uses rhel_sat_reg_action.
    rhel_sat_reg_action: "{{ 'deregister' if (state | default('present')) == 'absent' else 'register' }}"
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env | default('prod') }}/vault_satellite.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env | default('prod') }}/vars_satellite.yml"
  roles:
    - role: infra.automation_development_office.rhel_sat_reg
