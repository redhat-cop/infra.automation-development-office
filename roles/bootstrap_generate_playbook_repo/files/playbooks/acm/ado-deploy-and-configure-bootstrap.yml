---
# yamllint disable rule:line-length
# ACM install/uninstall. Absent order matters: tear down MultiClusterHub /
# MCE / ClusterManager and the Subscription before OperatorGroup + namespace,
# otherwise OLM/hub controllers can recreate the OG and fail ocp_operatorgroups.
- name: ADO | Deploy and Configure ACM
  hosts: localhost
  gather_facts: false
  vars:
    component: acm
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: >-
      {{ (verify_ssl | bool) | ternary('yes', 'no') }}
  pre_tasks:
    - name: >-
        ADO | Resolve vars for component from framework defaults + env
        overrides
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component

  tasks:
    # ----- present: install -----
    - name: ADO | Ensure ACM namespace exists
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      when: (state | default('present')) == 'present'

    - name: ADO | Create ACM OperatorGroup
      ansible.builtin.include_role:
        name: infra.ado.ocp_operatorgroups
      # operatorgroup comes from bootstrap_resolve_component (do not set
      # operatorgroup: "{{ operatorgroup | default(...) }}" — that recurses).
      when: (state | default('present')) == 'present'

    - name: ADO | Subscribe ACM operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_operator_subscription
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for ACM operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_operator
      when: (state | default('present')) == 'present'

    - name: ADO | Configure MultiClusterHub
      ansible.builtin.include_role:
        name: infra.ado.ocp_acm
      when: (state | default('present')) == 'present'

    - name: ADO | Wait for ACM pods
      ansible.builtin.include_role:
        name: infra.ado.ocp_wait_pods
      when: (state | default('present')) == 'present'

    # ----- absent: hub CRs → subscription → OG → namespace -----
    - name: ADO | Remove MultiClusterHub / MCE / ClusterManager
      ansible.builtin.include_role:
        name: infra.ado.ocp_acm
      when: (state | default('present')) == 'absent'

    - name: ADO | Unsubscribe ACM operator
      ansible.builtin.include_role:
        name: infra.ado.ocp_operator_subscription
      when: (state | default('present')) == 'absent'

    - name: ADO | Delete ACM OperatorGroup
      ansible.builtin.include_role:
        name: infra.ado.ocp_operatorgroups
      # operatorgroup from resolve_component — avoid self-referential vars.
      when: (state | default('present')) == 'absent'

    - name: ADO | Delete ACM namespace
      ansible.builtin.include_role:
        name: infra.ado.ocp_namespace
      when: (state | default('present')) == 'absent'
