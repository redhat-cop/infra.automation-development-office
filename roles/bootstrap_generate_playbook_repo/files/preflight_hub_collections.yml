# Contoller project sync installs ONLY what Hub/Galaxy credentials can resolve.
# Do NOT list collections that are missing from Private Hub (sync fails the whole
# requirements.yml). Bundle these on the Contoller EE (or publish to Hub) when a
# JT needs them:
#   - infra.aap_utilities (install_aap / aap_ocp_install)
#   - infra.rhacs_configuration (ACS configuration JTs)
#   - infra.openshift_virtualization_ops (validated; AH-only)
#   - redhat.rhel_system_roles (Automation Hub certified)
controller_requirements_galaxy_only: []
