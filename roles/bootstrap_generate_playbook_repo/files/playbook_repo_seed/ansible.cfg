[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
interpreter_python = auto_silent
# Controller runs from /runner/project; preflight pod uses /workspace/collections.
collections_paths = /runner/project/collections:/workspace/collections:./collections:/usr/share/ansible/collections

# Lab Hub uses a self-signed ingress cert. Project sync runs
# ansible-galaxy collection install -r collections/requirements.yml against Hub.
[galaxy]
ignore_certs = False
