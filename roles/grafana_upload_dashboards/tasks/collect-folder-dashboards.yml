---
- name: Ensure workspace directory exists
  ansible.builtin.file:
    path: >-
      /tmp/grafana-folder-src-{{
        (
          grafana_folder_item.name
          | default('general')
          | regex_replace('[^A-Za-z0-9_-]', '_')
        )
        if (grafana_folder_item.name | default('') | string | trim | length) > 0
        else 'general'
      }}
    state: directory
    mode: "0755"

- name: Clone git dashboard source
  ansible.builtin.git:
    repo: "{{ grafana_folder_item.source }}"
    dest: >-
      /tmp/grafana-folder-src-{{
        (
          grafana_folder_item.name
          | default('general')
          | regex_replace('[^A-Za-z0-9_-]', '_')
        )
        if (grafana_folder_item.name | default('') | string | trim | length) > 0
        else 'general'
      }}
    version: "{{ grafana_folder_item.version | default('HEAD') }}"
    force: true
  when:
    - (grafana_folder_item.source_type | default('path')) == 'git'
    - grafana_folder_item.source | default('') | length > 0

- name: Resolve local dashboard root
  ansible.builtin.set_fact:
    grafana_upload_dashboards_folder_root: >-
      {{
        (
          '/tmp/grafana-folder-src-'
          ~ (
            (
              grafana_folder_item.name
              | default('general')
              | regex_replace('[^A-Za-z0-9_-]', '_')
            )
            if (grafana_folder_item.name | default('') | string | trim | length) > 0
            else 'general'
          )
          ~ '/'
          ~ (grafana_folder_item.dashboards_path | default('dashboards'))
        )
        if ((grafana_folder_item.source_type | default('path')) == 'git')
        else (
          (
            (
              grafana_folder_item.source
              if (grafana_folder_item.source is match('^/'))
              else (
                (playbook_dir | dirname | dirname)
                ~ '/'
                ~ (grafana_folder_item.source | regex_replace('^\\./', ''))
              )
            )
            | regex_replace('/$', '')
          )
          ~ '/'
          ~ (grafana_folder_item.dashboards_path | default(''))
        )
      }}

- name: Find dashboard files in folder source
  ansible.builtin.find:
    paths: "{{ grafana_upload_dashboards_folder_root | regex_replace('/$', '') }}"
    patterns:
      - "*.json"
      - "*.json.j2"
    # recurse false = only files in this directory (e.g. dashboards/ root
    # without Applications/, Infrastucture/, Security/).
    recurse: "{{ grafana_folder_item.recurse | default(true) | bool }}"
  register: grafana_upload_dashboards_found
  when: grafana_upload_dashboards_folder_root | length > 0
  failed_when: false

- name: Append discovered dashboards to work items
  ansible.builtin.set_fact:
    grafana_upload_dashboards_work_items: >-
      {{
        grafana_upload_dashboards_work_items
        + [
          {
            'name': (
              (
                item.path
                | basename
                | regex_replace('(\\.json\\.j2|\\.json)$', '')
              )
              ~ '__'
              ~ (
                (
                  grafana_folder_item.name
                  | default('general')
                  | regex_replace('[^A-Za-z0-9_-]', '_')
                )
                if (grafana_folder_item.name | default('') | string | trim | length) > 0
                else 'general'
              )
            ),
            'path': item.path,
            'folder': grafana_folder_item.name | default(''),
            'use_general_folder': (
              grafana_folder_item.use_general_folder | default(false) | bool
              or (
                (grafana_folder_item.name | default('') | string | trim | length) == 0
              )
              or (
                (grafana_folder_item.name | default('') | string | trim | lower)
                in ['general', 'main', 'root']
              )
            ),
            'template': item.path if (item.path | basename | regex_search('\\.json\\.j2$')) else omit,
            'datasource_mode': grafana_folder_item.datasource_mode | default('none'),
            'datasource': grafana_folder_item.datasource | default(''),
            'uid_suffix': grafana_folder_item.uid_suffix | default(''),
            'title_cluster': grafana_folder_item.title_cluster | default('')
          }
        ]
      }}
  loop: "{{ grafana_upload_dashboards_found.files | default([]) }}"
  when: grafana_upload_dashboards_found is defined
