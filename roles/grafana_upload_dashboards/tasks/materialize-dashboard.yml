---
- name: Ensure rendered dashboard directory exists
  ansible.builtin.file:
    path: /tmp/grafana-dashboards
    state: directory
    mode: "0755"

- name: Render Jinja dashboard template
  ansible.builtin.template:
    src: "{{ grafana_dashboard_item.template | default(grafana_dashboard_item.path) }}"
    dest: "/tmp/grafana-dashboards/{{ grafana_dashboard_item.name }}.raw.json"
    mode: "0644"
  when: >
    (grafana_dashboard_item.template is defined)
    or (
      (grafana_dashboard_item.path | default('') | basename | regex_search('\\.json\\.j2$')) is not none
    )
  vars:
    grafana_dashboard: "{{ grafana_dashboard_item.name }}"

- name: Copy plain JSON dashboard
  ansible.builtin.copy:
    src: "{{ grafana_dashboard_item.path }}"
    dest: "/tmp/grafana-dashboards/{{ grafana_dashboard_item.name }}.raw.json"
    mode: "0644"
    remote_src: true
  when: >
    grafana_dashboard_item.path is defined
    and (grafana_dashboard_item.template is not defined)
    and (
      (grafana_dashboard_item.path | basename | regex_search('\\.json\\.j2$')) is none
    )

- name: Adapt dashboard for folder (pin / multi / none)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/adapt-dashboard-for-folder.py"
      - --src
      - "/tmp/grafana-dashboards/{{ grafana_dashboard_item.name }}.raw.json"
      - --dest
      - "/tmp/grafana-dashboards/{{ grafana_dashboard_item.name }}.json"
      - --mode
      - "{{ grafana_dashboard_item.datasource_mode | default('none') }}"
      - --datasource
      - "{{ grafana_dashboard_item.datasource | default(grafana_datasource | default('OpenshiftProd')) }}"
      - --datasource-uid
      - >-
        {{
          grafana_upload_dashboards_uid_by_name[
            grafana_dashboard_item.datasource
            | default(grafana_datasource | default('OpenshiftProd'))
          ]
          | default(
              grafana_dashboard_item.datasource
              | default(grafana_datasource | default('OpenshiftProd')),
              true
            )
        }}
      - --uid-suffix
      - "{{ grafana_dashboard_item.uid_suffix | default('') }}"
      - --title-cluster
      - "{{ grafana_dashboard_item.title_cluster | default('') }}"
  changed_when: true

- name: Replace leftover legacy string datasource names
  ansible.builtin.replace:
    path: "/tmp/grafana-dashboards/{{ grafana_dashboard_item.name }}.json"
    regexp: >-
      "datasource"\s*:\s*"(?:\s*\{\{\s*grafana_datasource\s*\}\}\s*|Openshift(?:-Prod|-Dev)?|OpenshiftProd(?:Infra)?|Prometheus|prometheus|grafana_datasource|\$\{DS_OPENSHIFT\}|DS_OPENSHIFT)"
    replace: >-
      "datasource": {"type": "prometheus", "uid": "{{
        grafana_upload_dashboards_uid_by_name[
          grafana_dashboard_item.datasource
          | default(grafana_datasource | default('OpenshiftProd'))
        ]
        | default(
            grafana_dashboard_item.datasource
            | default(grafana_datasource | default('OpenshiftProd')),
            true
          )
      }}"}
  when: (grafana_dashboard_item.datasource_mode | default('none')) != 'multi'
