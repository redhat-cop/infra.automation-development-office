---
# Quay needs a PostgreSQL password and a DATABASE_SECRET_KEY. Neither is shipped as a
# default. The values are supplied (ocp_quay_db_password / ocp_quay_database_secret_key),
# found in the cluster, or generated once and stored in the credentials Secret so a
# re-run reuses them. The decision itself is in resolve_db_credentials_values.yml.

- name: Quay DB credentials | Read the credentials Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ocp_quay_db_credentials_secret }}"
    namespace: "{{ name_space }}"
  register: ocp_quay_db_credentials_info
  no_log: true

- name: Quay DB credentials | Read an existing Quay configuration Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ocp_quay_config_secret }}"
    namespace: "{{ name_space }}"
  register: ocp_quay_existing_config_info
  no_log: true

- name: Quay DB credentials | Look for an existing PostgreSQL StatefulSet
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: postgres-db
    namespace: "{{ name_space }}"
  register: ocp_quay_existing_postgres_info

- name: Quay DB credentials | Resolve the effective values
  ansible.builtin.include_tasks: resolve_db_credentials_values.yml
  vars:
    ocp_quay_db_credentials_data: "{{ (ocp_quay_db_credentials_info.resources | default([]) | first | default({}, true)).get('data', {}) }}"
    ocp_quay_existing_config_data: "{{ (ocp_quay_existing_config_info.resources | default([]) | first | default({}, true)).get('data', {}) }}"
    ocp_quay_postgres_exists: "{{ (ocp_quay_existing_postgres_info.resources | default([]) | length) > 0 }}"

- name: Quay DB credentials | Store the values so a re-run reuses them
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp_quay_db_credentials_secret }}"
        namespace: "{{ name_space }}"
      type: Opaque
      stringData:
        db-password: "{{ ocp_quay_db_password_effective }}"
        database-secret-key: "{{ ocp_quay_database_secret_key_effective }}"
  no_log: true
