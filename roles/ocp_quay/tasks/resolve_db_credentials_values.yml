---
# Pure decision step (no cluster calls) for the Quay database credentials.
#
# Inputs (set by resolve_db_credentials.yml):
#   ocp_quay_db_credentials_data   data of the quay-db-credentials Secret ({} when absent)
#   ocp_quay_existing_config_data  data of the Quay config Secret ({} when absent)
#   ocp_quay_postgres_exists       true when the postgres-db StatefulSet already exists
#
# Order of precedence: value supplied by the operator, value already stored in the
# credentials Secret, value adopted from a Quay install made by an earlier version of
# this role, then a newly generated value. An existing database whose password cannot
# be found stops the run instead of being re-keyed.

- name: Quay DB credentials | Read the credentials already stored in the cluster
  ansible.builtin.set_fact:
    _ocp_quay_stored_password: >-
      {{ (ocp_quay_db_credentials_data | default({}, true)).get('db-password', '') | b64decode }}
    _ocp_quay_stored_secret_key: >-
      {{ (ocp_quay_db_credentials_data | default({}, true)).get('database-secret-key', '') | b64decode }}
  no_log: true

- name: Quay DB credentials | Adopt the credentials of an earlier install
  ansible.builtin.set_fact:
    _ocp_quay_adopted_password: >-
      {{
        (((ocp_quay_existing_config_data | default({}, true)).get('config.yaml', '') | b64decode | from_yaml | default({}, true)).get('DB_URI', '')
        | string | regex_search('://[^:/@]+:([^@]+)@', '\1') | default([''], true) | first)
      }}
    _ocp_quay_adopted_secret_key: >-
      {{
        ((ocp_quay_existing_config_data | default({}, true)).get('config.yaml', '') | b64decode | from_yaml | default({}, true)).get('DATABASE_SECRET_KEY', '')
      }}
  when:
    - (_ocp_quay_stored_password | length) == 0
    - (ocp_quay_existing_config_data | default({}, true) | length) > 0
  no_log: true

- name: Quay DB credentials | Choose the effective values
  ansible.builtin.set_fact:
    _ocp_quay_known_password: >-
      {{
        (ocp_quay_db_password | default('', true) | string)
        or _ocp_quay_stored_password
        or (_ocp_quay_adopted_password | default(''))
      }}
    _ocp_quay_known_secret_key: >-
      {{
        (ocp_quay_database_secret_key | default('', true) | string)
        or _ocp_quay_stored_secret_key
        or (_ocp_quay_adopted_secret_key | default(''))
      }}
  no_log: true

- name: Quay DB credentials | Refuse to re-key an existing database
  ansible.builtin.assert:
    that:
      - (_ocp_quay_known_password | length) > 0 or not (ocp_quay_postgres_exists | bool)
    fail_msg: >-
      A Quay PostgreSQL database already exists but its password could not be found in the
      {{ ocp_quay_db_credentials_secret }} Secret or in the existing Quay configuration.
      Set ocp_quay_db_password (quay_db_password) to the password that database was created with.
      A new password would not match the data on the volume.

- name: Quay DB credentials | Generate values that do not exist yet
  ansible.builtin.set_fact:
    ocp_quay_db_password_effective: >-
      {{
        _ocp_quay_known_password
        or lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')
      }}
    ocp_quay_database_secret_key_effective: >-
      {{
        _ocp_quay_known_secret_key
        or lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits')
      }}
  no_log: true
