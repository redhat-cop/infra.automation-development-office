---
- name: Resolve Quay storage class when unset
  when: (storage | default('') | string | trim | length) == 0
  block:
    - name: List cluster StorageClasses for Quay
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
      register: ocp_quay_storage_classes

    - name: Pick default StorageClass for Quay PVCs
      ansible.builtin.set_fact:
        ocp_quay_storage: >-
          {{
            (
              ocp_quay_storage_classes.resources
              | default([])
              | selectattr(
                'metadata.annotations.storageclass.kubernetes.io/is-default-class',
                'defined'
              )
              | selectattr(
                'metadata.annotations.storageclass.kubernetes.io/is-default-class',
                'equalto',
                'true'
              )
              | map(attribute='metadata.name')
              | list
              | first
            )
            | default(
              ocp_quay_storage_classes.resources
              | default([])
              | map(attribute='metadata.name')
              | list
              | first
              | default('')
            )
          }}

    - name: Apply resolved Quay storage class
      ansible.builtin.set_fact:
        # Shared inventory/preflight var name used across OCP app roles.
        storage: "{{ ocp_quay_storage }}"  # noqa: var-naming[no-role-prefix]
      when: (ocp_quay_storage | default('') | string | trim | length) > 0

- name: Assert Quay storage class is set
  ansible.builtin.assert:
    that:
      - (storage | default('') | string | trim | length) > 0
    fail_msg: >-
      Quay requires a StorageClass (set storage / storage_class in preflight or
      openshift.default_storage_class so PVCs for Postgres and registry can bind).

- name: Create Quay Namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ name_space }}"
    state: present

- name: Create PVC for Quay storage
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: quay-registry-storage
        namespace: "{{ name_space }}"
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ storage_size }}"
        storageClassName: "{{ storage }}"

- name: Resolve Quay OIDC issuer URL
  ansible.builtin.set_fact:
    ocp_quay_oidc_issuer_url: >-
      {{
        (
          ocp_quay_oidc_issuer_url | default('') | string | trim | length > 0
        ) | ternary(
          ocp_quay_oidc_issuer_url | string | trim,
          'https://'
          ~ (rhbk_hostname | default(keycloak_hostname | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))))))
          ~ '/realms/'
          ~ (quay_keycloak_realm | default(rhbk_realm | default(ocp_rhbk_realm | default('rhlab'))))
          ~ '/'
        )
      }}
  when: quay_oidc_enabled | default(false) | bool

- name: Fetch Quay OIDC client secret from Keycloak when vault empty
  ansible.builtin.include_role:
    name: infra.ado.ocp_rhbk_client_secrets
  vars:
    ocp_rhbk_secret_client_key: quay_client
    ocp_rhbk_secret_client_id: "{{ quay_oidc_client_id | default('quay') }}"
    ocp_rhbk_secret_target_var: ocp_quay_oidc_client_secret
    ocp_rhbk_secret_optional: true
  when:
    - quay_oidc_enabled | default(false) | bool
    - (ocp_quay_oidc_client_secret | default('') | string | length) == 0
  no_log: true

- name: Prefer fetched Quay OIDC client secret for initial install
  ansible.builtin.set_fact:
    ocp_quay_oidc_client_secret: "{{ ocp_rhbk_client_secrets__value }}"
  when:
    - quay_oidc_enabled | default(false) | bool
    - (ocp_quay_oidc_client_secret | default('') | string | length) == 0
    - ocp_rhbk_client_secrets__value is defined
    - (ocp_rhbk_client_secrets__value | string | length) > 0
  no_log: true

- name: Build Quay config
  ansible.builtin.set_fact:
    ocp_quay_config: "{{ lookup('template', 'quay-config.yaml.j2') }}"
  no_log: "{{ quay_oidc_enabled | default(false) | bool }}"

- name: Create Quay Configuration Secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp_quay_config_secret }}"
        namespace: "{{ name_space }}"
      type: Opaque
      data:
        config.yaml: "{{ ocp_quay_config | b64encode }}"

# registry.redhat.io/rhel9/postgresql-15 runs as uid/gid 26. OpenShift
# restricted SCCs reject that unless the SA can use anyuid.
- name: Allow default SA anyuid SCC for Quay Postgres
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: quay-postgres-anyuid
        namespace: "{{ name_space }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ name_space }}"

- name: Deploy PostgreSQL StatefulSet
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-db
        namespace: "{{ name_space }}"
      spec:
        serviceName: postgres-db
        selector:
          matchLabels:
            app: postgres-db
        replicas: 1
        template:
          metadata:
            labels:
              app: postgres-db
          spec:
            # NFS (synology-csi) often root-squashes; postgres entrypoint chmod fails
            # without a root initContainer fixing ownership first.
            securityContext:
              fsGroup: 26
              fsGroupChangePolicy: OnRootMismatch
            initContainers:
              - name: fix-data-perms
                image: "{{ postgres_image }}"
                command:
                  - /bin/sh
                  - -ec
                  - |
                    mkdir -p /var/lib/pgsql/data/userdata
                    chown -R 26:26 /var/lib/pgsql/data /var/lib/pgsql/data/userdata || true
                    chmod -R ug+rwX /var/lib/pgsql/data /var/lib/pgsql/data/userdata || true
                securityContext:
                  runAsUser: 0
                volumeMounts:
                  - name: data-volume
                    mountPath: /var/lib/pgsql/data/userdata
            containers:
              - name: postgres-db
                image: "{{ postgres_image }}"
                # RHEL image entrypoint always chmod's PGDATA; Synology NFS
                # root_squash returns EPERM and CrashLoops the pod. Strip chmod
                # from container scripts, then start normally.
                command:
                  - /bin/bash
                  - -ec
                  - |
                    set -e
                    mkdir -p /var/lib/pgsql/data/userdata
                    for f in /usr/share/container-scripts/postgresql/*.sh \
                             /usr/bin/run-postgresql \
                             /usr/libexec/s2i/run; do
                      [ -e "$f" ] || continue
                      sed -i \
                        -e 's/\bchmod\b/true #chmod/g' \
                        -e 's/\bchown\b/true #chown/g' \
                        "$f" 2>/dev/null || true
                    done
                    if [ -x /usr/bin/run-postgresql ]; then
                      exec /usr/bin/run-postgresql
                    fi
                    exec /usr/libexec/s2i/run
                ports:
                  - containerPort: 5432
                volumeMounts:
                  - name: data-volume
                    mountPath: /var/lib/pgsql/data/userdata
                env:
                  - name: POSTGRESQL_USER
                    value: quay
                  - name: POSTGRESQL_PASSWORD
                    value: quaypass
                  - name: POSTGRESQL_DATABASE
                    value: quay
                securityContext:
                  runAsUser: 26
        volumeClaimTemplates:
          - metadata:
              name: data-volume
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: "{{ storage_size }}"
              storageClassName: "{{ storage }}"

- name: Deploy PostgreSQL Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-db
        namespace: "{{ name_space }}"
      spec:
        selector:
          app: postgres-db
        type: ClusterIP
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for Postgres pod to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ name_space }}"
    label_selectors:
      - "app=postgres-db"
  register: ocp_quay_pg_pods
  until:
    - ocp_quay_pg_pods.resources | default([]) | length > 0
    - (ocp_quay_pg_pods.resources[0].status.containerStatuses | default([]) | length) > 0
    - (ocp_quay_pg_pods.resources[0].status.containerStatuses[0].ready | default(false)) | bool
  retries: 60
  delay: 10

- name: Wait for Postgres service endpoint to exist
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Endpoints
    namespace: "{{ name_space }}"
    name: postgres-db
  register: ocp_quay_pg_eps
  until:
    - ocp_quay_pg_eps.resources | length > 0
    - (ocp_quay_pg_eps.resources[0].subsets | default([])) | length > 0
  retries: 40
  delay: 6

- name: Ensure Postgres pg_trgm extension for Quay
  kubernetes.core.k8s_exec:
    namespace: "{{ name_space }}"
    pod: "{{ ocp_quay_pg_pods.resources[0].metadata.name }}"
    container: postgres-db
    command: >-
      psql -U postgres -d quay -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
  register: ocp_quay_pg_trgm
  changed_when: >-
    'CREATE EXTENSION' in (ocp_quay_pg_trgm.stdout | default(''))
  failed_when: false

- name: Deploy Quay Registry with Redis Sidecar
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quay
        namespace: "{{ name_space }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: quay
        template:
          metadata:
            labels:
              app: quay
          spec:
            volumes:
              - name: config-volume
                secret:
                  secretName: "{{ ocp_quay_config_secret }}"
              - name: registry-storage
                persistentVolumeClaim:
                  claimName: quay-registry-storage
            containers:
              - name: quay
                image: quay.io/projectquay/quay:latest
                ports:
                  - containerPort: 8080
                volumeMounts:
                  - name: config-volume
                    mountPath: /conf/stack
                  - name: registry-storage
                    mountPath: /datastorage/registry
              - name: redis
                image: redis:7-alpine
                ports:
                  - containerPort: 6379

- name: Deploy Quay Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: quay
        namespace: "{{ name_space }}"
      spec:
        selector:
          app: quay
        ports:
          - name: http
            port: 8080
            targetPort: 8080

- name: Expose Quay with OpenShift Route
  kubernetes.core.k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: quay
        namespace: "{{ name_space }}"
      spec:
        host: "{{ ocp_quay_hostname }}"
        to:
          kind: Service
          name: quay
        port:
          targetPort: http
        tls:
          # Quay nginx listens on HTTP 8080 in this install path.
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Show Quay admin console URL
  ansible.builtin.debug:
    msg: "Login to Quay at: https://{{ ocp_quay_hostname }} (Username: {{ ocp_quay_admin_user }})"
