---
# defaults file for ocp_quay

state: present
name_space: quay-enterprise
ocp_quay_hostname: "{{ quay_hostname | default(hostname | default('')) }}"
ocp_quay_admin_user: "{{ quay_admin_user | default('quayadmin') }}"
ocp_quay_admin_password: "{{ quay_admin_password | default('redhat123') }}"
ocp_quay_config_secret: "{{ quay_config_secret | default('quay-config-secret') }}"
storage_size: 10Gi
storage: ""
postgres_image: registry.redhat.io/rhel9/postgresql-15:latest
# Red Hat registry — do not use quay.io/projectquay or docker.io/redis.
# Installing Quay must not require pulling from Quay or Docker Hub.
ocp_quay_image: >-
  {{
    quay_image
    | default('registry.redhat.io/quay/quay-rhel8:v3.15.4')
  }}
ocp_quay_redis_image: >-
  {{
    quay_redis_image
    | default('registry.redhat.io/rhel9/redis-6:latest')
  }}

# local = PVC LocalStorage. minio = S3-compatible RadosGWStorage on ADO MinIO.
ocp_quay_storage_backend: "{{ quay_storage_backend | default('local') }}"
ocp_quay_s3_bucket: "{{ quay_s3_bucket | default('quay') }}"
ocp_quay_s3_hostname: "{{ quay_s3_hostname | default('minio.minio.svc') }}"
ocp_quay_s3_port: "{{ quay_s3_port | default(9000) }}"
ocp_quay_s3_is_secure: "{{ quay_s3_is_secure | default(false) }}"
ocp_quay_s3_access_key: >-
  {{ quay_s3_access_key | default(minio_root_user | default('minioadmin')) }}
ocp_quay_s3_secret_key: >-
  {{ quay_s3_secret_key | default(minio_root_password | default('')) }}
ocp_quay_s3_minio_namespace: "{{ quay_s3_minio_namespace | default('minio') }}"
# Bucket Job image: UBI Python. Do not use quay.io/minio/mc.
ocp_quay_minio_mc_image: >-
  {{
    quay_minio_mc_image
    | default('registry.redhat.io/ubi9/python-311:latest')
  }}

# Keycloak OIDC (lab default: on; secret fetched via ocp_rhbk_client_secrets)
quay_oidc_enabled: true
quay_oidc_client_id: quay
quay_oidc_service_id: keycloak
quay_oidc_service_name: Keycloak
quay_keycloak_realm: "{{ rhbk_realm | default(ocp_rhbk_realm | default('rhlab')) }}"
quay_oidc_issuer_url: ""
quay_oidc_client_secret: ""
quay_oidc_configure_after_install: true
quay_oidc_ca_secret: quay-oidc-ca
quay_oidc_ca_pem: ""
