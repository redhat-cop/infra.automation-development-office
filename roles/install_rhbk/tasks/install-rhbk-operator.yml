# -----------------------
# Postgres objects
# -----------------------

- name: Deploy PostgreSQL StatefulSet
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ postgres_statefulset_name }}"
        namespace: "{{ name_space }}"
      spec:
        serviceName: "{{ postgres_service_name }}"
        selector:
          matchLabels:
            app: "{{ postgres_statefulset_name }}"
        replicas: 1
        template:
          metadata:
            labels:
              app: "{{ postgres_statefulset_name }}"
          spec:
            containers:
              - name: postgresql-db
                image: "{{ postgres_image }}"
                ports:
                  - containerPort: 5432
                volumeMounts:
                  - name: data-volume
                    mountPath: /var/lib/pgsql/data
                env:
                  - name: POSTGRESQL_USER
                    valueFrom:
                      secretKeyRef:
                        name: "{{ postgres_secret_name }}"
                        key: username
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ postgres_secret_name }}"
                        key: password
                  - name: POSTGRESQL_DATABASE
                    value: "{{ postgres_db_name }}"
                  - name: POSTGRES_DB
                    value: "{{ postgres_db_name }}"
        volumeClaimTemplates:
          - metadata:
              name: data-volume
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: "{{ postgres_storage_size }}"
              storageClassName: "{{ storage }}"
    wait: true

- name: Deploy PostgreSQL Service
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ postgres_service_name }}"
        namespace: "{{ name_space }}"
      spec:
        selector:
          app: "{{ postgres_statefulset_name }}"
        type: ClusterIP
        ports:
          - port: 5432
            targetPort: 5432

# -----------------------
# Keycloak CR (RHBK) with bootstrapAdmin wired correctly
# -----------------------

- name: Build Keycloak CR http section for TLS mode
  ansible.builtin.set_fact:
    install_rhbk_http_spec: >-
      {{
        {'httpEnabled': true}
        if (install_rhbk_tls_mode | default('edge')) == 'edge'
        else {'tlsSecret': ocp_rhbk_tls_secret_name}
      }}
  changed_when: false

- name: Build Keycloak CR additionalOptions for metrics
  ansible.builtin.set_fact:
    install_rhbk_additional_options: >-
      {{
        (
          [{'name': 'metrics-enabled', 'value': 'true'}]
          if (install_rhbk_metrics_enabled | bool) else []
        )
        + (
          [{'name': 'health-enabled', 'value': 'true'}]
          if (install_rhbk_metrics_enabled | bool) else []
        )
        + (
          [
            {'name': 'event-metrics-user-enabled', 'value': 'true'},
            {
              'name': 'event-metrics-user-events',
              'value': (install_rhbk_event_metrics_user_events | string)
            },
            {
              'name': 'event-metrics-user-tags',
              'value': (install_rhbk_event_metrics_user_tags | string)
            }
          ]
          if (
            (install_rhbk_metrics_enabled | bool)
            and (install_rhbk_event_metrics_user_enabled | bool)
          ) else []
        )
        + (
          [{'name': 'http-metrics-histograms-enabled', 'value': 'true'}]
          if (
            (install_rhbk_metrics_enabled | bool)
            and (install_rhbk_http_metrics_histograms_enabled | bool)
          ) else []
        )
      }}
  changed_when: false

- name: Build Keycloak CR features for user-event-metrics
  ansible.builtin.set_fact:
    # Required with event-metrics-user-enabled on RHBK 26.1+/26.2+.
    # Older images (e.g. stable-v26.0) reject the feature and crash-loop —
    # leave install_rhbk_event_metrics_user_enabled false until upgraded.
    install_rhbk_features_spec: >-
      {{
        {'features': {'enabled': ['user-event-metrics']}}
        if (
          (install_rhbk_metrics_enabled | bool)
          and (install_rhbk_event_metrics_user_enabled | bool)
          and (install_rhbk_user_event_metrics_feature | bool)
        ) else {}
      }}
  changed_when: false

- name: Deploy Keycloak Custom Resource
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: k8s.keycloak.org/v2alpha1
      kind: Keycloak
      metadata:
        name: keycloak
        namespace: "{{ name_space }}"
      # IMPORTANT: Creates the real admin user at initial creation
      spec: >-
        {{
          {
            'instances': 1,
            'bootstrapAdmin': {
              'user': {
                'secret': 'keycloak-admin-creds'
              }
            },
            'db': {
              'vendor': 'postgres',
              'host': postgres_service_name,
              'usernameSecret': {
                'name': postgres_secret_name,
                'key': 'username'
              },
              'passwordSecret': {
                'name': postgres_secret_name,
                'key': 'password'
              }
            },
            'http': install_rhbk_http_spec,
            'hostname': {
              'hostname': ocp_rhbk_hostname
            },
            'proxy': {
              'headers': 'xforwarded'
            },
            'additionalOptions': install_rhbk_additional_options
          }
          | combine(install_rhbk_features_spec, recursive=True)
        }}

- name: Ensure Keycloak ServiceMonitor for management metrics
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: keycloak
        namespace: "{{ name_space }}"
        labels:
          app: keycloak
      spec:
        selector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/instance: keycloak
        endpoints:
          - port: management
            path: /metrics
            scheme: https
            interval: 30s
            honorLabels: true
            tlsConfig:
              insecureSkipVerify: true
  when:
    - state == 'present'
    - install_rhbk_servicemonitor_enabled | bool

- name: Ensure OpenShift edge Route for Keycloak (HTTP backend)
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ ocp_rhbk_route_name | default('keycloak') }}"
        namespace: "{{ name_space }}"
      spec:
        host: "{{ ocp_rhbk_hostname }}"
        to:
          kind: Service
          name: "{{ ocp_rhbk_service_name | default('keycloak-service') }}"
        port:
          targetPort: "{{ ocp_rhbk_service_port | default('http') }}"
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
  when:
    - state == 'present'
    - (install_rhbk_tls_mode | default('edge')) == 'edge'
