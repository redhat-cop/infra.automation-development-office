---
- name: Guard — required vars
  ansible.builtin.assert:
    that:
      - name_space is defined and (name_space | string | length) > 0
      - ocp_rhbk_hostname is defined and (ocp_rhbk_hostname | string | length) > 0
    fail_msg: "name_space and ocp_rhbk_hostname are required."

# -----------------------
# Secrets: DB + Admin
# -----------------------

- name: Create Keycloak DB Secret
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ postgres_secret_name }}"
        namespace: "{{ name_space }}"
      type: Opaque
      stringData:
        username: "{{ ocp_rhbk_db_user }}"
        password: "{{ ocp_rhbk_db_password }}"

- name: Create Keycloak bootstrap ADMIN Secret (used by spec.bootstrapAdmin.user.secret)
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-admin-creds
        namespace: "{{ name_space }}"
      type: Opaque
      stringData:
        username: "{{ ocp_rhbk_admin_user }}"
        password: "{{ ocp_rhbk_admin_password }}"

# -----------------------
# TLS: cert-manager vs manual
# -----------------------

- name: Guard — cert-manager mode requires issuer name
  ansible.builtin.assert:
    that:
      - ocp_rhbk_issuer_name is defined
      - (ocp_rhbk_issuer_name | string | length) > 0
      - ocp_rhbk_issuer_kind is defined
      - ocp_rhbk_issuer_kind in ['Issuer', 'ClusterIssuer']
    fail_msg: "cert_manager=true requires ocp_rhbk_issuer_name and ocp_rhbk_issuer_kind (Issuer or ClusterIssuer)."
  when: cert_manager | default(false) | bool

- name: Resolve RHBK TLS mode
  ansible.builtin.set_fact:
    install_rhbk_tls_mode: >-
      {{
        'cert_manager' if (cert_manager | default(false) | bool)
        else (
          'ingress_copy' if (ocp_rhbk_use_default_ingress_cert | default(false) | bool)
          else (
            'manual' if (
              (tls_crt | default('') | string | trim | length) > 0
              and (tls_key | default('') | string | trim | length) > 0
            )
            else 'edge'
          )
        )
      }}
  changed_when: false

- name: Create cert-manager Certificate for Keycloak (cert_manager=true)
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ ocp_rhbk_cert_name }}"
        namespace: "{{ name_space }}"
      spec:
        secretName: "{{ ocp_rhbk_tls_secret_name }}"
        dnsNames:
          - "{{ ocp_rhbk_hostname }}"
        issuerRef:
          name: "{{ ocp_rhbk_issuer_name }}"
          kind: "{{ ocp_rhbk_issuer_kind }}"
  when: install_rhbk_tls_mode == 'cert_manager'

- name: Wait for cert-manager Certificate to be Ready
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ ocp_rhbk_cert_name }}"
    namespace: "{{ name_space }}"
  register: install_rhbk_certificate_info
  until: >-
    install_rhbk_certificate_info.resources | default([]) | length > 0
    and (
      install_rhbk_certificate_info.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) > 0
  retries: "{{ ocp_rhbk_certificate_wait_retries | default(60) | int }}"
  delay: "{{ ocp_rhbk_certificate_wait_delay | default(10) | int }}"
  when:
    - state == 'present'
    - install_rhbk_tls_mode == 'cert_manager'

- name: Guard — manual TLS requires tls_crt + tls_key
  ansible.builtin.assert:
    that:
      - tls_crt is defined and (tls_crt | string | length) > 0
      - tls_key is defined and (tls_key | string | length) > 0
    fail_msg: "manual TLS mode requires tls_crt and tls_key."
  when: install_rhbk_tls_mode == 'manual'

- name: Resolve default IngressController certificate secret name
  when: install_rhbk_tls_mode == 'ingress_copy'
  block:
    - name: Read default IngressController
      kubernetes.core.k8s_info:
        api_version: operator.openshift.io/v1
        kind: IngressController
        name: "{{ ocp_rhbk_ingress_controller_name | default('default') }}"
        namespace: "{{ ocp_rhbk_ingress_operator_namespace | default('openshift-ingress-operator') }}"
      register: install_rhbk_ingress_controller

    - name: Set default ingress TLS secret reference
      ansible.builtin.set_fact:
        install_rhbk_ingress_tls_secret_name: >-
          {{
            ocp_rhbk_ingress_controller.resources[0].spec.defaultCertificate.name
            | default('router-certs-' ~ (ocp_rhbk_ingress_controller_name | default('default')))
          }}
        install_rhbk_ingress_tls_secret_namespace: >-
          {{
            ocp_rhbk_ingress_controller.resources[0].spec.defaultCertificate.namespace
            | default('openshift-ingress')
          }}

    - name: Read default ingress TLS secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ install_rhbk_ingress_tls_secret_name }}"
        namespace: "{{ install_rhbk_ingress_tls_secret_namespace }}"
      register: install_rhbk_ingress_tls_secret

    - name: Decode and validate default ingress PEM material
      ansible.builtin.set_fact:
        install_rhbk_ingress_tls_crt_pem: >-
          {{
            ocp_rhbk_ingress_tls_secret.resources[0].data['tls.crt']
            | default('')
            | b64decode
          }}
        install_rhbk_ingress_tls_key_pem: >-
          {{
            ocp_rhbk_ingress_tls_secret.resources[0].data['tls.key']
            | default('')
            | b64decode
          }}
      no_log: true

    - name: Assert default ingress TLS secret has usable PEMs
      ansible.builtin.assert:
        that:
          - (ocp_rhbk_ingress_tls_secret.resources | default([]) | length) > 0
          - "'BEGIN CERTIFICATE' in (install_rhbk_ingress_tls_crt_pem | default(''))"
          - >-
            ('BEGIN' in (install_rhbk_ingress_tls_key_pem | default('')))
            and ('PRIVATE KEY' in (install_rhbk_ingress_tls_key_pem | default('')))
        fail_msg: >-
          Default ingress TLS secret
          {{ install_rhbk_ingress_tls_secret_namespace }}/{{ install_rhbk_ingress_tls_secret_name }}
          is missing or has empty/invalid PEM data (OpenShift warning:
          "tls: failed to find any PEM data in certificate input").
          Run "Update Default Ingress Certificate" / cert-manager first,
          set cert_manager=true for Keycloak, or leave defaults (edge TLS).

    - name: Create Keycloak TLS Secret from default ingress certificate
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ocp_rhbk_tls_secret_name }}"
            namespace: "{{ name_space }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ ocp_rhbk_ingress_tls_secret.resources[0].data['tls.crt'] }}"
            tls.key: "{{ ocp_rhbk_ingress_tls_secret.resources[0].data['tls.key'] }}"

- name: Create Keycloak TLS Secret (manual PEMs)
  kubernetes.core.k8s:
    state: "{{ state }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp_rhbk_tls_secret_name }}"
        namespace: "{{ name_space }}"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ tls_crt | b64encode }}"
        tls.key: "{{ tls_key | b64encode }}"
  when: install_rhbk_tls_mode == 'manual'

# -----------------------
# Postgres: handle immutable SS changes safely
# -----------------------

- name: Get existing PostgreSQL StatefulSet (if any)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ name_space }}"
    name: "{{ postgres_statefulset_name }}"
  register: install_rhbk_ss_info
  failed_when: false

- name: Decide if StatefulSet needs recreation due to immutable changes
  ansible.builtin.set_fact:
    install_rhbk_requires_ss_recreation: >-
      {{
        (ocp_rhbk_recreate_ss_on_immutable_change | default(rhbk_recreate_ss_on_immutable_change) | default(true) | bool) and
        (install_rhbk_ss_info.resources | length > 0) and (
          (
            (install_rhbk_ss_info.resources[0].spec
            .volumeClaimTemplates[0].spec.storageClassName | default(''))
            != (postgres_storage_class | default(''))
          )
          or
          (
            (install_rhbk_ss_info.resources[0].spec.serviceName | default('')) != postgres_service_name
          )
        )
      }}

