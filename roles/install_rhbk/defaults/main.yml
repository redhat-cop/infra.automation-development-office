---
# Platform: openshift (operator + Keycloak CR) or rhel (standalone RHBK on VM/bare metal).
# Always Red Hat Build of Keycloak — never upstream Keycloak.
install_rhbk_platform: "{{ rhbk_platform | default('openshift') }}"
state: present

# --- OpenShift path (existing) ---
name_space: keycloak
ocp_rhbk_hostname: "{{ rhbk_hostname | default('keycloak.apps.example.com') }}"
ocp_rhbk_admin_user: "{{ rhbk_admin_user | default('admin') }}"
ocp_rhbk_admin_password: "{{ rhbk_admin_password | default('changeme') }}"
ocp_rhbk_db_user: "{{ rhbk_db_user | default('keycloak') }}"
ocp_rhbk_db_password: "{{ rhbk_db_password | default('changeme-db') }}"
postgres_secret_name: keycloak-db-secret
cert_manager: false
# Prefer OpenShift edge TLS (router terminates HTTPS; Keycloak speaks HTTP).
# Copying the default ingress cert into Keycloak often fails in labs when that
# secret is empty/placeholder → UNEXPECTED_EOF on the route.
ocp_rhbk_http_edge: true
ocp_rhbk_use_default_ingress_cert: false
ocp_rhbk_cert_name: keycloak-tls
ocp_rhbk_tls_secret_name: keycloak-tls-secret
ocp_rhbk_issuer_name: ""
ocp_rhbk_issuer_kind: ClusterIssuer
ocp_rhbk_ingress_controller_name: default
ocp_rhbk_ingress_operator_namespace: openshift-ingress-operator
ocp_rhbk_service_name: keycloak-service
ocp_rhbk_service_port: http
ocp_rhbk_route_name: keycloak
# Recreate Postgres STS when immutable fields change (storage class / serviceName).
# Default true — callers should not need to set this.
ocp_rhbk_recreate_ss_on_immutable_change: "{{ rhbk_recreate_ss_on_immutable_change | default(true) }}"

# Native RHBK user-event metrics (keycloak_user_events_total) — not the old
# community Metrics SPI. Requires RHBK / Keycloak 26.1+ (supported 26.2+) with
# feature user-event-metrics. Lab channel stable-v26.0 rejects the feature and
# crash-loops if event-metrics-user-enabled is set — keep false until upgraded.
install_rhbk_metrics_enabled: "{{ rhbk_metrics_enabled | default(true) | bool }}"
install_rhbk_event_metrics_user_enabled: >-
  {{
    rhbk_event_metrics_user_enabled
    | default(event_metrics_user_enabled | default(false))
    | bool
  }}
install_rhbk_event_metrics_user_events: >-
  {{
    rhbk_event_metrics_user_events
    | default('login,logout,register,refresh_token,code_to_token')
  }}
install_rhbk_event_metrics_user_tags: >-
  {{ rhbk_event_metrics_user_tags | default('realm,clientId') }}
install_rhbk_http_metrics_histograms_enabled: >-
  {{ rhbk_http_metrics_histograms_enabled | default(true) | bool }}
# Set true on RHBK builds that list user-event-metrics (26.1+/26.2+).
# When event metrics are enabled, ADO also sets this unless explicitly false.
install_rhbk_user_event_metrics_feature: >-
  {{
    rhbk_user_event_metrics_feature
    | default(install_rhbk_event_metrics_user_enabled)
    | bool
  }}
# OpenShift ServiceMonitor for management /metrics (user-workload monitoring).
install_rhbk_servicemonitor_enabled: >-
  {{
    rhbk_servicemonitor_enabled
    | default(install_rhbk_metrics_enabled)
    | bool
  }}

# --- RHEL / standalone path (official RHBK zip) ---
install_rhbk_standalone_hostname: "{{ rhbk_hostname | default('') }}"
install_rhbk_standalone_http_port: 8080
install_rhbk_standalone_https_port: 8443
# Optional HTTPS (same PEM pattern as OpenShift install_rhbk: tls_crt + tls_key).
install_rhbk_standalone_https_enabled: "{{ rhbk_standalone_https_enabled | default(false) | bool }}"
install_rhbk_standalone_http_enabled: "{{ rhbk_standalone_http_enabled | default(true) | bool }}"
install_rhbk_standalone_tls_dir: /etc/rhbk/tls
# Prefer role-specific vars; fall back to shared tls_crt/tls_key used by OCP path.
install_rhbk_standalone_tls_crt: "{{ rhbk_standalone_tls_crt | default(tls_crt | default('')) }}"
install_rhbk_standalone_tls_key: "{{ rhbk_standalone_tls_key | default(tls_key | default('')) }}"
install_rhbk_standalone_admin_user: "{{ rhbk_admin_user | default('admin') }}"
install_rhbk_standalone_admin_password: "{{ rhbk_admin_password | default('redhat123') }}"
install_rhbk_standalone_home: /opt/rhbk
install_rhbk_standalone_data_dir: /var/lib/rhbk
# Zip source: url (HTTP/Satellite), git (clone on host), or upload (controller copy).
# Empty source keeps legacy precedence: local zip → URL → git.
install_rhbk_standalone_zip_source: "{{ rhbk_standalone_zip_source | default('') }}"
# Local/controller path (copied to the VM), e.g. files/rhbk-26.6.5.zip from bootstrap.
install_rhbk_standalone_zip: "{{ rhbk_standalone_zip | default('') }}"
# HTTP(S) URL the Keycloak host can reach (Satellite example: http://sat/pub/rhbk.zip).
install_rhbk_standalone_zip_url: "{{ rhbk_standalone_zip_url | default('') }}"
# Git clone on the Keycloak host; zip path is relative to the repo root.
install_rhbk_standalone_zip_git_repo: "{{ rhbk_standalone_zip_git_repo | default('') }}"
install_rhbk_standalone_zip_git_path: "{{ rhbk_standalone_zip_git_path | default('') }}"
install_rhbk_standalone_zip_git_branch: "{{ rhbk_standalone_zip_git_branch | default('') }}"
# When the VM has no Satellite/repos, pre-stage Java and set skip_packages.
install_rhbk_standalone_skip_packages: false
install_rhbk_standalone_java_home: ""
