---
# Standalone Grafana on RHEL.
# Lab default is disconnected: stage grafana RPM (Contoller path or internal URL).
# Set install_grafana_allow_online_repo=true only for connected labs (rpm.grafana.com).
state: present

install_grafana_hostname: "{{ grafana_hostname | default('') }}"
install_grafana_http_port: 3000
install_grafana_admin_user: "{{ grafana_admin_user | default('admin') }}"
install_grafana_admin_password: "{{ grafana_admin_password | default('redhat123') }}"

# Airgap (required unless allow_online_repo or package already installed).
install_grafana_rpm_path: "{{ grafana_rpm_path | default('') }}"
install_grafana_rpm_url: "{{ grafana_rpm_url | default('') }}"
install_grafana_allow_online_repo: "{{ grafana_allow_online_repo | default(false) | bool }}"
install_grafana_repo_url: https://rpm.grafana.com
install_grafana_gpg_key_url: https://rpm.grafana.com/gpg.key

# When the VM has no Satellite/repos, pre-stage package and set skip_packages.
install_grafana_skip_packages: false
install_grafana_config_path: /etc/grafana/grafana.ini
install_grafana_service_name: grafana-server
