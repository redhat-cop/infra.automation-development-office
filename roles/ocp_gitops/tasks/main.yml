---
- name: Wait for ArgoCD CRD before creating instance
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: argocds.argoproj.io
  register: ocp_gitops_argocd_crd
  until: (ocp_gitops_argocd_crd.resources | default([])) | length > 0
  retries: "{{ ocp_gitops_crd_retries | default(60) | int }}"
  delay: "{{ ocp_gitops_crd_delay | default(10) | int }}"

- name: Apply ArgoCD instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: "{{ argocd_name | default('openshift-gitops') }}"
        namespace: "{{ argocd_namespace | default(app_namespace) }}"
      spec:
        dex:
          openShiftOAuth: "{{ argocd_dex_openshift_oauth | default(true) | bool }}"
        rbac:
          defaultPolicy: "{{ argocd_rbac_default_policy | default('role:readonly') }}"
        server:
          route:
            enabled: "{{ argocd_server_route_enabled | default(true) | bool }}"

- name: Wait for ArgoCD pods to be running
  ansible.builtin.include_role:
    name: infra.automation_development_office.ocp_wait_pods
  vars:
    name_space: "{{ app_namespace }}"
    label_selector: "{{ pods_label_selector | default('app.kubernetes.io/part-of=argocd') }}"
    ocp_wait_pods_pod_wait_retries: "{{ ((wait_timeout_seconds | default(900) | int) // (delay | default(10) | int)) | int }}"
    ocp_wait_pods_pod_wait_delay: "{{ delay | default(10) | int }}"

- name: Enforce ArgoCD route if requested
  kubernetes.core.k8s:
    state: present
    namespace: "{{ name_space }}"
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ route_name | default('openshift-gitops-server') }}"
      spec:
        host: "{{ route_hostname | default('') }}"
        to:
          kind: Service
          name: "{{ (argocd_name | default('openshift-gitops')) ~ '-server' }}"
        port:
          targetPort: https
        tls:
          termination: "{{ route_termination | default('passthrough') }}"
  when: route_enforce | default(false) | bool

- name: Get ArgoCD route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ app_namespace | default(name_space) }}"
    name: "{{ route_name | default('openshift-gitops-server') }}"
  register: ocp_gitops_argocd_route

- name: Print ArgoCD URL
  ansible.builtin.debug:
    msg:
      - "Argo CD URL: https://{{ ocp_gitops_argocd_route.resources[0].spec.host }}"
      - "Login: click LOG IN VIA OPENSHIFT"
  when: ocp_gitops_argocd_route.resources | length > 0
