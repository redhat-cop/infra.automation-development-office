---
# yamllint disable rule:line-length
# Present-only install path (imported when state=present).

# Stale Subscriptions (wrong package) leave the namespace in ResolutionFailed and
# block the new package (seen with redhat-developer-hub-operator → rhdh).
- name: Subscription | Remove stale incompatible Subscriptions
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ ocp_operator_subscription_sub_namespace }}"
    name: "{{ item }}"
  loop: "{{ operator_subscription_remove_stale | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (operator_subscription_remove_stale | default([]) | length) > 0
  changed_when: false

- name: Namespace | Ensure subscription namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp_operator_subscription_sub_namespace }}"

# OLM allows only one OperatorGroup per namespace (e.g. openshift-operators
# already has global-operators). Discover first; create only when none exist.
- name: OperatorGroup | List existing in subscription namespace
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ ocp_operator_subscription_sub_namespace }}"
  register: ocp_operator_subscription_existing_ogs
  when:
    - operatorgroup is defined
    - (operatorgroup | string | trim | length) > 0

- name: OperatorGroup | Create only when namespace has none
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: "{{ operatorgroup | regex_replace('_', '-') }}"
        namespace: "{{ ocp_operator_subscription_sub_namespace }}"
      spec: >-
        {{
          (all_namespaces_install | default(false) | bool)
          | ternary({}, {'targetNamespaces': [ocp_operator_subscription_sub_namespace]})
        }}
  when:
    - operatorgroup is defined
    - (operatorgroup | string | trim | length) > 0
    - (ocp_operator_subscription_existing_ogs.resources | default([])) | length == 0

- name: Subscription | Create/Update Operator subscription (supports startingCSV)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ ocp_operator_subscription_sub_name }}"
        namespace: "{{ ocp_operator_subscription_sub_namespace }}"
      spec:
        channel: "{{ ocp_operator_subscription_channel }}"
        name: "{{ ocp_operator_subscription_pkg_name }}"
        source: "{{ operator_source }}"
        sourceNamespace: "{{ operator_source_namespace }}"
        installPlanApproval: "{{ installPlanApproval | default('Automatic') }}"
        startingCSV: "{{ operator_starting_csv }}"
  when: (operator_starting_csv | default('') | string | trim | length) > 0

- name: Subscription | Create/Update Operator subscription (no startingCSV)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ ocp_operator_subscription_sub_name }}"
        namespace: "{{ ocp_operator_subscription_sub_namespace }}"
      spec:
        channel: "{{ ocp_operator_subscription_channel }}"
        name: "{{ ocp_operator_subscription_pkg_name }}"
        source: "{{ operator_source }}"
        sourceNamespace: "{{ operator_source_namespace }}"
        installPlanApproval: "{{ installPlanApproval | default('Automatic') }}"
  when: (operator_starting_csv | default('') | string | trim | length) == 0
