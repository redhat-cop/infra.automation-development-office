---
# Wire NetBox ConfigMap OIDC settings (avoids helm upgrade PDB/StatefulSet conflicts).

- name: Check existing NetBox namespace before configuring OIDC
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ netbox_oidc_namespace }}"
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  register: netbox_oidc_namespace_check
  when: netbox_oidc_state | default('present') == 'present'

- name: Require an existing NetBox installation
  ansible.builtin.assert:
    that:
      - netbox_oidc_namespace_check.resources | default([]) | length > 0
    fail_msg: >-
      NetBox namespace {{ netbox_oidc_namespace }} does not exist on the target cluster.
      Install NetBox first or correct component_config.netbox.namespace.
      The NetBox workflow configures OIDC for an existing installation; it does not install NetBox.
  when: netbox_oidc_state | default('present') == 'present'

# Survey extra_vars beat set_fact on the same name — use *_resolved for effective values.
- name: Resolve NetBox OIDC issuer from RHBK when unset
  ansible.builtin.set_fact:
    netbox_oidc_issuer_resolved: >-
      {{
        netbox_oidc_issuer | default('', true)
        | default(oidc_issuer | default('', true), true)
        | default(
            'https://'
            ~ (ocp_rhbk_hostname | default(rhbk_hostname | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))))))
            ~ '/realms/'
            ~ (ocp_rhbk_realm | default(rhbk_realm | default('rhlab'))),
            true
          )
      }}
  when: netbox_oidc_state | default('present') == 'present'

- name: Fetch NetBox OIDC client secret from Keycloak when unset
  ansible.builtin.include_role:
    name: infra.ado.ocp_rhbk_client_secrets
    public: true
  vars:
    ocp_rhbk_secret_client_id: "{{ netbox_oidc_client_id }}"
    ocp_rhbk_component_name: rhbk
  when:
    - netbox_oidc_state | default('present') == 'present'
    - (netbox_oidc_client_secret | default('') | string | length) == 0
  no_log: true

- name: Resolve NetBox OIDC client secret
  ansible.builtin.set_fact:
    netbox_oidc_client_secret_resolved: >-
      {{
        (netbox_oidc_client_secret | default('') | trim)
        if (netbox_oidc_client_secret | default('') | trim | length) > 0
        else (ocp_rhbk_client_secrets__value | default(ocp_rhbk_secret_value | default('')))
      }}
  when: netbox_oidc_state | default('present') == 'present'
  no_log: true

- name: Assert NetBox OIDC inputs
  ansible.builtin.assert:
    that:
      - netbox_oidc_client_secret_resolved | default('') | length > 0
      - netbox_oidc_issuer_resolved | default('', true) | length > 0
      - netbox_oidc_client_id | default('') | length > 0
    fail_msg: >-
      netbox_oidc requires issuer, client_id, and client_secret
      (create confidential client {{ netbox_oidc_client_id | default('netbox') }}
      in Keycloak realm {{ ocp_rhbk_realm | default(rhbk_realm | default('')) }} first).
  when: netbox_oidc_state | default('present') == 'present'

- name: Create NetBox OIDC Secret (reference / audit)
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ netbox_oidc_secret_name }}"
        namespace: "{{ netbox_oidc_namespace }}"
        labels:
          app.kubernetes.io/name: netbox
          app.kubernetes.io/component: oidc
      type: Opaque
      stringData:
        SOCIAL_AUTH_OIDC_KEY: "{{ netbox_oidc_client_id }}"
        SOCIAL_AUTH_OIDC_SECRET: "{{ netbox_oidc_client_secret_resolved }}"
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  register: netbox_oidc_secret_apply
  when: netbox_oidc_state | default('present') == 'present'

- name: Fail when NetBox OIDC Secret apply failed
  ansible.builtin.fail:
    msg: >-
      Failed to create/update Secret {{ netbox_oidc_secret_name }} in
      {{ netbox_oidc_namespace }}: {{ netbox_oidc_secret_apply.msg | default(netbox_oidc_secret_apply) }}
  when:
    - netbox_oidc_state | default('present') == 'present'
    - netbox_oidc_secret_apply is failed

- name: Read current NetBox ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: netbox
    namespace: "{{ netbox_oidc_namespace }}"
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  register: netbox_oidc_cm
  when: netbox_oidc_state | default('present') == 'present'

- name: Create NetBox lab CA ConfigMap for OIDC TLS trust
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ netbox_oidc_ca_configmap }}"
        namespace: "{{ netbox_oidc_namespace }}"
        labels:
          app.kubernetes.io/name: netbox
          app.kubernetes.io/component: oidc
      data:
        lab-ca.crt: "{{ netbox_oidc_ca_bundle }}"
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  when:
    - netbox_oidc_state | default('present') == 'present'
    - netbox_oidc_ca_bundle | default('') | length > 0

# NetBox wires SSO via REMOTE_AUTH_BACKEND → AUTHENTICATION_BACKENDS.
# SOCIAL_AUTH_BACKENDS alone is ignored by LoginView (load_backends(AUTHENTICATION_BACKENDS)).
- name: Merge OIDC keys into netbox.yaml
  ansible.builtin.set_fact:
    netbox_oidc_config_yaml: >-
      {{
        (
          netbox_oidc_cm.resources[0].data['netbox.yaml'] | from_yaml
        )
        | combine({
            'REMOTE_AUTH_BACKEND': ['social_core.backends.open_id_connect.OpenIdConnectAuth'],
            'SOCIAL_AUTH_OIDC_OIDC_ENDPOINT': netbox_oidc_issuer_resolved,
            'SOCIAL_AUTH_OIDC_KEY': netbox_oidc_client_id,
            'SOCIAL_AUTH_OIDC_SECRET': netbox_oidc_client_secret_resolved,
            'SOCIAL_AUTH_BACKEND_ATTRS': {
              'oidc': ['Keycloak', 'shield-key-outline']
            },
            'SOCIAL_AUTH_VERIFY_SSL': netbox_oidc_verify_ssl | bool,
            'LOGIN_REQUIRED': netbox_oidc_login_required | bool
          }, recursive=True)
        | to_nice_yaml
      }}
  when:
    - netbox_oidc_state | default('present') == 'present'
    - netbox_oidc_cm.resources | default([]) | length > 0
  no_log: true

- name: Apply NetBox ConfigMap with OIDC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: netbox
        namespace: "{{ netbox_oidc_namespace }}"
      data: >-
        {{
          netbox_oidc_cm.resources[0].data
          | combine({'netbox.yaml': netbox_oidc_config_yaml})
        }}
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  when:
    - netbox_oidc_state | default('present') == 'present'
    - netbox_oidc_config_yaml is defined
  no_log: true

# NOTE: Mounting lab-ca + REQUESTS_CA_BUNDLE is done out-of-band / once on the
# Helm Deployment (strategic-merge of partial containers is unsafe). When
# netbox_oidc_verify_ssl is false, social_core skips TLS verify for discovery.

- name: Restart NetBox Deployments to load OIDC config
  kubernetes.core.k8s:
    state: present
    kind: Deployment
    namespace: "{{ netbox_oidc_namespace }}"
    name: "{{ item }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              ado.netbox/oidc-restart: "{{ ansible_date_time.epoch | default(lookup('pipe', 'date +%s')) }}"
    validate_certs: "{{ netbox_oidc_validate_certs }}"
  loop:
    - netbox
    - netbox-worker
  when: netbox_oidc_state | default('present') == 'present'

- name: Show NetBox OIDC status
  ansible.builtin.debug:
    msg: >-
      NetBox OIDC configured for issuer {{ netbox_oidc_issuer_resolved }}
      (client={{ netbox_oidc_client_id }}). Use OpenID Connect on the NetBox login page.
  when: netbox_oidc_state | default('present') == 'present'
