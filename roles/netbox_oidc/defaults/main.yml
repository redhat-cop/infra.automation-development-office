---
# Wire NetBox login to Keycloak / RHBK OIDC by updating the NetBox ConfigMap.

netbox_oidc_state: present
netbox_oidc_namespace: "{{ netbox_namespace | default(name_space | default('netbox')) }}"
netbox_oidc_release: netbox
netbox_oidc_validate_certs: "{{ validate_certs | default(true) }}"

# Issuer is resolved at runtime from ocp_rhbk_* / vars_rhbk.yml inside the role.
netbox_oidc_issuer: ""
netbox_oidc_client_id: netbox
netbox_oidc_client_secret: ""
netbox_oidc_login_required: false
netbox_oidc_auto_create_user: true

# Local admin remains available (Helm superuser); password managed outside this role.
netbox_oidc_secret_name: netbox-oidc

# Lab Keycloak uses IPA/router PEMs. Prefer CA trust via netbox_oidc_ca_bundle
# (ConfigMap netbox-lab-ca + REQUESTS_CA_BUNDLE on the Deployment — applied live).
# SOCIAL_AUTH_VERIFY_SSL defaults false so Contoller JT re-runs stay safe without a mount.
netbox_oidc_ca_bundle: "{{ bookstack_oidc_ca_bundle | default('') }}"
netbox_oidc_ca_configmap: netbox-lab-ca
netbox_oidc_verify_ssl: false
