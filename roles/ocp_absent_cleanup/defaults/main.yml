---
# SPDX-License-Identifier: GPL-3.0-or-later
# Explicit OpenShift cleanup. Nothing destructive runs unless the matching
# authorize flag is true. Namespace deletion itself belongs to ocp_namespace.

# Required: list of namespaces this run may touch.
ocp_absent_cleanup_namespaces: []

# check = report only; cleanup = delete only what the authorize flags allow.
ocp_absent_cleanup_mode: cleanup

# Listing/deleting CSVs and InstallPlans. Default false.
ocp_absent_cleanup_sweep_olm: false
# Required before any CSV or InstallPlan delete.
ocp_absent_cleanup_authorize_csv_delete: false
# Required before deleting every CSV when csv_name_match is empty.
ocp_absent_cleanup_authorize_unfiltered_csv_delete: false
# Substring. Empty does not mean "all CSVs".
ocp_absent_cleanup_csv_name_match: ""
# OLM copies (olm.copiedFrom, or olm.operatorNamespace != this namespace)
# stay in place unless this is true.
ocp_absent_cleanup_delete_copied_csvs: false
# Strip CSV finalizers only for CSVs already selected for deletion.
ocp_absent_cleanup_strip_csv_finalizers: false

# Delete Deployments/Pods. Default false.
ocp_absent_cleanup_sweep_workloads: false
# Empty does not mean "all Deployments". Unfiltered delete needs the flag below.
ocp_absent_cleanup_deployment_names: []
ocp_absent_cleanup_authorize_unfiltered_workloads: false

# Fail when a targeted namespace still exists after cleanup.
ocp_absent_cleanup_fail_if_present: true

# Namespace /finalize. Default false. Only Terminating namespaces are finalized
# unless finalize_only_terminating is also set false.
ocp_absent_cleanup_finalize: false
ocp_absent_cleanup_finalize_only_terminating: true

ocp_absent_cleanup_terminating_retries: 12
ocp_absent_cleanup_terminating_delay: 5
ocp_absent_cleanup_delete_settle_seconds: 3

# Additive. The filter plugin's platform denylist always applies as well.
ocp_absent_cleanup_blocked_namespaces: []
ocp_absent_cleanup_blocked_namespace_prefixes: []
