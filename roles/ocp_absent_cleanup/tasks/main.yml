---
# yamllint disable rule:line-length
# Safe OpenShift cleanup gate. Destructive work requires explicit authorize flags.

- name: Absent cleanup | Gate and process namespaces
  tags:
    - ocp_absent_cleanup
  block:
    - name: Absent cleanup | Normalize namespace list
      ansible.builtin.set_fact:
        ocp_absent_cleanup_ns_list: >-
          {{
            ocp_absent_cleanup_namespaces
            | default([])
            | map('string')
            | map('trim')
            | select('ne', '')
            | unique
            | list
          }}
        ocp_absent_cleanup_guard: "{{ {'mode': ocp_absent_cleanup_mode | default('cleanup') | string, 'sweep_olm': ocp_absent_cleanup_sweep_olm | default(false) | bool, 'csv_name_match': ocp_absent_cleanup_csv_name_match | default('') | string, 'authorize_unfiltered_csv_delete': ocp_absent_cleanup_authorize_unfiltered_csv_delete | default(false) | bool, 'delete_copied_csvs': ocp_absent_cleanup_delete_copied_csvs | default(false) | bool, 'sweep_workloads': ocp_absent_cleanup_sweep_workloads | default(false) | bool, 'authorize_unfiltered_workloads': ocp_absent_cleanup_authorize_unfiltered_workloads | default(false) | bool, 'extra_blocked': ocp_absent_cleanup_blocked_namespaces | default([]), 'extra_prefixes': ocp_absent_cleanup_blocked_namespace_prefixes | default([])} }}"
      changed_when: false

    - name: Absent cleanup | Require explicit namespaces
      ansible.builtin.assert:
        that:
          - (ocp_absent_cleanup_ns_list | length) > 0
        fail_msg: >-
          ocp_absent_cleanup requires ocp_absent_cleanup_namespaces (non-empty list).
          Refusing to run without an explicit namespace allowlist.

    - name: Absent cleanup | Require one valid namespace name per entry
      ansible.builtin.assert:
        that:
          - item | infra.automation_development_office.ocp_absent_cleanup_namespace_name_valid
        fail_msg: >-
          ocp_absent_cleanup refuses namespace '{{ item }}'. Pass one DNS-1123
          name per entry. Lists, wildcards, and empty names are not a namespace.
      loop: "{{ ocp_absent_cleanup_ns_list }}"
      loop_control:
        label: "{{ item }}"

    - name: Absent cleanup | Refuse protected or overly broad namespaces
      ansible.builtin.assert:
        that:
          - >-
            not (
              item
              | infra.automation_development_office.ocp_absent_cleanup_cleanup_refused(
                  ocp_absent_cleanup_guard
                )
            )
        fail_msg: >-
          ocp_absent_cleanup refuses namespace '{{ item }}'. Platform namespaces
          are blocked. openshift-operators accepts only a name-matched CSV
          cleanup with workload sweep, unfiltered CSV deletion, and copied-CSV
          deletion all left false.
      loop: "{{ ocp_absent_cleanup_ns_list }}"
      loop_control:
        label: "{{ item }}"

    - name: Absent cleanup | Validate mode
      ansible.builtin.assert:
        that:
          - (ocp_absent_cleanup_mode | string) in ['check', 'cleanup']
        fail_msg: >-
          ocp_absent_cleanup_mode must be 'check' or 'cleanup'
          (got '{{ ocp_absent_cleanup_mode }}').

    - name: Absent cleanup | Process each namespace
      ansible.builtin.include_tasks: cleanup_one_namespace.yml
      loop: "{{ ocp_absent_cleanup_ns_list }}"
      loop_control:
        loop_var: ocp_absent_cleanup_ns
