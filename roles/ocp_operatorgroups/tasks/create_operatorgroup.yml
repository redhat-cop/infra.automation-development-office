---
- name: Derive operator namespace and OperatorGroup name (DNS-1123)
  ansible.builtin.set_fact:
    # Prefer the standard framework var if present
    ocp_operatorgroups_operator_ns: >-
      {{
        operator_namespace
        | default(ocp_operatorgroups_operator_ns, true)
        | default(
            (all_namespaces_install | default(false) | bool)
            | ternary('openshift-operators', name_space),
            true
          )
      }}
    # Sanitize underscores → hyphens for DNS-1123 metadata.name
    ocp_operatorgroups_name: >-
      {{
        (
          operatorgroup
          | default(ocp_operatorgroups_name)
          | default(
              (all_namespaces_install | default(false) | bool)
              | ternary(
                  'global-operators',
                  (name_space | regex_replace('_', '-') ~ '-operator-group')
                )
            )
        ) | regex_replace('_', '-')
      }}

- name: Guard — require name_space when not in AllNamespaces mode
  ansible.builtin.assert:
    that:
      - (all_namespaces_install | default(false) | bool) or (name_space is defined and name_space | length > 0)
    fail_msg: "Variable 'name_space' must be set when all_namespaces_install is false."

# --- Module defaults (TLS + waits) apply to all k8s tasks below ---------------
- name: Manage openshift_tools_operator_groups with module defaults
  module_defaults:
    kubernetes.core.k8s:
      validate_certs: "{{ validate_certs | default(true) | bool }}"
      wait: true
      wait_timeout: 300
    kubernetes.core.k8s_info:
      validate_certs: "{{ validate_certs | default(true) | bool }}"
  block:
    # ========================== PRESENT =======================================
    - name: Lookup existing openshift_tools_operator_groupss in operator namespace
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1
        kind: OperatorGroup
        namespace: "{{ ocp_operatorgroups_operator_ns }}"
      register: ocp_operatorgroups_og_info
      when: (state | default('present')) == 'present'

    - name: Guard — OLM prefers exactly one OG; continue if extras already exist
      ansible.builtin.debug:
        msg: >-
          Namespace '{{ ocp_operatorgroups_operator_ns }}' already has
          {{ ocp_operatorgroups_og_info.resources | length }} OperatorGroups
          (OLM expects one). Skipping create/reconcile and reusing existing.
      when:
        - (state | default('present')) == 'present'
        - (ocp_operatorgroups_og_info.resources | length) > 1

    # ---- AllNamespaces mode: create when none exists; reconcile if needed -----
    - name: Create openshift_tools_operator_groups (AllNamespaces mode) when none exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ ocp_operatorgroups_name }}"
            namespace: "{{ ocp_operatorgroups_operator_ns }}"
          spec: {} # no targetNamespaces → all namespaces
      when:
        - (state | default('present')) == 'present'
        - (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 0

    - name: Reconcile existing OG to AllNamespaces (remove targetNamespaces) when needed
      vars:
        _reconcile_all_ns: "{{ reconcile_all_ns | default(true) | bool }}"
        existing_name: "{{ ocp_operatorgroups_og_info.resources[0].metadata.name }}"
        current_tns: "{{ (ocp_operatorgroups_og_info.resources[0].spec.targetNamespaces | default([])) | list }}"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ existing_name }}"
            namespace: "{{ ocp_operatorgroups_operator_ns }}"
          spec: {}
      when:
        - (state | default('present')) == 'present'
        - (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 1
        - _reconcile_all_ns
        - (current_tns | length) > 0

    - name: Info — AllNamespaces OG already has no targetNamespaces
      vars:
        current_tns: "{{ (ocp_operatorgroups_og_info.resources[0].spec.targetNamespaces | default([])) | list }}"
      ansible.builtin.debug:
        msg: >-
          OG '{{ ocp_operatorgroups_og_info.resources[0].metadata.name }}' in
          '{{ ocp_operatorgroups_operator_ns }}' already AllNamespaces
          (targetNamespaces={{ current_tns | to_json }}).
      when:
        - (state | default('present')) == 'present'
        - (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 1
        - (current_tns | length) == 0

    # ---- SingleNamespace mode -------------------------------------------------
    - name: Create openshift_tools_operator_groups (SingleNamespace mode) when none exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ ocp_operatorgroups_name }}"
            namespace: "{{ ocp_operatorgroups_operator_ns }}"
          spec:
            targetNamespaces:
              - "{{ name_space }}"
      when:
        - (state | default('present')) == 'present'
        - not (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 0

    - name: Reconcile existing OG to SingleNamespace target (optional)
      vars:
        _reconcile_single_ns: "{{ reconcile_single_ns | default(true) | bool }}"
        existing_name: "{{ ocp_operatorgroups_og_info.resources[0].metadata.name | default(ocp_operatorgroups_name) }}"
        current_tns: "{{ (ocp_operatorgroups_og_info.resources[0].spec.targetNamespaces | default([])) | list }}"
        desired_tns: ["{{ name_space }}"]
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ existing_name }}"
            namespace: "{{ ocp_operatorgroups_operator_ns }}"
          spec:
            targetNamespaces: "{{ desired_tns }}"
      when:
        - (state | default('present')) == 'present'
        - not (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 1
        - _reconcile_single_ns
        - current_tns != desired_tns

    - name: Info — SingleNamespace OG already matches desired targetNamespaces
      vars:
        current_tns: "{{ (ocp_operatorgroups_og_info.resources[0].spec.targetNamespaces | default([])) | list }}"
      ansible.builtin.debug:
        msg: >-
          OG '{{ ocp_operatorgroups_og_info.resources[0].metadata.name }}'
          in '{{ ocp_operatorgroups_operator_ns }}'
          already targets {{ current_tns
          | to_json }}.
      when:
        - (state | default('present')) == 'present'
        - not (all_namespaces_install | default(false) | bool)
        - (ocp_operatorgroups_og_info.resources | length) == 1
        - current_tns == [ name_space ]
