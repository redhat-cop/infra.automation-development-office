---
- name: Resolve IdP/secret names for removal
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_idp_to_remove: >-
      {{
        (
          htpasswd_idp_name
          | default(htpasswd_idp | default(''), true)
          | string
          | trim
        )
      }}
    ocp_htpasswd_admin_secret_to_remove: >-
      {{
        (
          htpasswd_secret
          | default('', true)
          | string
          | trim
        )
        if (
          (htpasswd_secret | default('', true) | string | trim | length) > 0
        )
        else (
          (
            htpasswd_idp_name
            | default(htpasswd_idp | default(''), true)
            | string
            | trim
          )
          ~ '-secret'
        )
      }}
    ocp_htpasswd_admin_vcerts: >-
      {{
        validate_certs
        | default(ocp_htpasswd_admin_validate_certs | default(false))
      }}

- name: Require an explicit htpasswd IdP name for delete
  ansible.builtin.assert:
    that:
      - (ocp_htpasswd_admin_idp_to_remove | length) > 0
    fail_msg: >-
      state=absent requires htpasswd_idp_name (Login button name / IdP).
      Set it in preflight Admin HTPasswd, re-run bootstrap so
      vars_admin_htpasswd.yml / vars_openshift.yml include it, or pass
      -e htpasswd_idp_name=<name>. Refusing to guess htpasswd-admin.

- name: Show htpasswd IdP targeted for removal
  ansible.builtin.debug:
    msg: >-
      Removing OAuth IdP '{{ ocp_htpasswd_admin_idp_to_remove }}'
      and secret '{{ ocp_htpasswd_admin_secret_to_remove }}'
      (from htpasswd_idp_name / htpasswd_secret).

- name: Read current OAuth
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: "cluster"
    validate_certs: "{{ ocp_htpasswd_admin_vcerts }}"
  register: ocp_htpasswd_admin_oauth
  failed_when: false

- name: List current OAuth IdP names
  when: ocp_htpasswd_admin_oauth.resources | default([]) | length > 0
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_existing_idps: >-
      {{ ocp_htpasswd_admin_oauth.resources[0].spec.identityProviders | default([]) }}
    ocp_htpasswd_admin_existing_idp_names: >-
      {{
        ocp_htpasswd_admin_oauth.resources[0].spec.identityProviders
        | default([])
        | map(attribute='name')
        | list
      }}
    ocp_htpasswd_admin_existing_htpasswd_names: >-
      {{
        ocp_htpasswd_admin_oauth.resources[0].spec.identityProviders
        | default([])
        | selectattr('type', 'defined')
        | selectattr('type', 'equalto', 'HTPasswd')
        | map(attribute='name')
        | list
      }}

- name: Fail when configured IdP is missing but other HTPasswd IdPs exist
  when:
    - ocp_htpasswd_admin_existing_idp_names is defined
    - ocp_htpasswd_admin_idp_to_remove not in ocp_htpasswd_admin_existing_idp_names
    - (ocp_htpasswd_admin_existing_htpasswd_names | default([]) | length) > 0
  ansible.builtin.fail:
    msg: >-
      Refusing to delete IdP '{{ ocp_htpasswd_admin_idp_to_remove }}' — it is
      not on the cluster. HTPasswd login buttons present:
      {{ ocp_htpasswd_admin_existing_htpasswd_names | join(', ') }}.
      Set Login button name (IdP) to the one you want removed (or pass
      -e htpasswd_idp_name=...), then re-run. All IdPs:
      {{ ocp_htpasswd_admin_existing_idp_names | join(', ') }}.

- name: Build pruned IdP list (if OAuth exists)
  when: ocp_htpasswd_admin_oauth.resources | default([]) | length > 0
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_idps_new: >-
      {{
        (ocp_htpasswd_admin_oauth.resources[0].spec.identityProviders | default([]))
        | rejectattr('name', 'equalto', ocp_htpasswd_admin_idp_to_remove)
        | list
      }}

- name: Apply OAuth without our IdP
  when:
    - ocp_htpasswd_admin_oauth.resources | default([]) | length > 0
    - ocp_htpasswd_admin_idps_new is defined
    - ocp_htpasswd_admin_idp_to_remove in (ocp_htpasswd_admin_existing_idp_names | default([]))
  kubernetes.core.k8s:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: "cluster"
    state: present
    definition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: "cluster"
      spec:
        identityProviders: "{{ ocp_htpasswd_admin_idps_new }}"
    validate_certs: "{{ ocp_htpasswd_admin_vcerts }}"
  register: ocp_htpasswd_admin_apply_oauth_result

- name: Record whether OAuth IdP list was updated
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_oauth_removed: >-
      {{ ocp_htpasswd_admin_apply_oauth_result is changed }}

- name: Wait for OAuth to settle after removal
  when: ocp_htpasswd_admin_oauth_removed | default(false) | bool
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterOperator
    name: authentication
    validate_certs: "{{ ocp_htpasswd_admin_vcerts }}"
  register: ocp_htpasswd_admin_auth_co_after
  retries: 30
  delay: 10
  until: >
    ocp_htpasswd_admin_auth_co_after.resources is defined and
    ocp_htpasswd_admin_auth_co_after.resources | length > 0 and
    (
      (ocp_htpasswd_admin_auth_co_after.resources[0].status.conditions
        | selectattr('type','equalto','Progressing') | list | first).status
      | default('False')
    ) == 'False'

- name: Delete Secret (safe if missing)
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ ocp_htpasswd_admin_secret_to_remove }}"
    namespace: "openshift-config"
    state: absent
    validate_certs: "{{ ocp_htpasswd_admin_vcerts }}"

- name: Optionally remove cluster-admin CRBs we created
  when: (remove_cluster_admin_bindings | default(true) | bool)
  loop: >-
    {{
      htpasswd_users
      | default([])
      | selectattr('name', 'defined')
      | map(attribute='name')
      | map('string')
      | map('trim')
      | reject('equalto', '')
      | list
    }}
  loop_control:
    label: "{{ item }}"
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: "htpasswd-{{ item }}-cluster-admin"
    state: absent
    validate_certs: "{{ ocp_htpasswd_admin_vcerts }}"
  failed_when: false

- name: Give the identity providers a few seconds to propagate
  ansible.builtin.pause:
    seconds: 25
