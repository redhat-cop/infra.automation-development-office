---
- name: Normalize htpasswd action
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_action: "{{ htpasswd_action | default('add') | lower }}"

- name: Assert htpasswd action is valid
  ansible.builtin.assert:
    that:
      - ocp_htpasswd_admin_action in ['add', 'replace', 'remove']
    fail_msg: "htpasswd_action must be add, replace, or remove (got {{ htpasswd_action | default('') }})"

- name: Assert htpasswd users are present for install
  ansible.builtin.assert:
    that:
      - htpasswd_users | default([]) | length > 0
      - >-
        (
          htpasswd_users | default([])
          | selectattr('name', 'defined')
          | map(attribute='name')
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        ) > 0
      - >-
        (
          htpasswd_users | default([])
          | selectattr('password', 'defined')
          | map(attribute='password')
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        ) > 0
    fail_msg: >-
      No htpasswd users with name and password were loaded. Preflight should
      write htpasswd_users to vault_openshift.yml, vault_htpass_admin.yml, and
      vault_admin_htpasswd.yml when Admin HTPasswd is selected. Re-run bootstrap
      or pass htpasswd_users via extra vars before launching this job.
  when: state | default('present') == 'present'

- name: Fetch existing htpasswd secret when merging or removing
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ htpasswd_secret }}"
    namespace: "{{ name_space }}"
  register: ocp_htpasswd_admin_existing_secret
  when: ocp_htpasswd_admin_action in ['add', 'remove']

- name: Parse existing htpasswd entries
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_existing_map: >-
      {{
        {} if (
          ocp_htpasswd_admin_existing_secret.resources | default([]) | length == 0
        ) else (
          (
            (
              ocp_htpasswd_admin_existing_secret.resources[0].data.htpasswd
              | default('')
              | b64decode
            ).splitlines()
            | select('match', '^[^:]+:.+$')
            | map('regex_replace', '^([^:]+):(.*)$', '\1')
            | list
          )
          | zip(
            (
              ocp_htpasswd_admin_existing_secret.resources[0].data.htpasswd
              | default('')
              | b64decode
            ).splitlines()
            | select('match', '^[^:]+:.+$')
            | map('regex_replace', '^([^:]+):(.*)$', '\2')
            | list
          )
          | items2dict(key_name=0, value_name=1)
        )
      }}
  when: ocp_htpasswd_admin_action in ['add', 'remove']
  no_log: true

- name: Build effective htpasswd map for replace
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_effective_map: {}
  when: ocp_htpasswd_admin_action == 'replace'
  no_log: true

- name: Seed effective map from existing for add/remove
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_effective_map: "{{ ocp_htpasswd_admin_existing_map | default({}) }}"
  when: ocp_htpasswd_admin_action in ['add', 'remove']
  no_log: true

# Hash all requested users in one Python step (stdin job). Looping set_fact +
# password_hash + no_log has dropped later users (secret ended with only the
# first username). Avoid Jinja ``| keys`` (unavailable in some EEs).
- name: Apply add/replace password hashes for requested users
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/hash_htpasswd_users.py"
      - "-"
    stdin: >-
      {{
        {
          'action': ocp_htpasswd_admin_action,
          'base': ocp_htpasswd_admin_effective_map | default({}),
          'users': htpasswd_users | default([])
        } | to_json
      }}
  register: ocp_htpasswd_admin_hash_cmd
  when: ocp_htpasswd_admin_action in ['add', 'replace']
  no_log: true
  changed_when: false

- name: Store hashed htpasswd payload
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_hash_payload: >-
      {{ ocp_htpasswd_admin_hash_cmd.stdout | from_json }}
    ocp_htpasswd_admin_effective_map: >-
      {{ (ocp_htpasswd_admin_hash_cmd.stdout | from_json).map | default({}) }}
    ocp_htpasswd_admin_htpasswd_content: >-
      {{ (ocp_htpasswd_admin_hash_cmd.stdout | from_json).htpasswd | default('') }}
    ocp_htpasswd_admin_hashed_users: >-
      {{ (ocp_htpasswd_admin_hash_cmd.stdout | from_json).users | default([]) }}
    ocp_htpasswd_admin_requested_users: >-
      {{ (ocp_htpasswd_admin_hash_cmd.stdout | from_json).requested | default([]) }}
  when:
    - ocp_htpasswd_admin_action in ['add', 'replace']
    - ocp_htpasswd_admin_hash_cmd is defined
    - ocp_htpasswd_admin_hash_cmd.stdout is defined
  no_log: true

- name: Show htpasswd usernames that will be written
  ansible.builtin.debug:
    msg: >-
      HTPasswd secret '{{ htpasswd_secret }}' will contain users:
      {{ ocp_htpasswd_admin_hashed_users | default([]) | join(', ') }}
  when:
    - ocp_htpasswd_admin_action in ['add', 'replace']
    - ocp_htpasswd_admin_hashed_users is defined

- name: Assert every requested htpasswd user was hashed
  ansible.builtin.assert:
    that:
      - (ocp_htpasswd_admin_requested_users | default([]) | length) > 0
      - >-
        (
          ocp_htpasswd_admin_requested_users | default([])
          | difference(ocp_htpasswd_admin_hashed_users | default([]))
          | length
        ) == 0
    fail_msg: >-
      One or more htpasswd users were not written into the secret map.
      requested={{ ocp_htpasswd_admin_requested_users | default([]) }}
      hashed={{ ocp_htpasswd_admin_hashed_users | default([]) }}.
      Check every user has a non-empty password in vault_admin_htpasswd.yml.
  when: ocp_htpasswd_admin_action in ['add', 'replace']

- name: Remove requested users from map
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_effective_map: >-
      {{
        ocp_htpasswd_admin_effective_map
        | dict2items
        | rejectattr('key', 'equalto', item.name)
        | items2dict
      }}
  loop: "{{ htpasswd_users | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when:
    - ocp_htpasswd_admin_action == 'remove'
    - not (htpasswd_remove_all | default(false) | bool)
    - item.name is defined
  no_log: true

- name: Clear all users when remove_all
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_effective_map: {}
  when:
    - ocp_htpasswd_admin_action == 'remove'
    - htpasswd_remove_all | default(false) | bool
  no_log: true

- name: Build htpasswd content from effective map
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_htpasswd_content: >-
      {{
        ocp_htpasswd_admin_effective_map
        | dictsort
        | map('join', ':')
        | join('\n')
      }}
  when: >-
    ocp_htpasswd_admin_action == 'remove'
    or ocp_htpasswd_admin_htpasswd_content is not defined
  no_log: true

- name: Create or update htpasswd Secret
  kubernetes.core.k8s:
    state: present
    namespace: "{{ name_space }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ htpasswd_secret }}"
      type: Opaque
      stringData:
        htpasswd: "{{ ocp_htpasswd_admin_htpasswd_content }}"
  register: ocp_htpasswd_admin_secret_result
  when: (ocp_htpasswd_admin_effective_map | length) > 0
  no_log: true

- name: Delete htpasswd Secret when empty after remove
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ htpasswd_secret }}"
    namespace: "{{ name_space }}"
  when:
    - ocp_htpasswd_admin_action == 'remove'
    - (ocp_htpasswd_admin_effective_map | length) == 0

- name: Grant cluster-admin to selected htpasswd users
  kubernetes.core.k8s:
    state: present
    kind: ClusterRoleBinding
    api_version: rbac.authorization.k8s.io/v1
    name: "htpasswd-{{ item.name }}-cluster-admin"
    definition:
      metadata:
        name: "htpasswd-{{ item.name }}-cluster-admin"
      subjects:
        - kind: User
          name: "{{ item.name }}"
          apiGroup: rbac.authorization.k8s.io
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io
  loop: "{{ htpasswd_users | default([]) }}"
  when:
    - ocp_htpasswd_admin_action in ['add', 'replace']
    - item.role is defined
    - item.role == "cluster-admin"
  no_log: true

- name: Remove cluster-admin bindings for removed users
  kubernetes.core.k8s:
    state: absent
    kind: ClusterRoleBinding
    api_version: rbac.authorization.k8s.io/v1
    name: "htpasswd-{{ item.name }}-cluster-admin"
  loop: "{{ htpasswd_users | default([]) }}"
  when:
    - ocp_htpasswd_admin_action == 'remove'
    - item.name is defined
  no_log: true

- name: Get current OAuth config
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: cluster
  register: ocp_htpasswd_admin_oauth_config

- name: Extract identity providers
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_current_providers: >-
      {{ ocp_htpasswd_admin_oauth_config.resources[0].spec.identityProviders | default([]) }}

- name: Check if htpasswd provider exists
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_htpasswd_exists: >-
      {{
        ocp_htpasswd_admin_current_providers
        | selectattr('name', 'equalto', htpasswd_idp_name)
        | list
        | length > 0
      }}
  no_log: true

- name: Define htpasswd provider
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_htpasswd_provider_def:
      name: "{{ htpasswd_idp_name }}"
      # claim fails with \"Could not create user\" when User admin already
      # belongs to a different Identity (e.g. old IdP name htpasswd:admin
      # while this IdP is htpasswd-admin). add attaches/creates cleanly.
      mappingMethod: "{{ htpasswd_mapping_method | default('add') }}"
      type: HTPasswd
      htpasswd:
        fileData:
          name: "{{ htpasswd_secret }}"
  no_log: true

- name: Add htpasswd provider if missing and users remain
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_updated_identity_providers: >
      {{
        ocp_htpasswd_admin_current_providers
        + [ocp_htpasswd_admin_htpasswd_provider_def]
        if (not ocp_htpasswd_admin_htpasswd_exists and (ocp_htpasswd_admin_effective_map | length) > 0)
        else ocp_htpasswd_admin_current_providers
      }}
  no_log: true

# If IdP already exists with mappingMethod claim (or wrong secret), rewrite it
# in place so Contoller re-runs fix \"Could not create user\" without wiping
# Keycloak/LDAP providers.
- name: Refresh existing htpasswd provider definition when present
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_updated_identity_providers: >-
      {{
        (
          ocp_htpasswd_admin_current_providers
          | rejectattr('name', 'equalto', htpasswd_idp_name)
          | list
        )
        + [ocp_htpasswd_admin_htpasswd_provider_def]
      }}
  when:
    - ocp_htpasswd_admin_htpasswd_exists | bool
    - ocp_htpasswd_admin_action in ['add', 'replace']
    - (ocp_htpasswd_admin_effective_map | length) > 0
  no_log: true

- name: Drop htpasswd provider when no users remain
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_updated_identity_providers: >-
      {{
        ocp_htpasswd_admin_current_providers
        | rejectattr('name', 'equalto', htpasswd_idp_name)
        | list
      }}
  when:
    - ocp_htpasswd_admin_action == 'remove'
    - (ocp_htpasswd_admin_effective_map | length) == 0
  no_log: true

- name: Capture current htpasswd IdP mapping and secret name
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_current_mapping_method: >-
      {{
        (
          ocp_htpasswd_admin_current_providers
          | selectattr('name', 'equalto', htpasswd_idp_name)
          | list
          | first
          | default({})
        ).mappingMethod | default('claim')
      }}
    ocp_htpasswd_admin_current_secret_name: >-
      {{
        (
          (
            (
              ocp_htpasswd_admin_current_providers
              | selectattr('name', 'equalto', htpasswd_idp_name)
              | list
              | first
              | default({})
            ).htpasswd | default({})
          ).fileData | default({})
        ).name | default('')
      }}
  when: ocp_htpasswd_admin_htpasswd_exists | bool
  no_log: true

- name: Detect whether OAuth IdP list needs apply
  ansible.builtin.set_fact:
    ocp_htpasswd_admin_oauth_needs_update: >-
      {{
        (
          not ocp_htpasswd_admin_htpasswd_exists
          and (ocp_htpasswd_admin_effective_map | length) > 0
        )
        or (
          ocp_htpasswd_admin_action == 'remove'
          and (ocp_htpasswd_admin_effective_map | length) == 0
          and ocp_htpasswd_admin_htpasswd_exists
        )
        or (
          ocp_htpasswd_admin_htpasswd_exists | bool
          and ocp_htpasswd_admin_action in ['add', 'replace']
          and (ocp_htpasswd_admin_effective_map | length) > 0
          and (
            (
              ocp_htpasswd_admin_current_mapping_method | default('claim')
            ) != (htpasswd_mapping_method | default('add'))
            or
            (
              ocp_htpasswd_admin_current_secret_name | default('')
            ) != (htpasswd_secret | default('') | string)
          )
        )
      }}

- name: Update OAuth config if needed
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        identityProviders: "{{ ocp_htpasswd_admin_updated_identity_providers }}"
  register: ocp_htpasswd_admin_oauth_result
  when: ocp_htpasswd_admin_oauth_needs_update | bool

# Drop stale Identities from older IdP names (e.g. htpasswd:admin) that block
# claim/add for the current htpasswd-admin IdP.
- name: Remove stale htpasswd Identities for configured users
  kubernetes.core.k8s:
    state: absent
    api_version: user.openshift.io/v1
    kind: Identity
    name: "{{ item.0 }}:{{ item.1.name | string | trim }}"
  loop: >-
    {{
      (['htpasswd'] if (htpasswd_idp_name | default('htpasswd-admin')) != 'htpasswd' else [])
      | product(htpasswd_users | default([]))
      | list
    }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.name | default('unnamed') }}"
  when:
    - ocp_htpasswd_admin_action in ['add', 'replace']
    - item.1.name is defined
    - (item.1.name | string | trim | length) > 0
  failed_when: false

# Secret-only updates used to skip this wait — oauth pods kept serving the
# previous htpasswd file and console login failed for the new password.
- name: Force oauth-openshift rollout after htpasswd secret change
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth-openshift
        namespace: openshift-authentication
      spec:
        template:
          metadata:
            annotations:
              infra.ado/htpasswd-synced-at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  when:
    - ocp_htpasswd_admin_secret_result is defined
    - ocp_htpasswd_admin_secret_result is changed

- name: Wait for authentication operator to finish rollout
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterOperator
    name: authentication
  register: ocp_htpasswd_admin_auth_co
  until: >
    ocp_htpasswd_admin_auth_co.resources is defined and
    ocp_htpasswd_admin_auth_co.resources | length > 0 and
    (
      (ocp_htpasswd_admin_auth_co.resources[0].status.conditions
        | selectattr('type','equalto','Available')
        | list | first).status | default('False')
    ) == 'True' and
    (
      (ocp_htpasswd_admin_auth_co.resources[0].status.conditions
        | selectattr('type','equalto','Progressing')
        | list | first).status | default('False')
    ) == 'False' and
    (
      (ocp_htpasswd_admin_auth_co.resources[0].status.conditions
        | selectattr('type','equalto','Degraded')
        | list | first).status | default('False')
    ) == 'False'
  retries: "{{ ocp_htpasswd_admin_auth_wait_retries | default(60) | int }}"
  delay: "{{ ocp_htpasswd_admin_auth_wait_delay | default(10) | int }}"
  changed_when: false
  when: >
    (ocp_htpasswd_admin_oauth_result is defined and ocp_htpasswd_admin_oauth_result is changed)
    or (ocp_htpasswd_admin_secret_result is defined and ocp_htpasswd_admin_secret_result is changed)

- name: Give oauth pods time to load the updated htpasswd secret
  ansible.builtin.pause:
    seconds: 25
  when: >
    (ocp_htpasswd_admin_oauth_result is defined and ocp_htpasswd_admin_oauth_result is changed)
    or (ocp_htpasswd_admin_secret_result is defined and ocp_htpasswd_admin_secret_result is changed)
