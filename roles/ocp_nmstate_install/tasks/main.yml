---
# yamllint disable rule:line-length
# roles/ocp_nmstate_install/tasks/main.yml
#
# Install the Kubernetes NMState Operator, create the NMState singleton,
# and optionally apply NodeNetworkConfigurationPolicy resources.
#
# WARNING: NNCP changes modify physical node network state. Incorrect
# configuration can make nodes unreachable. Review generated desired
# state carefully before applying.

# ── Operator install ─────────────────────────────────────────────────

- name: NMState | Install Kubernetes NMState Operator
  ansible.builtin.include_role:
    name: infra.ado.ocp_operator_subscription
  vars:
    name_space: "{{ ocp_nmstate_namespace }}"
    operator_subscription_namespace: "{{ ocp_nmstate_namespace }}"
    operatorgroup: kubernetes-nmstate-operator
    operator_name: "{{ ocp_nmstate_operator_name }}"
    operator_channel: "{{ ocp_nmstate_operator_channel }}"
    operator_source: "{{ ocp_nmstate_operator_source }}"
    operator_source_namespace: "{{ ocp_nmstate_operator_source_namespace }}"
    all_namespaces_install: true
    state: present

- name: NMState | Wait for operator readiness
  ansible.builtin.include_role:
    name: infra.ado.ocp_wait_operator
  vars:
    name_space: "{{ ocp_nmstate_namespace }}"
    operator_namespace: "{{ ocp_nmstate_namespace }}"
    operator_name: "{{ ocp_nmstate_operator_name }}"
    operator_deployment_pattern: nmstate
    state: present

# ── NMState instance ─────────────────────────────────────────────────

- name: NMState | Create NMState instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nmstate.io/v1
      kind: NMState
      metadata:
        name: "{{ ocp_nmstate_instance_name }}"

- name: NMState | Wait for NMState Available
  kubernetes.core.k8s_info:
    api_version: nmstate.io/v1
    kind: NMState
    name: "{{ ocp_nmstate_instance_name }}"
  register: ocp_nmstate_instance
  until: >-
    (ocp_nmstate_instance.resources | default([]) | length) > 0
    and (
      ocp_nmstate_instance.resources[0].status.conditions
      | default([])
      | selectattr('type', 'defined')
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'defined')
      | selectattr('status', 'equalto', 'True')
      | list | length
    ) > 0
  retries: 30
  delay: 10
  changed_when: false

- name: NMState | Instance ready
  ansible.builtin.debug:
    msg: >-
      Kubernetes NMState instance '{{ ocp_nmstate_instance_name }}' is
      Available in namespace {{ ocp_nmstate_namespace }}.

# ── NNCP application ────────────────────────────────────────────────

- name: NMState | Apply NodeNetworkConfigurationPolicy resources
  ansible.builtin.include_tasks: create_nncp.yml
  loop: "{{ ocp_nmstate_physical_networks }}"
  loop_control:
    loop_var: physical_net
    label: "{{ physical_net.name }}"
  when:
    - ocp_nmstate_apply_nncp | bool
    - ocp_nmstate_physical_networks | length > 0
