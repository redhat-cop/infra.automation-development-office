---
ocp_nmstate_namespace: openshift-nmstate
ocp_nmstate_operator_name: kubernetes-nmstate-operator
ocp_nmstate_operator_channel: stable
ocp_nmstate_operator_source: redhat-operators
ocp_nmstate_operator_source_namespace: openshift-marketplace
ocp_nmstate_instance_name: nmstate
ocp_nmstate_physical_networks: []

# Safety: require explicit confirmation for NNCP that modifies interfaces.
# Set to false to install the operator and instance only.
ocp_nmstate_apply_nncp: true

# Timeout (seconds) waiting for each NNCP to reach Available.
ocp_nmstate_nncp_wait_timeout: 300
ocp_nmstate_nncp_wait_retries: 30
ocp_nmstate_nncp_wait_delay: 10
