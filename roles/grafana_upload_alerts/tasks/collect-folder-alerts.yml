---
- name: Ensure alerts workspace directory exists
  ansible.builtin.file:
    path: >-
      /tmp/grafana-alerts-src-{{
        (
          grafana_folder_item.name
          | default('general')
          | regex_replace('[^A-Za-z0-9_-]', '_')
        )
        if (grafana_folder_item.name | default('') | string | trim | length) > 0
        else 'general'
      }}
    state: directory
    mode: "0755"

- name: Clone git alert source
  ansible.builtin.git:
    repo: "{{ grafana_folder_item.source }}"
    dest: >-
      /tmp/grafana-alerts-src-{{
        (
          grafana_folder_item.name
          | default('general')
          | regex_replace('[^A-Za-z0-9_-]', '_')
        )
        if (grafana_folder_item.name | default('') | string | trim | length) > 0
        else 'general'
      }}
    version: "{{ grafana_folder_item.version | default('HEAD') }}"
    force: true
  when:
    - (grafana_folder_item.source_type | default('path')) == 'git'
    - grafana_folder_item.source | default('') | length > 0

- name: Resolve alerts root for folder
  ansible.builtin.set_fact:
    grafana_upload_alerts_root: >-
      {{
        (
          '/tmp/grafana-alerts-src-'
          ~ (
            (
              grafana_folder_item.name
              | default('general')
              | regex_replace('[^A-Za-z0-9_-]', '_')
            )
            if (grafana_folder_item.name | default('') | string | trim | length) > 0
            else 'general'
          )
          ~ '/'
          ~ (grafana_folder_item.alerts_path | default('alerts'))
        )
        if ((grafana_folder_item.source_type | default('path')) == 'git')
        else (
          (
            (
              grafana_folder_item.source
              if (grafana_folder_item.source is match('^/'))
              else (
                (playbook_dir | dirname | dirname)
                ~ '/'
                ~ (grafana_folder_item.source | default('') | regex_replace('^\\./', ''))
              )
            )
            | regex_replace('/$', '')
          )
          ~ '/'
          ~ (grafana_folder_item.alerts_path | default('alerts'))
        )
      }}

- name: Find alert files
  ansible.builtin.find:
    paths: "{{ grafana_upload_alerts_root | regex_replace('/$', '') }}"
    patterns:
      - "*.json"
      - "*.json.j2"
    recurse: true
  register: grafana_upload_alerts_found
  failed_when: false

- name: Append alert work items
  ansible.builtin.set_fact:
    grafana_upload_alerts_work_items: >-
      {{
        grafana_upload_alerts_work_items
        + [
          {
            'name': (item.path | basename | regex_replace('\\.json(\\.j2)?$', '')),
            'path': item.path
          }
        ]
      }}
  loop: "{{ grafana_upload_alerts_found.files | default([]) }}"
