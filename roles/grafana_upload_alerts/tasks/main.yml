---
# Upload Grafana alert rule JSON files from folder sources.
# Plain .json uploaded as-is; .json.j2 templated first.
# Auth: grafana_api_key (Bearer) or grafana admin basic auth.

- name: Skip alerts when disabled
  ansible.builtin.meta: end_host
  when: not (grafana_alerts_enabled | default(false) | bool)

- name: Normalize alert work items
  ansible.builtin.set_fact:
    grafana_upload_alerts_work_items: []
    grafana_upload_alerts_url: "https://{{ grafana_hostname }}"
    grafana_upload_alerts_user: "{{ grafana_admin_user | default('admin') }}"
    grafana_upload_alerts_password: "{{ grafana_admin_password | default('') }}"

- name: Assert Grafana credentials for alert upload
  ansible.builtin.assert:
    that:
      - grafana_hostname | default('') | length > 0
      - >-
        (grafana_api_key | default('') | length > 0)
        or (grafana_upload_alerts_password | length > 0)
    fail_msg: >-
      grafana_upload_alerts needs grafana_hostname and either grafana_api_key
      or grafana_admin_password.

- name: Collect alerts from alert folders
  ansible.builtin.include_tasks: collect-folder-alerts.yml
  loop: >-
    {{
      grafana_alert_folders
      if (grafana_alert_folders | default([]) | length) > 0
      else (grafana_folders | default([]))
    }}
  loop_control:
    loop_var: grafana_folder_item
    label: "{{ grafana_folder_item.name | default('folder') }}"
  when: >-
    (grafana_alert_folders | default([]) | length) > 0
    or (grafana_folders | default([]) | length) > 0

- name: List Grafana datasources for alert rules
  ansible.builtin.uri:
    url: "{{ grafana_upload_alerts_url }}/api/datasources"
    method: GET
    url_username: >-
      {{
        grafana_upload_alerts_user
        if (grafana_api_key | default('') | length) == 0
        else omit
      }}
    url_password: >-
      {{
        grafana_upload_alerts_password
        if (grafana_api_key | default('') | length) == 0
        else omit
      }}
    force_basic_auth: "{{ (grafana_api_key | default('') | length) == 0 }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ grafana_api_key}
        if (grafana_api_key | default('') | length) > 0
        else {}
      }}
    status_code: [200]
    validate_certs: "{{ grafana_validate_certs | default(false) }}"
  register: grafana_upload_alerts_ds_list
  when: (grafana_upload_alerts_work_items | length) > 0

- name: Normalize datasource name filter
  ansible.builtin.set_fact:
    grafana_upload_alerts_datasource_names: >-
      {{
        (
          grafana_alert_datasource_names.split(',')
          | map('trim')
          | reject('equalto', '')
          | list
        )
        if (
          grafana_alert_datasource_names is defined
          and grafana_alert_datasource_names is string
        )
        else (grafana_alert_datasource_names | default([]))
      }}
    grafana_upload_alerts_uploaded_titles: []

- name: Select Prometheus datasources for OpenShift alerts
  ansible.builtin.set_fact:
    grafana_upload_alerts_prometheus_datasources: >-
      {{
        grafana_upload_alerts_ds_list.json
        | default([])
        | selectattr('type', 'defined')
        | selectattr('type', 'equalto', 'prometheus')
        | list
      }}
  when: (grafana_upload_alerts_work_items | length) > 0

- name: Limit alerts to named Prometheus datasources
  ansible.builtin.set_fact:
    grafana_upload_alerts_prometheus_datasources: >-
      {{
        grafana_upload_alerts_prometheus_datasources
        | selectattr('name', 'in', grafana_upload_alerts_datasource_names)
        | list
      }}
  when:
    - (grafana_upload_alerts_work_items | length) > 0
    - (grafana_upload_alerts_datasource_names | length) > 0

- name: Assert Prometheus datasources exist for alert rules
  ansible.builtin.assert:
    that:
      - grafana_upload_alerts_prometheus_datasources | length > 0
    fail_msg: >-
      grafana_upload_alerts needs a Prometheus datasource in Grafana
      before the default OpenShift alert rules can be uploaded.
  when: (grafana_upload_alerts_work_items | length) > 0

- name: Ensure each alert folder exists in Grafana
  ansible.builtin.uri:
    url: "{{ grafana_upload_alerts_url }}/api/folders"
    method: POST
    body_format: json
    body:
      uid: "{{ item }}-folder"
      title: "{{ item }}"
    url_username: >-
      {{
        grafana_upload_alerts_user
        if (grafana_api_key | default('') | length) == 0
        else omit
      }}
    url_password: >-
      {{
        grafana_upload_alerts_password
        if (grafana_api_key | default('') | length) == 0
        else omit
      }}
    force_basic_auth: "{{ (grafana_api_key | default('') | length) == 0 }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ grafana_api_key}
        if (grafana_api_key | default('') | length) > 0
        else {'Content-Type': 'application/json'}
      }}
    status_code: [200, 201, 409, 412]
    validate_certs: "{{ grafana_validate_certs | default(false) }}"
  loop: >-
    {{
      grafana_upload_alerts_work_items
      | map(attribute='folder')
      | unique
      | list
    }}
  loop_control:
    label: "{{ item }}"
  when: (grafana_upload_alerts_work_items | length) > 0

- name: Upload alert rules for each Prometheus datasource
  ansible.builtin.include_tasks: upload-datasource-alerts.yml
  loop: "{{ grafana_upload_alerts_prometheus_datasources }}"
  loop_control:
    loop_var: grafana_upload_alerts_ds
    label: "{{ grafana_upload_alerts_ds.name | default('prometheus') }}"
  when: (grafana_upload_alerts_work_items | length) > 0

- name: Configure alert email and send tests
  ansible.builtin.include_tasks: configure-alert-email.yml
  when: (grafana_upload_alerts_work_items | length) > 0
