---
# Build the VirtualMachine spec (DataSource + Multus/cloud-init) and apply it
# with kubernetes.core.k8s when that VM is not already in the namespace.

- name: Ensure required variables are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_name | length > 0
      - vm_namespace is defined
      - vm_namespace | length > 0
      - source_name is defined
      - source_name | length > 0
      - storage_class is defined
      - storage_class | length > 0
    fail_msg: >
      One or more required variables are missing.
      Please provide vm_name, vm_namespace, storage_class, and source_name.

# Namespace creation is handled by infra.ado.ocp_namespace in the playbook
# (do not create Namespace inline here — reuse the ADO role).

- name: Ensure Multus NetworkAttachmentDefinition exists for bridge mode
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ multus_nad_name }}"
        namespace: "{{ vm_namespace }}"
      spec:
        # NAD CRD requires config as a JSON *string*, not an object.
        config: >-
          {{
            (
              multus_nad_config
              if (multus_nad_config | default('') | length) > 0
              else (
                '{'
                ~ '"cniVersion":"0.3.1",'
                ~ '"name":"br-ex-network",'
                ~ '"type":"ovn-k8s-cni-overlay",'
                ~ '"topology":"localnet",'
                ~ '"netAttachDefName":"'
                ~ vm_namespace
                ~ '/br-ex-network"}'
              )
            )
          }}
  when: (network_mode | default('masquerade') | lower) in ['bridge', 'multus']

- name: Resolve Multus networkName for this namespace
  ansible.builtin.set_fact:
    ocp_virtualization_multus_ref: >-
      {{
        multus_network_name
        if ('/' in (multus_network_name | default('')))
        else (vm_namespace ~ '/' ~ (multus_nad_name | default('br-ex-network')))
      }}
  when: (network_mode | default('masquerade') | lower) in ['bridge', 'multus']

- name: Build VirtualMachine network + volumes (bridge / Multus)
  ansible.builtin.set_fact:
    ocp_virtualization_vm_spec:
      runStrategy: "{{ 'Always' if (vm_start | default(true) | bool) else 'Halted' }}"
      dataVolumeTemplates:
        - metadata:
            name: "{{ vm_name }}-rootdisk"
            labels:
              app: "{{ app_label | default(vm_name) }}"
              ado.role: virt-build
            annotations:
              cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          spec:
            sourceRef:
              kind: "{{ source_kind | default('DataSource') }}"
              name: "{{ source_name | default('rhel9') }}"
              namespace: >-
                {{
                  source_namespace
                  | default('openshift-virtualization-os-images')
                }}
            storage:
              storageClassName: "{{ storage_class }}"
              accessModes:
                - "{{ root_disk_access_mode | default('ReadWriteOnce') }}"
              resources:
                requests:
                  storage: "{{ root_disk_size | default('40Gi') }}"
      template:
        metadata:
          labels:
            app: "{{ app_label | default(vm_name) }}"
            ado.role: virt-build
        spec:
          domain:
            devices:
              interfaces:
                - name: "{{ network_name | default('lan') }}"
                  bridge: {}
                  model: virtio
              disks:
                - name: rootdisk
                  disk:
                    bus: virtio
                  bootOrder: 1
                - name: cloudinitdisk
                  disk:
                    bus: virtio
            machine:
              type: q35
            resources: {}
          networks:
            - name: "{{ network_name | default('lan') }}"
              multus:
                networkName: "{{ ocp_virtualization_multus_ref }}"
          volumes:
            - name: rootdisk
              dataVolume:
                name: "{{ vm_name }}-rootdisk"
            - name: cloudinitdisk
              cloudInitNoCloud:
                userData: "{{ cloud_init_user_data }}"
                networkData: "{{ cloud_init_network_data | default('') }}"
  when: (network_mode | default('masquerade') | lower) in ['bridge', 'multus']

- name: Build VirtualMachine network + volumes (pod / masquerade)
  ansible.builtin.set_fact:
    ocp_virtualization_vm_spec:
      runStrategy: "{{ 'Always' if (vm_start | default(true) | bool) else 'Halted' }}"
      dataVolumeTemplates:
        - metadata:
            name: "{{ vm_name }}-rootdisk"
            labels:
              app: "{{ app_label | default(vm_name) }}"
              ado.role: virt-build
            annotations:
              cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          spec:
            sourceRef:
              kind: "{{ source_kind | default('DataSource') }}"
              name: "{{ source_name | default('rhel9') }}"
              namespace: >-
                {{
                  source_namespace
                  | default('openshift-virtualization-os-images')
                }}
            storage:
              storageClassName: "{{ storage_class }}"
              accessModes:
                - "{{ root_disk_access_mode | default('ReadWriteOnce') }}"
              resources:
                requests:
                  storage: "{{ root_disk_size | default('40Gi') }}"
      template:
        metadata:
          labels:
            app: "{{ app_label | default(vm_name) }}"
            ado.role: virt-build
        spec:
          domain:
            devices:
              interfaces:
                - name: "{{ network_name | default('default') }}"
                  masquerade: {}
              disks:
                - name: rootdisk
                  disk:
                    bus: virtio
                  bootOrder: 1
                - name: cloudinitdisk
                  disk:
                    bus: virtio
            machine:
              type: q35
            resources: {}
          networks:
            - name: "{{ network_name | default('default') }}"
              pod: {}
          volumes:
            - name: rootdisk
              dataVolume:
                name: "{{ vm_name }}-rootdisk"
            - name: cloudinitdisk
              cloudInitNoCloud:
                userData: "{{ cloud_init_user_data }}"
                networkData: "{{ cloud_init_network_data | default('') }}"
  when: (network_mode | default('masquerade') | lower) not in ['bridge', 'multus']

- name: Add custom compute when no instance type is selected
  ansible.builtin.set_fact:
    ocp_virtualization_vm_spec: >-
      {{
        ocp_virtualization_vm_spec | combine(
          {
            'template': {
              'spec': {
                'domain': {
                  'cpu': {'cores': cpu_cores | default(4) | int},
                  'memory': {'guest': memory | default('8Gi')}
                }
              }
            }
          },
          recursive=True
        )
      }}
  when: instance_type | default('custom') | lower in ['', 'custom']

- name: Assemble VirtualMachine resource for vm_provision
  ansible.builtin.set_fact:
    ocp_virtualization_vm_definition:
      apiVersion: "{{ vm_provision_kubevirt_api_version | default('kubevirt.io/v1') }}"
      kind: VirtualMachine
      metadata:
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        labels:
          app: "{{ app_label | default(vm_name) }}"
          ado.role: virt-build
      spec: >-
        {{
          ocp_virtualization_vm_spec
          | combine(
              (
                {
                  'instancetype': {
                    'name': instance_type,
                    'kind': 'VirtualMachineClusterInstancetype'
                  }
                }
                if (instance_type | default('custom') | lower) not in ['', 'custom']
                else {}
              ),
              recursive=True
            )
          | combine(
              {
                'preference': {
                  'name': preference | default('rhel.9'),
                  'kind': 'VirtualMachineClusterPreference'
                }
              },
              recursive=True
            )
        }}

- name: Map OpenShift auth for validated vm_provision
  ansible.builtin.set_fact:
    ocp_virtualization_vm_provision_openshift_host: >-
      {{
        provision_openshift_virt_api_host
        | default(
            host
            | default(
                lookup('ansible.builtin.env', 'K8S_AUTH_HOST', default=''),
                true
              ),
            true
          )
      }}
    ocp_virtualization_vm_provision_api_key: >-
      {{
        provision_openshift_virt_api_token
        | default(
            token
            | default(
                lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY', default=''),
                true
              ),
            true
          )
      }}
    ocp_virtualization_vm_provision_openshift_verify_ssl: >-
      {{
        validate_certs
        | default(
            lookup(
              'ansible.builtin.env',
              'K8S_AUTH_VERIFY_SSL',
              default='yes'
            ) | bool,
            true
          )
      }}
    ocp_virtualization_vm_provision_request:
      - "{{ ocp_virtualization_vm_definition }}"

- name: Check whether VirtualMachine already exists
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: ocp_virtualization_existing_vm

- name: Create VirtualMachine when it does not exist
  kubernetes.core.k8s:
    state: present
    definition: "{{ ocp_virtualization_vm_definition }}"
  when: (ocp_virtualization_existing_vm.resources | default([]) | length) == 0

- name: Short status check (does not wait for full disk clone)
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
  register: ocp_virtualization_vm_status
  retries: 12
  delay: 5
  until: (ocp_virtualization_vm_status.resources | default([]) | length) > 0
  when: vm_state | default('present') == 'present'

- name: Report VM status (clone may still be importing in background)
  ansible.builtin.debug:
    msg: >-
      Created VM {{ vm_name }} in {{ vm_namespace }}
      (status={{ ocp_virtualization_vm_status.resources[0].status.printableStatus | default('Pending') }}).
      Root disk DataVolume {{ vm_name }}-rootdisk is populated from DataSource
      {{ source_name }} asynchronously — Contoller job no longer blocks on the clone.
  when:
    - vm_state | default('present') == 'present'
    - (ocp_virtualization_vm_status.resources | default([]) | length) > 0
