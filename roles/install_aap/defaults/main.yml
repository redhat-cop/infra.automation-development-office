---
# Desired state: present or absent. Legacy ``state`` is accepted if unset.
install_aap_state: present

# Target platform: openshift | rhel
# Auto-detect when unset: openshift if aap_ocp_install_* connection/namespace
# present; else rhel if aap_setup_prep_inv_nodes present; else openshift.
install_aap_target: ""

# OpenShift (infra.aap_utilities.aap_ocp_install) — pass aap_ocp_install_* vars.
# License is optional. none/skip = install only; attach later with
# aap_ocp_install_license_only + license_mode manifest|rhn.
aap_ocp_install_license_mode: none
aap_ocp_install_license_only: false
aap_ocp_install_subscription_manifest_path: ""
aap_ocp_install_subscription_manifest_content_base64: ""
aap_ocp_install_subscription_manifest_filename: manifest.zip
aap_ocp_install_rhn_username: ""
aap_ocp_install_rhn_password: ""
aap_ocp_install_rhn_subscription_id: ""
aap_ocp_install_rhn_client_id: ""
aap_ocp_install_rhn_client_secret: ""
aap_ocp_install_admin_user: admin
aap_ocp_install_admin_password: ""
aap_ocp_install_controller_route_host: ""
# Off for greenfield. Turn on only to wipe a leftover Fernet/Postgres mismatch.
aap_ocp_install_reset_database: false
aap_ocp_install_reset_delete_platform: true

# RHEL / VM / containerized (infra.aap_utilities.aap_setup_*)
# Set aap_setup_prep_inv_nodes / aap_setup_prep_inv_vars / secrets as documented
# by infra.aap_utilities. Optionally skip download when the tarball is local.
# aap_setup_down_dest_dir and aap_setup_prep_working_dir override /var/tmp.
# aap_setup_prep_installer_file is an existing tarball on the RHEL host.
# aap_setup_ssh_user plus aap_setup_ssh_password or aap_setup_ssh_private_key
# tells the bootstrap playbook to SSH to aap_setup_ssh_host.
install_aap_rhel_download: true
install_aap_rhel_prepare: true
install_aap_rhel_install: true
# Skip pre-flight URI checks that crash when AAP is not listening yet
# (infra.aap_utilities containerized.yml expects .status on a failed uri).
aap_setup_inst_force: true
# Containerized installer preflight asserts ansible_user_uid != 0. The
# bootstrap play uses become, so setup must run as this non-root user
# (passwordless sudo). Override when the host has no cloud-user.
install_aap_containerized_install_user: cloud-user
