---
# argument spec file for infra.ado.capsule_install
argument_specs:
  main:
    short_description: Role to install Red Hat Satellite Capsule
    options:
      capsule_install_os_version:
        type: str
        description: RHEL major version referenced in OS validation messages.
        default: "9"
      capsule_install_min_cpu_count:
        type: int
        description: Minimum required CPU count for Capsule host validation.
        default: 4
      capsule_install_min_memory_size:
        type: int
        description: Minimum required memory (MB) for Capsule host validation.
        default: 12288
      capsule_install_data_disk_min_size:
        type: int
        description: Minimum required data disk size in GB.
        default: 500
      capsule_install_min_pulp_size:
        type: int
        description: Minimum recommended Pulp volume size in GB.
        default: 300
      capsule_install_min_pgsql_size:
        type: int
        description: Minimum recommended PostgreSQL volume size in GB.
        default: 20
      capsule_install_pre_check:
        type: bool
        description: Run only preliminary validation checks.
        default: false
      capsule_install_pulp_size:
        type: str
        description: Logical volume size for /var/lib/pulp.
        default: "1500g"
      capsule_install_pgsql_size:
        type: str
        description: Logical volume size for /var/lib/pgsql.
        default: "150g"
      capsule_install_data_device:
        type: str
        description: Base data device path for storage configuration.
        default: "/dev"
      capsule_install_vg_name:
        type: str
        description: Volume group name for Capsule storage volumes.
        default: "capsule"
      capsule_install_req_dirs:
        type: list
        elements: dict
        description: Logical volume definitions to create and mount.
        default:
          - mount_point: /var/lib/pulp
            lv_name: pulp
            lv_size: "{{ capsule_install_pulp_size }}"
          - mount_point: /var/lib/pgsql
            lv_name: pgsql
            lv_size: "{{ capsule_install_pgsql_size }}"
      capsule_install_packages:
        type: list
        elements: str
        description: Packages installed for Capsule deployment.
        default:
          - satellite-capsule
          - chrony
          - sos
          - fapolicyd
          - vim
          - bash-completion
          - bind-utils
      capsule_install_scenario:
        type: str
        description: Satellite installer scenario for Capsule deployment.
        default: "capsule"
      capsule_install_deployment_version:
        type: str
        description: Target Capsule version used in RHSM repo names.
        default: "6.19"
      capsule_install_selinux_state:
        type: str
        description: SELinux state applied after package updates.
        default: "enforcing"
      capsule_install_admin_username:
        type: str
        description: Capsule/Satellite admin username.
        default: "admin"
      capsule_install_admin_password:
        type: str
        description: Capsule/Satellite admin password.
      capsule_install_timezone:
        type: str
        description: System timezone set before registration.
        default: "UTC"
      capsule_install_org_id:
        type: str
        description: Organization ID for Capsule registration.
      capsule_install_activation_key:
        type: str
        description: Activation key for Capsule registration.
      capsule_install_location:
        type: str
        description: Logical location label for Capsule deployment.
        default: ""
      capsule_install_setup_insights:
        type: bool
        description: Configure Red Hat Insights during Capsule registration.
        default: false
      capsule_install_rhn_repos:
        type: list
        elements: str
        description: RHSM repository IDs enabled after registration.
        default:
          - "rhel-9-for-x86_64-baseos-rpms"
          - "rhel-9-for-x86_64-appstream-rpms"
          - >-
            satellite-capsule-{{ capsule_install_deployment_version }}-for-rhel-9-x86_64-rpms
          - >-
            satellite-maintenance-{{ capsule_install_deployment_version }}-for-rhel-9-x86_64-rpms
      capsule_install_satellite_fqdn:
        type: str
        description: FQDN of the upstream Satellite server.
      capsule_install_certs:
        type: list
        elements: str
        description: >-
          Certificate filenames under /root/certs/ on the Capsule host copied to
          Satellite before capsule-certs-generate.
        default: []
      capsule_install_dns_device:
        type: str
        description: NetworkManager connection name updated by DNS configuration tasks.
      capsule_install_dns_servers:
        type: list
        elements: str
        description: DNS servers applied via NetworkManager and resolv.conf.
      capsule_install_dns_search:
        type: list
        elements: str
        description: DNS search domains applied via NetworkManager.
      capsule_install_data_device_name:
        type: str
        description: Optional data disk basename for storage configuration.
        default: ""
      capsule_install_lifecycle_environments:
        type: list
        elements: str
        description: Lifecycle environments assigned to the Capsule smart proxy.
        default: []
      capsule_install_sync_wait_time:
        type: int
        description: Maximum wait time for synchronization operations.
        default: 86400
      capsule_install_satellite_haproxy:
        type: bool
        description: Enable load-balanced Capsule registration settings.
        default: false
      capsule_install_loadbalancer_fqdn:
        type: str
        description: FQDN of the Capsule load balancer host.
        default: ""
      capsule_install_loadbalancer_activation_key:
        type: str
        description: Activation key used to register the load balancer host.
        default: ""
      capsule_install_satellite_loadbalancer_ports:
        type: list
        elements: str
        description: Firewall/service ports used by load-balanced deployments.
        default:
          - 80/tcp
          - 443/tcp
          - 8000/tcp
          - 9090/tcp
      capsule_install_installer_options:
        type: list
        elements: str
        description: Installer flags for standard Capsule deployment.
        default:
          - "--foreman-proxy-register-in-foreman true"
          - "--foreman-proxy-foreman-base-url https://{{ capsule_install_satellite_fqdn }}"
          - "--foreman-proxy-trusted-hosts {{ capsule_install_satellite_fqdn }}"
          - "--foreman-proxy-trusted-hosts {{ ansible_fqdn }}"
          - "--foreman-proxy-oauth-consumer-key {{ capsule_install_foreman_proxy_oauth_consumer_key }}"
          - "--foreman-proxy-oauth-consumer-secret {{ capsule_install_foreman_proxy_oauth_consumer_secret }}"
          - "--foreman-proxy-plugin-remote-execution-script-mode=ssh"
          - "--certs-tar-file /root/capsule_cert/{{ ansible_fqdn }}/{{ ansible_fqdn }}-capsule-certs.tar"
          - "--enable-foreman-proxy-plugin-remote-execution-script"
          - "--foreman-proxy-content-enable-docker=false"
      capsule_install_loadbalanced_options:
        type: list
        elements: str
        description: Installer flags for load-balanced Capsule deployment.
        default:
          - "--foreman-proxy-register-in-foreman true"
          - "--foreman-proxy-foreman-base-url https://{{ capsule_install_satellite_fqdn }}"
          - "--foreman-proxy-trusted-hosts {{ capsule_install_satellite_fqdn }}"
          - "--foreman-proxy-trusted-hosts {{ ansible_fqdn }}"
          - "--foreman-proxy-oauth-consumer-key {{ capsule_install_foreman_proxy_oauth_consumer_key }}"
          - "--foreman-proxy-oauth-consumer-secret {{ capsule_install_foreman_proxy_oauth_consumer_secret }}"
          - "--foreman-proxy-plugin-remote-execution-script-mode=ssh"
          - "--certs-tar-file /root/capsule_cert/{{ ansible_fqdn }}/{{ ansible_fqdn }}-capsule-certs.tar"
          - "--enable-foreman-proxy-plugin-remote-execution-script"
          - "--foreman-proxy-content-enable-docker=false"
          - "--certs-cname {{ capsule_install_loadbalancer_fqdn }}"
          - "--foreman-proxy-registration-url https://{{ capsule_install_loadbalancer_fqdn }}:9090"
          - "--foreman-proxy-template-url http://{{ capsule_install_loadbalancer_fqdn }}:8000"
