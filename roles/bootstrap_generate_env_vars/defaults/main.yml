---
# User-facing compatibility variables
generate_env_vars_force: false  # noqa: var-naming[no-role-prefix]
generate_env_vars_force_overwrite: false  # noqa: var-naming[no-role-prefix]
generate_env_vars_base_dir: >-  # noqa: var-naming[no-role-prefix]
  {{ playbook_dir | default('.') }}/group_vars/all
generate_env_vars_create_dirs: true  # noqa: var-naming[no-role-prefix]
generate_env_vars_encrypt_vault_files: true  # noqa: var-naming[no-role-prefix]
generate_env_vars_vault_password_file: ""  # noqa: var-naming[no-role-prefix]

generate_env_vars_components:  # noqa: var-naming[no-role-prefix]
  - aap
  - aap24
  - 389ds
  - acs
  - cert_manager
  - eck
  - gitlab
  - grafana
  - htpasswd
  - kafka
  - keycloak
  - ldap_auth_openshift
  - oadp
  - ocp_compliance
  - ocp_descheduler
  - ocp_virtualization
  - openshift_virt
  - ec2_ami_copy
  - pega
  - quay
  - minio
  - dev_hub
  - zabbix
  - bookstack
  - netbox
  - rhbk
  - gitlab_runner
  - web_terminal

# Internal role-prefixed variables used by tasks
bootstrap_generate_env_vars_force: >-
  {{
    generate_env_vars_force_overwrite
    | default(generate_env_vars_force)
    | bool
  }}
bootstrap_generate_env_vars_base_dir: "{{ generate_env_vars_base_dir }}"
bootstrap_generate_env_vars_create_dirs: >-
  {{ generate_env_vars_create_dirs | bool }}
bootstrap_generate_env_vars_encrypt_vault_files: >-
  {{ generate_env_vars_encrypt_vault_files | bool }}
bootstrap_generate_env_vars_vault_password_file: >-
  {{ generate_env_vars_vault_password_file }}
bootstrap_generate_env_vars_components: "{{ generate_env_vars_components }}"

# AAP generated object defaults
bootstrap_generate_env_vars_aap_additional_credentials: []
bootstrap_generate_env_vars_hub_publish_ado_collection: false
bootstrap_generate_env_vars_hub_publish_preflight_collections: false
bootstrap_generate_env_vars_hub_mark_ado_validated: false
bootstrap_generate_env_vars_hub_force_ado_collection_update: false
bootstrap_generate_env_vars_hub_update_collection_only: false
bootstrap_generate_env_vars_hub_push_ee: false
bootstrap_generate_env_vars_hub_ee_pull: false
bootstrap_generate_env_vars_hub_ee_create_execution_environment: true
bootstrap_generate_env_vars_hub_ee_source_image: ghcr.io/automation-development-office/ado-ee:latest
bootstrap_generate_env_vars_hub_ado_collection_path: "."
bootstrap_generate_env_vars_hub_ado_collection_tarball: ""
bootstrap_generate_env_vars_aap_ee_image: >-
  registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9:latest

# AAP on OpenShift installer defaults
bootstrap_generate_env_vars_aap_deployment_version: "2.7"
bootstrap_generate_env_vars_aap_namespace: "aap"
bootstrap_generate_env_vars_aap_instance_name: "aap"
bootstrap_generate_env_vars_aap_create_namespace: true
bootstrap_generate_env_vars_aap_component_deployment: unified
bootstrap_generate_env_vars_aap_install_controller: true
bootstrap_generate_env_vars_aap_install_hub: true
bootstrap_generate_env_vars_aap_install_eda: true
bootstrap_generate_env_vars_aap_install_lightspeed: false
bootstrap_generate_env_vars_aap_controller_replicas: 1
bootstrap_generate_env_vars_aap_hub_storage_type: file
bootstrap_generate_env_vars_aap_hub_storage_class: ""
bootstrap_generate_env_vars_aap_hub_storage_size: 20Gi
bootstrap_generate_env_vars_aap_hub_s3_secret: ""
bootstrap_generate_env_vars_aap_hub_azure_secret: ""

# Satellite dynamic inventory defaults
bootstrap_generate_env_vars_satellite_dynamic_inventory_enabled: false
bootstrap_generate_env_vars_satellite_server_url: ""
bootstrap_generate_env_vars_satellite_organization: ""
bootstrap_generate_env_vars_satellite_service_account_username: ""
bootstrap_generate_env_vars_satellite_service_account_password: ""
bootstrap_generate_env_vars_satellite_admin_password: ""
bootstrap_generate_env_vars_satellite_validate_certs: false
bootstrap_generate_env_vars_satellite_credential_name: >-
  ADO Satellite Service Account
bootstrap_generate_env_vars_satellite_inventory_source_name: >-
  ADO Satellite Dynamic Inventory
bootstrap_generate_env_vars_satellite_inventory_overwrite: true
bootstrap_generate_env_vars_satellite_inventory_overwrite_vars: true
bootstrap_generate_env_vars_satellite_inventory_update_on_launch: true
bootstrap_generate_env_vars_satellite_inventory_update_cache_timeout: 0
bootstrap_generate_env_vars_satellite_inventory_verbosity: 0
bootstrap_generate_env_vars_satellite_inventory_host_filter: ""
bootstrap_generate_env_vars_satellite_inventory_source_vars: {}
bootstrap_generate_env_vars_satellite_deployment_version: "6.19"
bootstrap_generate_env_vars_satellite_location: ""
bootstrap_generate_env_vars_satellite_rhn_org_id: ""
bootstrap_generate_env_vars_satellite_rhn_activation_key: ""
bootstrap_generate_env_vars_satellite_activation_key: ""
bootstrap_generate_env_vars_satellite_rhn_connected: true
bootstrap_generate_env_vars_satellite_oidc_client_id: ado-satellite
bootstrap_generate_env_vars_satellite_oidc_realm: rhlab
bootstrap_generate_env_vars_satellite_oidc_keycloak_url: ""
bootstrap_generate_env_vars_satellite_oidc_keycloak_hostname: ""
bootstrap_generate_env_vars_satellite_oidc_issuer: ""
bootstrap_generate_env_vars_satellite_oidc_create_client: true
bootstrap_generate_env_vars_satellite_oidc_client_secret: ""
bootstrap_generate_env_vars_satellite_oidc_admin_user: admin
bootstrap_generate_env_vars_satellite_oidc_admin_password: ""
bootstrap_generate_env_vars_satellite_oidc_keycloak_validate_certs: false
bootstrap_generate_env_vars_satellite_manifest_file: ""
bootstrap_generate_env_vars_satellite_size_profile: "default"
bootstrap_generate_env_vars_satellite_vg_name: "satellite"
bootstrap_generate_env_vars_satellite_data_disk_min_size: "10G"
bootstrap_generate_env_vars_satellite_data_device_name: ""
bootstrap_generate_env_vars_satellite_data_device: "/dev"
bootstrap_generate_env_vars_satellite_size:
  - name: default
    min_hosts: 0
    max_hosts: 5000
    min_ram: 20
    min_cpu: 4
  - name: medium
    min_hosts: 5000
    max_hosts: 10000
    min_ram: 32
    min_cpu: 8
  - name: large
    min_hosts: 10000
    max_hosts: 20000
    min_ram: 64
    min_cpu: 12
  - name: extra-large
    min_hosts: 20000
    max_hosts: 60000
    min_ram: 128
    min_cpu: 16
  - name: extra-extra-large
    min_hosts: 60000
    max_hosts: 100000
    min_ram: 256
    min_cpu: 32
bootstrap_generate_env_vars_satellite_req_dirs:
  - mount_point: /var/lib/pulp
    lv_name: lv_rhspulp
    lv_size: 300g
  - mount_point: /var/lib/pgsql
    lv_name: lv_pgsql
    lv_size: 20g

bootstrap_generate_env_vars_capsule_hostname: ""
bootstrap_generate_env_vars_capsule_satellite_fqdn: ""
bootstrap_generate_env_vars_capsule_deployment_version: "6.19"
bootstrap_generate_env_vars_capsule_location: ""
bootstrap_generate_env_vars_capsule_org_id: ""
bootstrap_generate_env_vars_capsule_activation_key: ""
bootstrap_generate_env_vars_capsule_min_memory_size: 12288
bootstrap_generate_env_vars_capsule_min_cpu_count: 4
bootstrap_generate_env_vars_capsule_min_pulp_size: 300
bootstrap_generate_env_vars_capsule_min_pgsql_size: 20
bootstrap_generate_env_vars_capsule_data_disk_min_size: 500
bootstrap_generate_env_vars_capsule_selinux_state: enforcing
bootstrap_generate_env_vars_capsule_scenario: capsule
bootstrap_generate_env_vars_capsule_admin_username: admin
bootstrap_generate_env_vars_capsule_pulp_size: 1500g
bootstrap_generate_env_vars_capsule_pgsql_size: 150g
bootstrap_generate_env_vars_capsule_data_device: /dev
bootstrap_generate_env_vars_capsule_data_device_name: ""
bootstrap_generate_env_vars_capsule_vg_name: capsule
bootstrap_generate_env_vars_capsule_req_dirs:
  - mount_point: /var/lib/pulp
    lv_name: pulp
    lv_size: 1500g
  - mount_point: /var/lib/pgsql
