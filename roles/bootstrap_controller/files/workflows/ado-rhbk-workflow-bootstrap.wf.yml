---
controller_workflow_job_templates:
  - name: ADO | RHBK Workflow
    description: >-
      Keycloak/RHBK — deploy operator, realm, optional federation/IdP,
      mappers, clients, then the login-events exporter. Only nodes whose
      job templates were generated from preflight selections are kept at
      bootstrap time.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | rhbk
    simplified_workflow_nodes:
      - identifier: Deploy RHBK
        unified_job_template: ADO | Deploy RHBK
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy RHBK Realm

      - identifier: Deploy RHBK Realm
        unified_job_template: ADO | Deploy RHBK Realm
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHBK 389ds Federation
          - RHBK EntraID
          - RHBK Client Scopes
          - RHBK LDAP Group Mapper
          - Deploy RHBK Client
          - RHBK login events exporter

      - identifier: RHBK Client Scopes
        unified_job_template: ADO | RHBK Client Scopes
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy RHBK Client

      - identifier: RHBK 389ds Federation
        unified_job_template: ADO | RHBK 389ds Federation
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHBK LDAP Group Mapper
          - RHBK Client Scopes
          - Deploy RHBK Client

      - identifier: RHBK EntraID
        unified_job_template: ADO | RHBK EntraID
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHBK Client Scopes
          - Deploy RHBK Client

      - identifier: RHBK LDAP Group Mapper
        unified_job_template: ADO | RHBK LDAP Group Mapper
        lookup_organization: "{{ bootstrap_controller_organization }}"
        all_parents_must_converge: true
        success_nodes:
          - Deploy RHBK Client

      - identifier: Deploy RHBK Client
        unified_job_template: ADO | Deploy RHBK Client
        lookup_organization: "{{ bootstrap_controller_organization }}"
        all_parents_must_converge: true

      - identifier: RHBK login events exporter
        unified_job_template: ADO | RHBK login events exporter
        lookup_organization: "{{ bootstrap_controller_organization }}"
