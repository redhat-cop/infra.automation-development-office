---
controller_workflow_job_templates:
  - name: ADO | OpenShift Workflow
    description: >-
      Bootstrap workflow — cert/ingress first, then RHBK + OIDC, then selected
      platform services; ends by printing application routes.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | openshift
    simplified_workflow_nodes:
      # --- Early / independent cluster prep (parallel roots) ---
      - identifier: Enable Integrated Image Registry
        unified_job_template: ADO | Enable Integrated Image Registry
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Create Admin HTPasswd User
        unified_job_template: ADO | Create Admin HTPasswd User
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Configure LDAP in OpenShift
        unified_job_template: ADO | Configure LDAP in OpenShift
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Configure Console Banner
        unified_job_template: ADO | Configure Console Banner
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy ACM
        unified_job_template: ADO | Deploy ACM
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy OpenShift Virtualization
        unified_job_template: ADO | Deploy OpenShift Virtualization
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy MTV
        unified_job_template: ADO | Deploy MTV
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy Web Terminal
        unified_job_template: ADO | Deploy Web Terminal
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy OpenShift Descheduler
        unified_job_template: ADO | Deploy OpenShift Descheduler
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      # --- Cert Manager sub-workflow (deploy + optional issuer/ingress) ---
      # RHBK needs cert-manager webhook for Certificates; hang RHBK off this
      # nested workflow (same pattern as Grafana Workflow / RHBK Workflow).
      - identifier: Cert Manager Workflow
        unified_job_template: ADO | Cert Manager Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - RHBK Workflow

      # --- RHBK sub-workflow (realm, federation, IdP, mappers, clients) ---
      - identifier: RHBK Workflow
        unified_job_template: ADO | RHBK Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Configure OAuth/RHBK in OpenShift

      - identifier: Configure OAuth/RHBK in OpenShift
        unified_job_template: ADO | Configure OAuth/RHBK in OpenShift
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Grafana Workflow
          - Deploy GitLab
          - Deploy Kafka
          - Deploy ECK
          - Quay Workflow
          - Deploy DevSpaces
          - Dev Hub Workflow
          - Zabbix Workflow
          - BookStack Workflow
          - MinIO Workflow
          - NetBox Workflow
          - Deploy ACS
          - Install AAP on OpenShift
          - Deploy 389ds
          - Deploy GitOps
          - Deploy OADP
          - Deploy Pega

      # --- Platform services (after RHBK + optional cluster OAuth) ---
      - identifier: Grafana Workflow
        unified_job_template: ADO | Grafana Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy GitLab
        unified_job_template: ADO | Deploy GitLab
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy Kafka
        unified_job_template: ADO | Deploy Kafka
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy ECK
        unified_job_template: ADO | Deploy ECK
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Quay Workflow
        unified_job_template: ADO | Quay Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy DevSpaces
        unified_job_template: ADO | Deploy DevSpaces
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Dev Hub Workflow
        unified_job_template: ADO | Dev Hub Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Zabbix Workflow
        unified_job_template: ADO | Zabbix Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: BookStack Workflow
        unified_job_template: ADO | BookStack Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: MinIO Workflow
        unified_job_template: ADO | MinIO Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: NetBox Workflow
        unified_job_template: ADO | NetBox Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy ACS
        unified_job_template: ADO | Deploy ACS
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Install AAP on OpenShift
        unified_job_template: ADO | Install AAP on OpenShift
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy 389ds
        unified_job_template: ADO | Deploy 389ds
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy GitOps
        unified_job_template: ADO | Deploy GitOps
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy OADP
        unified_job_template: ADO | Deploy OADP
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      - identifier: Deploy Pega
        unified_job_template: ADO | Deploy Pega
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Print ADO Routes
          - Alt Routes Workflow

      # --- Final: human-readable route summary for selected installs ---
      - identifier: Alt Routes Workflow
        unified_job_template: ADO | Alt Routes Workflow
        lookup_organization: "{{ bootstrap_controller_organization }}"
        all_parents_must_converge: true

      - identifier: Print ADO Routes
        unified_job_template: ADO | Deploy Discover Routes and Print
        lookup_organization: "{{ bootstrap_controller_organization }}"
        all_parents_must_converge: true
