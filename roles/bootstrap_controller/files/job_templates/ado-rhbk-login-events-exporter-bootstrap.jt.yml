---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | RHBK login events exporter
    description: >-
      Bootstrap - Deploy Keycloak LOGIN / LOGIN_ERROR Prometheus exporter
      (username labels for Grafana)
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/rhbk/ado-rhbk-login-events-exporter-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | rhbk
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | RHBK login events exporter
      description: Deploy the Keycloak login-events exporter
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
