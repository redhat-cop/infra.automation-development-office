---
controller_templates:
  - name: ADO | Create Admin HTPasswd User
    description: Bootstrap - Create Admin htpasswd User
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/openshift/ado-create-htpass-user-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | openshift
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Create Admin HTPasswd User
      description: Configuration options for Create Admin htpasswd User
      spec:
        - question_name: ADO | User change (while Login button stays)
          question_description: >-
            Only used when state=present. add=merge users into the secret,
            replace=rewrite the secret from vault users only, remove=drop the
            named users from the secret (IdP/login button remains).
          required: true
          type: multiplechoice
          variable: htpasswd_action
          choices: "add\nreplace\nremove"
          default: add
        - question_name: ADO | Login button name (IdP)
          question_description: >-
            OpenShift console login button label
            (OAuth identityProviders[].name). Secret defaults to
            name-secret from generated vars. Required for state=absent.
          required: true
          type: text
          variable: htpasswd_idp_name
          default: htpasswd-admin
        - question_name: ADO | Keep or delete the Login button?
          question_description: >-
            present=create/update the HTPasswd IdP and users (see User change).
            absent=delete the entire Login button (IdP) and its secret —
            ignores User change (add/replace/remove).
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
