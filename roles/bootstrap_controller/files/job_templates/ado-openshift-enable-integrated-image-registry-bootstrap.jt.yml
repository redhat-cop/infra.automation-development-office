---
controller_templates:
  - name: ADO | Enable Integrated Image Registry
    description: >-
      Bootstrap - Enable OpenShift integrated image registry and validate
      operational status
    organization: '{{ bootstrap_controller_organization }}'
    playbook: >-
      playbooks/openshift/ado-enable-integrated-image-registry-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: >-
      {{ bootstrap_controller_execution_environment_name }}
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | openshift
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Enable Integrated Image Registry Survey
      description: Configuration options for integrated image registry
      spec:
        - question_name: ADO | Do you want to enable or report only?
          question_description: >-
            present enables and validates; report checks status without
            patching. absent skips enablement.
          required: true
          type: multiplechoice
          variable: state
          choices: "present\nreport\nabsent"
          default: present
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Enable default registry route?
          question_description: >-
            When yes, set spec.defaultRoute=true on the image registry Config.
          required: true
          type: multiplechoice
          variable: ocp_image_registry_default_route
          choices: "true\nfalse"
          default: "true"
