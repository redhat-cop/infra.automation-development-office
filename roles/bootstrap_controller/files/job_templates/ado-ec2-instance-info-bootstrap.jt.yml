---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | EC2 instance info
    description: >-
      Bootstrap - Gather EC2 instance info via
      infra.automation_development_office.aws.ec2.ado_ec2_instance_info
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aws/ec2/ado-ec2-instance-info-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aws
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | EC2 instance info Survey
      description: Describe EC2 instances by ID or Name tag
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_aws / vars_ec2_instance)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Instance ID (optional)
          question_description: EC2 instance ID (for example i-0123456789abcdef0)
          required: false
          type: text
          variable: ec2_instance_ids
          default: ""
        - question_name: ADO | Instance Name tag (optional)
          question_description: Filter by Name tag
          required: false
          type: text
          variable: ec2_instance_name
          default: ""
# yamllint enable rule:line-length
