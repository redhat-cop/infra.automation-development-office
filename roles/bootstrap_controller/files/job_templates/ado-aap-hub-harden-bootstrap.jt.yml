---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Separate AAP Hub Postgres
    description: >-
      Bootstrap - Move Automation Hub off shared Controller Postgres onto a
      dedicated database, then pin Hub workers and the stability CronJob
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aap/ado-aap-hub-harden-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aap
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Separate AAP Hub Postgres Survey
      description: Select the generated environment for Hub dedicated Postgres
      spec:
        - question_name: ADO | What environment?
          question_description: Target generated environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
