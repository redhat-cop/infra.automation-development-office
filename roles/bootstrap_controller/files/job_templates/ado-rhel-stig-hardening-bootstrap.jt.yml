---
controller_templates:
  - name: ADO | RHEL STIG Hardening
    description: Bootstrap - ADO | RHEL STIG Hardening
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/rhel/ado-stig-hardening-bootstrap.yml
    inventory: '{{ bootstrap_controller_rhel_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'  # yamllint disable-line rule:line-length
    credentials:
      - '{{ bootstrap_controller_creds }}'
      # ADO_MACHINE_CREDENTIAL
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | stig
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | rhel
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | RHEL STIG Hardening Survey
      description: Configuration options for ADO | RHEL STIG Hardening
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Compliance profile
          question_description: >-
            Compliance profile context for this hardening run
          required: true
          type: multiplechoice
          variable: compliance_profile
          choices:
            - STIG
            - PCI-DSS
            - NIST 800-53
            - CIS
          default: STIG
        - question_name: ADO | STIG engine
          question_description: >-
            Choose DISA Compliance-as-Code (OpenSCAP) or RHEL System Roles STIG
          required: true
          type: multiplechoice
          variable: stig_engine
          choices:
            - cac
            - system_role
          default: cac
        - question_name: ADO | STIG profile
          question_description: >-
            STIG baseline to apply. "Match host OS" selects RHEL 8/9/10
            content from the target host major version. An explicit RHEL N
            STIG choice requires the host major to match.
          required: true
          type: multiplechoice
          variable: stig_profile
          choices:
            - Match host OS
            - RHEL 8 STIG
            - RHEL 9 STIG
            - RHEL 10 STIG
            - stig
          default: Match host OS
        - question_name: ADO | STIG mode
          question_description: >-
            audit scans only (default). prepare installs OpenSCAP. remediate
            changes the host and needs approval below. verify re-audits the
            listed controls.
          required: true
          type: multiplechoice
          variable: stig_mode
          choices:
            - audit
            - prepare
            - remediate
            - verify
          default: audit
        - question_name: ADO | STIG controls
          question_description: >-
            Optional for audit, required for remediate and verify. STIG IDs
            (RHEL-09-255100), V-IDs (V-257996) or SSG rule names, separated by
            commas or new lines.
          required: false
          type: textarea
          variable: stig_controls
          default: ''
        - question_name: ADO | Approve remediation
          question_description: >-
            Must be true to change the host. Ignored by audit, prepare and
            verify.
          required: true
          type: multiplechoice
          variable: stig_remediation_approved
          choices:
            - 'false'
            - 'true'
          default: 'false'
        - question_name: ADO | Snapshot or backup exists
          question_description: >-
            Confirm a snapshot or backup exists. SCAP remediation cannot be
            undone by this job.
          required: true
          type: multiplechoice
          variable: stig_recovery_confirmed
          choices:
            - 'false'
            - 'true'
          default: 'false'
        - question_name: ADO | Allow protected controls
          question_description: >-
            Optional. Controls that may be remediated even though they touch
            FIPS, SSH, SSSD/IdM, authentication, sudo or the firewall. Leave
            empty unless you accept the lock-out risk.
          required: false
          type: textarea
          variable: stig_allow_protected
          default: ''
