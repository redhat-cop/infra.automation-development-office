---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | GitLab Onboard Comment
    description: >-
      Post a status comment on the originating GitLab issue (awaiting approval,
      etc.). Connection settings come from group_vars/all.
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/gitlab/ado-gitlab-onboard-comment-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    ask_variables_on_launch: false
    related: null
    labels:
      - name: ADO | gitlab
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | day2
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars:
      gitlab_manage_action: issue_comment
    survey_enabled: false
