---
controller_templates:
  - name: ADO | Install RHBK Standalone
    description: >-
      Bootstrap - Install Red Hat Build of Keycloak (standalone zip) on a RHEL VM
      (e.g. keycloak-ado from OpenShift Virt).
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/rhbk/ado-install-rhbk-standalone-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
      # ADO_MACHINE_CREDENTIAL
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | rhbk
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | standalone
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Install RHBK Standalone Survey
      description: Standalone RHBK on RHEL (not OpenShift operator)
      spec:
        - question_name: ADO | Do you want to install or remove?
          question_description: Install (present) or remove service unit (absent)
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | RHBK hostname
          question_description: Public/hostname for KC_HOSTNAME (e.g. keycloak-ado.server.lab)
          required: true
          type: text
          variable: rhbk_hostname
          default: ""
        - question_name: ADO | Admin username
          required: true
          type: text
          variable: rhbk_admin_user
          default: admin
        - question_name: ADO | Admin password
          required: true
          type: password
          variable: rhbk_admin_password
          default: redhat123
        - question_name: ADO | Path to RHBK zip on Contoller/runner
          question_description: >-
            Absolute path to rhbk-*.zip reachable by the Contoller EE, or leave blank
            and set rhbk_standalone_zip_url. For local CLI, use ~/Downloads/rhbk-26.6.5.zip
          required: false
          type: text
          variable: rhbk_standalone_zip
          default: ''
        - question_name: ADO | RHBK zip URL (optional)
          required: false
          type: text
          variable: rhbk_standalone_zip_url
          default: ''
