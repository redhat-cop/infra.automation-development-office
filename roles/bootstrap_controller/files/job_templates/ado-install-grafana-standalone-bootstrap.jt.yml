---
controller_templates:
  - name: ADO | Install Grafana Standalone
    description: >-
      Bootstrap - Install Grafana on a RHEL VM
      (e.g. grafana-ado from OpenShift Virt).
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/grafana/ado-install-grafana-standalone-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
      # ADO_MACHINE_CREDENTIAL
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | grafana
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | standalone
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Install Grafana Standalone Survey
      description: Standalone Grafana on RHEL (not OpenShift operator)
      spec:
        - question_name: ADO | Do you want to install or remove?
          question_description: Install (present) or remove service unit (absent)
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Grafana hostname
          question_description: Public/hostname for grafana.ini domain (e.g. grafana-ado.server.lab)
          required: true
          type: text
          variable: grafana_hostname
          default: ""
        - question_name: ADO | HTTP port
          required: true
          type: integer
          variable: install_grafana_http_port
          default: 3000
        - question_name: ADO | Admin username
          required: true
          type: text
          variable: grafana_admin_user
          default: admin
        - question_name: ADO | Admin password
          required: true
          type: password
          variable: grafana_admin_password
          default: redhat123
        - question_name: ADO | Path to Grafana RPM on Contoller/runner
          question_description: >-
            Disconnected by default. Absolute path to a staged grafana RPM on
            the Contoller EE (required unless package already installed).
            Online rpm.grafana.com only if grafana_allow_online_repo=true.
          required: false
          type: text
          variable: grafana_rpm_path
          default: ''
        - question_name: ADO | Grafana RPM URL (optional)
          question_description: >-
            Internal/airgap mirror URL for the Grafana RPM (not rpm.grafana.com).
          required: false
          type: text
          variable: grafana_rpm_url
          default: ''
