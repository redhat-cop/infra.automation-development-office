---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | GitLab Manage Branch
    description: >-
      Create or delete branches in a GitLab project via the GitLab API.
      Connection settings come from group_vars/all.
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/gitlab/ado-gitlab-manage-branch-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    ask_variables_on_launch: false
    related: null
    labels:
      - name: ADO | gitlab
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | day2
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | GitLab Manage Branch Survey
      description: GitLab branch create / delete
      spec:
        - question_name: ADO | Action
          question_description: Create a branch from a ref, or delete a branch
          required: true
          type: multiplechoice
          variable: gitlab_manage_action
          choices:
            - branch_create
            - branch_delete
          default: branch_create
        - question_name: ADO | Branch name
          question_description: Branch to create or delete
          required: true
          type: text
          variable: gitlab_manage_branch_name
          default: ""
        - question_name: ADO | Source branch
          question_description: Ref used when creating (ignored on delete)
          required: false
          type: text
          variable: gitlab_manage_ref_branch
          default: main
