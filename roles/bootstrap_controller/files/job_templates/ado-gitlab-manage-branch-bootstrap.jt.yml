---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | GitLab Manage Branch
    description: Create or delete branches in a GitLab project via the GitLab API
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/gitlab/ado-gitlab-manage-branch-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    ask_variables_on_launch: false
    related: null
    labels:
      - name: ADO | gitlab
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | day2
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | GitLab Manage Branch Survey
      description: GitLab branch create / delete
      spec:
        - question_name: ADO | Action
          question_description: Create a branch from a ref, or delete a branch
          required: true
          type: multiplechoice
          variable: gitlab_manage_action
          choices:
            - branch_create
            - branch_delete
          default: branch_create
        - question_name: ADO | GitLab API URL
          question_description: Base GitLab URL (no /api/v4 suffix)
          required: true
          type: text
          variable: gitlab_manage_api_url
          default: ""
        - question_name: ADO | GitLab API token
          question_description: Personal or project access token with api/write_repository scope
          required: true
          type: password
          variable: gitlab_manage_api_token
          default: ""
        - question_name: ADO | Project path
          question_description: group/project path (example redhat-lab/gitlab)
          required: true
          type: text
          variable: gitlab_manage_project
          default: ""
        - question_name: ADO | Branch name
          question_description: Branch to create or delete
          required: true
          type: text
          variable: gitlab_manage_branch_name
          default: ""
        - question_name: ADO | Source branch
          question_description: Ref used when creating (ignored on delete)
          required: false
          type: text
          variable: gitlab_manage_ref_branch
          default: main
        - question_name: ADO | Validate TLS
          question_description: Verify GitLab TLS certificates
          required: true
          type: multiplechoice
          variable: gitlab_manage_validate_certs
          choices:
            - "true"
            - "false"
          default: "true"
