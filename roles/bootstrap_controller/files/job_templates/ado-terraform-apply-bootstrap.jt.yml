---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Terraform apply
    description: >-
      Bootstrap - Run terraform apply or destroy for a stack in terraform/stacks.
      Requires a remote backend and terraform or tofu on the execution environment.
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/terraform/ado-terraform-apply-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | terraform
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Terraform apply survey
      description: Select environment, stack, and apply or destroy
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault/vars for terraform)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Terraform action
          question_description: apply creates or updates resources; destroy removes them
          required: true
          type: multiplechoice
          variable: terraform_action
          choices: "apply\ndestroy"
          default: apply
        - question_name: ADO | Terraform stack
          question_description: >-
            Directory name under terraform/stacks in the bootstrap repository
          required: true
          type: text
          variable: terraform_stack
          default: example
        - question_name: ADO | Terraform workspace (optional)
          question_description: Leave blank to use the current workspace
          required: false
          type: text
          variable: terraform_workspace
          default: ""
        - question_name: ADO | Terraform binary
          question_description: terraform or tofu (OpenTofu)
          required: true
          type: multiplechoice
          variable: terraform_bin
          choices: "terraform\ntofu"
          default: terraform
        - question_name: ADO | Remote backend already configured in *.tf?
          question_description: >-
            Choose true when the stack declares a backend block. Required for
            apply/destroy from Ansible Automation Platform.
          required: true
          type: multiplechoice
          variable: terraform_backend_configured
          choices: "true\nfalse"
          default: "false"
# yamllint enable rule:line-length
