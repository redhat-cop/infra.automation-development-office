---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Copy AMI between AWS regions
    description: >-
      Bootstrap - Copy an AWS AMI from one region to another using
      infra.automation_development_office.ec2_ami_copy
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aws/ado-copy-ami-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aws
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Copy AMI Survey
      description: Cross-region AMI copy options for infra.automation_development_office.ec2_ami_copy
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault/vars for ec2_ami_copy)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Source AWS region
          question_description: Region that currently holds the AMI to copy
          required: true
          type: text
          variable: ec2_ami_copy_source_region
          default: us-east-1
        - question_name: ADO | Destination AWS region
          question_description: Region where the copied AMI will be created
          required: true
          type: text
          variable: ec2_ami_copy_dest_region
          default: us-west-2
        - question_name: ADO | Source AMI ID
          question_description: AMI ID in the source region (for example ami-0123456789abcdef0)
          required: true
          type: text
          variable: ec2_ami_copy_source_image_id
          default: ""
        - question_name: ADO | Destination AMI name (optional)
          question_description: >-
            Rename the copied AMI. Leave blank to reuse the source AMI name.
          required: false
          type: text
          variable: ec2_ami_copy_name
          default: ""
        - question_name: ADO | Wait for AMI availability?
          question_description: Wait until the copied AMI reaches state available
          required: true
          type: multiplechoice
          variable: ec2_ami_copy_wait
          choices: "true\nfalse"
          default: "true"
# yamllint enable rule:line-length
