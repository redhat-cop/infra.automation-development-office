---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | GitLab Manage Issue
    description: >-
      Create, update, or close issues in a GitLab project via the GitLab API
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/gitlab/ado-gitlab-manage-issue-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    ask_variables_on_launch: false
    related: null
    labels:
      - name: ADO | gitlab
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | day2
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | GitLab Manage Issue Survey
      description: GitLab issue create / update / close
      spec:
        - question_name: ADO | Action
          question_description: Create/update opens or updates by title; close closes an opened issue
          required: true
          type: multiplechoice
          variable: gitlab_manage_action
          choices:
            - issue_create
            - issue_update
            - issue_close
          default: issue_create
        - question_name: ADO | GitLab API URL
          question_description: Base GitLab URL (no /api/v4 suffix)
          required: true
          type: text
          variable: gitlab_manage_api_url
          default: ""
        - question_name: ADO | GitLab API token
          question_description: Personal or project access token with api scope
          required: true
          type: password
          variable: gitlab_manage_api_token
          default: ""
        - question_name: ADO | Project path
          question_description: group/project path (example redhat-lab/gitlab)
          required: true
          type: text
          variable: gitlab_manage_project
          default: ""
        - question_name: ADO | Issue title
          question_description: Required for create/update; used to find the issue when closing without IID
          required: false
          type: text
          variable: gitlab_manage_issue_title
          default: ""
        - question_name: ADO | Issue description
          question_description: Markdown body for create/update
          required: false
          type: textarea
          variable: gitlab_manage_issue_description
          default: ""
        - question_name: ADO | Issue IID
          question_description: Numeric IID when closing a known issue (optional if title is unique)
          required: false
          type: text
          variable: gitlab_manage_issue_iid
          default: ""
        - question_name: ADO | Validate TLS
          question_description: Verify GitLab TLS certificates
          required: true
          type: multiplechoice
          variable: gitlab_manage_validate_certs
          choices:
            - "true"
            - "false"
          default: "true"
