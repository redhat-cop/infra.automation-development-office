---
controller_templates:
  - name: ADO | Deploy Grafana Alerts
    description: Bootstrap - Upload OpenShift alert rules for each Prometheus datasource
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/grafana/ado-deploy-alerts-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | grafana
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Deploy Grafana Alerts Survey
      description: Configuration options for Grafana alerts
      spec:
        - question_name: ADO | Do you want to install or remove?
          question_description: Install (present) or Remove (absent)
          required: true
          type: multiplechoice
          variable: state
          choices: '{{ bootstrap_controller_state_choices }}'
          default: '{{ bootstrap_controller_default_state }}'
        - question_name: ADO | What environment?
          question_description: Target environment
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Alert email recipients
          question_description: Comma-separated addresses. Blank skips the contact point.
          required: false
          type: text
          variable: grafana_alert_email_to
          default: ''
        - question_name: ADO | Send test alert emails?
          question_description: Send one test email per OpenShift alert rule.
          required: true
          type: multiplechoice
          variable: grafana_alert_send_test
          choices: "false\ntrue"
          default: 'false'
        - question_name: ADO | Prometheus datasource names
          question_description: Comma-separated names. Blank uses every Prometheus datasource.
          required: false
          type: text
          variable: grafana_alert_datasource_names
          default: ''
