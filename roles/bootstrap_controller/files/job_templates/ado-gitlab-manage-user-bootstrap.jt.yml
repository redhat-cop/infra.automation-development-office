---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | GitLab Manage User
    description: Create, remove, or block GitLab users via the GitLab API
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/gitlab/ado-gitlab-manage-user-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    ask_variables_on_launch: false
    related: null
    labels:
      - name: ADO | gitlab
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | day2
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | GitLab Manage User Survey
      description: GitLab user create / remove / block
      spec:
        - question_name: ADO | Action
          question_description: Create, remove, or block a GitLab user (admin token required)
          required: true
          type: multiplechoice
          variable: gitlab_manage_action
          choices:
            - user_create
            - user_absent
            - user_blocked
          default: user_create
        - question_name: ADO | GitLab API URL
          question_description: Base GitLab URL (no /api/v4 suffix)
          required: true
          type: text
          variable: gitlab_manage_api_url
          default: ""
        - question_name: ADO | GitLab API token
          question_description: Admin personal access token with api scope
          required: true
          type: password
          variable: gitlab_manage_api_token
          default: ""
        - question_name: ADO | Username
          question_description: GitLab username
          required: true
          type: text
          variable: gitlab_manage_user_username
          default: ""
        - question_name: ADO | Display name
          question_description: Required for create
          required: false
          type: text
          variable: gitlab_manage_user_name
          default: ""
        - question_name: ADO | Email
          question_description: Required for create
          required: false
          type: text
          variable: gitlab_manage_user_email
          default: ""
        - question_name: ADO | Password
          question_description: Required for create
          required: false
          type: password
          variable: gitlab_manage_user_password
          default: ""
        - question_name: ADO | Admin user
          question_description: Grant GitLab admin privileges on create
          required: true
          type: multiplechoice
          variable: gitlab_manage_user_isadmin
          choices:
            - "false"
            - "true"
          default: "false"
        - question_name: ADO | Validate TLS
          question_description: Verify GitLab TLS certificates
          required: true
          type: multiplechoice
          variable: gitlab_manage_validate_certs
          choices:
            - "true"
            - "false"
          default: "true"
