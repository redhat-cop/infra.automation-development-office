---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Modify EC2 instance
    description: >-
      Bootstrap - Modify an EC2 instance via
      infra.automation_development_office.aws.ec2.ado_ec2_instance_modify
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aws/ec2/ado-ec2-instance-modify-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aws
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Modify EC2 instance Survey
      description: Stop/start/restart, change type, or update tags
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_aws / vars_ec2_instance)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Instance ID
          question_description: EC2 instance ID (for example i-0123456789abcdef0)
          required: true
          type: text
          variable: ec2_instance_ids
          default: ""
        - question_name: ADO | Desired state (optional)
          question_description: >-
            amazon.aws.ec2_instance state choices. Use (no change) to skip.
            Terminate via the Delete EC2 instance job template.
          required: true
          type: multiplechoice
          variable: ec2_instance_state
          choices:
            - "(no change)"
            - present
            - running
            - started
            - stopped
            - restarted
            - rebooted
          default: "(no change)"
        - question_name: ADO | Instance type (optional)
          question_description: >-
            amazon.aws.ec2_instance instance_type (instance often must be stopped first)
          required: true
          type: multiplechoice
          variable: ec2_instance_type
          choices:
            - "(no change)"
            - t3.micro
            - t3.small
            - t3.medium
            - t3.large
            - t3.xlarge
            - t3a.micro
            - t3a.small
            - t3a.medium
            - t3a.large
            - t2.micro
            - t2.small
            - t2.medium
            - t2.large
            - m5.large
            - m5.xlarge
            - m6i.large
            - m6i.xlarge
            - c5.large
            - c5.xlarge
            - c6i.large
            - r5.large
            - r6i.large
          default: "(no change)"
        - question_name: ADO | Termination protection (optional)
          question_description: amazon.aws.ec2_instance termination_protection
          required: true
          type: multiplechoice
          variable: ec2_instance_termination_protection
          choices:
            - "(no change)"
            - "true"
            - "false"
          default: "(no change)"
        - question_name: ADO | Wait for state change?
          question_description: amazon.aws.ec2_instance wait
          required: true
          type: multiplechoice
          variable: ec2_instance_wait
          choices:
            - "true"
            - "false"
          default: "true"
# yamllint enable rule:line-length
