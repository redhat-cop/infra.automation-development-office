---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Set S3 bucket policy
    description: >-
      Bootstrap - Create bucket and set inline policy via
      infra.automation_development_office.aws.s3.ado_s3_bucket_policy_set
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aws/s3/ado-s3-bucket-policy-set-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aws
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Set S3 bucket policy Survey
      description: Inline S3 bucket policy options
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_aws / vars_s3_bucket_policy)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Bucket name
          question_description: Exact S3 bucket name
          required: true
          type: text
          variable: s3_bucket_name
          default: ""
        - question_name: ADO | AWS account ID
          question_description: Account ID used in the AllowRoleRead principal ARN
          required: true
          type: text
          variable: s3_bucket_aws_account_id
          default: "123456789012"
        - question_name: ADO | Reader role name
          question_description: IAM role name granted s3:GetObject
          required: true
          type: text
          variable: s3_bucket_reader_role_name
          default: AppReader
# yamllint enable rule:line-length
