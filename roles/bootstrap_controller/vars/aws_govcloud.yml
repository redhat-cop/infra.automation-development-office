---
# AWS GovCloud (US) survey choices for EC2 instance job and workflow templates.
# Keep job-template and workflow surveys in sync by referencing these vars.
bootstrap_controller_aws_govcloud_region_choices:
  - us-gov-west-1
  - us-gov-east-1
bootstrap_controller_aws_govcloud_default_region: us-gov-west-1

bootstrap_controller_ec2_instance_state_choices:
  - present
  - running
  - stopped
  - terminated
bootstrap_controller_ec2_instance_default_state: present

# Current-generation instance types offered in AWS GovCloud (US).
# Not an exhaustive AWS catalog — commercial-only families are omitted.
bootstrap_controller_aws_govcloud_default_instance_type: m5.large
