---
# =========================
# Safe defaults / knobs only
# =========================

bootstrap_controller_enabled_objects:
  - organizations
  - credentials
  - execution_environments
  - projects
  - inventories
  - inventory_sources
  - hosts
  - labels
  - job_templates
  - workflow_job_templates

bootstrap_controller_generate_job_templates_from_manifest: true
bootstrap_controller_generate_aap_configs_force_job_workflows: false

bootstrap_controller_aap_connectivity_check_enabled: true
bootstrap_controller_aap_connectivity_no_log: true
bootstrap_controller_aap_api_path: ""
bootstrap_controller_aap_connectivity_endpoint: ""
bootstrap_controller_aap_smoke_test_enabled: true
bootstrap_controller_aap_smoke_test_job_template: "Demo Job Template"
bootstrap_controller_aap_smoke_test_extra_vars: {}
bootstrap_controller_aap_smoke_test_poll_delay: 5
bootstrap_controller_aap_smoke_test_poll_retries: 60

# When true (from preflight component_config.aap.install_during_bootstrap),
# bootstrap runs infra.automation_development_office.install_aap (openshift → aap_utilities.aap_ocp_install)
# before apply_aap_configs and omits
# the Install AAP on OpenShift job template.
bootstrap_controller_aap_install_during_bootstrap: false

# ansible.controller defaults request_timeout to 10s. Org lookup on a slow
# Controller API then fails inventory create. Dispatcher roles read
# aap_request_timeout; direct module calls pass this value.
bootstrap_controller_request_timeout: 120
# Gateway 504 on POST /inventories/ is retried per inventory. The next
# inventory in the same run often succeeds, so one timeout must not fail
# bootstrap.
bootstrap_controller_inventory_retries: 4
bootstrap_controller_inventory_retry_delay: 10
# GET /organizations/?name= can 504 while the org already exists.
# Retry the lookup. Do not create or PATCH on a gateway timeout.
bootstrap_controller_org_lookup_retries: 4
bootstrap_controller_org_lookup_retry_delay: 10
# Gateway 504 on POST /credentials/ is retried per credential. The
# dispatcher otherwise posts every credential together, so one timeout
# fails bootstrap while another credential in the same batch succeeds.
bootstrap_controller_credential_retries: 4
bootstrap_controller_credential_retry_delay: 10
# Gateway 504 on POST /projects/ is retried per project. Ansible 2.15
# rejects delay on include_role, so each try pauses between attempts.
bootstrap_controller_project_retries: 4
bootstrap_controller_project_retry_delay: 10
# Gateway 504 on POST /hosts/ and /groups/ is retried per object.
# Ansible 2.15 rejects delay on include_role, so each try pauses.
bootstrap_controller_host_retries: 4
bootstrap_controller_host_retry_delay: 10
bootstrap_controller_group_retries: 4
bootstrap_controller_group_retry_delay: 10
# The job template role polls async for 50 seconds by default. The
# Controller call is allowed 120 seconds, so the poll ends first and
# the only message is Unknown Error. Delay times retries must outlast
# bootstrap_controller_request_timeout. Each template is also retried.
bootstrap_controller_job_template_async_delay: 5
bootstrap_controller_job_template_retries: 4
bootstrap_controller_job_template_retry_delay: 10

bootstrap_controller_hub_publish_wait: false
# Upload timeout for ah_collection (large tarballs need more than 5m).
bootstrap_controller_hub_publish_timeout: 900
bootstrap_controller_hub_publish_request_timeout: 120
# Pulp import / promote visibility wait (wait:false upload + URI poll).
# Default ~10m; large tarballs (e.g. redhat.rhel_system_roles)
# use the large_* knobs.
bootstrap_controller_hub_publish_verify_retries: 60
bootstrap_controller_hub_publish_verify_delay: 10
bootstrap_controller_hub_publish_large_bytes: 30000000
bootstrap_controller_hub_publish_large_verify_retries: 120
bootstrap_controller_hub_publish_large_verify_delay: 10
bootstrap_controller_hub_staging_repository: staging
# Retry skip-if-exists GETs when Hub/route returns 502/503/504.
bootstrap_controller_hub_exist_check_retries: 8
bootstrap_controller_hub_exist_check_delay: 15
# Content repos to treat as "already installed" before uploading a tarball.
# Red Hat certified collections often exist in rh-certified, not validated.
bootstrap_controller_hub_pub_exist_repos:
  - validated
  - published
  - rh-certified
# Private Hub reserves these; do not create or upload into them.
bootstrap_controller_hub_reserved_namespaces:
  - redhat
bootstrap_controller_hub_hostname: ""
bootstrap_controller_hub_push_ee: false
bootstrap_controller_hub_ee_source_image: ""
bootstrap_controller_hub_ee_name: ""
bootstrap_controller_hub_ee_tag: latest
bootstrap_controller_hub_ee_registry: ""
bootstrap_controller_hub_ee_pull: false
bootstrap_controller_hub_ee_create_execution_environment: true
bootstrap_controller_hub_ee_execution_environment_name: ""
bootstrap_controller_hub_ee_description: ""
# skopeo copy retries (Hub registry 502 / gateway flakes during layer upload).
bootstrap_controller_hub_ee_skopeo_retry_times: 8
bootstrap_controller_hub_ee_skopeo_retry_delay: 15s
bootstrap_controller_hub_ee_push_retries: 5
bootstrap_controller_hub_ee_push_delay: 30
bootstrap_controller_hub_publish_ado_collection: false
# Opt-in: publish selected preflight tarball collections to Hub validated when missing.
# Never forced. infra.automation_development_office uses hub_force_ado_collection_update only.
bootstrap_controller_hub_publish_preflight_collections: false
bootstrap_controller_hub_preflight_collection_names: []
bootstrap_controller_hub_force_ado_collection_update: false
bootstrap_controller_hub_update_collection_only: false
bootstrap_controller_ignore_galaxy_cert: false
ansible_dispatch_ignore_galaxy_cert: false
# When true: only generate group_vars (vars/vault) and optionally git-push them.
# Skips playbook regeneration and Contoller object apply.
bootstrap_controller_vars_only: false

# Common placeholders. Real values belong in group_vars/all/vars_<env>.yml
bootstrap_controller_organization: ""
bootstrap_controller_inventory_name: ""
bootstrap_controller_project_name: ""
bootstrap_controller_execution_environment_name: ""
bootstrap_controller_creds: ""

# Survey defaults (overridden by aap_config_vars from preflight:
# primary environment + optional additional_environments)
bootstrap_controller_environment_choices:
  - prod
bootstrap_controller_default_environment: prod

bootstrap_controller_state_choices:
  - present
  - absent
bootstrap_controller_console_banner_state_choices:
  - add
  - update
  - delete
bootstrap_controller_default_state: present

# amazon.aws.ec2_instance state= choices (modify survey).
bootstrap_controller_ec2_instance_state_choices:
  - present
  - running
  - started
  - stopped
  - restarted
  - rebooted

# Curated instance_type list for Contoller surveys (amazon.aws accepts any
# valid EC2 type; module examples use t2/t3/c4/c5 families).
bootstrap_controller_ec2_instance_type_choices:
  - t3.micro
  - t3.small
  - t3.medium
  - t3.large
  - t3.xlarge
  - t3a.micro
  - t3a.small
  - t3a.medium
  - t3a.large
  - t2.micro
  - t2.small
  - t2.medium
  - t2.large
  - m5.large
  - m5.xlarge
  - m6i.large
  - m6i.xlarge
  - c5.large
  - c5.xlarge
  - c6i.large
  - r5.large
  - r6i.large
bootstrap_controller_ec2_instance_type_default: t3.small

# Job Template Defaults
bootstrap_controller_job_templates_defaults:
  job_type: run
  ask_inventory_on_launch: false
  ask_credential_on_launch: false
  ask_variables_on_launch: true
  ask_limit_on_launch: false
  ask_skip_tags_on_launch: false
  ask_tags_on_launch: false
  ask_verbosity_on_launch: false
  ask_execution_environment_on_launch: false
  ask_labels_on_launch: false
  ask_forks_on_launch: false
  ask_job_slice_count_on_launch: false
  ask_timeout_on_launch: false
  ask_instance_groups_on_launch: false
  concurrent_jobs_enabled: false
  job_slice_count: 1
  timeout: 0
  verbosity: 0
  prevent_instance_group_fallback: false
  survey_enabled: true

# Controller object lists are intentionally empty by default.
# Define these in group_vars/all/vars_<env>.yml.
bootstrap_controller_controller_organizations: []
bootstrap_controller_controller_inventories: []
bootstrap_controller_controller_inventory_sources: []
bootstrap_controller_controller_hosts: []
bootstrap_controller_controller_groups: []
bootstrap_controller_controller_execution_environments: []
bootstrap_controller_controller_credentials: []
bootstrap_controller_controller_projects: []
bootstrap_controller_controller_labels:
  - name: "{{ bootstrap_controller_organization }}"
    organization: "{{ bootstrap_controller_organization }}"

  - name: "{{ bootstrap_controller_organization }} | bootstrap"
    organization: "{{ bootstrap_controller_organization }}"

  - name: "{{ bootstrap_controller_organization }} | jira"
    organization: "{{ bootstrap_controller_organization }}"
bootstrap_controller_workflow_job_templates: []
bootstrap_controller_templates: []
