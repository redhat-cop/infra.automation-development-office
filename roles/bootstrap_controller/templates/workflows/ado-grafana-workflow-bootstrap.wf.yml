---
controller_workflow_job_templates:
  - name: ADO | Grafana Workflow
    description: >-
      Grafana — optional OpenShift or standalone install, then independent
      OIDC, email/SMTP, datasources, folders, dashboards, alerts, and
      alternate route based on preflight Grafana options. Content steps run
      without install when only those options are selected.
    organization: "{{ bootstrap_controller_organization }}"
    inventory: "{{ bootstrap_controller_inventory_name }}"
    state: present
    destroy_current_nodes: true
    labels:
      - ADO | bootstrap
      - ADO | grafana
    simplified_workflow_nodes:
      - identifier: Deploy Grafana
        unified_job_template: ADO | Deploy Grafana
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Install Grafana Standalone
          - Deploy Grafana OIDC
          - Deploy Grafana Email
          - Deploy Grafana Datasource
          - Deploy Grafana Folders
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Install Grafana Standalone
        unified_job_template: ADO | Install Grafana Standalone
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana OIDC
          - Deploy Grafana Email
          - Deploy Grafana Datasource
          - Deploy Grafana Folders
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana OIDC
        unified_job_template: ADO | Deploy Grafana OIDC
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Email
          - Deploy Grafana Datasource
          - Deploy Grafana Folders
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Email
        unified_job_template: ADO | Deploy Grafana Email
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Datasource
          - Deploy Grafana Folders
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Datasource
        unified_job_template: ADO | Deploy Grafana Datasource
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Folders
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Folders
        unified_job_template: ADO | Deploy Grafana Folders
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Dashboards
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Dashboards
        unified_job_template: ADO | Deploy Grafana Dashboards
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Alerts
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Alerts
        unified_job_template: ADO | Deploy Grafana Alerts
        lookup_organization: "{{ bootstrap_controller_organization }}"
        success_nodes:
          - Deploy Grafana Alternate Route

      - identifier: Deploy Grafana Alternate Route
        unified_job_template: ADO | Deploy Grafana Alternate Route
        lookup_organization: "{{ bootstrap_controller_organization }}"
