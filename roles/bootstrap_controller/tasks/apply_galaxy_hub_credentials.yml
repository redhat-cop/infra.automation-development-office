# yamllint disable rule:line-length
---
# Apply Galaxy / Hub API Token credentials (+ optional Contoller user) and attach
# them to the organization in search order. Used on hub-update-only runs because
# the full Contoller credential dispatch happens after meta: end_host.

- name: Galaxy hub-only | Normalize credential list ordered for org attach
  ansible.builtin.set_fact:
    bootstrap_controller_galaxy_cred_ordered: >-
      {{
        (
          bootstrap_controller_controller_credentials
          | default(controller_credentials | default([]), true)
          | selectattr('credential_type', 'defined')
          | selectattr(
              'credential_type',
              'equalto',
              'Ansible Galaxy/Automation Hub API Token'
            )
          | list
        )
      }}
    bootstrap_controller_galaxy_org_attach_names: >-
      {{
        (
          (
            controller_bootstrap_controller_organizations
            | default(bootstrap_controller_controller_organizations | default([]), true)
            | selectattr('name', 'defined')
            | selectattr(
                'name',
                'equalto',
                controller_bootstrap_organization | default('ADO')
              )
            | list
            | first
            | default({})
          ).galaxy_credentials
          | default([])
        )
      }}

- name: Galaxy hub-only | Report Controller Galaxy credential work
  ansible.builtin.debug:
    msg: >-
      Creating {{ bootstrap_controller_galaxy_cred_ordered | default([]) | length }}
      Galaxy credential(s); attaching
      {{ bootstrap_controller_galaxy_org_attach_names | default([]) }}
      to {{ controller_bootstrap_organization | default('ADO') }}.

- name: Galaxy hub-only | Create Galaxy/Hub API Token credentials
  ansible.controller.credential:
    name: "{{ item.name }}"
    description: "{{ item.description | default('Galaxy/Hub credential ' ~ item.name) }}"
    organization: "{{ item.organization | default(controller_bootstrap_organization | default('ADO')) }}"
    credential_type: "{{ item.credential_type }}"
    inputs: "{{ item.inputs }}"
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ bootstrap_controller_galaxy_cred_ordered }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bootstrap_controller_galaxy_cred_ordered | default([]) | length > 0
    # Platform-global "Ansible Galaxy" already exists; org attach uses the name.
    - item.name | default('') != 'Ansible Galaxy'
    - item.inputs.url | default('') | string | length > 0
  no_log: true

# Galaxy attach is the only allowed org update. Never send description —
# AAP 2.5+ returns 400 Failed to sync resource on existing orgs.
- name: Galaxy hub-only | Attach Galaxy credentials to organization (ordered)
  ansible.controller.organization:
    name: "{{ controller_bootstrap_organization | default('ADO') }}"
    galaxy_credentials: "{{ bootstrap_controller_galaxy_org_attach_names }}"
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  when:
    - controller_bootstrap_organization | default('') | length > 0
    - bootstrap_controller_galaxy_org_attach_names | default([]) | length > 0

- name: Galaxy hub-only | Create optional Contoller user (not admin)
  ansible.controller.user:
    username: "{{ item.username }}"
    password: "{{ item.password }}"
    email: "{{ item.email | default(omit) }}"
    is_superuser: "{{ item.is_superuser | default(false) | bool }}"
    organizations:
      - "{{ controller_bootstrap_organization | default('ADO') }}"
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ controller_users | default([]) }}"
  loop_control:
    label: "{{ item.username | default('user') }}"
  when:
    - controller_users | default([]) | length > 0
  no_log: true
