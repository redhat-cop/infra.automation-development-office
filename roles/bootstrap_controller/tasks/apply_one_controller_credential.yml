---
# state=present leaves an existing credential in place.
- name: AAP 2.5+ | Apply one credential
  block:
    - name: AAP 2.5+ | Dispatch one credential
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        gateway_configuration_dispatcher_roles: []
        hub_configuration_dispatcher_roles: []
        eda_configuration_dispatcher_roles: []
        controller_credentials: "{{ [bootstrap_controller_credential] }}"
        controller_configuration_dispatcher_roles:
          - role: controller_credentials
            var: controller_credentials
            tags: credentials

    - name: AAP 2.5+ | Credential apply succeeded
      ansible.builtin.set_fact:
        bootstrap_controller_credential_ok: true
  rescue:
    - name: AAP 2.5+ | Wait before the next credential attempt
      ansible.builtin.pause:
        seconds: >-
          {{
            bootstrap_controller_credential_retry_delay | default(10) | int
          }}
      when: >-
        (bootstrap_controller_credential_try | int)
        < (bootstrap_controller_credential_retries | default(4) | int)

    - name: AAP 2.5+ | Fail when credential retries are exhausted
      ansible.builtin.fail:
        msg: >-
          Credential was not applied after
          {{ bootstrap_controller_credential_retries | default(4) }}
          attempts.
      when: >-
        (bootstrap_controller_credential_try | int)
        >= (bootstrap_controller_credential_retries | default(4) | int)
