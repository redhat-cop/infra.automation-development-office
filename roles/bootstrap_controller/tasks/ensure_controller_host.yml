---
# One host per include. Ansible 2.15 rejects delay on include_role
# and on include_tasks, so each try is a loop iteration with a pause.
- name: AAP 2.5+ | Reset host retry state
  ansible.builtin.set_fact:
    bootstrap_controller_host_ok: false

- name: AAP 2.5+ | Apply one host until it succeeds
  ansible.builtin.include_tasks: apply_one_controller_host.yml
  loop: >-
    {{
      range(
        1,
        (bootstrap_controller_host_retries | default(4) | int) + 1
      ) | list
    }}
  loop_control:
    loop_var: bootstrap_controller_host_try
  when: not (bootstrap_controller_host_ok | default(false) | bool)
