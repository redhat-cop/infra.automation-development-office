---
# yamllint disable rule:line-length
- name: AAP 2.5+ | Load controller configs before project sync
  ansible.builtin.include_tasks: load_controller_configs.yml

- name: AAP 2.5+ | Debug controller object counts before project sync
  ansible.builtin.debug:
    msg:
      - "controller_templates={{ controller_templates | default([]) | length }}"
      - "controller_workflow_job_templates={{ controller_workflow_job_templates | default([]) | length }}"

# Create/update projects separately so we can force sync before job templates.
# Never sync during project create: Contoller runs install_collections then and
# fails hard if Hub does not yet have infra.ado (or Hub update was skipped).
- name: AAP 2.5+ | Sanitize controller projects (no sync-on-create)
  ansible.builtin.set_fact:
    bootstrap_controller_projects_sanitized: >-
      {{
        (
          controller_projects
          | default(controller_bootstrap_controller_projects | default([]), true)
        )
        | map('combine', {'update_project': false, 'wait': false, 'scm_clean': true})
        | list
      }}

- name: AAP 2.5+ | Normalize controller projects before apply  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_projects: "{{ bootstrap_controller_projects_sanitized }}"
    bootstrap_controller_controller_projects: "{{ bootstrap_controller_projects_sanitized }}"
    controller_bootstrap_controller_projects: "{{ bootstrap_controller_projects_sanitized }}"

- name: AAP 2.5+ | Debug controller projects before apply
  ansible.builtin.debug:
    var: controller_projects

- name: AAP 2.5+ | Set Controller jobs GALAXY_IGNORE_CERTS when opted in
  ansible.builtin.uri:
    url: "{{ (controller_host | default(vault_controller_hostname)).rstrip('/') }}/api/controller/v2/settings/jobs/"
    method: PATCH
    body_format: json
    body:
      GALAXY_IGNORE_CERTS: true
    status_code: [200]
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ (controller_oauthtoken | default(vault_controller_oauthtoken | default('')))}
        if (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) > 0
        else omit
      }}
    user: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    force_basic_auth: >-
      {{
        (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) == 0
      }}
  when:
    - ansible_dispatch_ignore_galaxy_cert | default(bootstrap_controller_ignore_galaxy_cert | default(false)) | bool
    - controller_projects | default([]) | length > 0

- name: AAP 2.5+ | Apply projects
  ansible.builtin.include_role:
    name: infra.aap_configuration.controller_projects
  when: controller_projects | default([]) | length > 0

# controller_projects may no-op when the project already exists, leaving an
# old scm_branch. Explicitly align URL/branch before sync.
- name: AAP 2.5+ | Align existing project git URL and branch
  ansible.controller.project:
    name: "{{ item.name }}"
    organization: "{{ item.organization | default(omit) }}"
    scm_type: "{{ item.scm_type | default('git') }}"
    scm_url: "{{ item.scm_url | default(omit) }}"
    scm_branch: "{{ item.scm_branch | default(omit) }}"
    scm_credential: "{{ item.credential | default(item.scm_credential | default(omit)) }}"
    scm_clean: true
    update_project: false
    wait: false
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ controller_projects | default([]) }}"
  loop_control:
    label: "{{ item.name }} branch={{ item.scm_branch | default('') }}"
  when:
    - controller_projects | default([]) | length > 0
    - item.scm_type | default('') | length > 0
    - (item.scm_branch | default('') | length > 0) or (item.scm_url | default('') | length > 0)

- name: AAP 2.5+ | Query Controller project status before forced sync
  ansible.builtin.uri:
    url: >-
      {{
        (controller_host | default(vault_controller_hostname)).rstrip('/')
      }}/api/controller/v2/projects/?page_size=200
    method: GET
    return_content: true
    status_code: [200]
    body_format: json
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ (controller_oauthtoken | default(vault_controller_oauthtoken | default('')))}
        if (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) > 0
        else omit
      }}
    user: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    force_basic_auth: >-
      {{
        (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) == 0
      }}
  register: bootstrap_controller_projects_status_query
  failed_when: false
  when:
    - controller_projects | default([]) | length > 0

- name: AAP 2.5+ | Record Controller project state before forced sync
  ansible.builtin.set_fact:
    bootstrap_controller_projects_pre_sync: >-
      {%- set out = {} -%}
      {%- set wanted = controller_projects | default([]) | map(attribute='name') | list -%}
      {%- for row in bootstrap_controller_projects_status_query.json.results | default([]) -%}
      {%- if row.name in wanted -%}
      {%- set _ = out.update({
        row.name: {
          'last_job_status': row.summary_fields.last_job.status | default(''),
          'scm_revision': row.scm_revision | default(''),
          'last_job_finished': row.summary_fields.last_job.finished | default('')
        }
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when:
    - controller_projects | default([]) | length > 0
    - bootstrap_controller_projects_status_query is defined
    - not (bootstrap_controller_projects_status_query.failed | default(false) | bool)

- name: AAP 2.5+ | Initialize project sync results
  ansible.builtin.set_fact:
    bootstrap_controller_project_sync_result:
      results: []

- name: AAP 2.5+ | Complete one sync per project before creating templates
  ansible.builtin.include_tasks: sync_one_controller_project.yml
  loop: "{{ controller_projects | default([]) }}"
  loop_control:
    loop_var: bootstrap_controller_sync_project
    label: "{{ bootstrap_controller_sync_project.name }}"
  when: bootstrap_controller_sync_project.scm_type | default('') | length > 0

- name: AAP 2.5+ | Collect failed project sync items
  ansible.builtin.set_fact:
    bootstrap_controller_project_sync_failures: >-
      {%- set failures = [] -%}
      {%- for result in bootstrap_controller_project_sync_result.results | default([]) -%}
      {%- if not (result.skipped | default(false) | bool) -%}
      {%- if result.failed | default(false) | bool -%}
      {%- set _ = failures.append(result) -%}
      {%- elif (result.status | default('error') | string) != 'successful' -%}
      {%- set _ = failures.append(result) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ failures }}
  when:
    - controller_projects | default([]) | length > 0
    - bootstrap_controller_project_sync_result is defined

- name: AAP 2.5+ | Fetch failed project update stdout
  ansible.builtin.uri:
    url: >-
      {{
        (controller_host | default(vault_controller_hostname)).rstrip('/')
      }}/api/controller/v2/project_updates/{{ item.id }}/stdout/?format=txt
    method: GET
    return_content: true
    status_code: [200]
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ (controller_oauthtoken | default(vault_controller_oauthtoken | default('')))}
        if (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) > 0
        else omit
      }}
    user: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    force_basic_auth: >-
      {{
        (controller_oauthtoken | default(vault_controller_oauthtoken | default('')) | string | trim | length) == 0
      }}
  loop: "{{ bootstrap_controller_project_sync_failures | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.id) }}"
  register: bootstrap_controller_project_sync_stdout
  failed_when: false
  when:
    - bootstrap_controller_project_sync_failures | default([]) | length > 0
    - item.id is defined

- name: AAP 2.5+ | Fail with actionable project sync guidance
  ansible.builtin.fail:
    msg: >-
      Controller project sync did not finish before bootstrap continued for:
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='item.name')
        | list
        | join(', ')
      }}.
      Module message:
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='msg')
        | list
        | join(' | ')
      }}
      Status:
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='status')
        | list
        | join(', ')
      }}.
      If status is pending, the sync may still be running in AAP — wait for
      {{
        bootstrap_controller_project_sync_failures
        | map(attribute='item.name')
        | list
        | join(', ')
      }}
      to finish, then re-run bootstrap or increase
      aap.project_sync_timeout in preflight JSON (default 600).
      For Bitbucket Server, set preflight git.username (account name) and
      git.token (HTTP access token); Controller Source Control credentials
      use basic auth, not OAuth2 or Bearer headers.
      Job stdout (tail):
      {%- for result in bootstrap_controller_project_sync_stdout.results | default([]) %}
      {{ (result.content | default('', true)).splitlines()[-40:] | join('\n') }}
      {% endfor %}
  when:
    - bootstrap_controller_project_sync_failures | default([]) | length > 0

- name: AAP 2.5+ | Wait for project playbooks to become available
  ansible.builtin.pause:
    seconds: "{{ bootstrap_controller_project_playbook_wait_seconds | default(60) }}"
  when:
    - controller_projects | default([]) | length > 0
    - bootstrap_controller_project_sync_failures | default([]) | length == 0
