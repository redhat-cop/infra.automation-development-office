---
# Publish one preflight tarball to Hub validated (staging upload + pulp move).
# Skips when version already exists in validated unless __hub_pub_force is true.
#
# wait:false on ah_collection — the module's import wait polls Hub and can fail
# with DNS/URLError even after a successful upload. We wait via pulp lookup.

- name: Publish preflight collection | Find tarball on bootstrap host
  ansible.builtin.find:
    paths: "{{ bootstrap_controller_hub_pub_search_dirs }}"
    patterns: "{{ __hub_pub_item.tarball_glob }}"
    recurse: false
  register: bootstrap_controller_hub_pub_find

- name: Publish preflight collection | Resolve tarball path
  ansible.builtin.set_fact:
    bootstrap_controller_hub_pub_file: >-
      {{
        bootstrap_controller_hub_pub_find.files
        | default([])
        | sort(attribute='path')
        | last
        | default({})
      }}

- name: Publish preflight collection | Set tarball path and size
  ansible.builtin.set_fact:
    bootstrap_controller_hub_pub_tarball: "{{ bootstrap_controller_hub_pub_file.path | default('') }}"
    bootstrap_controller_hub_pub_tarball_size: "{{ bootstrap_controller_hub_pub_file.size | default(0) | int }}"

- name: Publish preflight collection | Skip when tarball missing
  ansible.builtin.debug:
    msg: >-
      Skipping {{ __hub_pub_item.name }} — tarball not found under
      {{ bootstrap_controller_hub_pub_search_dirs | join(', ') }}
      (glob {{ __hub_pub_item.tarball_glob }}).
  when: bootstrap_controller_hub_pub_tarball | default('') | length == 0

- name: Publish preflight collection | Publish tarball when present
  when: bootstrap_controller_hub_pub_tarball | default('') | length > 0
  block:
    - name: Publish preflight collection | Scale pulp wait for large tarballs
      ansible.builtin.set_fact:
        bootstrap_controller_hub_pub_verify_retries: >-
          {{
            (
              bootstrap_controller_hub_publish_large_verify_retries
              | default(120)
              | int
            )
            if (
              (bootstrap_controller_hub_pub_tarball_size | default(0) | int)
              >= (bootstrap_controller_hub_publish_large_bytes | default(30000000) | int)
            )
            else (
              bootstrap_controller_hub_publish_verify_retries
              | default(60)
              | int
            )
          }}
        bootstrap_controller_hub_pub_verify_delay: >-
          {{
            (
              bootstrap_controller_hub_publish_large_verify_delay
              | default(10)
              | int
            )
            if (
              (bootstrap_controller_hub_pub_tarball_size | default(0) | int)
              >= (bootstrap_controller_hub_publish_large_bytes | default(30000000) | int)
            )
            else (
              bootstrap_controller_hub_publish_verify_delay
              | default(10)
              | int
            )
          }}

    - name: Publish preflight collection | Parse version from tarball name
      ansible.builtin.set_fact:
        bootstrap_controller_hub_pub_version: "{{ (bootstrap_controller_hub_pub_tarball | basename | replace('.tar.gz', '')).split('-')[2:] | join('-') }}"

    - name: Publish preflight collection | Assert version does not include archive suffix
      ansible.builtin.assert:
        that:
          - bootstrap_controller_hub_pub_version | length > 0
          - "'.tar.gz' not in bootstrap_controller_hub_pub_version"
        fail_msg: >-
          Could not parse collection version from
          {{ bootstrap_controller_hub_pub_tarball | basename }}
          (got '{{ bootstrap_controller_hub_pub_version }}').

    - name: Publish preflight collection | Show publish target
      ansible.builtin.debug:
        msg: >-
          {{ __hub_pub_item.name }} {{ bootstrap_controller_hub_pub_version }}
          from {{ bootstrap_controller_hub_pub_tarball }}
          ({{ bootstrap_controller_hub_pub_tarball_size | default(0) }} bytes;
          pulp wait retries={{ bootstrap_controller_hub_pub_verify_retries }},
          delay={{ bootstrap_controller_hub_pub_verify_delay }}s)

    - name: Publish preflight collection | Build Hub API URLs for this collection
      ansible.builtin.set_fact:
        bootstrap_controller_hub_pub_validated_version_url: >-
          {{
            bootstrap_controller_hub_pub_api_host.rstrip('/')
            ~ '/api/galaxy/content/'
            ~ (bootstrap_controller_hub_publish_repository | default('validated'))
            ~ '/v3/collections/' ~ __hub_pub_item.namespace
            ~ '/' ~ __hub_pub_item.collection
            ~ '/versions/' ~ bootstrap_controller_hub_pub_version ~ '/'
          }}
        bootstrap_controller_hub_pub_staging_version_url: >-
          {{
            bootstrap_controller_hub_pub_api_host.rstrip('/')
            ~ '/api/galaxy/content/'
            ~ (bootstrap_controller_hub_staging_repository | default('staging'))
            ~ '/v3/collections/' ~ __hub_pub_item.namespace
            ~ '/' ~ __hub_pub_item.collection
            ~ '/versions/' ~ bootstrap_controller_hub_pub_version ~ '/'
          }}
        bootstrap_controller_hub_pub_pulp_cv_url: >-
          {{
            bootstrap_controller_hub_pub_api_host.rstrip('/')
            ~ '/api/galaxy/pulp/api/v3/content/ansible/collection_versions/'
            ~ '?namespace=' ~ __hub_pub_item.namespace
            ~ '&name=' ~ __hub_pub_item.collection
            ~ '&version=' ~ bootstrap_controller_hub_pub_version
          }}

    - name: Publish preflight collection | Check validated for existing version
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_validated_version_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 404]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_existing

    - name: Publish preflight collection | Decide whether to publish
      ansible.builtin.set_fact:
        bootstrap_controller_hub_pub_should_publish: >-
          {{
            __hub_pub_force | bool
            or (bootstrap_controller_hub_pub_existing.status | default(404) | int) == 404
          }}

    - name: Publish preflight collection | Skip existing version
      ansible.builtin.debug:
        msg: >-
          Skipping {{ __hub_pub_item.name }} {{ bootstrap_controller_hub_pub_version }} — already
          in {{ bootstrap_controller_hub_publish_repository | default('validated') }}.
      when: not (bootstrap_controller_hub_pub_should_publish | bool)

    - name: Publish preflight collection | Ensure Hub namespace exists
      ansible.hub.ah_namespace:
        name: "{{ __hub_pub_item.namespace }}"
        state: present
        ah_host: "{{ bootstrap_controller_hub_pub_api_host }}"
        ah_username: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_username
              | default(vault_controller_username | default(omit))
            )
          }}
        ah_password: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_password
              | default(vault_controller_password | default(omit))
            )
          }}
        ah_token: >-
          {{
            omit
            if (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (bootstrap_controller_hub_ah_token | default(omit))
          }}
        validate_certs: "{{ controller_validate_certs | default(false) }}"
      when:
        - bootstrap_controller_hub_pub_should_publish | bool
        - __hub_pub_item.namespace | length > 0

    - name: Publish preflight collection | Check whether pulp already has this version
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_pulp_cv_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_cv_precheck
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Upload to staging (no wait — avoid import poll DNS failures)
      ansible.hub.ah_collection:
        namespace: "{{ __hub_pub_item.namespace }}"
        name: "{{ __hub_pub_item.collection }}"
        version: "{{ bootstrap_controller_hub_pub_version }}"
        path: "{{ bootstrap_controller_hub_pub_tarball }}"
        repository: "{{ bootstrap_controller_hub_staging_repository | default('staging') }}"
        auto_approve: false
        overwrite_existing: false
        wait: false
        timeout: "{{ bootstrap_controller_hub_publish_timeout | default(900) | int }}"
        request_timeout: "{{ bootstrap_controller_hub_publish_request_timeout | default(120) | int }}"
        ah_host: "{{ bootstrap_controller_hub_pub_api_host }}"
        ah_username: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_username
              | default(vault_controller_username | default(omit))
            )
          }}
        ah_password: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_password
              | default(vault_controller_password | default(omit))
            )
          }}
        ah_token: >-
          {{
            omit
            if (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (bootstrap_controller_hub_ah_token | default(omit))
          }}
        validate_certs: "{{ controller_validate_certs | default(false) }}"
      register: bootstrap_controller_hub_pub_upload
      retries: 3
      delay: 10
      until: bootstrap_controller_hub_pub_upload is succeeded
      when:
        - bootstrap_controller_hub_pub_should_publish | bool
        - (bootstrap_controller_hub_pub_cv_precheck.json.count | default(0) | int) == 0
          or (__hub_pub_force | bool)

    - name: Publish preflight collection | Resolve pulp href for collection version
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_pulp_cv_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_cv_lookup
      until: (bootstrap_controller_hub_pub_cv_lookup.json.count | default(0) | int) >= 1
      retries: "{{ bootstrap_controller_hub_pub_verify_retries | default(bootstrap_controller_hub_publish_verify_retries | default(60)) | int }}"
      delay: "{{ bootstrap_controller_hub_pub_verify_delay | default(bootstrap_controller_hub_publish_verify_delay | default(10)) | int }}"
      when: bootstrap_controller_hub_pub_should_publish | bool

    # wait:false upload can register pulp content before the version is in the
    # staging repository. Moving too early returns Hub HTTP 500 with empty HTML.
    - name: Publish preflight collection | Wait until version is visible in staging
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_staging_version_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 404]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_staging_ready
      until: (bootstrap_controller_hub_pub_staging_ready.status | default(0) | int) == 200
      retries: "{{ bootstrap_controller_hub_pub_verify_retries | default(bootstrap_controller_hub_publish_verify_retries | default(60)) | int }}"
      delay: "{{ bootstrap_controller_hub_pub_verify_delay | default(bootstrap_controller_hub_publish_verify_delay | default(10)) | int }}"
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Promote from staging to validated via pulp
      vars:
        bootstrap_controller_hub_pub_pulp_move_url: >-
          {{
            bootstrap_controller_hub_pub_api_host.rstrip('/')
            ~ bootstrap_controller_hub_preflight_staging_repo.json.results[0].pulp_href
            ~ 'move_collection_version/'
          }}
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_pulp_move_url }}"
        method: POST
        body_format: json
        body:
          collection_versions:
            - "{{ bootstrap_controller_hub_pub_cv_lookup.json.results[0].pulp_href }}"
          destination_repositories:
            - "{{ bootstrap_controller_hub_preflight_validated_repo.json.results[0].pulp_href }}"
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 202, 400, 409, 500]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_promote_attempt
      until: (bootstrap_controller_hub_pub_promote_attempt.status | default(0) | int) in [200, 202]
      retries: 6
      delay: 10
      failed_when: false
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Copy to validated when move keep failing (Hub 500 workaround)
      vars:
        bootstrap_controller_hub_pub_pulp_copy_url: >-
          {{
            bootstrap_controller_hub_pub_api_host.rstrip('/')
            ~ bootstrap_controller_hub_preflight_staging_repo.json.results[0].pulp_href
            ~ 'copy_collection_version/'
          }}
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_pulp_copy_url }}"
        method: POST
        body_format: json
        body:
          collection_versions:
            - "{{ bootstrap_controller_hub_pub_cv_lookup.json.results[0].pulp_href }}"
          destination_repositories:
            - "{{ bootstrap_controller_hub_preflight_validated_repo.json.results[0].pulp_href }}"
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 202, 400, 409, 500]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_copy_attempt
      until: (bootstrap_controller_hub_pub_copy_attempt.status | default(0) | int) in [200, 202]
      retries: 4
      delay: 10
      failed_when: false
      when:
        - bootstrap_controller_hub_pub_should_publish | bool
        - (bootstrap_controller_hub_pub_promote_attempt.status | default(0) | int) not in [200, 202]

    - name: Publish preflight collection | Resolve pulp task href from move or copy
      ansible.builtin.set_fact:
        bootstrap_controller_hub_pub_async_task: >-
          {{
            bootstrap_controller_hub_pub_promote_attempt.json.task
            if (
              (bootstrap_controller_hub_pub_promote_attempt.status | default(0) | int) in [200, 202]
              and (bootstrap_controller_hub_pub_promote_attempt.json.task is defined)
            )
            else (
              bootstrap_controller_hub_pub_copy_attempt.json.task
              if (
                (bootstrap_controller_hub_pub_copy_attempt is defined)
                and (bootstrap_controller_hub_pub_copy_attempt.status | default(0) | int) in [200, 202]
                and (bootstrap_controller_hub_pub_copy_attempt.json.task is defined)
              )
              else ''
            )
          }}
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Wait for pulp promote/copy task
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_api_host.rstrip('/') }}{{ bootstrap_controller_hub_pub_async_task }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      when:
        - bootstrap_controller_hub_pub_should_publish | bool
        - (bootstrap_controller_hub_pub_async_task | default('') | length) > 0
      register: bootstrap_controller_hub_pub_promote_task
      until: (bootstrap_controller_hub_pub_promote_task.json.state | default('')) in ['completed', 'failed']
      retries: "{{ bootstrap_controller_hub_pub_verify_retries | default(bootstrap_controller_hub_publish_verify_retries | default(60)) | int }}"
      delay: "{{ bootstrap_controller_hub_pub_verify_delay | default(bootstrap_controller_hub_publish_verify_delay | default(10)) | int }}"
      failed_when: (bootstrap_controller_hub_pub_promote_task.json.state | default('')) == 'failed'

    - name: Publish preflight collection | Re-check validated after promote/copy
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_validated_version_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 404]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_promote_fallback
      until: (bootstrap_controller_hub_pub_promote_fallback.status | default(0) | int) == 200
      retries: 12
      delay: 5
      failed_when: false
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Fail when promote failed and version still missing
      ansible.builtin.fail:
        msg: >-
          Hub promote failed for {{ __hub_pub_item.name }} {{ bootstrap_controller_hub_pub_version }}
          (move HTTP {{ bootstrap_controller_hub_pub_promote_attempt.status | default('?') }},
          copy HTTP {{ bootstrap_controller_hub_pub_copy_attempt.status | default('n/a') }})
          and version is not in validated. Unselect this collection in Hub → Collections
          dropdown and retry, or approve it manually in Hub UI.
          move_body={{ bootstrap_controller_hub_pub_promote_attempt.content | default('') }}
      when:
        - bootstrap_controller_hub_pub_should_publish | bool
        - (bootstrap_controller_hub_pub_promote_fallback.status | default(404) | int) != 200

    - name: Publish preflight collection | Verify collection is in validated Hub repository
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_pub_validated_version_url }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_pub_uri_headers }}"
        user: "{{ bootstrap_controller_hub_pub_uri_user }}"
        password: "{{ bootstrap_controller_hub_pub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_pub_uri_force_basic }}"
      register: bootstrap_controller_hub_pub_verify
      until: (bootstrap_controller_hub_pub_verify.status | default(0) | int) == 200
      retries: "{{ bootstrap_controller_hub_pub_verify_retries | default(bootstrap_controller_hub_publish_verify_retries | default(60)) | int }}"
      delay: "{{ bootstrap_controller_hub_pub_verify_delay | default(bootstrap_controller_hub_publish_verify_delay | default(10)) | int }}"
      when: bootstrap_controller_hub_pub_should_publish | bool

    - name: Publish preflight collection | Confirm publish landed in validated
      ansible.builtin.debug:
        msg: >-
          Published {{ __hub_pub_item.name }} {{ bootstrap_controller_hub_pub_version }} to Hub
          repository '{{ bootstrap_controller_hub_publish_repository | default('validated') }}'.
      when: bootstrap_controller_hub_pub_should_publish | bool
