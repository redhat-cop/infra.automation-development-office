- name: AAP configs | Merge RHEL system roles JT catalog
  ansible.builtin.include_tasks: load_rhel_system_roles_jt_catalog.yml

- name: AAP configs | Build selected job template file list
  ansible.builtin.set_fact:
    bootstrap_controller_job_template_files_selected: >-
      {{
        bootstrap_controller_job_template_component_map
        | dict2items
        | selectattr('key', 'in', bootstrap_controller_effective_components)
        | map(attribute='value')
        | flatten
        | unique
        | list
      }}

- name: AAP configs | Skip Install AAP JT when bootstrap installs AAP
  ansible.builtin.set_fact:
    bootstrap_controller_job_template_files_selected: >-
      {{
        bootstrap_controller_job_template_files_selected
        | reject('equalto', 'ado-aap-ocp-install-bootstrap.jt.yml')
        | list
      }}
  when: bootstrap_controller_aap_install_during_bootstrap | default(false) | bool

- name: AAP configs | Skip default ingress JT unless update_default_ingress is enabled
  ansible.builtin.set_fact:
    bootstrap_controller_job_template_files_selected: >-
      {{
        bootstrap_controller_job_template_files_selected
        | reject('equalto', 'ado-openshift-update-default-ingress-cert-bootstrap.jt.yml')
        | list
      }}
  when: not (bootstrap_controller_update_default_ingress | default(false) | bool)

# yamllint disable rule:line-length
- name: AAP configs | Copy job templates for generated playbooks only
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    from pathlib import Path
    import json
    import yaml

    src_dir = Path("{{ role_path }}/files/job_templates")
    dest_dir = Path("{{ playbook_dir }}/configs/job_templates")
    dest_dir.mkdir(parents=True, exist_ok=True)
    force_overwrite = {{
      bootstrap_controller_jt_wf_force
      | default(false)
      | bool
      | ternary('True', 'False')
    }}

    organization = "{{ bootstrap_controller_organization | default(controller_bootstrap_organization, true) }}"
    inventory = "{{ bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true) }}"
    local_inventory = "{{ bootstrap_controller_local_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    rhel_inventory = "{{ bootstrap_controller_rhel_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    idm_inventory = "{{ bootstrap_controller_idm_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    satellite_inventory = "{{ bootstrap_controller_satellite_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    project = "{{ bootstrap_controller_project_name | default(controller_bootstrap_project_name, true) }}"
    execution_environment = "{{ bootstrap_controller_execution_environment_name | default(controller_bootstrap_execution_environment_name, true) }}"
    credential = "{{ bootstrap_controller_creds | default(controller_bootstrap_creds, true) }}"
    machine_credential = "{{ bootstrap_controller_machine_credential | default(controller_bootstrap_machine_credential | default(bootstrap_controller_organization ~ '-machine', true), true) }}"
    state_choices_yaml = "present\nabsent"
    console_banner_state_choices_yaml = "add\nupdate\ndelete"
    default_state = "{{ bootstrap_controller_default_state | default('present', true) }}"
    environment_choices = {{ (
        bootstrap_controller_environment_choices
        | default(controller_bootstrap_environment_choices
        | default([env | default('prod')]))
        + [env | default('prod')]
      ) | unique | list | to_json }}
    environment_choices_yaml = "\n".join(environment_choices)
    default_environment = "{{ env | default(bootstrap_controller_default_environment | default(controller_bootstrap_default_environment | default('prod')), true) }}"
    govcloud_instance_types = {{
      bootstrap_controller_aws_govcloud_instance_type_choices | default([]) | to_json
    }}
    govcloud_regions = {{
      bootstrap_controller_aws_govcloud_region_choices
      | default(['us-gov-west-1', 'us-gov-east-1']) | to_json
    }}
    ec2_state_choices = {{
      bootstrap_controller_ec2_instance_state_choices
      | default(['present', 'running', 'stopped', 'terminated']) | to_json
    }}
    govcloud_default_instance_type = {{
      bootstrap_controller_aws_govcloud_default_instance_type
      | default('m5.large') | to_json
    }}
    govcloud_default_region = {{
      bootstrap_controller_aws_govcloud_default_region
      | default('us-gov-west-1') | to_json
    }}
    ec2_default_state = {{
      bootstrap_controller_ec2_instance_default_state | default('present') | to_json
    }}

    selected = {{ bootstrap_controller_job_template_files_selected | default([]) | to_json }}
    if not selected:
        selected = [p.name for p in sorted(src_dir.glob("*.jt.yml"))]

    env_name = "{{ env | default('prod', true) }}"
    virt_vars_path = Path("{{ playbook_dir }}") / "group_vars" / "all" / env_name / "vars_openshift_virt.yml"
    virt_vars = {}
    if virt_vars_path.exists():
        loaded = yaml.safe_load(virt_vars_path.read_text()) or {}
        if isinstance(loaded, dict):
            virt_vars = loaded
    network_defaults = virt_vars.get("openshift_virt_network_defaults") or {}
    if not isinstance(network_defaults, dict):
        network_defaults = {}

    def virt_default(key, fallback=""):
        value = virt_vars.get(f"provision_openshift_virt_{key}", network_defaults.get(key, fallback))
        if value is None:
            return fallback
        if isinstance(value, list):
            return ",".join(str(item).strip() for item in value if str(item).strip())
        return str(value)

    # Static IP is launch-time only; preflight seeds gateway/DNS/prefix and an optional range hint.
    virt_static_ip = ""
    try:
        virt_prefix_length = int(virt_default("prefix_length", "24") or 24)
    except (TypeError, ValueError):
        virt_prefix_length = 24
    virt_gateway = virt_default("gateway", "")
    virt_dns_servers = virt_default("dns_servers", "")
    virt_ip_range = str(
        network_defaults.get("ip_range")
        or virt_vars.get("openshift_virt_ip_range")
        or virt_vars.get("provision_openshift_virt_ip_range")
        or ""
    ).strip()
    if virt_ip_range:
        virt_static_ip_help = (
            f"Optional static IP for the guest. Suggested range: {virt_ip_range}"
        )
    else:
        virt_static_ip_help = "Optional static IP for the guest"

    lb = "{" * 2
    rb = "}" * 2

    replacements = {
        f"{lb} bootstrap_controller_organization {rb}": organization,
        f"{lb} controller_bootstrap_organization {rb}": organization,
        f"{lb} bootstrap_controller_inventory_name {rb}": inventory,
        f"{lb} controller_bootstrap_inventory_name {rb}": inventory,
        f"{lb} bootstrap_controller_local_inventory_name {rb}": local_inventory,
        f"{lb} controller_bootstrap_local_inventory_name {rb}": local_inventory,
        f"{lb} bootstrap_controller_rhel_inventory_name {rb}": rhel_inventory,
        f"{lb} controller_bootstrap_rhel_inventory_name {rb}": rhel_inventory,
        f"{lb} bootstrap_controller_idm_inventory_name {rb}": idm_inventory,
        f"{lb} controller_bootstrap_idm_inventory_name {rb}": idm_inventory,
        f"{lb} bootstrap_controller_satellite_inventory_name {rb}": satellite_inventory,
        f"{lb} controller_bootstrap_satellite_inventory_name {rb}": satellite_inventory,
        f"{lb} bootstrap_controller_project_name {rb}": project,
        f"{lb} controller_bootstrap_project_name {rb}": project,
        f"{lb} bootstrap_controller_execution_environment_name {rb}": execution_environment,
        f"{lb} controller_bootstrap_execution_environment_name {rb}": execution_environment,
        f"{lb} bootstrap_controller_creds {rb}": credential,
        f"{lb} controller_bootstrap_creds {rb}": credential,
        f"{lb} bootstrap_controller_machine_credential {rb}": machine_credential,
        f"{lb} controller_bootstrap_machine_credential {rb}": machine_credential,
        f"{lb} bootstrap_controller_state_choices {rb}": state_choices_yaml,
        f"{lb} controller_bootstrap_state_choices {rb}": state_choices_yaml,
        f"{lb} bootstrap_controller_console_banner_state_choices {rb}": console_banner_state_choices_yaml,
        f"{lb} controller_bootstrap_console_banner_state_choices {rb}": console_banner_state_choices_yaml,
        f"{lb} bootstrap_controller_default_state {rb}": default_state,
        f"{lb} controller_bootstrap_default_state {rb}": default_state,
        f"{lb} bootstrap_controller_environment_choices {rb}": environment_choices_yaml,
        f"{lb} controller_bootstrap_environment_choices {rb}": environment_choices_yaml,
        f"{lb} bootstrap_controller_default_environment {rb}": default_environment,
        f"{lb} controller_bootstrap_default_environment {rb}": default_environment,
        f"{lb} bootstrap_controller_openshift_virt_static_ip {rb}": virt_static_ip,
        f"{lb} bootstrap_controller_openshift_virt_prefix_length {rb}": str(virt_prefix_length),
        f"{lb} bootstrap_controller_openshift_virt_gateway {rb}": virt_gateway,
        f"{lb} bootstrap_controller_openshift_virt_dns_servers {rb}": virt_dns_servers,
        f"{lb} bootstrap_controller_openshift_virt_static_ip_help {rb}": virt_static_ip_help,
        f"{lb} bootstrap_controller_openshift_virt_ip_range {rb}": virt_ip_range,
    }

    quoted_replacements = {}
    for old, new in replacements.items():
        quoted_replacements["'" + old + "'"] = new
        quoted_replacements['"' + old + '"'] = new
    replacements.update(quoted_replacements)

    # Survey text defaults must stay YAML strings; integer defaults must be bare numbers.
    # Prefer quoted-placeholder keys (longer) so we do not leave surrounding quotes behind.
    for key, value in (
        (f"{lb} bootstrap_controller_openshift_virt_static_ip {rb}", virt_static_ip),
        (f"{lb} bootstrap_controller_openshift_virt_gateway {rb}", virt_gateway),
        (f"{lb} bootstrap_controller_openshift_virt_dns_servers {rb}", virt_dns_servers),
        (f"{lb} bootstrap_controller_openshift_virt_static_ip_help {rb}", virt_static_ip_help),
        (f"{lb} bootstrap_controller_openshift_virt_ip_range {rb}", virt_ip_range),
    ):
        quoted = json.dumps("" if value is None else str(value))
        replacements["'" + key + "'"] = quoted
        replacements['"' + key + '"'] = quoted
    prefix_key = f"{lb} bootstrap_controller_openshift_virt_prefix_length {rb}"
    replacements["'" + prefix_key + "'"] = str(virt_prefix_length)
    replacements['"' + prefix_key + '"'] = str(virt_prefix_length)

    replacements[f"{lb} bootstrap_controller_state_choices {rb}"] = state_choices_yaml
    replacements[f"{lb} controller_bootstrap_state_choices {rb}"] = state_choices_yaml
    replacements[f"'{lb} bootstrap_controller_state_choices {rb}'"] = f'"{state_choices_yaml}"'
    replacements[f"'{lb} controller_bootstrap_state_choices {rb}'"] = f'"{state_choices_yaml}"'

    replacements[f"{lb} bootstrap_controller_console_banner_state_choices {rb}"] = console_banner_state_choices_yaml
    replacements[f"{lb} controller_bootstrap_console_banner_state_choices {rb}"] = console_banner_state_choices_yaml
    replacements[f"'{lb} bootstrap_controller_console_banner_state_choices {rb}'"] = f'"{console_banner_state_choices_yaml}"'
    replacements[f"'{lb} controller_bootstrap_console_banner_state_choices {rb}'"] = f'"{console_banner_state_choices_yaml}"'

    replacements[f"{lb} bootstrap_controller_default_state {rb}"] = default_state
    replacements[f"{lb} controller_bootstrap_default_state {rb}"] = default_state
    replacements[f"'{lb} bootstrap_controller_default_state {rb}'"] = default_state
    replacements[f"'{lb} controller_bootstrap_default_state {rb}'"] = default_state

    replacements[f"{lb} bootstrap_controller_environment_choices {rb}"] = environment_choices_yaml
    replacements[f"{lb} controller_bootstrap_environment_choices {rb}"] = environment_choices_yaml
    replacements[f"'{lb} bootstrap_controller_environment_choices {rb}'"] = f'"{environment_choices_yaml}"'
    replacements[f"'{lb} controller_bootstrap_environment_choices {rb}'"] = f'"{environment_choices_yaml}"'

    replacements[f"{lb} bootstrap_controller_default_environment {rb}"] = default_environment
    replacements[f"{lb} controller_bootstrap_default_environment {rb}"] = default_environment
    replacements[f"'{lb} bootstrap_controller_default_environment {rb}'"] = default_environment
    replacements[f"'{lb} controller_bootstrap_default_environment {rb}'"] = default_environment

    copied = []
    playbook_dir = Path("{{ playbook_dir }}")
    for name in selected:
        src = src_dir / name
        if not src.exists():
            continue

        text = src.read_text()

        for old, new in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
            if old:
                text = text.replace(old, new)

        if machine_credential:
            text = text.replace(
                "      # ADO_MACHINE_CREDENTIAL",
                f"      - '{machine_credential}'",
            )
        else:
            text = text.replace("      # ADO_MACHINE_CREDENTIAL\n", "")

        text = text.replace("- name: bootstrap", f"- name: {organization}")
        text = text.replace("ADO |", f"{organization} |")
        text = text.replace(f"{organization} | ADO ", f"{organization} | ")

        dest_path = dest_dir / name
        if not force_overwrite and dest_path.exists():
            continue

        data = yaml.safe_load(text)
        templates = data.get("controller_templates", []) or []
        missing_playbooks = []
        for template in templates:
            playbook = template.get("playbook")
            if not playbook:
                continue
            if not (playbook_dir / playbook).exists():
                missing_playbooks.append(playbook)
        if missing_playbooks:
            print(
                f"Skipping {name}: playbook(s) not generated: "
                + ", ".join(missing_playbooks)
            )
            continue

        def normalize_survey_choices(question):
            choices = question.get("choices")
            if choices is None:
                return

            if isinstance(choices, list):
                question["choices"] = "\n".join(str(choice) for choice in choices)
                return

            if not isinstance(choices, str):
                return

            collapsed = " ".join(choices.split())
            variable = question.get("variable")
            if variable == "state" and collapsed == "present absent":
                question["choices"] = state_choices_yaml
            elif variable == "state" and collapsed == "add update delete":
                question["choices"] = console_banner_state_choices_yaml
            elif variable == "env" and collapsed == " ".join(environment_choices):
                question["choices"] = environment_choices_yaml
            elif variable == "ec2_instance_instance_type":
                question["choices"] = "\n".join(
                    str(choice) for choice in govcloud_instance_types
                )
                question["default"] = govcloud_default_instance_type
            elif variable == "ec2_instance_region":
                question["choices"] = "\n".join(
                    str(choice) for choice in govcloud_regions
                )
                question["default"] = govcloud_default_region
            elif variable == "ec2_instance_state":
                question["choices"] = "\n".join(
                    str(choice) for choice in ec2_state_choices
                )
                question["default"] = ec2_default_state

        for template in data.get("controller_templates", []) or []:
            survey_spec = template.get("survey_spec", {}) or {}
            for question in survey_spec.get("spec", []) or []:
                normalize_survey_choices(question)
        text = yaml.safe_dump(data, sort_keys=False)

        dest_path.write_text(text)
        copied.append(name)

    selected_set = set(selected)
    if force_overwrite:
        for existing in dest_dir.glob("*.jt.yml"):
            if existing.name not in selected_set:
                existing.unlink()

    print("Copied job templates:", len(copied))
    PYCODE
