- name: AAP configs | Apply generated values to workflow templates
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    from pathlib import Path
    import yaml

    workflow_dir = Path("{{ playbook_dir }}/configs/workflows")
    organization = "{{ bootstrap_controller_organization | default(controller_bootstrap_organization, true) }}"
    inventory = "{{ bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true) }}"
    rhel_inventory = "{{ bootstrap_controller_rhel_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    idm_inventory = "{{ bootstrap_controller_idm_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    satellite_inventory = "{{ bootstrap_controller_satellite_inventory_name | default(bootstrap_controller_inventory_name | default(controller_bootstrap_inventory_name, true), true) }}"
    environment_choices = {{ (
        bootstrap_controller_environment_choices
        | default(controller_bootstrap_environment_choices
        | default([env | default('prod')]))
        + [env | default('prod')]
      ) | unique | list | to_json }}
    default_environment = "{{ env | default(bootstrap_controller_default_environment | default(controller_bootstrap_default_environment | default('prod')), true) }}"
    govcloud_instance_types = {{
      bootstrap_controller_aws_govcloud_instance_type_choices | default([]) | to_json
    }}
    govcloud_regions = {{
      bootstrap_controller_aws_govcloud_region_choices
      | default(['us-gov-west-1', 'us-gov-east-1']) | to_json
    }}
    ec2_state_choices = {{
      bootstrap_controller_ec2_instance_state_choices
      | default(['present', 'running', 'stopped', 'terminated']) | to_json
    }}
    govcloud_default_instance_type = {{
      bootstrap_controller_aws_govcloud_default_instance_type
      | default('m5.large') | to_json
    }}
    govcloud_default_region = {{
      bootstrap_controller_aws_govcloud_default_region
      | default('us-gov-west-1') | to_json
    }}
    ec2_default_state = {{
      bootstrap_controller_ec2_instance_default_state | default('present') | to_json
    }}

    lb = "{" * 2
    rb = "}" * 2
    replacements = {
        f"{lb} bootstrap_controller_organization {rb}": organization,
        f"{lb} controller_bootstrap_organization {rb}": organization,
        f"{lb} bootstrap_controller_inventory_name {rb}": inventory,
        f"{lb} controller_bootstrap_inventory_name {rb}": inventory,
        f"{lb} bootstrap_controller_rhel_inventory_name {rb}": rhel_inventory,
        f"{lb} controller_bootstrap_rhel_inventory_name {rb}": rhel_inventory,
        f"{lb} bootstrap_controller_idm_inventory_name {rb}": idm_inventory,
        f"{lb} controller_bootstrap_idm_inventory_name {rb}": idm_inventory,
        f"{lb} bootstrap_controller_satellite_inventory_name {rb}": satellite_inventory,
        f"{lb} controller_bootstrap_satellite_inventory_name {rb}": satellite_inventory,
    }

    def normalize_survey_choices(question):
        variable = question.get("variable")
        choices = question.get("choices")
        if isinstance(choices, list):
            question["choices"] = "\n".join(str(choice) for choice in choices)
        if variable == "env":
            question["choices"] = "\n".join(str(choice) for choice in environment_choices)
            question["default"] = default_environment
        elif variable == "ec2_instance_instance_type":
            question["choices"] = "\n".join(
                str(choice) for choice in govcloud_instance_types
            )
            question["default"] = govcloud_default_instance_type
        elif variable == "ec2_instance_region":
            question["choices"] = "\n".join(
                str(choice) for choice in govcloud_regions
            )
            question["default"] = govcloud_default_region
        elif variable == "ec2_instance_state":
            question["choices"] = "\n".join(
                str(choice) for choice in ec2_state_choices
            )
            question["default"] = ec2_default_state

    changed = 0
    for path in sorted(workflow_dir.glob("*.wf.yml")):
        text = path.read_text()
        updated = text
        for old, new in replacements.items():
            updated = updated.replace(old, new)
        data = yaml.safe_load(updated) or {}
        survey_changed = False
        for workflow in data.get("controller_workflow_job_templates", []) or []:
            survey_spec = workflow.get("survey_spec", {}) or {}
            for question in survey_spec.get("spec", []) or []:
                before = dict(question)
                normalize_survey_choices(question)
                if question != before:
                    survey_changed = True
        if survey_changed:
            updated = yaml.safe_dump(data, sort_keys=False)
        if updated != text:
            path.write_text(updated)
            changed += 1

    print("Rendered workflow templates:", changed)
    PYCODE
  args:
    executable: /bin/bash
  changed_when: true

- name: AAP configs | Prune workflow nodes without generated job templates
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    from pathlib import Path
    import yaml

    playbook_dir = Path("{{ playbook_dir }}")
    workflow_dir = playbook_dir / "configs" / "workflows"
    job_template_dir = playbook_dir / "configs" / "job_templates"
    cert_manager_mode = "{{ bootstrap_controller_cert_manager_mode | default('cert', true) }}"

    available_templates = set()
    for path in sorted(job_template_dir.glob("*.jt.yml")):
        data = yaml.safe_load(path.read_text()) or {}
        for item in data.get("controller_templates", []) or []:
            name = item.get("name")
            if name:
                available_templates.add(name)

    for path in sorted(workflow_dir.glob("*.wf.yml")):
        data = yaml.safe_load(path.read_text()) or {}
        for item in data.get("controller_workflow_job_templates", []) or []:
            name = item.get("name")
            if name:
                available_templates.add(name)

    grafana_chain = [
        "Deploy Grafana",
        "Install Grafana Standalone",
        "Deploy Grafana OIDC",
        "Deploy Grafana Email",
        "Deploy Grafana Datasource",
        "Deploy Grafana Folders",
        "Deploy Grafana Dashboards",
        "Deploy Grafana Alerts",
        "Deploy Grafana Alternate Route",
    ]

    alt_routes_chain = [
        "Print Alternate Routes",
        "Add Alternate Routes",
        "Add Ingress with Route",
    ]

    quay_chain = ["Deploy Quay", "Deploy Quay OIDC"]
    minio_chain = ["Deploy MinIO", "Deploy MinIO OIDC"]
    dev_hub_chain = ["Deploy Dev Hub", "Deploy Dev Hub OIDC"]
    bookstack_chain = ["Deploy BookStack", "Deploy BookStack OIDC"]
    zabbix_chain = ["Deploy Zabbix", "Configure Zabbix SAML"]
    netbox_chain = ["Configure NetBox OIDC"]

    def chain_linear_nodes(kept_by_id, ordered_ids):
        present = [node_id for node_id in ordered_ids if node_id in kept_by_id]
        for index, node_id in enumerate(present):
            node = kept_by_id[node_id]
            if index + 1 < len(present):
                node["success_nodes"] = [present[index + 1]]
            else:
                node.pop("success_nodes", None)

    edge_keys = ("success_nodes", "failure_nodes", "always_nodes")
    changed = 0
    for path in sorted(workflow_dir.glob("*.wf.yml")):
        data = yaml.safe_load(path.read_text()) or {}
        workflows = data.get("controller_workflow_job_templates", []) or []
        keep_file = False

        for workflow in workflows:
            nodes = workflow.get("simplified_workflow_nodes", []) or []
            kept_nodes = [
                node for node in nodes
                if node.get("unified_job_template") in available_templates
            ]
            if cert_manager_mode == "cert":
                kept_nodes = [
                    node for node in kept_nodes
                    if node.get("identifier") not in (
                        "Configure IDM ACME ClusterIssuer",
                        "Deploy AWSPCA Cert Manager",
                    )
                ]
            elif cert_manager_mode == "idm_acme":
                kept_nodes = [
                    node for node in kept_nodes
                    if node.get("identifier") != "Deploy AWSPCA Cert Manager"
                ]
            elif cert_manager_mode == "aws_pca":
                kept_nodes = [
                    node for node in kept_nodes
                    if node.get("identifier") != "Configure IDM ACME ClusterIssuer"
                ]
            kept_ids = {node.get("identifier") for node in kept_nodes}
            kept_by_id = {node.get("identifier"): node for node in kept_nodes}

            # After ACME/PCA prune, Ensure Deploy cert-manager still gates RHBK.
            # Default Ingress alone must not unlock RHBK when cert-manager is selected.
            cert_node = kept_by_id.get("Deploy cert-manager")
            rhbk_workflow_id = "RHBK Workflow"
            legacy_rhbk_id = "Deploy RHBK"
            rhbk_target = (
                rhbk_workflow_id
                if rhbk_workflow_id in kept_ids
                else legacy_rhbk_id
            )
            if cert_node is not None and rhbk_target in kept_ids:
                edges = list(cert_node.get("success_nodes") or [])
                edges = [
                    item for item in edges
                    if item not in (legacy_rhbk_id, rhbk_workflow_id)
                ]
                if rhbk_target not in edges:
                    edges.append(rhbk_target)
                    cert_node["success_nodes"] = edges

            platform_ids = {
                "Grafana Workflow",
                "Quay Workflow",
                "MinIO Workflow",
                "Dev Hub Workflow",
                "BookStack Workflow",
                "NetBox Workflow",
                "Zabbix Workflow",
                "Deploy GitLab",
                "Deploy Kafka",
                "Deploy ECK",
                "Deploy Quay",
                "Deploy DevSpaces",
                "Deploy Dev Hub",
                "Deploy Zabbix",
                "Deploy ACS",
                "Install AAP on OpenShift",
                "Deploy 389ds",
                "Deploy GitOps",
                "Deploy OADP",
                "Deploy Pega",
                "Deploy OpenShift Descheduler",
            }
            oauth_id = "Configure OAuth/RHBK in OpenShift"
            client_id = "Deploy RHBK Client"
            rhbk_id = rhbk_workflow_id if rhbk_workflow_id in kept_ids else legacy_rhbk_id
            ingress_id = "Update Default Ingress Certificate"
            cert_id = "Deploy cert-manager"

            # If OIDC JT was pruned, hang platform apps off RHBK Workflow (or legacy RHBK chain).
            if oauth_id not in kept_ids:
                parent = (
                    kept_by_id.get(rhbk_workflow_id)
                    or kept_by_id.get(client_id)
                    or kept_by_id.get(legacy_rhbk_id)
                    or kept_by_id.get(ingress_id)
                    or kept_by_id.get(cert_id)
                )
                if parent is not None:
                    edges = list(parent.get("success_nodes") or [])
                    for app_id in sorted(platform_ids):
                        if app_id in kept_ids and app_id not in edges:
                            edges.append(app_id)
                    if edges:
                        parent["success_nodes"] = edges

            mapper_id = "RHBK LDAP Group Mapper"
            if mapper_id not in kept_ids and client_id in kept_ids:
                for parent_id in (
                    "Deploy RHBK Realm",
                    "RHBK 389ds Federation",
                    "RHBK EntraID",
                ):
                    parent = kept_by_id.get(parent_id)
                    if parent is None:
                        continue
                    edges = [
                        item for item in (parent.get("success_nodes") or [])
                        if item != mapper_id
                    ]
                    if client_id not in edges:
                        edges.append(client_id)
                    parent["success_nodes"] = edges

            chain_linear_nodes(kept_by_id, grafana_chain)
            chain_linear_nodes(kept_by_id, alt_routes_chain)
            chain_linear_nodes(kept_by_id, quay_chain)
            chain_linear_nodes(kept_by_id, minio_chain)
            chain_linear_nodes(kept_by_id, dev_hub_chain)
            chain_linear_nodes(kept_by_id, bookstack_chain)
            chain_linear_nodes(kept_by_id, zabbix_chain)
            chain_linear_nodes(kept_by_id, netbox_chain)

            for node in kept_nodes:
                for edge_key in edge_keys:
                    if edge_key in node:
                        node[edge_key] = [
                            item for item in (node.get(edge_key) or [])
                            if item in kept_ids
                        ]
                        if not node[edge_key]:
                            node.pop(edge_key, None)

            workflow["simplified_workflow_nodes"] = kept_nodes
            if kept_nodes:
                keep_file = True

        if not keep_file:
            path.unlink()
            changed += 1
            continue

        updated = "---\n" + yaml.safe_dump(data, sort_keys=False, width=1000)
        if updated != path.read_text():
            path.write_text(updated)
            changed += 1

    print("Pruned workflow templates:", changed)
    PYCODE
  args:
    executable: /bin/bash
  changed_when: true
  when: bootstrap_controller_jt_wf_force | bool

- name: AAP configs | Attach organization label to generated templates
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PYCODE'
    from pathlib import Path
    import yaml

    organization = "{{ controller_bootstrap_organization | default(bootstrap_controller_organization) }}"
    root = Path("{{ playbook_dir }}/configs")
    changed = 0

    def label_name(label):
        if isinstance(label, dict):
            return label.get("name")
        return label

    def normalize_labels(item):
        if not isinstance(item, dict):
            return False

        labels = []
        if organization:
            labels.append(organization)

        labels.extend(
            name for name in (label_name(label) for label in item.get("labels") or [])
            if name
        )

        related = item.get("related")
        if isinstance(related, dict):
            labels.extend(
                name for name in (label_name(label) for label in related.get("labels") or [])
                if name
            )
            related.pop("labels", None)
            if not related:
                item.pop("related", None)

        if not labels:
            return False

        normalized = list(dict.fromkeys(labels))
        if item.get("labels") == normalized:
            return False

        item["labels"] = normalized
        return True

    for pattern, key in (
        ("job_templates/*.jt.yml", "controller_templates"),
        ("workflows/*.wf.yml", "controller_workflow_job_templates"),
    ):
        for path in sorted(root.glob(pattern)):
            original = path.read_text()
            data = yaml.safe_load(original) or {}
            file_changed = False

            for item in data.get(key, []) or []:
                file_changed = normalize_labels(item) or file_changed

            if file_changed:
                path.write_text("---\n" + yaml.safe_dump(data, sort_keys=False, width=1000))
                changed += 1

    print("Attached organization labels:", changed)
    PYCODE
  args:
    executable: /bin/bash
  changed_when: true
  when: bootstrap_controller_jt_wf_force | bool
