---
# One job template per include. Ansible 2.15 rejects delay on
# include_role and on include_tasks, so each try pauses in the loop.
- name: AAP 2.5+ | Reset job template retry state
  ansible.builtin.set_fact:
    bootstrap_controller_job_template_ok: false

- name: AAP 2.5+ | Apply one job template until it succeeds
  ansible.builtin.include_tasks: apply_one_controller_job_template.yml
  loop: >-
    {{
      range(
        1,
        (bootstrap_controller_job_template_retries | default(4) | int) + 1
      ) | list
    }}
  loop_control:
    loop_var: bootstrap_controller_job_template_try
  when: not (bootstrap_controller_job_template_ok | default(false) | bool)
