---
# One credential per include. Ansible 2.15 rejects delay on include_role
# and on include_tasks, so each try is a loop iteration with a pause.
- name: AAP 2.5+ | Reset credential retry state
  ansible.builtin.set_fact:
    bootstrap_controller_credential_ok: false

- name: AAP 2.5+ | Apply one credential until it succeeds
  ansible.builtin.include_tasks: apply_one_controller_credential.yml
  loop: >-
    {{
      range(
        1,
        (bootstrap_controller_credential_retries | default(4) | int) + 1
      ) | list
    }}
  loop_control:
    loop_var: bootstrap_controller_credential_try
  when: not (bootstrap_controller_credential_ok | default(false) | bool)
