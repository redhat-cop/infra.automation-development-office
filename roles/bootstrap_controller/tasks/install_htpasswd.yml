---
# yamllint disable rule:line-length
- name: Bootstrap HTPasswd | Assert vault users are present
  ansible.builtin.assert:
    that:
      - htpasswd_users is defined
      - htpasswd_users | length > 0
      - htpasswd_users[0].password | default('') | length > 0
    fail_msg: >-
      admin_htpasswd is selected for bootstrap prep but
      openshift.admin_username / admin_password are empty.

# Copy before include_role. Passing htpasswd_users: "{{ htpasswd_users }}"
# makes ansible-core 2.18 recurse while templating the include params.
# The role still receives the vault list at include-param precedence.
- name: Bootstrap HTPasswd | Capture vault users for ocp_htpasswd_admin
  ansible.builtin.set_fact:
    bootstrap_controller_htpasswd_users: "{{ htpasswd_users }}"
    bootstrap_controller_htpasswd_pass: >-
      {{
        htpasswd_pass
        if htpasswd_pass is defined
        else (htpasswd_users | default([{}]) | first | default({})).password | default('')
      }}
  no_log: true

# environment on include_role breaks older ansible-core; use a block.
- name: Bootstrap HTPasswd | Create admin HTPasswd identity provider
  environment:
    KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ bootstrap_controller_openshift_kubeconfig }}"
  block:
    - name: Bootstrap HTPasswd | Include ocp_htpasswd_admin
      ansible.builtin.include_role:
        name: infra.automation_development_office.ocp_htpasswd_admin
      vars:
        state: present
        name_space: openshift-config
        htpasswd_idp_name: htpasswd-admin
        htpasswd_secret: htpasswd-admin-secret
        htpasswd_users: "{{ bootstrap_controller_htpasswd_users }}"
        htpasswd_pass: "{{ bootstrap_controller_htpasswd_pass }}"
