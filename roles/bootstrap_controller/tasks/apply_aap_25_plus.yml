---
# yamllint disable rule:line-length
# Organizations first using direct module call
# avoids gateway/resource sync issues in infra.aap_configuration 4.6.x

- name: AAP 2.5+ | Reload generated controller configs before direct apply
  ansible.builtin.include_tasks: load_controller_configs.yml

- name: AAP 2.5+ | Normalize controller objects before apply  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    bootstrap_controller_controller_organizations: "{{ controller_bootstrap_controller_organizations | default(bootstrap_controller_controller_organizations | default(controller_organizations | default([]), true), true) }}"
    bootstrap_controller_controller_projects: "{{ controller_bootstrap_controller_projects | default(bootstrap_controller_controller_projects | default(controller_projects | default([]), true), true) }}"
    bootstrap_controller_controller_inventories: "{{ controller_bootstrap_controller_inventories | default(bootstrap_controller_controller_inventories | default(controller_inventories | default([]), true), true) }}"
    bootstrap_controller_controller_inventory_sources: "{{ controller_bootstrap_controller_inventory_sources | default(bootstrap_controller_controller_inventory_sources | default(controller_inventory_sources | default([]), true), true) }}"
    bootstrap_controller_controller_credentials: "{{ controller_bootstrap_controller_credentials | default(bootstrap_controller_controller_credentials | default(controller_credentials | default([]), true), true) }}"
    bootstrap_controller_controller_execution_environments: "{{ controller_bootstrap_controller_execution_environments | default(bootstrap_controller_controller_execution_environments | default(controller_execution_environments | default([]), true), true) }}"

- name: AAP 2.5+ | Debug controller orgs before apply
  ansible.builtin.debug:
    var: bootstrap_controller_controller_organizations

# Hub-only: do NOT create Contoller orgs/inventories before Hub publish.
# Stale configs/controller (esp. with overwrite_generated=false) often still
# list old orgs like DEV and would 401-block publish when Contoller OAuth is
# missing/wrong. Hub publish uses Hub token; org/Galaxy attach runs after.
- name: AAP 2.5+ | Create organizations directly
  ansible.controller.organization:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    # Galaxy/Hub creds attach after credential dispatch — names are not resolvable yet.
    state: "{{ item.state | default('present') }}"
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ bootstrap_controller_controller_organizations | default([]) }}"
  when:
    - bootstrap_controller_controller_organizations | default([]) | length > 0
    - not (bootstrap_controller_hub_update_collection_only | default(false) | bool)

- name: AAP 2.5+ | Ensure General organization exists (missing from configs)
  ansible.controller.organization:
    name: "{{ controller_bootstrap_organization }}"
    description: "{{ controller_bootstrap_organization }}"
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  when:
    - not (bootstrap_controller_hub_update_collection_only | default(false) | bool)
    - controller_bootstrap_organization | default('') | length > 0
    - >-
      controller_bootstrap_organization not in
      (bootstrap_controller_controller_organizations | default([]) | map(attribute='name') | list)

# Inventories direct because infra.aap_configuration 4.6.19 stringifies variables
- name: AAP 2.5+ | Create inventories directly
  ansible.controller.inventory:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ item.organization }}"
    variables: "{{ item.variables | default(omit) }}"
    state: "{{ item.state | default('present') }}"
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  loop: "{{ bootstrap_controller_controller_inventories | default([]) }}"
  when:
    - bootstrap_controller_controller_inventories | default([]) | length > 0
    - not (bootstrap_controller_hub_update_collection_only | default(false) | bool)

- name: AAP 2.5+ | Set AAP Hub collection publish defaults
  ansible.builtin.set_fact:
    bootstrap_controller_hub_publish_repository: "{{ (hub_collections | first).repository | default('validated') }}"
    bootstrap_controller_hub_publish_working_dir: "/var/tmp/ado-hub-publish"
    # ansible.hub Token-scheme auth is resolved later by ensure_hub_namespace.yml
    # (Hub token → Contoller OAuth → admin basic). Keep empty until that probe.
    bootstrap_controller_hub_ah_token: ""
    bootstrap_controller_hub_ah_auth_mode: ""
    bootstrap_controller_hub_ah_use_basic: false
    # Prefer a prebuilt infra-ado-*.tar.gz (exact bytes from preflight collections)
    # over rebuilding /workspace/ado-source. Look in workspace + /opt/ado-collections
    # (preflight container install path).
    bootstrap_controller_hub_tarball_src: >-
      {{
        (
          (
            lookup('ansible.builtin.fileglob', '/workspace/infra-ado-*.tar.gz', wantlist=True)
            + lookup('ansible.builtin.fileglob', '/opt/ado-collections/infra-ado-*.tar.gz', wantlist=True)
          )
          | unique
          | sort
          | last
          | default(
              (hub_collections | first).collection_tarball_path
              | default(bootstrap_controller_hub_ado_collection_tarball | default(''), true),
              true
            )
        )
      }}
    bootstrap_controller_hub_use_tarball: >-
      {{
        (
          (
            lookup('ansible.builtin.fileglob', '/workspace/infra-ado-*.tar.gz', wantlist=True)
            + lookup('ansible.builtin.fileglob', '/opt/ado-collections/infra-ado-*.tar.gz', wantlist=True)
          )
          | length > 0
        )
        or (
          (
            (hub_collections | first).collection_tarball_path
            | default(bootstrap_controller_hub_ado_collection_tarball | default(''), true)
          )
          | length > 0
        )
      }}
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0

- name: AAP 2.5+ | Assert ADO Hub collection tarball is present
  ansible.builtin.assert:
    that:
      - bootstrap_controller_hub_tarball_src | default('') | length > 0
      - bootstrap_controller_hub_tarball_src | basename is match('^infra-ado-.*\\.tar\\.gz$')
    fail_msg: >-
      Expected infra-ado-*.tar.gz under /workspace or /opt/ado-collections for Hub
      publish (galaxy-compatible filename). Found:
      {{ bootstrap_controller_hub_tarball_src | default('missing') }}
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_use_tarball | default(false) | bool

- name: AAP 2.5+ | Reset AAP Hub collection publish working dir
  ansible.builtin.file:
    path: "{{ bootstrap_controller_hub_publish_working_dir }}"
    state: absent
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0

- name: AAP 2.5+ | Create AAP Hub collection publish working dir
  ansible.builtin.file:
    path: "{{ bootstrap_controller_hub_publish_working_dir }}"
    state: directory
    mode: "0755"
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0

- name: AAP 2.5+ | Stage prebuilt ADO collection tarball for Hub publish
  ansible.builtin.copy:
    src: "{{ bootstrap_controller_hub_tarball_src }}"
    dest: >-
      {{ bootstrap_controller_hub_publish_working_dir }}/{{ bootstrap_controller_hub_tarball_src | basename }}
    remote_src: true
    mode: "0644"
  register: bootstrap_controller_hub_tarball_stage
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_use_tarball | default(false) | bool

- name: AAP 2.5+ | Copy ADO collection source for AAP Hub publish
  ansible.builtin.copy:
    src: "{{ __hub_collection_item.collection_local_path }}/"
    dest: "{{ bootstrap_controller_hub_publish_working_dir }}/{{ __hub_collection_item.collection_name }}"
    remote_src: true
    mode: "0755"
  loop: "{{ hub_collections }}"
  loop_control:
    loop_var: __hub_collection_item
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - not (bootstrap_controller_hub_use_tarball | default(false) | bool)
    - __hub_collection_item.collection_local_path is defined

- name: AAP 2.5+ | Build ADO collection for AAP Hub publish
  ansible.hub.ah_build:
    path: "{{ bootstrap_controller_hub_publish_working_dir }}/{{ __hub_collection_item.collection_name }}"
    output_path: "{{ bootstrap_controller_hub_publish_working_dir }}/{{ __hub_collection_item.collection_name }}"
    force: true
  register: bootstrap_controller_hub_build_results
  loop: "{{ hub_collections }}"
  loop_control:
    loop_var: __hub_collection_item
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - not (bootstrap_controller_hub_use_tarball | default(false) | bool)

- name: AAP 2.5+ | Check built ADO collection artifact path
  ansible.builtin.stat:
    path: "{{ __hub_build_result_item.path }}"
  register: bootstrap_controller_hub_build_stat_results
  loop: "{{ bootstrap_controller_hub_build_results.results | default([]) }}"
  loop_control:
    loop_var: __hub_build_result_item
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - not (bootstrap_controller_hub_use_tarball | default(false) | bool)

- name: AAP 2.5+ | Find built ADO collection artifact
  ansible.builtin.find:
    paths: "{{ (__hub_build_stat_item.stat.isdir) | ternary(__hub_build_stat_item.stat.path, (__hub_build_stat_item.stat.path | dirname)) }}"
    patterns: "{{ (__hub_build_stat_item.stat.isdir) | ternary('*.tar.gz', (__hub_build_stat_item.stat.path | basename)) }}"
  register: bootstrap_controller_hub_find_results
  loop: "{{ bootstrap_controller_hub_build_stat_results.results | default([]) }}"
  loop_control:
    loop_var: __hub_build_stat_item
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - not (bootstrap_controller_hub_use_tarball | default(false) | bool)

- name: AAP 2.5+ | Set ADO collection artifact list for Hub publish
  ansible.builtin.set_fact:
    bootstrap_controller_hub_collection_artifacts: >-
      {{
        [bootstrap_controller_hub_tarball_stage.dest]
        if (bootstrap_controller_hub_use_tarball | default(false) | bool)
        else (
          bootstrap_controller_hub_find_results.results
          | default([])
          | map(attribute='files')
          | flatten
          | map(attribute='path')
          | list
        )
      }}
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0

# Fresh Private Automation Hub has no namespaces; ah_collection fails with
# "Namespace in filename not found." until `infra` exists.
- name: AAP 2.5+ | Assert ADO Hub artifact is infra.ado (not ado namespace)
  ansible.builtin.assert:
    that:
      - (__hub_collection_file | basename) is match('^infra-ado-.*\\.tar\\.gz$')
    fail_msg: >-
      Hub artifact must be infra-ado-*.tar.gz so the collection publishes as
      infra.ado. Filenames like ado-collection-artifact.tar.gz wrongly create an
      ado namespace on Hub.
  loop: "{{ bootstrap_controller_hub_collection_artifacts | default([]) }}"
  loop_control:
    loop_var: __hub_collection_file
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0

# Hub-only: Galaxy credential attach and optional Contoller EE need the General org
# before any Controller API work. Hub publish itself uses the Hub API token only.
- name: AAP 2.5+ | Ensure General organization before Hub/Galaxy Controller work (hub-only)
  ansible.controller.organization:
    name: "{{ controller_bootstrap_organization }}"
    description: "{{ controller_bootstrap_organization }}"
    state: present
    controller_host: "{{ controller_host | default(vault_controller_hostname) }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(vault_controller_oauthtoken | default(omit)) }}"
    controller_username: "{{ controller_username | default(vault_controller_username | default(omit)) }}"
    controller_password: "{{ controller_password | default(vault_controller_password | default(omit)) }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
  register: bootstrap_controller_hub_only_org
  failed_when: false
  when:
    - bootstrap_controller_hub_update_collection_only | default(false) | bool
    - controller_bootstrap_organization | default('') | length > 0
    - bootstrap_generate_env_vars_preflight is defined
    - >-
      (
        bootstrap_generate_env_vars_preflight.aap.galaxy_setup_enabled | default(false) | bool
      )
      or (
        bootstrap_controller_hub_push_ee | default(false) | bool
        and bootstrap_controller_hub_ee_create_execution_environment | default(true) | bool
      )

- name: AAP 2.5+ | Ensure Hub namespace exists for ADO collection
  ansible.builtin.include_tasks: ensure_hub_namespace.yml
  when:
    - >-
      (
        bootstrap_controller_hub_publish_ado_collection | default(false) | bool
        and bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
      )
      or (
        bootstrap_controller_hub_publish_preflight_collections
        | default(false)
        | bool
      )

# ansible.hub.ah_collection auto_approve ALWAYS moves staging -> published
# (hardcoded). This Hub uses validated, not published — so auto_approve crashes
# with IndexError after upload and never lands infra.ado in validated.
# Correct flow: upload to staging (no approve), pulp-move into validated, then
# GET-verify the validated content API.
- name: AAP 2.5+ | Resolve Hub URI auth for collection publish
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
  ansible.builtin.set_fact:
    bootstrap_controller_hub_api_host: >-
      {{
        ('https://' ~ (bootstrap_controller_hub_hostname | regex_replace('^https?://', '') | regex_replace('/.*$', '')))
        if (bootstrap_controller_hub_hostname | default('') | string | trim | length > 0)
        else (controller_host | default(vault_controller_hostname))
      }}
    # Pulp URI calls must match ansible.hub auth. On some gateways Bearer is
    # ignored ("credentials were not provided"); Token + the winning Hub/OAuth
    # token, or admin basic, is what works after a successful staging upload.
    bootstrap_controller_hub_uri_oauth: >-
      {{
        controller_oauthtoken
        | default(vault_controller_oauthtoken | default('', true), true)
        | string
        | trim
      }}
    bootstrap_controller_hub_uri_token: >-
      {{
        (
          bootstrap_controller_hub_ah_token
          | default('', true)
          | string
          | trim
        )
        if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
        else ''
      }}

- name: AAP 2.5+ | Resolve Hub URI headers and basic-auth fallback
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
  ansible.builtin.set_fact:
    # Never set headers to omit — uri: headers undefined crashes the play.
    # Basic auth: empty headers + force_basic. Token auth: Authorization header.
    bootstrap_controller_hub_uri_force_basic: >-
      {{
        (
          bootstrap_controller_hub_ah_use_basic | default(false) | bool
        )
        or (
          (bootstrap_controller_hub_uri_token | default('') | length) == 0
          and (bootstrap_controller_hub_uri_oauth | default('') | length) == 0
        )
      }}
    bootstrap_controller_hub_uri_headers: >-
      {{
        {}
        if (
          bootstrap_controller_hub_ah_use_basic | default(false) | bool
          or (
            (bootstrap_controller_hub_uri_token | default('') | length) == 0
            and (bootstrap_controller_hub_uri_oauth | default('') | length) == 0
          )
        )
        else (
          {'Authorization': 'Token ' ~ bootstrap_controller_hub_uri_token}
          if (bootstrap_controller_hub_uri_token | default('') | length > 0)
          else {'Authorization': 'Token ' ~ bootstrap_controller_hub_uri_oauth}
        )
      }}
    bootstrap_controller_hub_uri_user: >-
      {{
        (
          controller_username
          | default(vault_controller_username | default(''))
        )
        if (
          (
            bootstrap_controller_hub_ah_use_basic | default(false) | bool
          )
          or (
            (bootstrap_controller_hub_uri_token | default('') | length) == 0
            and (bootstrap_controller_hub_uri_oauth | default('') | length) == 0
          )
        )
        else ''
      }}
    bootstrap_controller_hub_uri_password: >-
      {{
        (
          controller_password
          | default(vault_controller_password | default(''))
        )
        if (
          (
            bootstrap_controller_hub_ah_use_basic | default(false) | bool
          )
          or (
            (bootstrap_controller_hub_uri_token | default('') | length) == 0
            and (bootstrap_controller_hub_uri_oauth | default('') | length) == 0
          )
        )
        else ''
      }}

- name: AAP 2.5+ | Check whether infra.ado already exists in validated (skip unless force)
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
    - not (bootstrap_controller_hub_force_ado_collection_update | default(false) | bool)
  ansible.builtin.uri:
    url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}/api/galaxy/content/{{ bootstrap_controller_hub_publish_repository | default('validated') }}/v3/collections/infra/ado/versions/{{ bootstrap_controller_hub_artifact_coords.version }}/"
    method: GET
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: [200, 404]
    return_content: true
    headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
    user: "{{ bootstrap_controller_hub_uri_user }}"
    password: "{{ bootstrap_controller_hub_uri_password }}"
    force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
  vars:
    bootstrap_controller_hub_artifact_basename: "{{ __hub_collection_file | basename }}"
    bootstrap_controller_hub_artifact_coords:
      version: "{{ bootstrap_controller_hub_artifact_basename.split('-')[2:] | join('-') | regex_replace('\\.tar\\.gz$', '') }}"
  loop: "{{ bootstrap_controller_hub_collection_artifacts | default([]) }}"
  loop_control:
    loop_var: __hub_collection_file
    label: "infra.ado:{{ bootstrap_controller_hub_artifact_coords.version }}"
  register: bootstrap_controller_hub_ado_existing_check

- name: AAP 2.5+ | Decide whether infra.ado should publish
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
  ansible.builtin.set_fact:
    bootstrap_controller_hub_ado_should_publish: >-
      {{
        (bootstrap_controller_hub_force_ado_collection_update | default(false) | bool)
        or (
          bootstrap_controller_hub_ado_existing_check.results
          | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 404)
          | list
          | length > 0
        )
        or (
          bootstrap_controller_hub_ado_existing_check is skipped
        )
      }}

- name: AAP 2.5+ | Skip infra.ado publish — version already in validated
  ansible.builtin.debug:
    msg: >-
      Skipping infra.ado Hub publish — version already in
      {{ bootstrap_controller_hub_publish_repository | default('validated') }}
      and force is not set.
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
    - not (bootstrap_controller_hub_ado_should_publish | default(true) | bool)

- name: AAP 2.5+ | Publish ADO collection to validated AAP Hub repository
  when:
    - bootstrap_controller_hub_publish_ado_collection | default(false) | bool
    - hub_collections | default([]) | length > 0
    - bootstrap_controller_hub_collection_artifacts | default([]) | length > 0
    - bootstrap_controller_hub_ado_should_publish | default(true) | bool
  block:
    - name: AAP 2.5+ | Upload infra.ado to Hub staging (auto_approve must stay false)
      ansible.hub.ah_collection:
        namespace: infra
        name: ado
        version: "{{ bootstrap_controller_hub_artifact_coords.version }}"
        path: "{{ __hub_collection_file }}"
        repository: "{{ bootstrap_controller_hub_staging_repository | default('staging') }}"
        auto_approve: false
        overwrite_existing: "{{ bootstrap_controller_hub_force_ado_collection_update | default(false) | bool }}"
        wait: true
        timeout: "{{ bootstrap_controller_hub_publish_timeout | default(900) | int }}"
        request_timeout: "{{ bootstrap_controller_hub_publish_request_timeout | default(120) | int }}"
        ah_host: "{{ bootstrap_controller_hub_api_host }}"
        ah_username: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_username
              | default(vault_controller_username | default(omit))
            )
          }}
        ah_password: >-
          {{
            omit
            if not (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (
              controller_password
              | default(vault_controller_password | default(omit))
            )
          }}
        ah_token: >-
          {{
            omit
            if (bootstrap_controller_hub_ah_use_basic | default(false) | bool)
            else (bootstrap_controller_hub_ah_token | default(omit))
          }}
        validate_certs: "{{ controller_validate_certs | default(false) }}"
      vars:
        bootstrap_controller_hub_artifact_basename: "{{ __hub_collection_file | basename }}"
        bootstrap_controller_hub_artifact_coords:
          version: "{{ bootstrap_controller_hub_artifact_basename.split('-')[2:] | join('-') | regex_replace('\\.tar\\.gz$', '') }}"
      loop: "{{ bootstrap_controller_hub_collection_artifacts | default([]) }}"
      loop_control:
        loop_var: __hub_collection_file
        label: "infra.ado:{{ bootstrap_controller_hub_artifact_coords.version }} -> staging"
      register: bootstrap_controller_hub_publish_attempt

    - name: AAP 2.5+ | Fail when Hub staging upload did not change anything
      ansible.builtin.fail:
        msg: >-
          Staging upload reported changed=false for infra.ado — Hub did not
          accept a new artifact. Full result:
          {{ bootstrap_controller_hub_publish_attempt.results | default([]) | to_json }}
      when: >-
        (
          bootstrap_controller_hub_publish_attempt.results
          | default([])
          | selectattr('changed', 'defined')
          | selectattr('changed', 'equalto', true)
          | list
          | length
        ) == 0

    - name: AAP 2.5+ | Resolve pulp href for infra.ado collection version
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}/api/galaxy/pulp/api/v3/content/ansible/collection_versions/?namespace=infra&name=ado&version={{ bootstrap_controller_hub_artifact_coords.version }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      vars:
        bootstrap_controller_hub_artifact_basename: "{{ __hub_collection_file | basename }}"
        bootstrap_controller_hub_artifact_coords:
          version: "{{ bootstrap_controller_hub_artifact_basename.split('-')[2:] | join('-') | regex_replace('\\.tar\\.gz$', '') }}"
      loop: "{{ bootstrap_controller_hub_collection_artifacts | default([]) }}"
      loop_control:
        loop_var: __hub_collection_file
        label: "infra.ado:{{ bootstrap_controller_hub_artifact_coords.version }}"
      register: bootstrap_controller_hub_cv_lookup
      until: (bootstrap_controller_hub_cv_lookup.json.count | default(0) | int) >= 1
      retries: "{{ bootstrap_controller_hub_publish_verify_retries | default(60) | int }}"
      delay: "{{ bootstrap_controller_hub_publish_verify_delay | default(10) | int }}"

    - name: AAP 2.5+ | Resolve Hub staging repository pulp href
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}/api/galaxy/pulp/api/v3/repositories/?name={{ bootstrap_controller_hub_staging_repository | default('staging') }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      register: bootstrap_controller_hub_staging_repo

    - name: AAP 2.5+ | Resolve Hub validated repository pulp href
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}/api/galaxy/pulp/api/v3/repositories/?name={{ bootstrap_controller_hub_publish_repository | default('validated') }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      register: bootstrap_controller_hub_validated_repo

    - name: AAP 2.5+ | Assert staging and validated pulp repos were found
      ansible.builtin.assert:
        that:
          - (bootstrap_controller_hub_staging_repo.json.count | default(0) | int) >= 1
          - (bootstrap_controller_hub_validated_repo.json.count | default(0) | int) >= 1
        fail_msg: >-
          Could not resolve pulp repos. staging={{ bootstrap_controller_hub_staging_repo.json | default({}) | to_json }}
          validated={{ bootstrap_controller_hub_validated_repo.json | default({}) | to_json }}

    - name: AAP 2.5+ | Promote infra.ado from staging to validated via pulp
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}{{ bootstrap_controller_hub_staging_repo.json.results[0].pulp_href }}move_collection_version/"
        method: POST
        body_format: json
        body:
          collection_versions:
            - "{{ item.json.results[0].pulp_href }}"
          destination_repositories:
            - "{{ bootstrap_controller_hub_validated_repo.json.results[0].pulp_href }}"
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200, 202]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      loop: "{{ bootstrap_controller_hub_cv_lookup.results | default([bootstrap_controller_hub_cv_lookup]) }}"
      loop_control:
        label: "{{ item.json.results[0].pulp_href | default('cv') }}"
      register: bootstrap_controller_hub_promote_attempt

    - name: AAP 2.5+ | Wait for pulp promote task(s)
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}{{ item.json.task }}"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      loop: "{{ bootstrap_controller_hub_promote_attempt.results | default([bootstrap_controller_hub_promote_attempt]) }}"
      loop_control:
        label: "{{ item.json.task | default('task') }}"
      when: item.json.task is defined
      register: bootstrap_controller_hub_promote_task
      until: (bootstrap_controller_hub_promote_task.json.state | default('')) in ['completed', 'failed']
      retries: "{{ bootstrap_controller_hub_publish_verify_retries | default(60) | int }}"
      delay: "{{ bootstrap_controller_hub_publish_verify_delay | default(10) | int }}"
      failed_when: (bootstrap_controller_hub_promote_task.json.state | default('')) == 'failed'

    - name: AAP 2.5+ | Verify infra.ado is in validated Hub repository
      ansible.builtin.uri:
        url: "{{ bootstrap_controller_hub_api_host.rstrip('/') }}/api/galaxy/content/{{ bootstrap_controller_hub_publish_repository | default('validated') }}/v3/collections/infra/ado/versions/{{ bootstrap_controller_hub_artifact_coords.version }}/"
        method: GET
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code: [200]
        return_content: true
        headers: "{{ bootstrap_controller_hub_uri_headers | default({}) }}"
        user: "{{ bootstrap_controller_hub_uri_user }}"
        password: "{{ bootstrap_controller_hub_uri_password }}"
        force_basic_auth: "{{ bootstrap_controller_hub_uri_force_basic }}"
      vars:
        bootstrap_controller_hub_artifact_basename: "{{ __hub_collection_file | basename }}"
        bootstrap_controller_hub_artifact_coords:
          version: "{{ bootstrap_controller_hub_artifact_basename.split('-')[2:] | join('-') | regex_replace('\\.tar\\.gz$', '') }}"
      loop: "{{ bootstrap_controller_hub_collection_artifacts | default([]) }}"
      loop_control:
        loop_var: __hub_collection_file
        label: "infra.ado:{{ bootstrap_controller_hub_artifact_coords.version }} in validated"
      register: bootstrap_controller_hub_publish_verify
      until: (bootstrap_controller_hub_publish_verify.status | default(0) | int) == 200
      retries: "{{ bootstrap_controller_hub_publish_verify_retries | default(60) | int }}"
      delay: "{{ bootstrap_controller_hub_publish_verify_delay | default(10) | int }}"

    - name: AAP 2.5+ | Confirm infra.ado publish landed in validated
      ansible.builtin.debug:
        msg: >-
          infra.ado is present in Hub repository
          '{{ bootstrap_controller_hub_publish_repository | default('validated') }}'.

