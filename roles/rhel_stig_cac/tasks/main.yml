---
- name: Gather distribution facts for STIG CaC
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - distribution
      - distribution_major_version
      - os_family

- name: Validate STIG CaC mode
  ansible.builtin.assert:
    that:
      - rhel_stig_cac_mode in rhel_stig_cac_valid_modes
    fail_msg: >-
      rhel_stig_cac_mode must be one of
      {{ rhel_stig_cac_valid_modes | join(', ') }}.
      Got '{{ rhel_stig_cac_mode }}'.
    quiet: true

- name: Refuse the retired rhel_stig_cac_remediate switch
  ansible.builtin.assert:
    that:
      - >-
        not (rhel_stig_cac_remediate | default(false) | bool)
        or rhel_stig_cac_mode == 'remediate'
    fail_msg: >-
      rhel_stig_cac_remediate=true no longer starts a remediation. Set
      rhel_stig_cac_mode=remediate, rhel_stig_cac_remediation_approved=true,
      rhel_stig_cac_recovery_confirmed=true and list the controls in
      rhel_stig_cac_controls. Nothing was scanned or changed.
    quiet: true

- name: Resolve STIG CaC target OS major version
  ansible.builtin.set_fact:
    rhel_stig_cac_effective_os_major: >-
      {{
        (
          rhel_stig_cac_os_major | string | trim
          if (rhel_stig_cac_os_major | string | trim | length) > 0
          else (
            rhel_stig_cac_profile_label_map[
              rhel_stig_cac_profile_label | default('', true)
            ]
            | default(ansible_facts.distribution_major_version | string, true)
          )
        )
      }}

- name: Validate STIG CaC target platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - rhel_stig_cac_effective_os_major in ['8', '9', '10']
      - >-
        ansible_facts.distribution_major_version | string
        == rhel_stig_cac_effective_os_major
    fail_msg: >-
      DISA STIG CaC supports RHEL 8, 9, and 10 only, and the content must
      match the host. Detected
      {{ ansible_facts.distribution | default('unknown') }}
      {{ ansible_facts.distribution_major_version | default('unknown') }};
      requested content for RHEL {{ rhel_stig_cac_effective_os_major }}.
    success_msg: >-
      DISA STIG CaC mode '{{ rhel_stig_cac_mode }}' for
      RHEL {{ rhel_stig_cac_effective_os_major }}.

- name: Refuse check mode for scans and remediation
  ansible.builtin.assert:
    that:
      - not ansible_check_mode or rhel_stig_cac_mode == 'prepare'
    fail_msg: >-
      Audit, remediate, and verify write OpenSCAP evidence and cannot run
      in check mode. Use mode audit to inspect a host without changing it.
    quiet: true

- name: Resolve STIG CaC content paths
  ansible.builtin.set_fact:
    rhel_stig_cac_datastream: >-
      {{ rhel_stig_cac_datastream_map[rhel_stig_cac_effective_os_major] }}
    rhel_stig_cac_playbook_path: >-
      {{ rhel_stig_cac_playbook_map[rhel_stig_cac_effective_os_major] }}

- name: Prepare host (install OpenSCAP and scap-security-guide)
  ansible.builtin.include_tasks: prepare.yml
  when: rhel_stig_cac_mode == 'prepare'

- name: Run STIG CaC workflow
  ansible.builtin.include_tasks: "{{ rhel_stig_cac_mode }}.yml"
  when: rhel_stig_cac_mode != 'prepare'
