---
# yamllint disable rule:line-length
# Not used by ordinary state=absent. main.yml does not include this file.
# Advanced cleanup finalizes through ocp_absent_cleanup when
# ocp_namespace_absent_finalize is true. If a future task includes this file,
# the assert below still refuses platform namespaces and unauthorized runs.

- name: Refuse namespace finalize unless explicitly authorized
  ansible.builtin.assert:
    that:
      - ocp_namespace_advanced_cleanup | default(false) | bool
      - ocp_namespace_absent_finalize | default(false) | bool
      - ocp_namespace_effective | infra.automation_development_office.ocp_absent_cleanup_namespace_name_valid
      - >-
        not (
          ocp_namespace_effective
          | infra.automation_development_office.ocp_absent_cleanup_namespace_delete_blocked(
              ocp_namespace_blocked_namespaces | default([]),
              ocp_namespace_blocked_namespace_prefixes | default([])
            )
        )
      - >-
        (ocp_namespace_finalize_resource.metadata.name | default(''))
        == (ocp_namespace_effective | string)
      - >-
        (ocp_namespace_finalize_resource.status.phase | default(''))
        == 'Terminating'
    fail_msg: >-
      Refusing to strip finalizers on namespace '{{ ocp_namespace_effective }}'.
      Set ocp_namespace_advanced_cleanup and ocp_namespace_absent_finalize,
      and only for a Terminating namespace that is not platform-protected.

- name: Build finalize body with empty finalizers
  ansible.builtin.set_fact:
    ocp_namespace_finalize_body: >-
      {{
        ocp_namespace_finalize_resource
        | combine({'spec': {'finalizers': []}}, recursive=True)
        | combine({'metadata': (ocp_namespace_finalize_resource.metadata | default({})) | combine({'finalizers': []})}, recursive=True)
      }}
  no_log: true

- name: PUT namespace finalize subresource
  ansible.builtin.uri:
    url: >-
      {{
        (host | default(api_host | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST'))))
        | regex_replace('/$', '')
      }}/api/v1/namespaces/{{ ocp_namespace_effective }}/finalize
    method: PUT
    headers:
      Authorization: "Bearer {{ token | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY')) }}"
      Content-Type: application/json
    body_format: json
    body: "{{ ocp_namespace_finalize_body }}"
    status_code: [200, 201, 409]
    validate_certs: "{{ (verify_ssl | default(true)) | bool }}"
  no_log: true
  register: ocp_namespace_finalize_put
  failed_when: false

- name: Wait until finalized namespace is gone
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ ocp_namespace_effective }}"
  register: ocp_namespace_finalize_gone
  until: (ocp_namespace_finalize_gone.resources | default([]) | length) == 0
  retries: "{{ ocp_namespace_terminating_retries | default(24) | int }}"
  delay: "{{ ocp_namespace_terminating_delay | default(5) | int }}"
  failed_when: false
