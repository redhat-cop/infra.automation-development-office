---
# yamllint disable rule:line-length
- name: Delete Route to expose Grafana
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: grafana
        namespace: "{{ name_space }}"

- name: Delete Grafana instance using Operator
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      metadata:
        name: grafana
        namespace: "{{ name_space }}"
  failed_when: false

- name: Wait until Grafana custom resource is gone
  kubernetes.core.k8s_info:
    api_version: grafana.integreatly.org/v1beta1
    kind: Grafana
    name: grafana
    namespace: "{{ name_space }}"
  register: grafana_install_cr_after_delete
  until: >-
    grafana_install_cr_after_delete is failed
    or ((grafana_install_cr_after_delete.resources | default([]) | length) == 0)
  retries: "{{ grafana_install_cr_delete_retries | default(36) | int }}"
  delay: "{{ grafana_install_cr_delete_delay | default(5) | int }}"
  failed_when: false

- name: Fail if Grafana custom resource is still present
  ansible.builtin.fail:
    msg: >-
      Grafana CR grafana in namespace {{ name_space }} is still present after
      state=absent. The Grafana operator must remove that CR before the
      namespace can be deleted. Nothing else was uninstalled.
  when:
    - grafana_install_cr_after_delete is succeeded
    - (grafana_install_cr_after_delete.resources | default([]) | length) > 0

- name: Delete Grafana PostgreSQL Deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: >-
      {{
        grafana_install_postgres_name
        | default(grafana_postgres_name)
        | default('grafana-postgres')
      }}
    namespace: "{{ name_space }}"
  failed_when: false

- name: Delete Grafana PostgreSQL Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: >-
      {{
        grafana_install_postgres_name
        | default(grafana_postgres_name)
        | default('grafana-postgres')
      }}
    namespace: "{{ name_space }}"
  failed_when: false

- name: Delete Grafana PostgreSQL PVC
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: >-
      {{
        grafana_install_postgres_name
        | default(grafana_postgres_name)
        | default('grafana-postgres')
      }}
    namespace: "{{ name_space }}"
  failed_when: false

- name: Delete Grafana PostgreSQL Secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: >-
      {{
        grafana_install_postgres_name
        | default(grafana_postgres_name)
        | default('grafana-postgres')
      }}
    namespace: "{{ name_space }}"
  failed_when: false

- name: Delete Grafana PostgreSQL anyuid RoleBinding
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    name: >-
      {{
        (
          grafana_install_postgres_name
          | default(grafana_postgres_name)
          | default('grafana-postgres')
        ) ~ '-anyuid'
      }}
    namespace: "{{ name_space }}"
  failed_when: false
