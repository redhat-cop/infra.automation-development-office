---
# =========================================================
# Grafana: normalize inputs + build config (base + optional Keycloak OIDC)
# =========================================================

- name: Normalize grafana_install vars from component resolve / playbook
  ansible.builtin.set_fact:
    # Prefer OpenShift route hostname over RHEL standalone lab default.
    grafana_install_hostname: >-
      {{
        (
          (
            hostname
            if (
              (hostname | default('') | string | trim | length) > 0
              and ('server.lab' not in (hostname | default('') | string))
            )
            else (
              grafana_hostname
              if (
                (grafana_hostname | default('') | string | trim | length) > 0
                and ('server.lab' not in (grafana_hostname | default('') | string))
              )
              else (
                hostname
                | default(grafana_hostname)
                | default(grafana_install_hostname)
                | default('')
              )
            )
          )
          | string
          | regex_replace('^https?://', '')
          | regex_replace('/.*$', '')
          | trim
        )
      }}
    grafana_install_admin_user: >-
      {{ grafana_install_admin_user | default(grafana_admin_user | default('admin')) }}
    grafana_install_admin_password: >-
      {{ grafana_install_admin_password | default(grafana_admin_password | default('')) }}
    grafana_install_route_name: >-
      {{ grafana_install_route_name | default(grafana_route_name | default('grafana')) }}
    grafana_install_route_backend_svc: >-
      {{ grafana_install_route_backend_svc | default(grafana_route_backend_svc | default('grafana-service')) }}
    grafana_install_route_tls_termination: >-
      {{ grafana_install_route_tls_termination | default(grafana_route_tls_termination | default('edge')) }}
  changed_when: false

- name: Resolve Grafana OIDC/SMTP inclusion flags
  ansible.builtin.set_fact:
    grafana_install_oidc_enabled: "{{ grafana_install_include_oidc | default(false) | bool }}"
    grafana_install_email_enabled: "{{ grafana_install_include_email | default(false) | bool }}"
  changed_when: false

- name: Assert grafana_install_hostname is set
  ansible.builtin.assert:
    that:
      - (grafana_install_hostname | string | trim | length) > 0
    fail_msg: >-
      grafana_install_hostname / grafana_hostname must be set (components_defaults grafana_hostname).

- name: Build base Grafana config
  ansible.builtin.set_fact:
    grafana_install_config_base:
      log:
        mode: console
        level: warn

      server:
        domain: "{{ grafana_install_hostname }}"
        root_url: "https://{{ grafana_install_hostname }}/"
        serve_from_sub_path: "false"

      auth:
        disable_login_form: "false"

      security:
        admin_user: "{{ grafana_install_admin_user }}"
        admin_password: "{{ grafana_install_admin_password }}"

# ---------------------------------------------------------
# Optional OIDC + SMTP fragments (gated; separate JTs when not on install)
# ---------------------------------------------------------
- name: Build Grafana OIDC config when included on install
  ansible.builtin.import_tasks: build-grafana-oidc-config.yml
  when: grafana_install_oidc_enabled | default(false) | bool

- name: Build Grafana SMTP config when included on install
  ansible.builtin.import_tasks: build-grafana-email-config.yml
  when: grafana_install_email_enabled | default(false) | bool

- name: Resolve Grafana database type
  ansible.builtin.set_fact:
    grafana_install_db_type: >-
      {{
        grafana_install_database_type
        | default(grafana_database_type)
        | default(grafana_database.type | default('sqlite'))
        | string
        | trim
        | lower
      }}
    grafana_install_db_provision: >-
      {{
        grafana_install_database_provision
        | default(grafana_database_provision)
        | default(grafana_database.provision | default(true))
        | bool
      }}
  changed_when: false

- name: Assert Grafana database type is supported
  ansible.builtin.assert:
    that:
      - grafana_install_db_type in ['sqlite', 'postgres']
    fail_msg: >-
      grafana_database_type must be sqlite or postgres
      (got '{{ grafana_install_db_type }}').

- name: Provision in-cluster PostgreSQL for Grafana
  ansible.builtin.import_tasks: provision-grafana-postgres.yml
  when:
    - grafana_install_db_type == 'postgres'
    - grafana_install_db_provision | bool

- name: Resolve external PostgreSQL for Grafana
  ansible.builtin.import_tasks: resolve-external-postgres.yml
  when:
    - grafana_install_db_type == 'postgres'
    - not (grafana_install_db_provision | bool)

- name: Build Grafana PostgreSQL database config
  ansible.builtin.set_fact:
    grafana_install_config_database:
      database:
        type: postgres
        host: "{{ grafana_install_pg_host }}"
        name: "{{ grafana_install_pg_database }}"
        user: "{{ grafana_install_pg_user }}"
        password: "{{ grafana_install_pg_password }}"
        ssl_mode: >-
          {{
            grafana_install_postgres_ssl_mode
            | default(grafana_postgres_ssl_mode)
            | default('disable')
          }}
  when: grafana_install_db_type == 'postgres'
  no_log: true
  changed_when: false

- name: Merge Grafana config (base + database + optional OIDC + optional SMTP)
  ansible.builtin.set_fact:
    grafana_install_config: >-
      {{
        grafana_install_config_base
        | combine((grafana_install_config_database | default({})), recursive=True)
        | combine((grafana_install_config_oidc | default({})), recursive=True)
        | combine((grafana_install_config_smtp | default({})), recursive=True)
      }}
  no_log: true

# =========================================================
# Grafana instance + SCC + route (your existing tasks)
# =========================================================

- name: Wait for Grafana CRD before creating instance
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: grafanas.grafana.integreatly.org
  register: grafana_install_crd
  until: (grafana_install_crd.resources | default([])) | length > 0
  retries: "{{ grafana_install_crd_retries | default(60) | int }}"
  delay: "{{ grafana_install_crd_delay | default(10) | int }}"

- name: Deploy Grafana instance using Operator
  kubernetes.core.k8s:
    definition:
      apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      metadata:
        name: grafana
        namespace: "{{ name_space }}"
      spec:
        ingress:
          enabled: true
        config: "{{ grafana_install_config }}"
        persistentVolumeClaim:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "{{ storage_class }}"
            resources:
              requests:
                storage: "{{ storage_size }}"

- name: Allow grafana-sa to use privileged SCC (bypasses fsGroup/seccomp blocks)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: grafana-privileged-scc
        namespace: "{{ name_space }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:privileged
      subjects:
        - kind: ServiceAccount
          name: grafana-sa
          namespace: "{{ name_space }}"

- name: Allow grafana-sa to use anyuid SCC (fix fsGroup=472 forbidden)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: grafana-anyuid-scc
        namespace: "{{ name_space }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: grafana-sa
          namespace: "{{ name_space }}"

- name: Delete failed Grafana replicaset pods so it retries with new SCC
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ name_space }}"
    label_selectors:
      - app=grafana

- name: Create Route to expose Grafana
  kubernetes.core.k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ grafana_install_route_name | default('grafana') }}"
        namespace: "{{ name_space }}"
      spec:
        host: "{{ grafana_install_hostname }}"
        to:
          kind: Service
          name: "{{ grafana_install_route_backend_svc | default('grafana-service') }}"
        port:
          targetPort: 3000
        tls:
          termination: "{{ grafana_install_route_tls_termination | default('edge') }}"
          insecureEdgeTerminationPolicy: "{{ route_insecure_edge_policy | default('Redirect') }}"

# =========================================================
# Prometheus datasource SA token (your existing tasks)
# =========================================================

- name: Create ServiceAccount for Grafana
  kubernetes.core.k8s:
    namespace: openshift-monitoring
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: grafana-prometheus-sa

- name: Bind ServiceAccount to Prometheus Role
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: grafana-prometheus-sa-binding
      subjects:
        - kind: ServiceAccount
          name: grafana-prometheus-sa
          namespace: openshift-monitoring
      roleRef:
        kind: ClusterRole
        name: cluster-monitoring-view
        apiGroup: rbac.authorization.k8s.io

- name: Create ServiceAccount token secret
  kubernetes.core.k8s:
    namespace: openshift-monitoring
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-prometheus-sa-token
        annotations:
          kubernetes.io/service-account.name: grafana-prometheus-sa
      type: kubernetes.io/service-account-token
  no_log: true

- name: Get token from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: openshift-monitoring
    name: grafana-prometheus-sa-token
  register: grafana_install_sa_secret
  no_log: true

- name: Set bearer token fact
  ansible.builtin.set_fact:
    grafana_install_bearer_token: "{{ grafana_install_sa_secret.resources[0].data.token | b64decode }}"
  no_log: true

- name: Wait for Grafana API to be ready (/api/health)
  ansible.builtin.uri:
    url: "https://{{ grafana_install_hostname }}/api/health"
    method: GET
    validate_certs: "{{ grafana_install_validate_certs | default(false) }}"
    status_code: 200
    return_content: true
  register: grafana_install_health
  until:
    - grafana_install_health.status == 200
    - (grafana_install_health.json.database | default('ok')) in ['ok', 'connected']
  retries: 60
  delay: 5
