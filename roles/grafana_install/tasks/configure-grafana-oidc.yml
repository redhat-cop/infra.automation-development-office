---
- name: Normalize grafana_install hostname for OIDC configure
  ansible.builtin.set_fact:
    grafana_install_hostname: >-
      {{
        (
          hostname
          | default(grafana_hostname)
          | default(grafana_install_hostname)
          | default('')
          | string
          | regex_replace('^https?://', '')
          | regex_replace('/.*$', '')
          | trim
        )
      }}
  changed_when: false

- name: Resolve Grafana OIDC enabled from generated vars
  ansible.builtin.set_fact:
    grafana_install_oidc_enabled: >-
      {{ (oidc | default({})).enabled | default(false) | bool }}
  changed_when: false

- name: Align Grafana OIDC include flag when enabled
  ansible.builtin.set_fact:
    grafana_install_include_oidc: true
    grafana_install_oidc: >-
      {{
        (grafana_install_oidc | default({}))
        | combine({'enabled': true}, recursive=True)
      }}
  when: grafana_install_oidc_enabled | bool
  changed_when: false

- name: Build Grafana OIDC config fragment
  ansible.builtin.import_tasks: build-grafana-oidc-config.yml
  when: grafana_install_oidc_enabled | bool

- name: Stage OIDC config patch payload
  ansible.builtin.set_fact:
    grafana_install_config_patch: "{{ grafana_install_config_oidc }}"
  when:
    - grafana_install_oidc_enabled | bool
    - grafana_install_config_oidc is defined

- name: Patch Grafana CR with OIDC settings
  ansible.builtin.import_tasks: patch-grafana-cr-config.yml
  when:
    - grafana_install_oidc_enabled | bool
    - grafana_install_config_oidc is defined
