# defaults file for rhbk_setup_mapper
rhbk_host: >-
  {{
    (
      rhbk_hostname | default(rhbk_standalone_hostname, true)
      | default(install_rhbk_standalone_hostname, true)
      | default(ocp_rhbk_hostname, true)
      | default(hostname, true)
      | default('', true)
    )
    | regex_replace('^https?://', '')
    | regex_replace('/.*$', '')
  }}
rhbk_federation_name: "{{ federation_name | default('LDAP') }}"
rhbk_setup_ldap_user_mappers: true
