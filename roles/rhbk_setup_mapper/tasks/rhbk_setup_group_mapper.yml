---
# yamllint disable rule:line-length
- name: Assert LDAP group mapper config is present
  ansible.builtin.assert:
    that:
      - ldap_group_config is defined
      - ldap_group_config is mapping
      - (ldap_group_config | length) > 0
    fail_msg: >-
      ldap_group_config is required to create the LDAP group mapper.
      Provide Keycloak Component-style config (each value as a list of strings).

- name: Normalize ldap_group_config for Keycloak Component API
  ansible.builtin.set_fact:
    rhbk_setup_mapper_ldap_group_config: {}

# Keycloak /components expects MultivaluedHashMap: {"key": ["value"]}.
# Older vault templates used bare strings and Keycloak returns HTTP 400
# "Cannot parse the JSON".
- name: Build MultivaluedHashMap ldap_group_config
  ansible.builtin.set_fact:
    rhbk_setup_mapper_ldap_group_config: >-
      {{
        rhbk_setup_mapper_ldap_group_config
        | combine({
            item.key: (
              [item.value | string]
              if (item.value is string)
                 or (item.value is number)
                 or (item.value is boolean)
              else (
                (item.value | map('string') | list)
                if (item.value is sequence)
                else [item.value | string]
              )
            )
          })
      }}
  loop: "{{ ldap_group_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Login to RHBK and get admin token
  ansible.builtin.uri:
    url: "{{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/realms/master/protocol/openid-connect/token"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ rhbk_admin_user }}"
      password: "{{ rhbk_admin_password }}"
    validate_certs: "{{ rhbk_verify_ssl }}"
    return_content: true
  register: rhbk_setup_mapper_auth

- name: Get LDAP Federation Component list
  ansible.builtin.uri:
    url: "{{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/admin/realms/{{ rhbk_realm }}/components?type=org.keycloak.storage.UserStorageProvider"
    method: GET
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
    return_content: true
    validate_certs: "{{ rhbk_verify_ssl }}"
  register: rhbk_setup_mapper_ldap_components

- name: Extract LDAP federation component ({{ rhbk_federation_name }})
  ansible.builtin.set_fact:
    rhbk_setup_mapper_idm_component_obj: >-
      {{
        rhbk_setup_mapper_ldap_components.json
        | selectattr('name', 'equalto', rhbk_federation_name)
        | list
        | first | default({})
      }}
  when: rhbk_setup_mapper_ldap_components.json is defined

- name: Set the rhbk_setup_mapper_ldap_component_id
  ansible.builtin.set_fact:
    rhbk_setup_mapper_ldap_component_id: "{{ rhbk_setup_mapper_idm_component_obj.id | default('') }}"

- name: Show the extracted component ID
  ansible.builtin.debug:
    msg: "LDAP component ID: {{ rhbk_setup_mapper_ldap_component_id }}"

- name: Fail when LDAP federation component was not found
  ansible.builtin.fail:
    msg: >-
      LDAP federation component '{{ rhbk_federation_name }}' was not found in realm
      '{{ rhbk_realm }}'. Create federation before the group mapper.
  when: rhbk_setup_mapper_ldap_component_id | length == 0

- name: Get all existing LDAP mappers for component
  vars:
    rhbk_setup_mapper_ldap_mappers_url: >-
      {{
        (rhbk_keycloak_base_url | default('https://' ~ rhbk_host))
        ~ '/admin/realms/' ~ rhbk_realm
        ~ '/components?parent=' ~ rhbk_setup_mapper_ldap_component_id
        ~ '&type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper'
      }}
  ansible.builtin.uri:
    url: "{{ rhbk_setup_mapper_ldap_mappers_url }}"
    method: GET
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
    return_content: true
    validate_certs: "{{ rhbk_verify_ssl }}"
  register: rhbk_setup_mapper_ldap_mappers

- name: Locate existing ldap-group-mapper when present
  ansible.builtin.set_fact:
    rhbk_setup_mapper_ldap_group_mapper: >-
      {{
        rhbk_setup_mapper_ldap_mappers.json
        | default([])
        | selectattr('name', 'equalto', 'ldap-group-mapper')
        | list
        | first
        | default({}, true)
      }}

- name: Create LDAP Group Mapper when missing
  ansible.builtin.uri:
    url: "{{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/admin/realms/{{ rhbk_realm }}/components"
    method: POST
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "ldap-group-mapper"
      parentId: "{{ rhbk_setup_mapper_ldap_component_id }}"
      providerId: "group-ldap-mapper"
      providerType: "org.keycloak.storage.ldap.mappers.LDAPStorageMapper"
      config: "{{ rhbk_setup_mapper_ldap_group_config }}"
    validate_certs: "{{ rhbk_verify_ssl }}"
    status_code:
      - 201
      - 409
  when: (rhbk_setup_mapper_ldap_group_mapper.id | default('') | length) == 0

- name: Update LDAP Group Mapper when configuration changed
  ansible.builtin.uri:
    url: >-
      {{ rhbk_keycloak_base_url | default('https://' ~ rhbk_host) }}/admin/realms/{{ rhbk_realm }}/components/{{ rhbk_setup_mapper_ldap_group_mapper.id }}
    method: PUT
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ rhbk_setup_mapper_ldap_group_mapper.id }}"
      name: "ldap-group-mapper"
      parentId: "{{ rhbk_setup_mapper_ldap_component_id }}"
      providerId: "group-ldap-mapper"
      providerType: "org.keycloak.storage.ldap.mappers.LDAPStorageMapper"
      config: "{{ rhbk_setup_mapper_ldap_group_config }}"
    validate_certs: "{{ rhbk_verify_ssl }}"
    status_code:
      - 204
      - 200
  when: (rhbk_setup_mapper_ldap_group_mapper.id | default('') | length) > 0

- name: Re-read LDAP mappers and confirm group mapper is present
  vars:
    rhbk_setup_mapper_ldap_mappers_url: >-
      {{
        (rhbk_keycloak_base_url | default('https://' ~ rhbk_host))
        ~ '/admin/realms/' ~ rhbk_realm
        ~ '/components?parent=' ~ rhbk_setup_mapper_ldap_component_id
        ~ '&type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper'
      }}
  ansible.builtin.uri:
    url: "{{ rhbk_setup_mapper_ldap_mappers_url }}"
    method: GET
    headers:
      Authorization: "Bearer {{ rhbk_setup_mapper_auth.json.access_token }}"
    return_content: true
    validate_certs: "{{ rhbk_verify_ssl }}"
  register: rhbk_setup_mapper_ldap_mappers_after

- name: Assert ldap-group-mapper exists after apply
  ansible.builtin.assert:
    that:
      - >
        (
          rhbk_setup_mapper_ldap_mappers_after.json
          | default([])
          | selectattr('name', 'equalto', 'ldap-group-mapper')
          | list
          | length
        ) > 0
    fail_msg: >-
      LDAP group mapper 'ldap-group-mapper' was not found under federation
      '{{ rhbk_federation_name }}' after create/update. Check ldap_group_config
      and Keycloak Admin API errors.
