---
# yamllint disable rule:line-length
- name: Read existing BookStack secrets (preserve passwords / APP_KEY)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ bookstack_namespace }}"
    validate_certs: "{{ bookstack_validate_certs }}"
  loop:
    - bookstack-db
    - bookstack-app
  register: bookstack_openshift_existing_secrets
  failed_when: false

- name: Decode existing secret values
  ansible.builtin.set_fact:
    bookstack_openshift_existing_db: >-
      {{
        (
          bookstack_openshift_existing_secrets.results
          | selectattr('resources', 'defined')
          | selectattr('resources')
          | map(attribute='resources')
          | flatten
          | selectattr('metadata.name', 'equalto', 'bookstack-db')
          | list
          | first
          | default({})
        ).data | default({})
      }}
    bookstack_openshift_existing_app: >-
      {{
        (
          bookstack_openshift_existing_secrets.results
          | selectattr('resources', 'defined')
          | selectattr('resources')
          | map(attribute='resources')
          | flatten
          | selectattr('metadata.name', 'equalto', 'bookstack-app')
          | list
          | first
          | default({})
        ).data | default({})
      }}

- name: Resolve DB password (keep existing / use var / generate once)
  ansible.builtin.set_fact:
    bookstack_openshift_db_password_effective: >-
      {{
        bookstack_db_password
        if (bookstack_db_password | default('') | length > 0)
        else (
          (bookstack_openshift_existing_db['database-password'] | b64decode)
          if (bookstack_openshift_existing_db['database-password'] is defined)
          else (lookup('password', '/dev/null length=24 chars=ascii_letters,digits'))
        )
      }}
    bookstack_openshift_db_root_password_effective: >-
      {{
        bookstack_db_root_password
        if (bookstack_db_root_password | default('') | length > 0)
        else (
          (bookstack_openshift_existing_db['root-password'] | b64decode)
          if (bookstack_openshift_existing_db['root-password'] is defined)
          else (lookup('password', '/dev/null length=24 chars=ascii_letters,digits'))
        )
      }}

- name: Generate APP_KEY when missing
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import base64, os; print('base64:' + base64.b64encode(os.urandom(32)).decode())
  register: bookstack_openshift_generated_app_key
  changed_when: false
  when:
    - bookstack_app_key | default('') | length == 0
    - bookstack_openshift_existing_app['app-key'] is not defined

- name: Resolve APP_KEY (keep existing / use var / generate once)
  ansible.builtin.set_fact:
    bookstack_openshift_app_key_effective: >-
      {{
        bookstack_app_key
        if (bookstack_app_key | default('') | length > 0)
        else (
          (bookstack_openshift_existing_app['app-key'] | b64decode)
          if (bookstack_openshift_existing_app['app-key'] is defined)
          else bookstack_openshift_generated_app_key.stdout
        )
      }}

- name: Resolve route host and APP_URL
  ansible.builtin.set_fact:
    bookstack_openshift_route_host_effective: >-
      {{
        bookstack_route_host
        if (bookstack_route_host | default('') | length > 0)
        else (bookstack_namespace ~ '.' ~ (bookstack_apps_domain | default('apps.ocp.example.com')))
      }}

- name: Resolve APP_URL from route host when unset
  ansible.builtin.set_fact:
    bookstack_openshift_app_url_effective: >-
      {{
        bookstack_app_url
        if (bookstack_app_url | default('') | length > 0)
        else ('https://' ~ bookstack_openshift_route_host_effective)
      }}

- name: Create BookStack database Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: bookstack-db
        namespace: "{{ bookstack_namespace }}"
        labels:
          app.kubernetes.io/name: bookstack
          app.kubernetes.io/component: database
      type: Opaque
      stringData:
        database-name: "{{ bookstack_db_name }}"
        database-user: "{{ bookstack_db_user }}"
        database-password: "{{ bookstack_openshift_db_password_effective }}"
        root-password: "{{ bookstack_openshift_db_root_password_effective }}"
    validate_certs: "{{ bookstack_validate_certs }}"

- name: Preserve existing BookStack OIDC client secret when OIDC is off
  ansible.builtin.set_fact:
    bookstack_openshift_oidc_client_secret_effective: >-
      {{
        (bookstack_oidc_client_secret | default('') | trim)
        if (bookstack_oidc_client_secret | default('') | trim | length) > 0
        else (
          (bookstack_openshift_existing_app['oidc-client-secret'] | b64decode)
          if (bookstack_openshift_existing_app['oidc-client-secret'] is defined)
          else ''
        )
      }}
  when: not (bookstack_oidc_enabled | default(false) | bool)
  no_log: true

- name: Resolve BookStack OIDC client secret before writing the app Secret
  ansible.builtin.include_tasks: resolve-oidc-secret.yml
  vars:
    bookstack_openshift_oidc_existing_secret_data: "{{ bookstack_openshift_existing_app }}"
  when: bookstack_oidc_enabled | default(false) | bool

- name: Create BookStack application Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: bookstack-app
        namespace: "{{ bookstack_namespace }}"
        labels:
          app.kubernetes.io/name: bookstack
          app.kubernetes.io/component: app
      type: Opaque
      stringData:
        app-key: "{{ bookstack_openshift_app_key_effective }}"
        app-url: "{{ bookstack_openshift_app_url_effective }}"
        db-host: "{{ bookstack_db_host }}.{{ bookstack_namespace }}.svc"
        db-port: "{{ bookstack_db_port | string }}"
        db-database: "{{ bookstack_db_name }}"
        db-username: "{{ bookstack_db_user }}"
        db-password: "{{ bookstack_openshift_db_password_effective }}"
        oidc-client-id: "{{ bookstack_oidc_client_id | default('') }}"
        oidc-client-secret: "{{ bookstack_openshift_oidc_client_secret_effective | default('') }}"
    validate_certs: "{{ bookstack_validate_certs }}"
  no_log: true
