---
# Resolve the BookStack OIDC client secret before any Secret/env is written.
# Ownership (create_client) controls Keycloak mutations only. Read-only secret
# retrieval is allowed for managed and unmanaged clients.
# yamllint disable rule:line-length

- name: Decode existing BookStack OIDC client identity
  ansible.builtin.set_fact:
    bookstack_openshift_existing_oidc_secret: >-
      {{
        (bookstack_openshift_oidc_existing_secret_data['oidc-client-secret'] | b64decode)
        if (
          bookstack_openshift_oidc_existing_secret_data is defined
          and bookstack_openshift_oidc_existing_secret_data['oidc-client-secret'] is defined
        )
        else ''
      }}
    bookstack_openshift_existing_oidc_client_id: >-
      {{
        (bookstack_openshift_oidc_existing_secret_data['oidc-client-id'] | b64decode)
        if (
          bookstack_openshift_oidc_existing_secret_data is defined
          and bookstack_openshift_oidc_existing_secret_data['oidc-client-id'] is defined
        )
        else ''
      }}
  no_log: true

- name: Fetch BookStack OIDC client secret from Keycloak when unset
  ansible.builtin.include_role:
    name: infra.automation_development_office.ocp_rhbk_client_secrets
    public: true
  vars:
    ocp_rhbk_secret_client_id: "{{ bookstack_oidc_client_id | default('bookstack') }}"
    ocp_rhbk_component_name: rhbk
    ocp_rhbk_secret_optional: false
  when: (bookstack_oidc_client_secret | default('') | trim | length) == 0
  no_log: true

- name: Resolve BookStack OIDC client secret
  ansible.builtin.set_fact:
    bookstack_openshift_oidc_client_secret_effective: >-
      {{
        (bookstack_oidc_client_secret | default('') | trim)
        if (bookstack_oidc_client_secret | default('') | trim | length) > 0
        else (
          (ocp_rhbk_client_secrets__value | default('') | trim)
          if (ocp_rhbk_client_secrets__value | default('') | trim | length) > 0
          else (
            (bookstack_openshift_existing_oidc_secret | default('') | trim)
            if (
              (bookstack_openshift_existing_oidc_secret | default('') | trim | length) > 0
              and (bookstack_openshift_existing_oidc_client_id | default('') | trim)
              == (bookstack_oidc_client_id | default('bookstack') | trim)
            )
            else ''
          )
        )
      }}
  no_log: true

- name: Assert BookStack OIDC client secret is available
  ansible.builtin.assert:
    that:
      - (bookstack_openshift_oidc_client_secret_effective | default('') | length) > 0
    fail_msg: >-
      BookStack OIDC is enabled but no client secret is available for Keycloak
      client '{{ bookstack_oidc_client_id | default('bookstack') }}'.
      Create the confidential client (ADO | Deploy RHBK Client) then re-run,
      set bookstack_oidc_client_secret / vault_bookstack_oidc_client_secret,
      or confirm the Keycloak admin account can view that client's secret.
      An existing bookstack-app oidc-client-secret is reused only when
      oidc-client-id matches this client. An empty secret is not written to BookStack.
