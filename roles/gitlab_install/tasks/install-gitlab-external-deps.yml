---
# yamllint disable rule:line-length
# Lab external PostgreSQL, Redis, and MinIO for GitLab Helm chart 10.x
# (bundled subcharts removed in chart 10.0).

- name: Create GitLab object storage Secret (MinIO / S3-compatible)
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-object-storage
        namespace: "{{ name_space }}"
      type: Opaque
      stringData:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: "{{ gitlab_install_minio_access_key }}"
          aws_secret_access_key: "{{ gitlab_install_minio_secret_key }}"
          endpoint: "http://{{ gitlab_install_minio_service }}:{{ gitlab_install_minio_port }}"
          path_style: true
  no_log: true

- name: Create GitLab registry object storage Secret (chart 10.x)
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitlab_install_registry_storage_secret }}"
        namespace: "{{ name_space }}"
      type: Opaque
      stringData:
        config: |
          s3:
            v4auth: true
            region: us-east-1
            bucket: "{{ gitlab_install_registry_bucket }}"
            accesskey: "{{ gitlab_install_minio_access_key }}"
            secretkey: "{{ gitlab_install_minio_secret_key }}"
            endpoint: "http://{{ gitlab_install_minio_service }}:{{ gitlab_install_minio_port }}"
            pathstyle: true
  no_log: true

- name: Provision dedicated GitLab PostgreSQL
  ansible.builtin.import_tasks: provision-gitlab-postgres.yml

- name: Deploy GitLab Redis
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gitlab-redis
        namespace: "{{ name_space }}"
        labels:
          app.kubernetes.io/name: gitlab-redis
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: gitlab-redis
        template:
          metadata:
            labels:
              app.kubernetes.io/name: gitlab-redis
          spec:
            containers:
              - name: redis
                image: "{{ gitlab_install_redis_image }}"
                ports:
                  - containerPort: 6379
                    name: redis

- name: Create GitLab Redis Service
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: gitlab-redis
        namespace: "{{ name_space }}"
      spec:
        selector:
          app.kubernetes.io/name: gitlab-redis
        ports:
          - name: redis
            port: 6379
            targetPort: 6379

- name: Build GitLab MinIO Deployment definition
  ansible.builtin.set_fact:
    gitlab_install_minio_deployment: >-
      {{
        {
          'apiVersion': 'apps/v1',
          'kind': 'Deployment',
          'metadata': {
            'name': 'gitlab-minio',
            'namespace': name_space,
            'labels': {'app.kubernetes.io/name': 'gitlab-minio'},
          },
          'spec': {
            'replicas': 1,
            'selector': {'matchLabels': {'app.kubernetes.io/name': 'gitlab-minio'}},
            'template': {
              'metadata': {'labels': {'app.kubernetes.io/name': 'gitlab-minio'}},
              'spec': {
                'containers': [{
                  'name': 'minio',
                  'image': gitlab_install_minio_image,
                  'args': ['server', '/data'],
                  'env': [
                    {'name': 'MINIO_ROOT_USER', 'value': gitlab_install_minio_access_key},
                    {'name': 'MINIO_ROOT_PASSWORD', 'value': gitlab_install_minio_secret_key},
                  ],
                  'ports': [{
                    'containerPort': gitlab_install_minio_port | int,
                    'name': 'api',
                  }],
                  'volumeMounts': [{'name': 'data', 'mountPath': '/data'}],
                }],
                'volumes': [{'name': 'data', 'emptyDir': {}}],
              },
            },
          },
        }
      }}

- name: Deploy GitLab MinIO for object storage
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition: "{{ gitlab_install_minio_deployment }}"

- name: Build GitLab MinIO Service definition
  ansible.builtin.set_fact:
    gitlab_install_minio_service_definition: >-
      {{
        {
          'apiVersion': 'v1',
          'kind': 'Service',
          'metadata': {
            'name': gitlab_install_minio_service,
            'namespace': name_space,
          },
          'spec': {
            'selector': {'app.kubernetes.io/name': 'gitlab-minio'},
            'ports': [{
              'name': 'api',
              'port': gitlab_install_minio_port | int,
              'targetPort': 'api',
            }],
          },
        }
      }}

- name: Create GitLab MinIO Service
  kubernetes.core.k8s:
    validate_certs: "{{ gitlab_install_validate_certs }}"
    definition: "{{ gitlab_install_minio_service_definition }}"

- name: Wait for GitLab PostgreSQL pod Ready
  when: gitlab_install_database_provision | default(true) | bool
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ name_space }}"
    label_selectors:
      - app.kubernetes.io/name=gitlab-postgresql
  register: gitlab_install_postgres_pods
  until: >-
    (gitlab_install_postgres_pods.resources | default([]) | length > 0)
    and (
      (gitlab_install_postgres_pods.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True')
        | list | length) > 0
    )
  retries: 36
  delay: 10
