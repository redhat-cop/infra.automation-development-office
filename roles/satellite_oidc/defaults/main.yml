---
# Configure Red Hat Satellite login against Keycloak / RHBK (OIDC).
satellite_oidc_state: present
satellite_oidc_create_client: true
satellite_oidc_configure_satellite: true

# Keycloak / RHBK
satellite_oidc_client_id: ado-satellite
satellite_oidc_client_name: ADO Satellite
satellite_oidc_realm: rhlab
satellite_oidc_keycloak_url: ""
satellite_oidc_keycloak_hostname: ""
satellite_oidc_issuer: ""
satellite_oidc_client_secret: ""
satellite_oidc_admin_user: admin
satellite_oidc_admin_password: ""
satellite_oidc_auth_realm: master
satellite_oidc_auth_client_id: admin-cli
satellite_oidc_keycloak_validate_certs: false
satellite_oidc_no_log: true

# Satellite
satellite_oidc_server_url: ""
satellite_oidc_app_name: "{{ satellite_oidc_client_id }}"
satellite_oidc_username: admin
satellite_oidc_password: ""
satellite_oidc_validate_certs: false
satellite_oidc_autocreate_users: External
satellite_oidc_installer_timeout: 3600
satellite_oidc_run_installer: true
satellite_oidc_oidc_algorithm: RS256
# Foreman validates the Keycloak access token. RHBK sets aud to "account"
# and azp to the client id, so include both unless overridden.
satellite_oidc_audience: []
satellite_oidc_rhbk_client_role: infra.ado.rhbk_client
