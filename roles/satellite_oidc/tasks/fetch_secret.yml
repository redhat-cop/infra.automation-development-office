---
- name: Skip Keycloak secret fetch when already provided
  ansible.builtin.set_fact:
    satellite_oidc_client_secret_effective: "{{ satellite_oidc_client_secret }}"
  when: (satellite_oidc_client_secret | default('') | string | length) > 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Assert Keycloak admin credentials for secret fetch
  ansible.builtin.assert:
    that:
      - satellite_oidc_admin_user | default('') | length > 0
      - satellite_oidc_admin_password | default('') | length > 0
    fail_msg: >-
      Fetching the Satellite OIDC client secret requires Keycloak admin
      credentials when satellite_oidc_client_secret is empty.
  when: (satellite_oidc_client_secret | default('') | string | length) == 0

- name: Fetch Keycloak client secret via module
  community.general.keycloak_clientsecret_info:
    auth_keycloak_url: "https://{{ satellite_oidc_keycloak_hostname_effective }}"
    auth_realm: "{{ satellite_oidc_auth_realm }}"
    auth_username: "{{ satellite_oidc_admin_user }}"
    auth_password: "{{ satellite_oidc_admin_password }}"
    auth_client_id: "{{ satellite_oidc_auth_client_id }}"
    realm: "{{ satellite_oidc_realm_effective }}"
    client_id: "{{ satellite_oidc_client_id_effective }}"
    validate_certs: "{{ satellite_oidc_keycloak_validate_certs | bool }}"
  register: satellite_oidc_client_secret_raw
  delegate_to: localhost
  connection: local
  become: false
  when: (satellite_oidc_client_secret | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Extract Keycloak client secret from module result
  ansible.builtin.set_fact:
    satellite_oidc_client_secret_effective: >-
      {{
        (satellite_oidc_client_secret_raw.clientsecret_info | default({}))['value']
          | default((satellite_oidc_client_secret_raw.clientsecret_info | default({})).secret, true)
          | default(satellite_oidc_client_secret_raw.secret, true)
          | default(satellite_oidc_client_secret_raw.value, true)
          | default('')
      }}
  when: (satellite_oidc_client_secret | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Get Keycloak admin token for secret fallback
  ansible.builtin.uri:
    url: "{{ satellite_oidc_keycloak_token_url }}"
    method: POST
    validate_certs: "{{ satellite_oidc_keycloak_validate_certs | bool }}"
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: "{{ satellite_oidc_auth_client_id }}"
      username: "{{ satellite_oidc_admin_user }}"
      password: "{{ satellite_oidc_admin_password }}"
  register: satellite_oidc_token_resp
  delegate_to: localhost
  connection: local
  become: false
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
  no_log: true

- name: Lookup Keycloak client UUID for secret fallback
  ansible.builtin.uri:
    url: "{{ satellite_oidc_keycloak_clients_url }}"
    method: GET
    validate_certs: "{{ satellite_oidc_keycloak_validate_certs | bool }}"
    headers:
      Authorization: "Bearer {{ satellite_oidc_token_resp.json.access_token }}"
  register: satellite_oidc_clients_lookup
  delegate_to: localhost
  connection: local
  become: false
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Fetch Keycloak client secret via REST fallback
  ansible.builtin.uri:
    url: "{{ satellite_oidc_keycloak_client_secret_url }}"
    method: GET
    validate_certs: "{{ satellite_oidc_keycloak_validate_certs | bool }}"
    headers:
      Authorization: "Bearer {{ satellite_oidc_token_resp.json.access_token }}"
  register: satellite_oidc_secret_resp
  delegate_to: localhost
  connection: local
  become: false
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
    - satellite_oidc_clients_lookup.json is defined
    - (satellite_oidc_clients_lookup.json | length) > 0
  vars:
    satellite_oidc_keycloak_client_secret_url: >-
      {{
        'https://' ~ satellite_oidc_keycloak_hostname_effective
        ~ '/admin/realms/' ~ satellite_oidc_realm_effective
        ~ '/clients/' ~ satellite_oidc_clients_lookup.json[0].id
        ~ '/client-secret'
      }}
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Set Satellite OIDC client secret from REST fallback
  ansible.builtin.set_fact:
    satellite_oidc_client_secret_effective: >-
      {{
        satellite_oidc_secret_resp.json.value
          | default(satellite_oidc_secret_resp.json.secret, true)
          | default('')
      }}
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Regenerate Keycloak client secret when empty
  community.general.keycloak_clientsecret_regenerate:
    auth_keycloak_url: "https://{{ satellite_oidc_keycloak_hostname_effective }}"
    auth_realm: "{{ satellite_oidc_auth_realm }}"
    auth_username: "{{ satellite_oidc_admin_user }}"
    auth_password: "{{ satellite_oidc_admin_password }}"
    auth_client_id: "{{ satellite_oidc_auth_client_id }}"
    realm: "{{ satellite_oidc_realm_effective }}"
    client_id: "{{ satellite_oidc_client_id_effective }}"
    validate_certs: "{{ satellite_oidc_keycloak_validate_certs | bool }}"
  register: satellite_oidc_client_secret_regen
  delegate_to: localhost
  connection: local
  become: false
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Set Satellite OIDC client secret from regenerate
  ansible.builtin.set_fact:
    satellite_oidc_client_secret_effective: >-
      {{
        (satellite_oidc_client_secret_regen.end_state | default({})).value
          | default((satellite_oidc_client_secret_regen.clientsecret_info | default({})).value, true)
          | default('')
      }}
  when:
    - (satellite_oidc_client_secret | default('') | string | length) == 0
    - (satellite_oidc_client_secret_effective | default('') | string | length) == 0
  no_log: "{{ satellite_oidc_no_log | bool }}"

- name: Assert Satellite OIDC client secret is available
  ansible.builtin.assert:
    that:
      - (satellite_oidc_client_secret_effective | default('') | string | length) > 0
    fail_msg: >-
      Could not retrieve the Keycloak client secret for
      {{ satellite_oidc_client_id_effective }} in realm
      {{ satellite_oidc_realm_effective }}. Provide satellite_oidc_client_secret
      or Keycloak admin credentials.
  no_log: "{{ satellite_oidc_no_log | bool }}"
