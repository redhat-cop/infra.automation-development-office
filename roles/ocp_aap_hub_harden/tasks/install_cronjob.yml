---
# yamllint disable rule:line-length
- name: Create ServiceAccount for Hub stability CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ ocp_aap_hub_harden_cronjob_name }}"
        namespace: "{{ ocp_aap_hub_harden_namespace }}"

- name: Create Role for Hub stability CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: "{{ ocp_aap_hub_harden_cronjob_name }}"
        namespace: "{{ ocp_aap_hub_harden_namespace }}"
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/exec"]
          verbs: ["get", "list", "create"]
        - apiGroups: ["automationhub.ansible.com"]
          resources: ["automationhubs"]
          verbs: ["get", "patch", "update"]
        - apiGroups: ["aap.ansible.com"]
          resources: ["ansibleautomationplatforms"]
          verbs: ["get", "patch", "update"]

- name: Bind Role to Hub stability ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ ocp_aap_hub_harden_cronjob_name }}"
        namespace: "{{ ocp_aap_hub_harden_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: "{{ ocp_aap_hub_harden_cronjob_name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ ocp_aap_hub_harden_cronjob_name }}"
          namespace: "{{ ocp_aap_hub_harden_namespace }}"

- name: Install ConfigMap script for Hub stability maintenance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ ocp_aap_hub_harden_cronjob_name }}-script"
        namespace: "{{ ocp_aap_hub_harden_namespace }}"
      data:
        maintain.sh: |
          #!/bin/bash
          set -euo pipefail
          NS="${NAMESPACE:-aap}"
          AAP_CR="${AAP_CR:-aap}"
          HUB_CR="${HUB_CR:-aap-hub}"
          PG_POD="${POSTGRES_POD:-aap-hub-dedicated-postgres-0}"
          DB="${POSTGRES_DB:-automationhub}"
          HUB_PG_SECRET="${HUB_POSTGRES_SECRET:-external-hub-postgres-configuration}"
          echo "[hub-stability] $(date -u +%FT%TZ) start pg_pod=$PG_POD"

          oc -n "$NS" patch ansibleautomationplatform "$AAP_CR" --type=merge -p "{
            \"spec\":{\"hub\":{
              \"postgres_configuration_secret\":\"$HUB_PG_SECRET\",
              \"api\":{\"replicas\":1},\"content\":{\"replicas\":1},
              \"worker\":{\"replicas\":1},\"web\":{\"replicas\":1}
            }}
          }" >/dev/null || true

          oc -n "$NS" patch automationhub "$HUB_CR" --type=merge -p "{
            \"spec\":{
              \"postgres_configuration_secret\":\"$HUB_PG_SECRET\",
              \"gunicorn_api_workers\":1,
              \"gunicorn_content_workers\":1,
              \"gunicorn_timeout\":180,
              \"haproxy_timeout\":\"180s\",
              \"nginx_proxy_connect_timeout\":\"120s\",
              \"nginx_proxy_read_timeout\":\"180s\",
              \"nginx_proxy_send_timeout\":\"180s\"
            }
          }" >/dev/null || true

          if oc -n "$NS" get pod "$PG_POD" >/dev/null 2>&1; then
            oc -n "$NS" exec "$PG_POD" -- bash -lc "psql -U postgres -d '$DB' -v ON_ERROR_STOP=0 <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = current_database()
            AND pid <> pg_backend_pid()
            AND wait_event_type = 'LWLock'
            AND query ILIKE '%core_apiappstatus%'
            AND state = 'active'
            AND now() - query_start > interval '120 seconds';

          ALTER TABLE IF EXISTS public.core_apiappstatus SET (
            autovacuum_enabled = true,
            autovacuum_vacuum_scale_factor = 0.2,
            autovacuum_analyze_scale_factor = 1.0,
            autovacuum_vacuum_threshold = 50,
            autovacuum_analyze_threshold = 100
          );

          VACUUM public.core_apiappstatus;
          SQL" || true
          fi

          echo "[hub-stability] $(date -u +%FT%TZ) done"

- name: Install Hub stability CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: "{{ ocp_aap_hub_harden_cronjob_name }}"
        namespace: "{{ ocp_aap_hub_harden_namespace }}"
      spec:
        schedule: "{{ ocp_aap_hub_harden_cron_schedule }}"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 2
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 1
            template:
              spec:
                serviceAccountName: "{{ ocp_aap_hub_harden_cronjob_name }}"
                restartPolicy: Never
                containers:
                  - name: maintain
                    image: "{{ ocp_aap_hub_harden_cron_image | default('image-registry.openshift-image-registry.svc:5000/openshift/cli:latest') }}"
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: NAMESPACE
                        value: "{{ ocp_aap_hub_harden_namespace }}"
                      - name: AAP_CR
                        value: "{{ ocp_aap_hub_harden_aap_name }}"
                      - name: HUB_CR
                        value: "{{ ocp_aap_hub_harden_automationhub_name }}"
                      - name: POSTGRES_POD
                        value: "{{ ocp_aap_hub_harden_postgres_pod }}"
                      - name: POSTGRES_DB
                        value: "{{ ocp_aap_hub_harden_postgres_db }}"
                      - name: HUB_POSTGRES_SECRET
                        value: "{{ ocp_aap_hub_harden_postgres_secret }}"
                    command: ["/bin/bash", "/scripts/maintain.sh"]
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: "{{ ocp_aap_hub_harden_cronjob_name }}-script"
                      defaultMode: 493  # 0755
