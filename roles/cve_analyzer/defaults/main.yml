---
# RHACS CVE Analyzer — ADO collection role.
# Bootstrap / Contoller playbooks must set cve_analyzer_action explicitly.

# Required. One of: fetch_export | pipeline | publish_grafana |
# publish_rhacs_posture | publish_metrics | repair_posture_metrics |
# cve_intel | full | enrichment
cve_analyzer_action: ""
cve_analyzer_data_dir: ""
# Ad-hoc metrics repair: repair (create/restore) or verify (read-only checks).
cve_analyzer_repair_mode: repair
# Durable input dir for scrubbed CSV / cve_posture.prom when Contoller EE
# has no shared /tmp from a prior job. Empty → use cve_analyzer_data_dir only.
cve_analyzer_metrics_input_dir: ""
cve_analyzer_scripts_dir: "{{ role_path }}/files/scripts"
cve_analyzer_report_name: "{{ now(utc=true).strftime('%b-%d') }}"
# Print endpoint banner/recap (Full / Enrichment). Override to silence.
cve_analyzer_print_banner: true
# Require Contoller/CLI ``env`` (no prod default). Set false only for local
# unit harnesses that pass all URLs and data_dir explicitly.
cve_analyzer_require_env: true

# ACS Central — set via group_vars (acs_central_url) or vault; no cluster default.
cve_analyzer_acs_central_url: >-
  {{ acs_central_url | default('') | regex_replace('/$', '') }}
cve_analyzer_acs_api_token: >-
  {{
    acs_api_token
    | default(lookup('env', 'ROX_API_TOKEN'), true)
    | default(vault_acs_api_token | default(''), true)
  }}
cve_analyzer_acs_admin_user: "{{ acs_admin_user | default('admin') }}"
# Password aliases (first non-empty wins). All three names are supported.
cve_analyzer_acs_admin_password: >-
  {{
    acs_admin_password
    | default(ocp_acs_admin_password | default(vault_acs_admin_password | default(''), true), true)
  }}
# ACS export URL query timeout (Central-side). Kept generous for large clusters.
cve_analyzer_acs_export_timeout: 900
# Ansible get_url / HTTP client timeout for the export download (seconds).
cve_analyzer_acs_http_timeout: 1200
# ACS /v1/apitokens/generate HTTP timeout (seconds).
cve_analyzer_acs_auth_timeout: 60
cve_analyzer_acs_validate_certs: false
# Transient Central / network blips during large vuln exports
cve_analyzer_acs_export_retries: 3
cve_analyzer_acs_export_retry_delay: 30

# Grafana ansible.builtin.uri timeout (seconds). Publish script uses the same
# default via GRAFANA_HTTP_TIMEOUT (see publish_grafana_dashboard.py).
cve_analyzer_grafana_http_timeout: 120

# Wall-clock bound for python3 analytics/build/parse/publish subprocesses
# (coreutils `timeout`). Must stay above a normal successful Full build.
cve_analyzer_subprocess_timeout: 1800

# Phase 4a — metrics Kubernetes tasks.
# kubernetes.core.k8s / k8s_info do NOT expose a per-request HTTP timeout.
# Contoller EE rejected Ansible async/poll on these tasks (job 2859); async is
# not used. wait=false disables readiness waiting only — it does NOT bound HTTP
# or task wall-clock. Contoller JT timeout remains a separate setting.
# Track unbounded k8s API hang risk as a separate follow-up (not Phase 4a).
cve_analyzer_k8s_wait: false
cve_analyzer_k8s_wait_timeout: 120

# Phase 1a timing — ordered labels for EXECUTION SUMMARY (do not rename lightly).
cve_analyzer_timing_order:
  - RHACS Authentication
  - RHACS Export
  - CSV Processing
  - Cluster Inventory
  - Dashboard Build
  - Metrics Publish
  - Grafana Publish
  - Enrichment Pipeline
  - Triage Grafana Publish
  - Namespace Metrics Publish
  - CVE Intelligence

# Phase 4a — artifact size lines in EXECUTION SUMMARY (sizes only; no contents).
cve_analyzer_artifact_size_order:
  - RHACS Export NDJSON
  - Scrubbed CSV
  - raw.csv
  - Dashboard JSON
  - Dashboard JSON Lite
  - Posture gauges prom
  - CVE Intel Published JSON
  - CVE Intel Matches JSON

# Phase 4B — catalog.redhat.com / Docker Hub image-update Action annotations.
# Default false (no external HTTP during Dashboard Build). Set true via group_vars
# or Contoller extra_var to restore prior Actions wording. Passed to the builder as
# CVE_ANALYZER_IMAGE_UPDATE_CHECK (existing env gate in rhacs_report_analytics.py).
cve_analyzer_image_updates_check: false

# Grafana — set via group_vars (grafana_url); no cluster default.
# Publish updates by dashboard UID ado-rhacs-cve-triage into Security folder when present.
cve_analyzer_grafana_url: >-
  {{ grafana_url | default('') | regex_replace('/$', '') }}
cve_analyzer_grafana_user: "{{ grafana_admin_user | default('admin') }}"
cve_analyzer_grafana_password: >-
  {{
    grafana_admin_password
    | default(vault_grafana_admin_password | default(''), true)
  }}
cve_analyzer_grafana_folder: Security
cve_analyzer_grafana_folder_uid: ""
cve_analyzer_grafana_validate_certs: false
cve_analyzer_dashboard_title: "OpenShift CVE Triage Report"
cve_analyzer_dashboard_uid: ado-rhacs-cve-triage

# Per-namespace severity gauges for Dev Spaces / Prometheus panels
# Namespace must allow user-workload ServiceMonitors (often same ns as Grafana).
cve_analyzer_metrics_namespace: "{{ grafana_namespace | default('grafana') }}"
cve_analyzer_metrics_name: cve-analyzer-ns-metrics
# Phase 1b-B: METRICS_PUBLISHED | METRICS_SKIPPED_NO_OCP_AUTH |
# METRICS_SKIPPED_NO_LIVE_SNAPSHOT | METRICS_FAILED | METRICS_SKIPPED_NO_CONFIGMAP
cve_analyzer_metrics_status: ""
# Grafana Prometheus/Thanos datasource UID for Findings over time panels.
# Empty → resolve at publish: exactly one Prometheus datasource is
# auto-selected; zero or many require an explicit UID (never invent one).
# Set per environment in vars_cve_analyzer.yml when Grafana has multiple.
cve_analyzer_prometheus_datasource_uid: ""
# Optional Contoller JT deep-link for dashboard header "Send report".
# Empty = omit link. Set in group_vars when the JT exists.
cve_analyzer_send_report_url: ""
cve_analyzer_metrics_image: registry.access.redhat.com/ubi9/python-312:latest

# Live RHACS vulnerability overview (from data.json on each full run).
# Override in group_vars (title/uid). Blank or omitted → these defaults.
# Stable ADO UID — do not overwrite the Manage-Grafana sample board
# (rhacs-vulnerability-dashboard-json__secu); that stays a separate bookmark.
cve_analyzer_vuln_dashboard_title: "RHACS Vulnerability Posture (ADO)"
# Empty in role defaults on purpose — publish_rhacs_posture requires an
# explicit UID (survey / group_vars / -e). Do not silently fall through to
# production ado-rhacs-vuln-posture when Contoller strips undeclared extras.
cve_analyzer_vuln_dashboard_uid: ""
# When true (default), refuse production UID/aliases. Contoller survey
# "Refuse production UID?" maps here. Survey defaults alone are not a
# security boundary — the role also requires
# cve_analyzer_allow_production_publish=true before any production write.
cve_analyzer_phase0_publish_only: true
# Explicit opt-in for production UID ado-rhacs-vuln-posture (and aliases).
# Default false. Set true only for intentional production publishes
# (survey Refuse production = false).
cve_analyzer_allow_production_publish: false
# Persistent Grafana JSON backups before overwrite (required when the target
# UID already exists). Contoller EE /tmp is ephemeral — mount NFS/PVC:
#   cve_analyzer_grafana_dashboard_backup_dir: >-
#     /var/lib/cve-analyzer/grafana-backups
# Same durability pattern as cve_analyzer_metrics_input_dir. Empty + existing
# dashboard → publish fails closed (no overwrite without backup).
cve_analyzer_grafana_dashboard_backup_dir: ""
# Local/Molecule only: allow /tmp backups. Never true on Contoller.
cve_analyzer_grafana_dashboard_backup_allow_ephemeral: false
# Same-job scrubbed CSV retention for independent Unique/KPI validation.
# Default false so existing Contoller schedules are unchanged. Set true and
# mount a durable dir (NFS/PVC) for Phase 0 / pre-merge CSV-to-dashboard audits.
# When true, retention failure fails the job (never silent).
cve_analyzer_scrubbed_csv_retention_enabled: false
cve_analyzer_scrubbed_csv_retention_dir: ""
# Days to keep job* retention directories under retention_dir (prune after copy).
cve_analyzer_scrubbed_csv_retention_days: 30
# Local/Molecule only: allow retention under /tmp. Never true on Contoller.
cve_analyzer_scrubbed_csv_retention_allow_ephemeral: false
# Optional extra UIDs to overwrite with the same live JSON (empty by default).
cve_analyzer_vuln_dashboard_alias_uids: []
# Extra approved nonprod UIDs for Phase 0 features (filterable Panel 11,
# CVE Intelligence panels, Lite/compare). Built-in: phase0, ado-lite, ado-dev.
# Production ado-rhacs-vuln-posture is always refused. Example Preprod:
#   cve_analyzer_phase0_feature_uids: [ado-rhacs-vuln-posture-new]
cve_analyzer_phase0_feature_uids: []
# Phase 0 Lite — omit panel 90 Detail + drill links (Grafana 16 MB).
# Default false = Full. Only allowed with Phase 0 feature UIDs; never production.
cve_analyzer_dashboard_lite: false
# When true: build Full + Lite from the same CSV, publish Full to the primary
# Phase 0 UID and Lite to cve_analyzer_lite_dashboard_uid (default ado-lite).
# Never publishes to production ado-rhacs-vuln-posture.
cve_analyzer_publish_lite_compare: false
cve_analyzer_lite_dashboard_uid: ado-lite
cve_analyzer_lite_dashboard_title: "RHACS Vulnerability Posture (ADO) - Lite"
# A failed live dashboard build fails the job and does not publish.
# cve_analyzer_fail_on_dashboard_build is unused; kept so older extra vars
# do not error. The static sample is not substituted for a failed build.
cve_analyzer_fail_on_dashboard_build: null
# Dashboard/analytics cluster scope. Empty = all RHACS clusters in the report.
# Exact names only (fail if missing). Does not rewrite the downloaded CSV.
# Prometheus: panel 11 uses by-cluster/by-ns gauges; panel 12 keeps
# all-cluster cve_posture_findings as the legacy reference trend.
cve_analyzer_clusters: []

# Image rescans (roxctl / skopeo / release payload) are off by default.
# Posture dashboard builds from the scrubbed CSV without them.
# Set true (or use action ``enrichment``) to run the enrichment pipeline and
# the data.json triage dashboard. Action ``full`` honors this flag; action
# ``enrichment`` always enables it for one timed session.
cve_analyzer_run_enrichment: false

# CVE Intelligence (Red Hat Security Data API → JSON / Grafana Postgres).
# Independent of Panel 11 / Dont Delete. Prefer daily Contoller schedule.
cve_analyzer_cve_intel_enabled: false
# Append Recent reports panels on approved Phase 0 / nonprod UIDs only.
# Requires UID in built-in set or cve_analyzer_phase0_feature_uids.
# Never applies to production ado-rhacs-vuln-posture. Default off.
cve_analyzer_cve_intel_panels: false
cve_analyzer_cve_intel_lookback_days: 14
cve_analyzer_cve_intel_fetch_details: true
# Optional postgresql://user:pass@host:5432/grafana
# When empty, tasks resolve from Secret grafana-postgres (ns grafana) via OCP
# API using cve_analyzer_ocp_host/token — credentials stay out of Git.
cve_analyzer_cve_intel_database_url: ""
cve_analyzer_cve_intel_postgres_secret: grafana-postgres
cve_analyzer_cve_intel_postgres_namespace: grafana
cve_analyzer_cve_intel_postgres_host: grafana-postgres.grafana.svc
cve_analyzer_cve_intel_postgres_port: 5432
cve_analyzer_cve_intel_match_csv: ""
# Install psycopg2-binary into a job-local path when the EE lacks it.
cve_analyzer_cve_intel_ensure_psycopg2: true

# Pipeline tuning
cve_analyzer_pipeline_steps:
  - {name: Preparing triage report, script: prepare_triage.py}
  - {name: Scanning images with roxctl, script: save_scans.py}
  - {name: Fetching Red Hat CVSS scores, script: fetch_rh_scores.py}
  - {name: Scanning latest image versions, script: scan_latest.py}
  - {name: Scanning OCP core images, script: scan_ocp_latest.py}
  - {name: Fixing catalog URLs, script: fix_catalog_urls.py}
  - {name: Fixing manifest digests, script: fix_manifest_digests.py}
  - {name: Fetching RHSA descriptions, script: fetch_rhsa_descriptions.py}
  - {name: Checking CISA KEV catalog, script: fetch_kev.py}
  - {name: Building HTML report, script: build_report_v2.py}

cve_analyzer_step_timeout: 1800
# Prefer host:443. ensure_acs_token.yml rewrites this before pipeline/export.
cve_analyzer_rox_endpoint: >-
  {{
    (
      cve_analyzer_acs_central_url
      | default('')
      | regex_replace('^https?://', '')
      | regex_replace('/.*$', '')
    )
    ~ (
      ''
      if (
        (
          cve_analyzer_acs_central_url
          | default('')
          | regex_replace('^https?://', '')
          | regex_replace('/.*$', '')
        ) is search(':[0-9]+$')
      )
      else ':443'
    )
  }}
