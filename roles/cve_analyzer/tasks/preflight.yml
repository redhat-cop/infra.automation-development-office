---
# Playbook-shell checks that used to live outside the role.
- name: Require env (no prod default)
  when: cve_analyzer_require_env | bool
  ansible.builtin.assert:
    that:
      - env is defined
      - (env | string | length) > 0
    fail_msg: >-
      Set env explicitly (Contoller extra_vars or -e env=<name>).
      Refusing to default to prod.

- name: Require an explicit cve_analyzer_action
  ansible.builtin.assert:
    that:
      - (cve_analyzer_action | default('') | string | length) > 0
      - >-
        cve_analyzer_action is in [
          'fetch_export',
          'pipeline',
          'publish_grafana',
          'publish_rhacs_posture',
          'publish_metrics',
          'repair_posture_metrics',
          'cve_intel',
          'full',
          'enrichment'
        ]
    fail_msg: >-
      Set cve_analyzer_action to fetch_export, pipeline, publish_grafana,
      publish_rhacs_posture, publish_metrics, repair_posture_metrics,
      cve_intel, full, or enrichment.
      Bootstrap playbooks must set the action explicitly (no default).

- name: Default data directory from env when unset
  when: (cve_analyzer_data_dir | default('') | string | length) == 0
  ansible.builtin.set_fact:
    cve_analyzer_data_dir: "/tmp/cve-analyzer-{{ env | default('local') }}"

# Derived per invocation — never mutate caller cve_analyzer_run_enrichment.
# Action enrichment forces enrichment for THIS call only; a later role include
# with action full and run_enrichment=false stays optional-enrichment.
- name: Compute enrichment enablement for this role invocation only
  ansible.builtin.set_fact:
    cve_analyzer_effective_run_enrichment: >-
      {{
        (cve_analyzer_action | default('') == 'enrichment')
        or (cve_analyzer_run_enrichment | default(false) | bool)
      }}

# ACS: fetch_export / pipeline / full / enrichment need Central (auth + export
# or enrichment scripts). pipeline alone still hits ensure_acs_token +
# run_pipeline (ROX_*), matching the former standalone wrappers.
- name: Require ACS Central URL when the action talks to Central
  when: >-
    cve_analyzer_action in [
      'full',
      'enrichment',
      'publish_rhacs_posture',
      'fetch_export',
      'pipeline'
    ]
  ansible.builtin.assert:
    that:
      - (cve_analyzer_acs_central_url | default('') | length) > 0
        or (acs_central_url | default('') | length) > 0
    fail_msg: >-
      Set acs_central_url in group_vars for env={{ env | default('(unset)') }}.
      Action {{ cve_analyzer_action }} requires ACS Central.

# Grafana: only publish / full / enrichment (not bare pipeline or fetch).
# repair_posture_metrics uses Grafana optionally for datasource/series
# checks; missing Grafana skips those checks rather than failing preflight.
- name: Require Grafana URL when the action publishes dashboards
  when: >-
    cve_analyzer_action in [
      'full',
      'enrichment',
      'publish_rhacs_posture',
      'publish_grafana'
    ]
  ansible.builtin.assert:
    that:
      - (cve_analyzer_grafana_url | default('') | length) > 0
        or (grafana_url | default('') | length) > 0
    fail_msg: >-
      Set grafana_url in group_vars for env={{ env | default('(unset)') }}.
      Action {{ cve_analyzer_action }} publishes to Grafana.

- name: Normalize repair mode for repair_posture_metrics
  when: cve_analyzer_action == 'repair_posture_metrics'
  ansible.builtin.assert:
    that:
      - >-
        (cve_analyzer_repair_mode | default('repair') | trim | lower)
        in ['repair', 'verify']
    fail_msg: >-
      cve_analyzer_repair_mode must be repair or verify
      (got {{ cve_analyzer_repair_mode | default('(unset)') }}).
