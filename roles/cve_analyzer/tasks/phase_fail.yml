---
# Record the active (or named) phase as failed with elapsed time so far.
# Does not re-raise; caller must fail/rescue as needed.
- name: "Record failed — {{ cve_analyzer_timing_phase_active | default(cve_analyzer_timing_phase) }}"
  ansible.builtin.set_fact:
    cve_analyzer_last_failed_phase: >-
      {{ cve_analyzer_timing_phase_active | default(cve_analyzer_timing_phase) }}
    cve_analyzer_phase_times: >-
      {{
        (cve_analyzer_phase_times | default({}))
        | combine({
            (cve_analyzer_timing_phase_active | default(cve_analyzer_timing_phase)): {
              'status': 'failed',
              'seconds': (
                (
                  (lookup('pipe', 'date +%s.%N') | float)
                  - (cve_analyzer_timing_mark | default(0) | float)
                )
                | round(1)
              )
            }
          })
      }}
    cve_analyzer_timing_phase_active: ""
