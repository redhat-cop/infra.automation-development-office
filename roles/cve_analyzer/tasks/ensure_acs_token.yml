---
# Roxctl needs ROX_API_TOKEN. Export can use basic auth, so a full run often
# has only the ACS admin password. Mint a short-lived API token when missing.
- name: Skip ACS token mint when already set
  ansible.builtin.debug:
    msg: >-
      ACS API credential already present
      (len={{ cve_analyzer_acs_api_token | length }}).
  when: (cve_analyzer_acs_api_token | default('') | length) > 0

- name: Mint ACS API token from admin password when token missing
  when:
    - (cve_analyzer_acs_api_token | default('') | length) == 0
    - (cve_analyzer_acs_admin_password | default('') | length) > 0
    - (cve_analyzer_acs_central_url | default('') | length) > 0
  block:
    - name: Request ACS API token
      ansible.builtin.uri:
        url: "{{ cve_analyzer_acs_central_url }}/v1/apitokens/generate"
        method: POST
        user: "{{ cve_analyzer_acs_admin_user }}"
        password: "{{ cve_analyzer_acs_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ cve_analyzer_acs_validate_certs | bool }}"
        status_code: [200]
        body_format: json
        body:
          name: "cve-analyzer-{{ env | default('lab') }}-{{ lookup('pipe', 'date +%s') }}"
          roles:
            - Admin
        timeout: "{{ cve_analyzer_acs_auth_timeout | default(60) | int }}"
      register: cve_analyzer_acs_token_mint
      no_log: true
      retries: 3
      delay: 10
      until: cve_analyzer_acs_token_mint is succeeded

    - name: Set ACS API token from mint response
      ansible.builtin.set_fact:
        cve_analyzer_acs_api_token: "{{ cve_analyzer_acs_token_mint.json.token }}"
      no_log: true

    - name: Confirm ACS API credential minted
      ansible.builtin.debug:
        msg: >-
          Minted ACS API credential for roxctl
          (len={{ cve_analyzer_acs_api_token | length }}).
  rescue:
    - name: Warn when ACS credential mint failed
      ansible.builtin.debug:
        msg: >-
          Could not mint ACS API credential from admin login
          ({{ ansible_failed_result.msg | default(ansible_failed_result) | string | truncate(200) }}).
          Export may still work with basic auth; roxctl scan steps will be SCAN_UNAVAILABLE.

- name: Derive ROX host from ACS Central URL
  ansible.builtin.set_fact:
    cve_analyzer_rox_host: >-
      {{
        cve_analyzer_acs_central_url
        | default('')
        | regex_replace('^https?://', '')
        | regex_replace('/.*$', '')
        | regex_replace(':$', '')
        | trim
      }}

- name: Normalize ROX endpoint to host:443
  ansible.builtin.set_fact:
    cve_analyzer_rox_endpoint: >-
      {{
        cve_analyzer_rox_host
        if (cve_analyzer_rox_host is search(':[0-9]+$'))
        else (cve_analyzer_rox_host ~ ':443')
      }}

- name: Show normalized ROX endpoint
  ansible.builtin.debug:
    msg: "ROX_ENDPOINT={{ cve_analyzer_rox_endpoint }}"
