---
# Record one artifact file size (bytes) into cve_analyzer_artifact_sizes.
# Expects:
#   cve_analyzer_artifact_label — summary key (e.g. RHACS Export NDJSON)
#   cve_analyzer_artifact_path  — absolute path
# Does not read file contents (sizes only; no secrets / report body).
- name: "Stat artifact — {{ cve_analyzer_artifact_label }}"
  ansible.builtin.stat:
    path: "{{ cve_analyzer_artifact_path }}"
  register: cve_analyzer_artifact_stat_tmp

- name: "Record artifact size — {{ cve_analyzer_artifact_label }}"
  ansible.builtin.set_fact:
    cve_analyzer_artifact_sizes: >-
      {{
        (cve_analyzer_artifact_sizes | default({}))
        | combine({
            cve_analyzer_artifact_label: {
              'bytes': (
                cve_analyzer_artifact_stat_tmp.stat.size | default(0) | int
                if (cve_analyzer_artifact_stat_tmp.stat.exists | default(false))
                else -1
              ),
              'exists': (cve_analyzer_artifact_stat_tmp.stat.exists | default(false) | bool)
            }
          })
      }}
