---
- name: Resolve posture dashboard URL for recap
  when: cve_analyzer_print_banner | bool
  ansible.builtin.set_fact:
    cve_analyzer_recap_dashboard_url: >-
      {{
        cve_analyzer_posture_dashboard_url
        | default(
            (
              (
                cve_analyzer_grafana_url
                | default(grafana_url | default(''))
                | regex_replace('/$', '')
              )
              ~ '/d/'
              ~ (cve_analyzer_vuln_dashboard_uid | default('ado-rhacs-vuln-posture'))
            )
            if (
              (
                cve_analyzer_grafana_url
                | default(grafana_url | default(''))
                | length
              ) > 0
            )
            else '(not published)'
          )
      }}

- name: Print endpoint recap (bottom)
  when: cve_analyzer_print_banner | bool
  ansible.builtin.debug:
    msg:
      - "======= CVE Analyzer recap ======="
      - >-
        Action:
        {{ cve_analyzer_action }}
      - >-
        OpenShift URL:
        {{
          cve_analyzer_ocp_host
          | default(host | default(api_host | default('(unset)')))
        }}
      - >-
        Grafana URL:
        {{
          (
            cve_analyzer_grafana_url
            | default(grafana_url | default('(unset)'))
          )
          | regex_replace('/$', '')
        }}
      - >-
        ACS URL:
        {{
          (
            cve_analyzer_acs_central_url
            | default(acs_central_url | default('(unset)'))
          )
          | regex_replace('/$', '')
        }}
      - >-
        Dashboard URL:
        {{
          cve_analyzer_recap_dashboard_url
          | default('(not published)')
        }}
      - "=================================="
