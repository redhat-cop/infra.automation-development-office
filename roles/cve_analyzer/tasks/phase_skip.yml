---
# Record a phase as SKIPPED (not executed on this run).
# Expects cve_analyzer_timing_phase (string).
- name: "Record skipped — {{ cve_analyzer_timing_phase }}"
  ansible.builtin.set_fact:
    cve_analyzer_phase_times: >-
      {{
        (cve_analyzer_phase_times | default({}))
        | combine({
            cve_analyzer_timing_phase: {
              'status': 'skipped',
              'seconds': ''
            }
          })
      }}
