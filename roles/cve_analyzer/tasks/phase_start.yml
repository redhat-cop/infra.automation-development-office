---
# Start a named execution phase. Expects cve_analyzer_timing_phase (string).
- name: "Mark start — {{ cve_analyzer_timing_phase }}"
  ansible.builtin.set_fact:
    cve_analyzer_timing_mark: "{{ lookup('pipe', 'date +%s.%N') }}"
    cve_analyzer_timing_phase_active: "{{ cve_analyzer_timing_phase }}"
