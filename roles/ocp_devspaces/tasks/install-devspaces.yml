---
# ----------------------------
# 0) Resolve namespaces and config from component_config / components_env
# ----------------------------
- name: Build shared Dev Spaces desired configuration
  ansible.builtin.import_tasks: build-checluster.yml

# ----------------------------
# 1) Wait for Dev Spaces CSV (operator install namespace)
# ----------------------------
- name: Wait for Dev Spaces CSV to reach 'Succeeded'
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp_devspaces_operator_ns }}"
  register: ocp_devspaces_csvs
  retries: "{{ ocp_devspaces_csv_retries | default(36) | int }}"
  delay: "{{ ocp_devspaces_csv_delay | default(10) | int }}"
  until: >
    (
      ocp_devspaces_csvs.resources
      | default([])
      | selectattr('metadata.name', 'search', 'devspacesoperator')
      | selectattr('status', 'defined')
      | selectattr('status.phase', 'defined')
      | selectattr('status.phase', 'equalto', 'Succeeded')
      | list
      | length
    ) > 0
  # Avoid dumping every CSV in the shared operator NS (e.g. Confluent) on timeout.
  failed_when: false

- name: Assert Dev Spaces CSV Succeeded
  ansible.builtin.assert:
    that:
      - >
        (
          ocp_devspaces_csvs.resources
          | default([])
          | selectattr('metadata.name', 'search', 'devspacesoperator')
          | selectattr('status', 'defined')
          | selectattr('status.phase', 'defined')
          | selectattr('status.phase', 'equalto', 'Succeeded')
          | list
          | length
        ) > 0
    fail_msg: >-
      Dev Spaces CSV not Succeeded in {{ ocp_devspaces_operator_ns }} after
      {{ ocp_devspaces_csv_retries | default(36) }} attempts.
      Matching CSVs: {{
        ocp_devspaces_csvs.resources
        | default([])
        | selectattr('metadata.name', 'search', 'devspacesoperator')
        | map(attribute='metadata.name')
        | list
      }}
      phases: {{
        ocp_devspaces_csvs.resources
        | default([])
        | selectattr('metadata.name', 'search', 'devspacesoperator')
        | map(attribute='status.phase')
        | list
      }}

# ----------------------------
# 2) Ensure app namespace exists
# ----------------------------
- name: Ensure DevSpaces app namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp_devspaces_app_ns }}"

# ----------------------------
# 3) Build CheCluster spec
# ----------------------------
# ----------------------------
# 4) Deploy CheCluster
# ----------------------------
- name: Deploy CheCluster to enable DevSpaces (app namespace)
  kubernetes.core.k8s:
    state: present
    definition: '{{ ocp_devspaces_checluster_resource }}'
  register: ocp_devspaces_checluster_apply

# ----------------------------
# 5) Getting-started samples ConfigMap (remove defaults / set custom)
# ----------------------------
- name: Resolve bundled ADO sample icon into custom_samples when requested
  when:
    - ocp_devspaces_disable_default_samples | default(true) | bool
    - (ocp_devspaces_custom_samples | default([]) | length) > 0
    - (ocp_devspaces_custom_sample_icon_source | default('bundled')) == 'bundled'
      or (
        (ocp_devspaces_custom_samples | first).icon_source | default('') == 'bundled'
      )
  block:
    - name: Read bundled ado-sample-icon.png from role files
      ansible.builtin.slurp:
        src: "{{ role_path }}/files/ado-sample-icon.png"
      register: ocp_devspaces_bundled_icon
      failed_when: false

    - name: Inject bundled icon base64 into custom_samples entries missing icon
      when: (ocp_devspaces_bundled_icon.content | default('') | length) > 0
      ansible.builtin.set_fact:
        ocp_devspaces_custom_samples: >-
          {{
            ocp_devspaces_custom_samples
            | map('combine', {
                'icon': {
                  'base64data': ocp_devspaces_bundled_icon.content,
                  'mediatype': 'image/png'
                }
              }, recursive=True)
            | list
          }}
      # Always inject when this block runs (bundled path). Upload path skips the block.

    - name: Drop icon_source helper key from samples payload
      ansible.builtin.set_fact:
        ocp_devspaces_custom_samples: >-
          {{
            ocp_devspaces_custom_samples
            | map('dict2items')
            | map('rejectattr', 'key', 'equalto', 'icon_source')
            | map('items2dict')
            | list
          }}

- name: Normalize custom getting-started samples payload
  ansible.builtin.set_fact:
    ocp_devspaces_samples_json: >-
      {{
        ocp_devspaces_custom_samples
        if (ocp_devspaces_custom_samples is string)
        else (ocp_devspaces_custom_samples | default([]) | to_json)
      }}
  when: ocp_devspaces_disable_default_samples | bool

- name: Replace getting-started samples with custom or empty list
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: getting-started-samples
        namespace: "{{ ocp_devspaces_app_ns }}"
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: getting-started-samples
      data:
        my-samples.json: "{{ ocp_devspaces_samples_json | default('[]') }}"
  when: ocp_devspaces_disable_default_samples | bool

# Only when no custom_samples were provided — otherwise custom (with icon) wins.
- name: Add optional default sample from default_devfile_url
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: getting-started-samples
        namespace: "{{ ocp_devspaces_app_ns }}"
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: getting-started-samples
      data:
        my-samples.json: >-
          {{
            [
              {
                'displayName': 'Default workspace',
                'description': 'Organization default Dev Spaces workspace',
                'tags': ['default'],
                'url': ocp_devspaces_default_devfile_url
              }
            ] | to_json
          }}
  when:
    - ocp_devspaces_disable_default_samples | bool
    - ocp_devspaces_customize_workspace | bool
    - (ocp_devspaces_default_devfile_url | default('') | length) > 0
    - (ocp_devspaces_custom_samples | default([]) | length) == 0

# ----------------------------
# 6) Wait for CheCluster to become usable (cheURL present)
# ----------------------------
- name: Wait for CheCluster to report cheURL
  kubernetes.core.k8s_info:
    api_version: org.eclipse.che/v2
    kind: CheCluster
    name: "{{ ocp_devspaces_checluster_resource.metadata.name }}"
    namespace: "{{ ocp_devspaces_checluster_resource.metadata.namespace }}"
  register: ocp_devspaces_checluster
  retries: 36
  delay: 15
  until: >
    (ocp_devspaces_checluster.resources | default([]) | length) > 0 and
    ((ocp_devspaces_checluster.resources[0].status.cheURL | default('')) | length) > 0
  failed_when: false

- name: List CheClusters in app namespace when named wait returned empty
  when: (ocp_devspaces_checluster.resources | default([]) | length) == 0
  kubernetes.core.k8s_info:
    api_version: org.eclipse.che/v2
    kind: CheCluster
    namespace: "{{ ocp_devspaces_checluster_resource.metadata.namespace }}"
  register: ocp_devspaces_checluster_listed
  failed_when: false

- name: Fail with CheCluster wait context
  when: >-
    (ocp_devspaces_checluster.resources | default([]) | length) == 0
    or ((ocp_devspaces_checluster.resources[0].status.cheURL | default('')) | length) == 0
  ansible.builtin.fail:
    msg: >-
      CheCluster {{ ocp_devspaces_checluster_resource.metadata.namespace }}/{{
      ocp_devspaces_checluster_resource.metadata.name }} did not report cheURL.
      Named lookup count={{ ocp_devspaces_checluster.resources | default([]) | length }}.
      Namespace CheClusters={{
        ocp_devspaces_checluster_listed.resources | default([])
        | map(attribute='metadata.name') | list
      }}.
      Check operator logs and CheCluster status conditions.

- name: Show DevSpaces URL
  ansible.builtin.debug:
    msg:
      - "DevSpaces operator namespace: {{ ocp_devspaces_operator_ns }}"
      - "DevSpaces app namespace: {{ ocp_devspaces_app_ns }}"
      - "cheURL: {{ ocp_devspaces_checluster.resources[0].status.cheURL | default('') }}"
      - "disable_default_samples: {{ ocp_devspaces_disable_default_samples }}"
      - "customize_workspace: {{ ocp_devspaces_customize_workspace }}"
      - "status_exporter_enabled: {{ ocp_devspaces_status_exporter_enabled }}"

# ----------------------------
# 7) Optional DevWorkspace status metrics (Grafana)
# ----------------------------
- name: Deploy DevWorkspace status metrics exporter
  ansible.builtin.import_tasks: status-exporter.yml
  when: ocp_devspaces_status_exporter_enabled | default(false) | bool
