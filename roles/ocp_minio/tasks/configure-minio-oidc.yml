---
# yamllint disable rule:line-length
- name: Resolve MinIO console and API hostnames for OIDC
  ansible.builtin.set_fact:
    ocp_minio_console_hostname_effective: >-
      {{
        minio_console_hostname
        | default(hostname)
        | default('minio-console-' ~ (name_space | default('minio')) ~ '.'
          ~ (apps_domain | default(app_domain | default('apps.example.com'))))
      }}
    ocp_minio_api_hostname_effective: >-
      {{
        minio_api_hostname
        | default('minio-api-' ~ (name_space | default('minio')) ~ '.'
          ~ (apps_domain | default(app_domain | default('apps.example.com'))))
      }}

- name: Resolve MinIO OIDC discovery URL
  ansible.builtin.set_fact:
    ocp_minio_console_url: "https://{{ ocp_minio_console_hostname_effective }}"
    ocp_minio_oidc_config_url_effective: >-
      {{
            minio_oidc_config_url
        | default(
            (
              minio_oidc_issuer | default('', true)
              | default(
                  'https://'
                  ~ (
                    minio_keycloak_hostname
                    | default(rhbk_hostname)
                    | default(keycloak_hostname)
                    | default('keycloak.' ~ (apps_domain | default(app_domain | default('apps.example.com'))))
                  )
                  ~ '/realms/'
                  ~ (
                    minio_keycloak_realm
                    | default(rhbk_realm)
                    | default(ocp_rhbk_realm)
                    | default('rhlab')
                  ),
                  true
                )
            )
            ~ '/.well-known/openid-configuration'
          )
      }}

- name: Configure MinIO Keycloak OIDC client and secret
  ansible.builtin.import_tasks: configure-keycloak-oidc.yml
  when: minio_oidc_enabled | default(false) | bool

- name: Create MinIO OIDC Secret when enabled
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: minio-oidc
        namespace: "{{ name_space }}"
        labels:
          app.kubernetes.io/name: minio
          app.kubernetes.io/component: oidc
      type: Opaque
      stringData:
        MINIO_IDENTITY_OPENID_CLIENT_ID: "{{ minio_oidc_client_id }}"
        MINIO_IDENTITY_OPENID_CLIENT_SECRET: "{{ ocp_minio_oidc_client_secret | default('') }}"
        MINIO_IDENTITY_OPENID_CONFIG_URL: "{{ ocp_minio_oidc_config_url_effective }}"
        MINIO_IDENTITY_OPENID_CLAIM_NAME: "{{ minio_oidc_claim_name | default('policy') }}"
        MINIO_IDENTITY_OPENID_DISPLAY_NAME: "{{ minio_oidc_display_name | default('Keycloak') }}"
        MINIO_IDENTITY_OPENID_SCOPES: "{{ minio_oidc_scopes | default('openid,profile,email') }}"
  when:
    - minio_oidc_enabled | default(false) | bool
    - ocp_minio_oidc_client_secret is defined
    - (ocp_minio_oidc_client_secret | string | length) > 0
  no_log: true

# JSON merge patch replaces the containers array when a partial container is
# supplied. Build a full definition from the live Deployment so image, mounts,
# probes, resources, sibling containers, and existing env/envFrom stay intact.
- name: Read MinIO Deployment for OIDC patch
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ minio_deployment_name | default('minio') }}"
    namespace: "{{ name_space }}"
  register: ocp_minio_deploy_for_oidc
  when: minio_oidc_enabled | default(false) | bool

- name: Fail when MinIO Deployment is missing for OIDC
  ansible.builtin.fail:
    msg: >-
      MinIO Deployment '{{ minio_deployment_name | default('minio') }}' was not
      found in namespace '{{ name_space }}'. Deploy MinIO before Configure MinIO
      OIDC. Do not recreate the PVC or delete MinIO storage to fix OIDC.
  when:
    - minio_oidc_enabled | default(false) | bool
    - (ocp_minio_deploy_for_oidc.resources | default([]) | length) == 0

- name: Build safe MinIO OIDC Deployment definition
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/minio_oidc_deployment_patch.py"
      - "-"
    stdin: >-
      {{
        {
          'deployment': ocp_minio_deploy_for_oidc.resources[0],
          'container_name': minio_container_name | default('minio'),
          'oidc_secret_name': 'minio-oidc',
          'redirect_url': ocp_minio_console_url,
          'annotation_key': 'ado.infra/minio-oidc',
          'annotation_value': 'enabled',
          'deployment_name': minio_deployment_name | default('minio'),
          'namespace': name_space
        } | to_json
      }}
  register: ocp_minio_oidc_deploy_patch_cmd
  changed_when: false
  failed_when: false
  when: minio_oidc_enabled | default(false) | bool

- name: Fail clearly when MinIO OIDC Deployment patch build fails
  ansible.builtin.fail:
    msg: >-
      Failed to build MinIO OIDC Deployment patch (missing Deployment or
      target container '{{ minio_container_name | default('minio') }}', or
      patch helper error). Details:
      {{ ocp_minio_oidc_deploy_patch_cmd.stderr | default('no stderr') }}
  when:
    - minio_oidc_enabled | default(false) | bool
    - (ocp_minio_oidc_deploy_patch_cmd.rc | default(0) | int) != 0

- name: Store patched MinIO Deployment definition for OIDC
  ansible.builtin.set_fact:
    ocp_minio_oidc_deployment_definition: >-
      {{ (ocp_minio_oidc_deploy_patch_cmd.stdout | from_json).definition }}
  when:
    - minio_oidc_enabled | default(false) | bool
    - (ocp_minio_oidc_deploy_patch_cmd.rc | default(1) | int) == 0

- name: Apply MinIO Deployment OIDC patch (full live object)
  kubernetes.core.k8s:
    state: present
    definition: "{{ ocp_minio_oidc_deployment_definition }}"
  when:
    - minio_oidc_enabled | default(false) | bool
    - ocp_minio_oidc_deployment_definition is defined
