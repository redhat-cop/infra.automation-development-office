---
# SPDX-License-Identifier: GPL-3.0-or-later
# MinIO object storage on OpenShift (Deployment + Routes + optional Keycloak OIDC).

state: present
name_space: minio

minio_image: quay.io/minio/minio:latest
minio_image_pull_policy: IfNotPresent

minio_root_user: minioadmin
minio_root_password: redhat123

minio_storage_size: 20Gi
minio_storage_access_mode: ReadWriteOnce

minio_deployment_name: minio
minio_service_name: minio
minio_api_port: 9000
minio_console_port: 9090

# Routes (console host used for OIDC redirect)
minio_console_hostname: ""
minio_api_hostname: ""
minio_route_tls_termination: edge
minio_route_insecure_policy: Redirect

# OIDC / Keycloak (MinIO console OpenID)
minio_oidc_enabled: true
minio_oidc_client_id: minio
minio_oidc_client_secret: ""
minio_oidc_display_name: Keycloak
minio_oidc_claim_name: policy
minio_oidc_policy_value: consoleAdmin
minio_oidc_scopes: "openid,profile,email"
minio_oidc_config_url: ""
minio_oidc_issuer: ""
# Default yes so legacy playbooks without create_client stay managed.
# Matching rhbk.clients[].create_client=false (or an explicit false here)
# skips every Keycloak mutation, including the policy mapper.
minio_oidc_create_keycloak_client: true
minio_oidc_create_policy_mapper: true

minio_resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
