---
# yamllint disable rule:line-length
- name: NFS CSI | Resolve OpenShift connection kwargs
  ansible.builtin.set_fact:
    ocp_nfs_storage_k8s_auth: >-
      {{
        {}
        | combine(
          {'host': ocp_nfs_storage_connection.host}
          if (ocp_nfs_storage_connection.host | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {'api_key': ocp_nfs_storage_connection.api_key}
          if (ocp_nfs_storage_connection.api_key | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {'kubeconfig': ocp_nfs_storage_connection.kubeconfig}
          if (ocp_nfs_storage_connection.kubeconfig | default('') | length > 0)
          else {},
          recursive=true
        )
        | combine(
          {
            'validate_certs': ocp_nfs_storage_connection.validate_certs
            | default(true)
            | bool
          }
          if (
            ocp_nfs_storage_connection.host is defined
            or ocp_nfs_storage_connection.kubeconfig is defined
          )
          else {},
          recursive=true
        )
      }}

- name: NFS CSI | Assert NFS server and share are set
  ansible.builtin.assert:
    that:
      - ocp_nfs_storage_server | default('') | length > 0
      - ocp_nfs_storage_share | default('') | length > 0
      - ocp_nfs_storage_class_name | default('') | length > 0
    fail_msg: >-
      ocp_nfs_storage_server, ocp_nfs_storage_share, and
      ocp_nfs_storage_class_name are required.

- name: NFS CSI | Resolve Helm chart reference
  ansible.builtin.set_fact:
    ocp_nfs_storage__use_local_chart: >-
      {{
        (ocp_nfs_storage_chart_path | default('') | length > 0)
        or (ocp_nfs_storage_use_bundled_chart | default(true) | bool)
      }}
    ocp_nfs_storage__chart_ref: >-
      {{
        ocp_nfs_storage_chart_path
        if (ocp_nfs_storage_chart_path | default('') | length > 0)
        else (
          (
            role_path
            ~ '/files/charts/csi-driver-nfs-'
            ~ ocp_nfs_storage_driver_version
            ~ '.tgz'
          )
          if (ocp_nfs_storage_use_bundled_chart | default(true) | bool)
          else 'csi-driver-nfs/csi-driver-nfs'
        )
      }}

- name: NFS CSI | Assert bundled chart archive exists
  when:
    - ocp_nfs_storage__use_local_chart | bool
    - ocp_nfs_storage_chart_path | default('') | length == 0
  ansible.builtin.stat:
    path: "{{ ocp_nfs_storage__chart_ref }}"
  register: ocp_nfs_storage__bundled_chart

- name: NFS CSI | Fail when bundled chart is missing
  when:
    - ocp_nfs_storage__use_local_chart | bool
    - ocp_nfs_storage_chart_path | default('') | length == 0
    - not (ocp_nfs_storage__bundled_chart.stat.exists | default(false))
  ansible.builtin.fail:
    msg: >-
      Bundled Helm chart not found at {{ ocp_nfs_storage__chart_ref }}.
      Ship files/charts/csi-driver-nfs-{{ ocp_nfs_storage_driver_version }}.tgz
      with the collection, set ocp_nfs_storage_chart_path, or set
      ocp_nfs_storage_use_bundled_chart=false to use the GitHub helm repo.

- name: NFS CSI | Ensure Helm repo for csi-driver-nfs is present
  when: not (ocp_nfs_storage__use_local_chart | bool)
  kubernetes.core.helm_repository:
    name: "{{ ocp_nfs_storage_helm_repo_name }}"
    repo_url: "{{ ocp_nfs_storage_helm_repo_url }}"

- name: NFS CSI | Install csi-driver-nfs with Helm (local chart)
  when: ocp_nfs_storage__use_local_chart | bool
  kubernetes.core.helm:
    name: "{{ ocp_nfs_storage_helm_release }}"
    chart_ref: "{{ ocp_nfs_storage__chart_ref }}"
    create_namespace: true
    namespace: "{{ ocp_nfs_storage_namespace }}"
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
    values:
      controller:
        runOnControlPlane: true
        replicas: 2
        strategyType: RollingUpdate
      externalSnapshotter:
        enabled: true
        customResourceDefinitions:
          enabled: false
  register: ocp_nfs_storage_helm_local

- name: NFS CSI | Install csi-driver-nfs with Helm (remote repo)
  when: not (ocp_nfs_storage__use_local_chart | bool)
  kubernetes.core.helm:
    name: "{{ ocp_nfs_storage_helm_release }}"
    chart_ref: csi-driver-nfs/csi-driver-nfs
    chart_version: "{{ ocp_nfs_storage_driver_version }}"
    create_namespace: true
    namespace: "{{ ocp_nfs_storage_namespace }}"
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
    values:
      controller:
        runOnControlPlane: true
        replicas: 2
        strategyType: RollingUpdate
      externalSnapshotter:
        enabled: true
        customResourceDefinitions:
          enabled: false
  register: ocp_nfs_storage_helm_remote

- name: NFS CSI | Assign privileged SCC to csi-nfs-node-sa
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: privileged-scc-to-csi-nfs-node-sa
        namespace: "{{ ocp_nfs_storage_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: csi-nfs-node-sa
          namespace: "{{ ocp_nfs_storage_namespace }}"
      roleRef:
        kind: ClusterRole
        name: system:openshift:scc:privileged
        apiGroup: rbac.authorization.k8s.io
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"

- name: NFS CSI | Assign privileged SCC to csi-nfs-controller-sa
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: privileged-scc-to-csi-nfs-controller-sa
        namespace: "{{ ocp_nfs_storage_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: csi-nfs-controller-sa
          namespace: "{{ ocp_nfs_storage_namespace }}"
      roleRef:
        kind: ClusterRole
        name: system:openshift:scc:privileged
        apiGroup: rbac.authorization.k8s.io
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"

- name: NFS CSI | Apply NFS StorageClass
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'ansible.builtin.template',
          'storageclass.yaml.j2'
        ) | from_yaml
      }}
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
  register: ocp_nfs_storage_storageclass_apply

- name: NFS CSI | Ensure test namespace exists
  when: ocp_nfs_storage_create_test_namespace | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp_nfs_storage_test_namespace }}"
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
  register: ocp_nfs_storage_test_namespace_apply

- name: NFS CSI | Look up existing test PVC before apply
  when:
    - ocp_nfs_storage_create_test_pvc | bool
    - ocp_nfs_storage_create_test_namespace | bool
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ ocp_nfs_storage_test_pvc_name }}"
    namespace: "{{ ocp_nfs_storage_test_namespace }}"
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
  register: ocp_nfs_storage_test_pvc_lookup
  failed_when: false

- name: NFS CSI | Fail clearly when test PVC StorageClass cannot change
  when:
    - ocp_nfs_storage_create_test_pvc | bool
    - ocp_nfs_storage_create_test_namespace | bool
    - (ocp_nfs_storage_test_pvc_lookup.resources | default([]) | length) > 0
    - >-
      (
        ocp_nfs_storage_test_pvc_lookup.resources[0].spec.storageClassName
        | default('')
      )
      | length > 0
    - >-
      (
        ocp_nfs_storage_test_pvc_lookup.resources[0].spec.storageClassName
        | default('')
      )
      != (ocp_nfs_storage_class_name | string)
  ansible.builtin.fail:
    msg: >-
      Test PVC {{ ocp_nfs_storage_test_namespace }}/{{ ocp_nfs_storage_test_pvc_name }}
      already exists with StorageClass
      '{{ ocp_nfs_storage_test_pvc_lookup.resources[0].spec.storageClassName }}',
      but this run requests '{{ ocp_nfs_storage_class_name }}'.
      Bound PVC specs are immutable — ADO will not patch or delete the claim.
      Helm/SCC/StorageClass steps above may have succeeded; treat PVC validation
      as failed separately. Fix: set openshift.nfs_create_test_pvc=false, or use
      a dedicated ocp_nfs_storage_test_pvc_name, or remove only this unused test
      PVC after confirming no workloads depend on it.

- name: NFS CSI | Apply test PVC
  when:
    - ocp_nfs_storage_create_test_pvc | bool
    - ocp_nfs_storage_create_test_namespace | bool
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'ansible.builtin.template',
          'test-pvc.yaml.j2'
        ) | from_yaml
      }}
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
  register: ocp_nfs_storage_test_pvc_apply

- name: NFS CSI | Wait for test PVC Bound
  when:
    - ocp_nfs_storage_create_test_pvc | bool
    - ocp_nfs_storage_create_test_namespace | bool
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ ocp_nfs_storage_test_pvc_name }}"
    namespace: "{{ ocp_nfs_storage_test_namespace }}"
    host: "{{ ocp_nfs_storage_k8s_auth.host | default(omit) }}"
    api_key: "{{ ocp_nfs_storage_k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ ocp_nfs_storage_k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ ocp_nfs_storage_k8s_auth.validate_certs | default(omit) }}"
  register: ocp_nfs_storage_test_pvc_bound
  until: >-
    (
      ocp_nfs_storage_test_pvc_bound.resources
      | default([])
      | length
    ) > 0
    and (
      ocp_nfs_storage_test_pvc_bound.resources[0].status.phase
      | default('')
    ) == 'Bound'
  retries: 30
  delay: 10
  # Keep going so the independent result summary can report PVC vs driver/SC.
  failed_when: false

- name: NFS CSI | Report independent validation results
  ansible.builtin.set_fact:
    ocp_nfs_storage_result:
      driver_install: >-
        {{
          'ok'
          if (
            (
              ocp_nfs_storage_helm_local is defined
              and not (ocp_nfs_storage_helm_local.failed | default(false))
              and not (ocp_nfs_storage_helm_local.skipped | default(false))
            )
            or (
              ocp_nfs_storage_helm_remote is defined
              and not (ocp_nfs_storage_helm_remote.failed | default(false))
              and not (ocp_nfs_storage_helm_remote.skipped | default(false))
            )
            or (
              (ocp_nfs_storage_helm_local.skipped | default(false))
              and (ocp_nfs_storage_helm_remote.skipped | default(false))
            )
          )
          else 'failed'
        }}
      storage_class: >-
        {{
          'ok'
          if (
            ocp_nfs_storage_storageclass_apply is defined
            and not (ocp_nfs_storage_storageclass_apply.failed | default(false))
          )
          else 'failed'
        }}
      storage_class_name: "{{ ocp_nfs_storage_class_name }}"
      test_namespace: >-
        {{
          'skipped'
          if not (ocp_nfs_storage_create_test_namespace | bool)
          else (
            'ok'
            if (
              ocp_nfs_storage_test_namespace_apply is defined
              and not (ocp_nfs_storage_test_namespace_apply.failed | default(false))
            )
            else 'failed'
          )
        }}
      test_namespace_name: "{{ ocp_nfs_storage_test_namespace }}"
      test_pvc: >-
        {{
          'skipped'
          if not (
            ocp_nfs_storage_create_test_pvc | bool
            and ocp_nfs_storage_create_test_namespace | bool
          )
          else (
            'ok'
            if (
              ocp_nfs_storage_test_pvc_bound is defined
              and (
                ocp_nfs_storage_test_pvc_bound.resources
                | default([])
                | length
              ) > 0
              and (
                ocp_nfs_storage_test_pvc_bound.resources[0].status.phase
                | default('')
              ) == 'Bound'
            )
            else 'failed'
          )
        }}
      test_pvc_name: "{{ ocp_nfs_storage_test_pvc_name }}"
      overall: >-
        {{
          'ok'
          if (
            (
              ocp_nfs_storage_storageclass_apply is defined
              and not (ocp_nfs_storage_storageclass_apply.failed | default(false))
            )
            and (
              not (ocp_nfs_storage_create_test_namespace | bool)
              or (
                ocp_nfs_storage_test_namespace_apply is defined
                and not (ocp_nfs_storage_test_namespace_apply.failed | default(false))
              )
            )
            and (
              not (
                ocp_nfs_storage_create_test_pvc | bool
                and ocp_nfs_storage_create_test_namespace | bool
              )
              or (
                ocp_nfs_storage_test_pvc_bound is defined
                and (
                  ocp_nfs_storage_test_pvc_bound.resources
                  | default([])
                  | length
                ) > 0
                and (
                  ocp_nfs_storage_test_pvc_bound.resources[0].status.phase
                  | default('')
                ) == 'Bound'
              )
            )
          )
          else 'failed'
        }}

- name: NFS CSI | Print validation summary
  ansible.builtin.debug:
    msg: >-
      NFS CSI results —
      driver={{ ocp_nfs_storage_result.driver_install }},
      StorageClass={{ ocp_nfs_storage_result.storage_class }}
      ({{ ocp_nfs_storage_result.storage_class_name }}),
      test_namespace={{ ocp_nfs_storage_result.test_namespace }}
      ({{ ocp_nfs_storage_result.test_namespace_name }}),
      test_pvc={{ ocp_nfs_storage_result.test_pvc }}
      ({{ ocp_nfs_storage_result.test_pvc_name }}),
      overall={{ ocp_nfs_storage_result.overall }}

- name: NFS CSI | Fail Bootstrap when required NFS validation failed
  when: (ocp_nfs_storage_result.overall | default('failed')) != 'ok'
  ansible.builtin.fail:
    msg: >-
      NFS CSI validation failed
      (driver={{ ocp_nfs_storage_result.driver_install }},
      StorageClass={{ ocp_nfs_storage_result.storage_class }},
      test_namespace={{ ocp_nfs_storage_result.test_namespace }},
      test_pvc={{ ocp_nfs_storage_result.test_pvc }}).
      Overall Bootstrap must not report success when required NFS checks fail.
