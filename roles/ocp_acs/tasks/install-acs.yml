---
# ============================================================
# RHACS / ACS Central install (deterministic admin password)
# Your operator requires:
# - spec.central.adminPasswordSecret.name
# - Secret must contain a non-empty, single-line "password" entry (PLAINTEXT)
# ============================================================

- name: Validate required ACS vars
  ansible.builtin.assert:
    that:
      - ocp_acs_namespace is defined
      - ocp_acs_namespace | length > 0
      - ocp_acs_namespace != "openshift-operators"
      - not (ocp_acs_namespace is match("^openshift-"))
      - (ocp_acs_admin_password is defined) and (ocp_acs_admin_password | length > 0)
      - (ocp_acs_admin_password is not match(".*\\n.*")) # single line only
    fail_msg: >-
      Missing/invalid vars. Ensure:
      - ocp_acs_namespace is a non-system namespace (e.g. stackrox)
      - ocp_acs_admin_password is set and single-line (plaintext)
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Ensure operand namespace exists
# ------------------------------------------------------------
- name: Ensure ACS operand namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp_acs_namespace }}"
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Optional clean reinstall (so you can SEE it work)
# ------------------------------------------------------------
- name: Delete Central CR (clean reinstall)
  kubernetes.core.k8s:
    state: absent
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    namespace: "{{ ocp_acs_namespace }}"
    name: "{{ ocp_acs_central_name }}"
  when: (ocp_acs_reinstall | default(false)) | bool
  tags: [acs, rhacs, central]

- name: Delete Central route (clean reinstall)
  kubernetes.core.k8s:
    state: absent
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ ocp_acs_namespace }}"
    name: "{{ ocp_acs_route_name }}"
  when: (ocp_acs_reinstall | default(false)) | bool
  tags: [acs, rhacs, central]

- name: Delete operator-generated htpasswd secret (clean reinstall)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: "{{ ocp_acs_namespace }}"
    name: central-htpasswd
  when:
    - (ocp_acs_reinstall | default(false)) | bool
    - (ocp_acs_delete_operator_generated_htpasswd | default(true)) | bool
  no_log: true
  tags: [acs, rhacs, central]

- name: Delete admin password secret (clean reinstall)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: "{{ ocp_acs_namespace }}"
    name: "{{ ocp_acs_admin_password_secret }}"
  when: (ocp_acs_reinstall | default(false)) | bool
  no_log: true
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Clean DB so central-db-password and DB state match
# (LAB SAFE: destroys Central DB data)
# ------------------------------------------------------------
- name: Delete central-db StatefulSet (reset DB)
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ ocp_acs_namespace }}"
    name: central-db
  when: (ocp_acs_reinstall | default(false)) | bool

- name: Delete central-db Service (reset DB)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    namespace: "{{ ocp_acs_namespace }}"
    name: central-db
  when: (ocp_acs_reinstall | default(false)) | bool

- name: Delete central-db-password secret (force regeneration)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: "{{ ocp_acs_namespace }}"
    name: central-db-password
  when: (ocp_acs_reinstall | default(false)) | bool
  no_log: true

- name: Delete central-db PVC (reset DB storage)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ ocp_acs_namespace }}"
    name: central-db
  when: (ocp_acs_reinstall | default(false)) | bool

- name: Delete any central-db PVCs by label (reset DB storage)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_pvcs
  when: (ocp_acs_reinstall | default(false)) | bool

- name: Remove matching central-db PVCs
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ ocp_acs_namespace }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ (ocp_acs_pvcs.resources | default([])) }}"
  when:
    - (ocp_acs_reinstall | default(false)) | bool
    - item.metadata.name is match('^data-.*central-db.*') or item.metadata.name is match('^central-db.*')

# PVC finalizers can leave "being deleted" for minutes; Central then stays Pending.
- name: Wait for central-db PVCs to finish deleting (reinstall)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_pvcs_after_delete
  until: >-
    (
      ocp_acs_pvcs_after_delete.resources
      | default([])
      | selectattr('metadata.name', 'match', '^(data-.*)?central-db.*')
      | list
      | length
    ) == 0
  retries: "{{ ocp_acs_pvc_delete_retries | default(36) | int }}"
  delay: "{{ ocp_acs_pvc_delete_delay | default(5) | int }}"
  when: enable_bootstrap | default(true) | bool

# ------------------------------------------------------------
# Ensure PVCs referenced by Central exist (claimName does not auto-create).
# Prior reinstalls may have deleted central-db while Central still expects it.
# Never invent a cluster "default" StorageClass — storage must come from
# preflight / group_vars (storage, storage_class, ocp_acs_storage_class).
# When unset, omit storageClassName so existing bound claims are not patched
# to storageClassName: "" (immutable / Forbidden).
# ------------------------------------------------------------
- name: Resolve ACS storage class for PVCs
  ansible.builtin.set_fact:
    ocp_acs_storage_class_effective: >-
      {{
        (
          ocp_acs_storage_class
          | default(storage, true)
          | default(storage_class, true)
          | default('', true)
        )
        | string
        | trim
      }}
  tags: [acs, rhacs, central]

- name: Ensure ACS Central / DB PVCs exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ ocp_acs_namespace }}"
      spec: >-
        {{
          {
            'accessModes': ['ReadWriteOnce'],
            'resources': {'requests': {'storage': item.size}},
          }
          | combine(
              {'storageClassName': ocp_acs_storage_class_effective}
              if (ocp_acs_storage_class_effective | length > 0)
              else {}
            )
        }}
  loop:
    - name: "{{ ocp_acs_central_pvc_name | default('central-pvc') }}"
      size: "{{ ocp_acs_central_pvc_size | default('10Gi') }}"
    - name: "{{ ocp_acs_central_db_pvc_name | default('central-db') }}"
      size: "{{ ocp_acs_central_db_pvc_size | default('20Gi') }}"
    - name: "{{ ocp_acs_central_db_backup_pvc_name | default('central-db-backup') }}"
      size: "{{ ocp_acs_central_db_backup_pvc_size | default('20Gi') }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Create admin password secret (PLAINTEXT "password" key)
# ------------------------------------------------------------
- name: Create Central admin password secret (plaintext "password" entry)
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp_acs_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp_acs_admin_password_secret }}"
      type: Opaque
      stringData:
        password: "{{ ocp_acs_admin_password }}"
  no_log: true
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Deploy Central CR — lab-sized resources; Scanner V4 disabled by default
# (default ACS central-db requests ~4CPU/8Gi often stay Pending on lab nodes)
# ------------------------------------------------------------
- name: Deploy RHACS Central CR (adminPasswordSecret)
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp_acs_namespace }}"
    definition:
      apiVersion: platform.stackrox.io/v1alpha1
      kind: Central
      metadata:
        name: "{{ ocp_acs_central_name }}"
      spec:
        central:
          adminPasswordSecret:
            name: "{{ ocp_acs_admin_password_secret }}"
          exposure:
            loadBalancer:
              enabled: false
          persistence:
            persistentVolumeClaim:
              claimName: central-pvc
          resources:
            requests:
              cpu: "{{ ocp_acs_central_cpu_request | default('500m') }}"
              memory: "{{ ocp_acs_central_memory_request | default('1Gi') }}"
            limits:
              cpu: "{{ ocp_acs_central_cpu_limit | default('2') }}"
              memory: "{{ ocp_acs_central_memory_limit | default('4Gi') }}"
          db:
            resources:
              requests:
                cpu: "{{ ocp_acs_central_db_cpu_request | default('500m') }}"
                memory: "{{ ocp_acs_central_db_memory_request | default('1Gi') }}"
              limits:
                cpu: "{{ ocp_acs_central_db_cpu_limit | default('2') }}"
                memory: "{{ ocp_acs_central_db_memory_limit | default('4Gi') }}"
        scanner:
          analyzer:
            scaling:
              autoScaling: "Disabled"
              replicas: 1
        scannerV4:
          scannerComponent: Disabled
  no_log: true
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Wait for central-db then Central
# ------------------------------------------------------------
- name: Wait for central-db pod to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp_acs_namespace }}"
    label_selectors:
      - app=central-db
  register: ocp_acs_central_db_pods
  until: >-
    (ocp_acs_central_db_pods.resources | default([]) | length > 0)
    and (
      (ocp_acs_central_db_pods.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True')
        | list | length) > 0
    )
  retries: 90
  delay: 10
  tags: [acs, rhacs, central]

- name: Wait for central deployment to exist
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp_acs_central_name }}"
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_central_deploy
  until: ocp_acs_central_deploy.resources | length > 0
  retries: 60
  delay: 10
  tags: [acs, rhacs, central]

- name: Wait for central deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp_acs_central_name }}"
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_central_ready
  until:
    - ocp_acs_central_ready.resources | default([]) | length > 0
    - (ocp_acs_central_ready.resources[0].status.availableReplicas | default(0)) | int >= 1
  retries: 120
  delay: 10
  tags: [acs, rhacs, central]

# ------------------------------------------------------------
# Route (reencrypt) so the browser gets the OpenShift ingress /
# cert-manager lab cert, not Central's self-signed TLS.
# ------------------------------------------------------------
- name: Read Central CA for route reencrypt
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: central-tls
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_central_tls_secret
  no_log: true
  tags: [acs, rhacs, central]

- name: Create reencrypt route for Central
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp_acs_namespace }}"
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ ocp_acs_route_name }}"
      spec:
        host: "{{ ocp_acs_hostname | default(omit, true) }}"
        to:
          kind: Service
          name: "{{ ocp_acs_central_name }}"
        port:
          targetPort: https
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: >-
            {{
              ocp_acs_central_tls_secret.resources[0].data['ca.pem']
              | b64decode
            }}
        wildcardPolicy: None
  no_log: true
  tags: [acs, rhacs, central]

- name: Get Central route hostname
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ ocp_acs_route_name }}"
    namespace: "{{ ocp_acs_namespace }}"
  register: ocp_acs_central_route
  tags: [acs, rhacs, central]

- name: Show RHACS admin login info
  ansible.builtin.debug:
    msg:
      - "RHACS Login: https://{{ ocp_acs_central_route.resources[0].spec.host }}"
      - "Username: admin"
      - "Password: (ocp_acs_admin_password)"
      - "Admin secret: {{ ocp_acs_admin_password_secret }} (key: password)"
  tags: [acs, rhacs, central]

- name: Configure OpenShift OAuth auth provider for Central
  ansible.builtin.include_tasks: configure-openshift-auth.yml
  tags: [acs, rhacs, central, auth]
