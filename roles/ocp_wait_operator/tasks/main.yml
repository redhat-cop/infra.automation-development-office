---
# yamllint disable rule:line-length
# Operator CSV/deployments live in operator_subscription_namespace / operator_namespace,
# not always the app operand namespace (name_space). GitLab is the common mismatch.
#
# Never wait for a CSV when uninstalling. Prefer playbook gates (include_role when
# present) and this role-level when — do NOT use ``meta: end_role`` (ansible-core
# 2.18+ only; older EEs fail with ``invalid meta action requested: end_role``).
- name: Wait for operator CSV and deployment (install only)
  when: (state | default('present') | string | lower) == 'present'
  block:
    - name: Resolve operator wait namespace
      ansible.builtin.set_fact:
        ocp_wait_operator__namespace: >-
          {{
            (
              operator_namespace
              | default(operator_subscription_namespace, true)
              | default(name_space, true)
              | default('', true)
            )
            | string
            | trim
          }}

    - name: Assert operator wait namespace is set
      ansible.builtin.assert:
        that:
          - (ocp_wait_operator__namespace | length) > 0
        fail_msg: >-
          Operator wait namespace is empty. Set operator_namespace,
          operator_subscription_namespace, or name_space.

    # Resolve CSV/deployment match string once. Callers often only set operator_name;
    # aliases alone do nothing when neither substring nor csv_contains exists.
    - name: Resolve ocp_wait_operator_name_substring
      ansible.builtin.set_fact:
        ocp_wait_operator_name_substring: >-
          {{
            ocp_wait_operator_name_substring
            | default(operator_csv_contains)
            | default(operator_name)
            | default('')
            | string
            | trim
          }}
        # OLM CSV names often drop hyphens from the package name
        # (cluster-kube-descheduler-operator → clusterkubedescheduleroperator.vX).
        ocp_wait_operator__csv_match_alt: >-
          {{
            (
              ocp_wait_operator_name_substring
              | default(operator_csv_contains)
              | default(operator_name)
              | default('')
              | string
              | trim
              | regex_replace('-', '')
            )
          }}

    - name: Assert ocp_wait_operator_name_substring is set
      ansible.builtin.assert:
        that:
          - (ocp_wait_operator_name_substring | length) > 0
        fail_msg: >-
          ocp_wait_operator_name_substring is undefined/empty. Set
          ocp_wait_operator_name_substring, operator_csv_contains, or
          operator_name for component wait in namespace
          '{{ name_space | default("") }}'.

    - name: Wait for Operator CSV to appear
      block:
        - name: Wait for Operator CSV to appear
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: ClusterServiceVersion
            namespace: "{{ ocp_wait_operator__namespace }}"
          register: ocp_wait_operator__installed_operator_csvs
          # CSV names/phases are not secrets. no_log hid the real until error
          # (selectattr on missing status.phase) and printed "output hidden".
          until: >-
            {% set ns = namespace(ready=false) -%}
            {% for csv in
                 (ocp_wait_operator__installed_operator_csvs.resources | default([]))
            -%}
              {%- set csv_name = csv.metadata.name | default('') -%}
              {%- set csv_phase = (
                    csv.status.phase
                    if (csv.status is defined and csv.status.phase is defined)
                    else ''
                  ) -%}
              {%- if csv_phase == 'Succeeded'
                    and (
                      (
                        (ocp_wait_operator_name_substring | length) > 0
                        and ocp_wait_operator_name_substring in csv_name
                      )
                      or (
                        (ocp_wait_operator__csv_match_alt | length) > 0
                        and ocp_wait_operator__csv_match_alt in csv_name
                      )
                    )
              -%}
                {%- set ns.ready = true -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.ready }}
          retries: "{{ ((operator_install_timeout | default(900) | int) // (operator_poll_interval | default(10) | int)) | int }}"
          delay: "{{ operator_poll_interval | default(10) | int }}"
      rescue:
        - name: Read Subscriptions in operator wait namespace
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            namespace: "{{ ocp_wait_operator__namespace }}"
          register: ocp_wait_operator__subs

        - name: Summarize CSV and Subscription status for failure
          ansible.builtin.set_fact:
            ocp_wait_operator__csv_summary: >-
              {% set ns = namespace(rows=[]) -%}
              {% for csv in
                   (ocp_wait_operator__installed_operator_csvs.resources | default([]))
              -%}
                {%- set csv_name = csv.metadata.name | default('unknown') -%}
                {%- set csv_phase = (
                      csv.status.phase
                      if (csv.status is defined and csv.status.phase is defined)
                      else 'unknown'
                    ) -%}
                {%- set ns.rows = ns.rows + [csv_name ~ '=' ~ csv_phase] -%}
              {%- endfor -%}
              {{ ns.rows }}
            ocp_wait_operator__sub_summary: >-
              {% set ns = namespace(rows=[]) -%}
              {% for sub in (ocp_wait_operator__subs.resources | default([])) -%}
                {%- set sub_name = sub.metadata.name | default('unknown') -%}
                {%- set pkg = (
                      sub.spec.name
                      if (sub.spec is defined and sub.spec.name is defined)
                      else ''
                    ) -%}
                {%- set channel = (
                      sub.spec.channel
                      if (sub.spec is defined and sub.spec.channel is defined)
                      else ''
                    ) -%}
                {%- set sub_state = (
                      sub.status.state
                      if (sub.status is defined and sub.status.state is defined)
                      else 'unknown'
                    ) -%}
                {%- set current = (
                      sub.status.currentCSV
                      if (sub.status is defined and sub.status.currentCSV is defined)
                      else ''
                    ) -%}
                {%- set installed = (
                      sub.status.installedCSV
                      if (sub.status is defined and sub.status.installedCSV is defined)
                      else ''
                    ) -%}
                {%- set ns.rows = ns.rows + [
                      sub_name ~ ' pkg=' ~ pkg ~ ' ch=' ~ channel
                      ~ ' state=' ~ sub_state
                      ~ ' current=' ~ current
                      ~ ' installed=' ~ installed
                    ] -%}
              {%- endfor -%}
              {{ ns.rows }}

        - name: Fail with actionable Operator CSV guidance
          ansible.builtin.fail:
            msg: >-
              No Succeeded ClusterServiceVersion matching
              '{{ ocp_wait_operator_name_substring }}'
              (or hyphen-stripped '{{ ocp_wait_operator__csv_match_alt }}') in
              namespace '{{ ocp_wait_operator__namespace }}'.
              CSVs: {{ ocp_wait_operator__csv_summary }}.
              Subscriptions: {{ ocp_wait_operator__sub_summary }}.
              Check package/channel/source and that operator_namespace is
              where the Subscription installs the CSV.

    - name: Set fact if Operator CSV is installed
      ansible.builtin.set_fact:
        ocp_wait_operator__operator_installed: true

    - name: Debug operator installation status
      ansible.builtin.debug:
        msg: >-
          Operator '{{ ocp_wait_operator_name_substring }}' CSV is installed in
          '{{ ocp_wait_operator__namespace }}'.
          Operator installed: {{ ocp_wait_operator__operator_installed }}

    - name: Resolve operator deployment name pattern
      ansible.builtin.set_fact:
        ocp_wait_operator__operator_deployment_pattern: >-
          {{
            operator_deployment_pattern
            | default(ocp_wait_operator_name_substring)
            | string
            | trim
          }}
        ocp_wait_operator__operator_deployment_pattern_alt: >-
          {{
            (
              operator_deployment_pattern
              | default(operator_name | default(ocp_wait_operator_name_substring) | default(''))
              | string
              | trim
              | regex_replace('-', '')
            )
          }}

    - name: Wait for a matching Operator Deployment to exist
      block:
        - name: Wait for a matching Operator Deployment to exist
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            namespace: "{{ ocp_wait_operator__namespace }}"
          register: ocp_wait_operator__all_deployments
          until: >-
            (
              ocp_wait_operator__all_deployments.resources
              | default([])
              | selectattr('metadata.name', 'search', ocp_wait_operator__operator_deployment_pattern)
              | list
              | length
            ) > 0
            or (
              (ocp_wait_operator__operator_deployment_pattern_alt | length) > 0
              and (
                ocp_wait_operator__all_deployments.resources
                | default([])
                | selectattr('metadata.name', 'search', ocp_wait_operator__operator_deployment_pattern_alt)
                | list
                | length
              ) > 0
            )
          retries: "{{ operator_wait_retries | default(30) | int }}"
          delay: "{{ operator_wait_delay | default(10) | int }}"
      rescue:
        - name: Fail with actionable Operator Deployment guidance
          ansible.builtin.fail:
            msg: >-
              No Deployment matching
              '{{ ocp_wait_operator__operator_deployment_pattern }}'
              in namespace '{{ ocp_wait_operator__namespace }}'. Deployments present:
              {{
                ocp_wait_operator__all_deployments.resources
                | default([])
                | map(attribute='metadata.name')
                | list
              }}.
              Set operator_deployment_pattern to the real Deployment name
              (e.g. descheduler-operator).

    - name: Select Operator Deployment name
      ansible.builtin.set_fact:
        ocp_wait_operator__operator_deployment: >-
          {{
            (
              (
                ocp_wait_operator__all_deployments.resources
                | default([])
                | selectattr('metadata.name', 'search', ocp_wait_operator__operator_deployment_pattern)
                | map(attribute='metadata.name')
                | list
              )
              + (
                ocp_wait_operator__all_deployments.resources
                | default([])
                | selectattr('metadata.name', 'search', ocp_wait_operator__operator_deployment_pattern_alt)
                | map(attribute='metadata.name')
                | list
              )
            )
            | unique
            | first
          }}

    - name: Debug discovered operator deployment
      ansible.builtin.debug:
        msg: >-
          Discovered operator deployment: {{ ocp_wait_operator__operator_deployment }}
          in namespace {{ ocp_wait_operator__namespace }}
          (pattern={{ ocp_wait_operator__operator_deployment_pattern }})

    - name: Wait for Operator Deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ocp_wait_operator__namespace }}"
        name: "{{ ocp_wait_operator__operator_deployment }}"
      register: ocp_wait_operator__operator_deploy_info
      until: >
        ocp_wait_operator__operator_deploy_info.resources | default([]) | length > 0
        and ocp_wait_operator__operator_deploy_info.resources[0].status is defined
        and ocp_wait_operator__operator_deploy_info.resources[0].status.availableReplicas is defined
        and ocp_wait_operator__operator_deploy_info.resources[0].status.availableReplicas | int > 0
      retries: "{{ operator_wait_retries | default(30) | int }}"
      delay: "{{ operator_wait_delay | default(10) | int }}"

    - name: Debug operator deployment status
      ansible.builtin.debug:
        msg: >-
          Operator deployment '{{ ocp_wait_operator__operator_deployment }}' ready status:
          {{
            ocp_wait_operator__operator_deploy_info.resources[0].status.availableReplicas | default('none')
          }}/
          {{
            ocp_wait_operator__operator_deploy_info.resources[0].status.replicas | default('none')
          }}
          available in namespace {{ ocp_wait_operator__namespace }}
