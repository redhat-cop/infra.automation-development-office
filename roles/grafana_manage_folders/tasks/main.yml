---
- name: Normalize folder list for grafana_manage_folders
  ansible.builtin.set_fact:
    grafana_manage_folders_list: >-
      {{
        (
          (
            (grafana_folders | default([]))
            | rejectattr('name', 'equalto', 'Openshift')
            | list
          )
          + (
            (grafana_folders | default([]) | selectattr('name', 'equalto', 'Openshift') | list)
            if (grafana_group_cluster_dashboards | default(true) | bool)
            else []
          )
        )
        if (grafana_folders | default([]) | length) > 0
        else ([{'name': grafana_folder}] if (grafana_folder | default('') | length) > 0 else [])
      }}
    grafana_manage_folders_url: "https://{{ grafana_hostname }}"
    grafana_manage_folders_user: "{{ grafana_admin_user | default('admin') }}"
    grafana_manage_folders_password: "{{ grafana_admin_password | default('') }}"

- name: Assert Grafana credentials for folder create
  ansible.builtin.assert:
    that:
      - grafana_hostname | default('') | length > 0
      - >-
        (grafana_api_key | default('') | length > 0)
        or (grafana_manage_folders_password | length > 0)
    fail_msg: >-
      grafana_manage_folders needs grafana_hostname and either grafana_api_key
      or grafana_admin_password.
  when: (grafana_manage_folders_list | length) > 0

- name: Create each Grafana folder
  ansible.builtin.include_tasks: grafana-manage-folder.yml
  loop: "{{ grafana_manage_folders_list }}"
  loop_control:
    loop_var: grafana_manage_folders_entry
    label: "{{ grafana_manage_folders_entry.name | default('folder') }}"
  vars:
    grafana_manage_folders_state: "{{ state | default('present') }}"
    grafana_manage_folders_name: "{{ grafana_manage_folders_entry.name | default('') }}"
    grafana_manage_folders_is_general: >-
      {{
        (grafana_manage_folders_entry.use_general_folder | default(false) | bool)
        or (
          (grafana_manage_folders_entry.name | default('') | string | trim | length) == 0
        )
        or (
          (grafana_manage_folders_entry.name | default('') | string | trim | lower)
          in ['general', 'main', 'root']
        )
      }}
  when: (grafana_manage_folders_list | length) > 0
