---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch:
  # TO-DO: Below is an example cron scheduler. Uncomment and tweak it as per your requirement
  # schedule:
    # - cron: '0 0 * * *'

env:
  ANSIBLE_GALAXY_SERVER_LIST: certified,galaxy
  ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/
  ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
  ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: >-
    https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
  ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
  ANSIBLE_GALAXY_SERVER_TIMEOUT: "120"

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    env:
      # Job-level env cannot use the runner context. /tmp is outside the checkout.
      XDG_CACHE_HOME: /tmp/ado-xdg-cache
      PYTHONUSERBASE: /tmp/ado-python-user
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ansible-lint
        run: |
          pip install ansible-lint ansible-core
          ansible-lint --version

      - name: Verify Automation Hub connectivity
        run: scripts/ci/verify-automation-hub.sh

      - name: Install Ansible collections
        run: |
          collections_path="${{ github.workspace }}/.ansible/collections"
          mkdir -p "$collections_path"
          sh scripts/ci/ansible-galaxy-with-retry.sh collection install \
            -r collections/requirements.yml -p "$collections_path"
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections

      - name: Run ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: ansible-lint --offline
  readme-format:
    name: README Format Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run README format verification
        id: readme_verify
        # Informational only for now; add to all_green when ready to enforce.
        continue-on-error: true
        run: |
          set +e
          python scripts/verify_readme.py > readme-verification.txt 2>&1
          exit_code=$?
          cat readme-verification.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Add README verification summary
        if: always()
        run: |
          {
            echo "## README Format Verification"
            echo
            echo '```text'
            cat readme-verification.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload README verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-verification-report
          path: readme-verification.txt
          if-no-files-found: error
          retention-days: 30
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@main
    secrets:
      galaxy_server_token: ${{ secrets.AUTOMATION_HUB_TOKEN }}
    with:
      galaxy_server_url: https://console.redhat.com/api/automation-hub/content/published/
      galaxy_server_auth_url: >-
        https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
  unit-galaxy:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@main
    secrets:
      galaxy_server_token: ${{ secrets.AUTOMATION_HUB_TOKEN }}
    with:
      galaxy_server_url: https://console.redhat.com/api/automation-hub/content/published/
      galaxy_server_auth_url: >-
        https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
  unit-source:
    uses: ansible-network/github_actions/.github/workflows/unit_source.yml@main
    if: false
    with:
      collection_pre_install: >-
        git+https://github.com/ansible-collections/ansible.utils.git
  all_green:
    if: ${{ always() }}
    needs:
      # - changelog
      - build-import
      - sanity
      - unit-galaxy
      # - unit-source
      - ansible-lint
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in set([
          '${{ needs.unit-galaxy.result }}',
          '${{ needs.ansible-lint.result }}'
          ])"
