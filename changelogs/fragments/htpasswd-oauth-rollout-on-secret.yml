bugfixes:
  - ocp_htpasswd_admin - After updating the htpasswd Secret, roll
    ``oauth-openshift`` and wait for the authentication operator. Contoller
    jobs were succeeding while console login kept failing because oauth pods
    never reloaded the new Secret (wait only ran when the OAuth IdP CR
    changed). Still uses Ansible ``password_hash('bcrypt')`` — no EE package
    install.
