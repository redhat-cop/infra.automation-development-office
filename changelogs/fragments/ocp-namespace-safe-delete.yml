---
security_fixes:
  - >-
    ocp_namespace - ``state=absent`` deletes only the requested Namespace.
    It no longer deletes ClusterServiceVersions, strips CSV finalizers, or
    sweeps Deployments and Pods. Platform namespaces, including
    ``openshift-operators``, are refused. A stuck namespace is reported
    and the role stops.
  - >-
    ocp_absent_cleanup - CSV and InstallPlan deletion requires
    ``ocp_absent_cleanup_authorize_csv_delete``. An empty name filter no
    longer selects every CSV; unfiltered deletion also requires
    ``ocp_absent_cleanup_authorize_unfiltered_csv_delete``. OLM copied
    CSVs (label ``olm.copiedFrom``, or ``olm.operatorNamespace`` pointing
    at another namespace) are skipped unless
    ``ocp_absent_cleanup_delete_copied_csvs`` is true. CSV finalizers are
    stripped only when ``ocp_absent_cleanup_strip_csv_finalizers`` is true
    and only for CSVs already selected in that namespace.
  - >-
    ocp_operator_subscription - Uninstall matches an exact CSV name or
    ``<package>.<version>`` only. A substring such as ``operator`` no
    longer selects other operators. Each selected CSV is asserted before
    deletion. InstallPlans are removed only when every referenced CSV
    matches that same package.
  - >-
    cert-manager uninstall - Workload cleanup is limited to the
    cert-manager controller, cainjector, webhook, and operator-controller
    Deployments. Unfiltered Pod deletion and namespace ``/finalize`` are
    off. CSV cleanup uses the ``cert-manager-operator`` package prefix.
breaking_changes:
  - >-
    ocp_namespace - ``ocp_namespace_absent_sweep_olm`` and
    ``ocp_namespace_absent_sweep_workloads`` now default to ``false``.
    ``ocp_absent_cleanup`` runs only on ``state=absent`` when
    ``ocp_namespace_advanced_cleanup`` is true and at least one of sweep
    OLM, sweep workloads, or namespace finalize is also true.
    ``state=present`` does not run that cleanup, including when the
    namespace is ``Terminating``.
  - >-
    ocp_absent_cleanup - ``ocp_absent_cleanup_sweep_olm``,
    ``ocp_absent_cleanup_sweep_workloads``, and
    ``ocp_absent_cleanup_finalize`` now default to ``false``.
    Callers that still want those actions must set the matching authorize
    flags. Subscription absent sets a package prefix only. Cert-manager
    uninstall sets that prefix plus a Deployment allowlist, and does not
    finalize namespaces.
