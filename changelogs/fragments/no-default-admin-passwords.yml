---
breaking_changes:
  - >-
    install_gitlab, gitlab_install, install_grafana, grafana_install, install_rhbk,
    ocp_quay, ocp_minio, ocp_zabbix, ocp_acs, install_elastic - Removed the built-in
    default admin/root passwords (``redhat123`` and the ``changeme`` Keycloak
    fallback). A password must now be supplied in the bootstrap (preflight JSON
    or form). A run without one fails early with a message that names the variable and
    the preflight field. For ECK, the optional lab Kibana/ES superuser is simply not
    created when no ``install_elastic_eck_lab_password`` is set.
  - >-
    bootstrap_generate_env_vars - The overlay no longer writes a ``redhat123``
    fallback for Grafana, GitLab (OpenShift), Quay admin, Quay S3 secret key or
    MinIO root password. Generation stops with a clear error when the password is
    missing. ACS Central now takes ``component_config.acs.admin_password``.
    ``component_vault.yml.j2`` emits empty values instead of ``redhat123``.
  - >-
    bootstrap_resolve_component - ``components_defaults.yml`` no longer ships
    default admin passwords for GitLab, Grafana, Quay, MinIO, Zabbix and ECK.
  - >-
    bootstrap_generate_playbook_repo - GitLab and Quay playbook seeds no longer
    fall back to ``redhat123``.
  - >-
    bootstrap_controller - The GitLab, Grafana and RHBK standalone surveys no
    longer pre-fill ``redhat123``, and the BookStack admin password survey field
    is now required with no default. Re-run bootstrap so existing job templates
    pick up the new surveys.
security_fixes:
  - >-
    Removed well-known default administrator passwords from generated vault
    files, role defaults, playbook seeds and Controller surveys. Deployments
    created earlier with ``redhat123`` should have those passwords rotated.
  - >-
    ocp_zabbix / bootstrap_generate_env_vars - Zabbix vault seeds no longer
    emit ``zabbix`` / ``zabbixpass`` / ``rootpass123!``. Overlay and the role
    refuse the upstream Admin default ``zabbix``.
  - >-
    install_rhbk / bootstrap_generate_env_vars - Removed ``changeme-db`` /
    ``change-me-db`` database password fallbacks. OpenShift RHBK requires
    ``db_password`` in preflight.
  - >-
    bootstrap_generate_env_vars - AAP and 389ds/dirsrv now fail generation when
    the admin/manager password is missing. Empty preflight secret fields no
    longer overwrite an existing non-empty vault value.
