---
bugfixes:
  - >-
    bookstack_openshift - Retrieve the Keycloak client secret before BookStack
    OIDC is applied when ``bookstack_oidc_client_secret`` is empty. An explicit
    secret is preserved. Retrieval is allowed for unmanaged clients. An empty
    confidential-client secret fails the job and is not written to the
    BookStack Secret.
  - >-
    bootstrap_generate_env_vars - Stop putting a GitLab Keycloak client in
    generated ``rhbk_clients`` when GitLab is selected. No GitLab OIDC role
    consumes that client. Existing clients and preflight rows are not deleted.
