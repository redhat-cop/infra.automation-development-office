---
bugfixes:
  - >-
    bootstrap_generate_env_vars - Nest Install AAP
    ``platform_manifest_overrides`` database settings under
    ``spec.database`` so ``infra.aap_utilities`` 3.5.0
    ``aap_ocp_install`` root-level combine places PostgreSQL
    StorageClass and capacity on the AnsibleAutomationPlatform CR
    (AAP Operator 2.7 CRD). A bare ``{database: ...}`` was previously
    applied as a sibling of ``spec`` and pruned, leaving Operator
    defaults (for example 8Gi PVC).
