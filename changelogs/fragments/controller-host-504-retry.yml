---
bugfixes:
  - >-
    bootstrap_controller - Retry each Controller host and group create
    when the gateway returns HTTP 504. One timed-out host, such as
    ``localhost``, no longer fails bootstrap while another host in the
    same batch succeeds. Existing hosts and groups stay in place
    (``state=present``). Ansible 2.15 rejects ``delay`` on
    ``include_role``, so each object is retried with a pause between
    attempts.
