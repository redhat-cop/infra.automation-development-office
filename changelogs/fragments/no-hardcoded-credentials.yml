---
bugfixes:
  - >-
    ocp_quay - The PostgreSQL password and ``DATABASE_SECRET_KEY`` are no longer
    shipped as ``quaypass`` / ``changeme-secret-key``. They are supplied
    (``ocp_quay_db_password`` / ``ocp_quay_database_secret_key``), read from the
    ``quay-db-credentials`` Secret, adopted from an earlier install's
    ``quay-config-secret``, or generated once. The StatefulSet reads the password
    through ``secretKeyRef``. An existing database whose password cannot be found
    stops the run with a clear message instead of being re-keyed.
  - >-
    install_dirsrv - The smoke-test user no longer gets a fixed password. It uses
    ``dirsrv.test_user_password`` or a password generated for the run, and the
    rendered LDIF is removed from the pod and the controller.
  - >-
    ocp_dev_hub / bootstrap_generate_env_vars - ``dev_hub_backend_secret`` no
    longer defaults to ``changeme-backend-secret``. The role reuses the value in
    ``rhdh-secrets`` or generates one.
  - >-
    molecule - Scenario fixtures and docs no longer carry realistic passwords
    (``redhat123``, ``knuckle``, ``changeme``, ``StrongAdminPassword123!``,
    ``QuayFormPass1``). Fixture values are marked ``SYNTHETIC`` and the htpasswd
    scenario reads ``MOLECULE_HTPASSWD_PASS`` from the environment.
  - >-
    bootstrap_generate_playbook_repo - The credential gate no longer treats
    ``changeme``, ``change-me``, ``password123`` or ``passw0rd`` as synthetic
    markers, and it recognises camelCase credential keys such as
    ``userPassword`` and ``bindCredential``.
minor_changes:
  - >-
    tests - Added ``test_no_hardcoded_credentials.py`` (retired fallback
    passwords, secret-named keys with literal values, credentials in URLs, token
    and key patterns, vault password files and plaintext exports) and
    ``test_role_credential_resolution.py`` (Quay, dirsrv, Developer Hub). Every
    exception in the guard is listed with its reason.
