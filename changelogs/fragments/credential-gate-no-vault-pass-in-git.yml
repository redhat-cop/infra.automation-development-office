---
minor_changes:
  - >-
    bootstrap_generate_playbook_repo - Added a credential gate
    (``ado_credential_gate.py``) that blocks credential file names, private
    keys, token patterns and literal secrets. It runs after ``git add -A`` and
    before the commit, and against ``HEAD`` before ``git push``. The generated
    repository also gets ``.githooks/pre-push`` and the gate.
  - >-
    bootstrap_generate_playbook_repo - The ``.gitignore`` block now always
    lists ``.vault_pass``, ``.vault-pass``, ``tmp-ado-preflight-*.json`` and the
    existing plaintext preflight patterns, in every git mode.
bugfixes:
  - >-
    bootstrap_generate_playbook_repo - ``local_components.py`` takes the Vault
    password file from ``ANSIBLE_VAULT_PASSWORD_FILE`` instead of a
    ``.vault_pass`` inside the repository.
  - >-
    molecule - Removed the committed ``.vault_pass`` and ``.vault-pass`` files
    and the unused encrypted ``group_vars/all/vault.yml`` from the
    ``integration_rhel_services_management`` and ``ocp_htpasswd_admin``
    scenarios. ``ocp_htpasswd_admin`` takes ``ANSIBLE_VAULT_PASSWORD_FILE`` from
    the environment.
