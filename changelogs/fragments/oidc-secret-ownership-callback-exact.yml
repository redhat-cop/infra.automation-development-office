---
bugfixes:
  - >-
    bookstack_openshift - Reuse an existing ``bookstack-app`` OIDC secret
    only when ``oidc-client-id`` matches ``bookstack_oidc_client_id``. A
    previous client's secret is not applied after a client ID change.
  - >-
    bootstrap_generate_env_vars - Always rebuild generated ``rhbk_clients``
    from the current preflight client list. Missing or empty lists drop
    seed and retained rows so unmanaged and MinIO clients cannot keep
    being provisioned by Deploy RHBK Client.
  - >-
    bootstrap_generate_env_vars - Register the OpenShift Keycloak redirect
    URI as the exact oauth-server callback
    ``https://oauth-openshift.<apps_domain>/oauth2callback/<idp_name>``.
    A trailing ``/*`` does not match OpenShift's live redirect.
