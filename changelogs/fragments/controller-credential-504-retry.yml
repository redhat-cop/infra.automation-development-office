---
bugfixes:
  - >-
    bootstrap_controller - Retry each Controller credential create when
    the gateway returns HTTP 504. One timed-out Galaxy credential no
    longer fails bootstrap while another credential in the same batch
    succeeds. Existing credentials stay unchanged (``state=present``).
    Ansible 2.15 rejects ``delay`` on ``include_role``, so each
    credential is retried with a pause between attempts.
