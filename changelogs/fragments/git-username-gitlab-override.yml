---
bugfixes:
  - >-
    bootstrap_generate_env_vars - Resolve the Controller Source Control
    username from preflight ``git.username`` when it is set. A blank
    username stays ``oauth2`` for GitLab and GitHub, and ``x-token-auth``
    for Bitbucket.
  - >-
    bootstrap_generate_playbook_repo - CLI bootstrap with only
    ``preflight_json`` uses that resolved username, the vault git token,
    and the generated auth mode. Extra vars and role parameters still win.
    The git remote URL stays free of the token. Bitbucket Bearer auth is
    stored in a mode 0600 include file.
