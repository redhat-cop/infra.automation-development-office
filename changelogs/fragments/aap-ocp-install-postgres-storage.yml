---
minor_changes:
  - >-
    bootstrap_generate_env_vars - Map Install AAP managed/external
    PostgreSQL storage (``postgres_storage``, ``postgres_storage_size``,
    ``database_secret``) into
    ``aap_ocp_install_platform.platform_manifest_overrides.spec.database``
    so ``spec.database.postgres_storage_class`` is set independently of
    Hub file/S3 storage (required nesting for ``infra.aap_utilities``
    3.5.0 document-root merge). Optional ``postgres_storage`` inherits
    General ``storage`` when blank; both blank leaves the
    Operator/cluster default unset (no invented class).
