  1.1.0:
    changes:
      breaking_changes:
      - Dropped Ansible 2.16 support (EOL). ``meta/runtime.yml`` ``requires_ansible``
        is now ``>=2.17.0``, matching CI and the ``amazon.aws`` dependency.
      bugfixes:
      - ci - Install ``galaxy.yml`` collection dependencies before ``antsibull-changelog
        release`` so modules that extend external doc fragments (for example ``amazon.aws``)
        can be parsed during release builds.
      - ci - Install the local collection with ``--no-deps`` in Molecule jobs so ``galaxy.yml``
        runtime dependencies are not resolved from Galaxy during role scenario runs.
      - ci - Skip Ansible 2.16 and ``py3.12-milestone`` tox-ansible sanity/unit matrix
        entries; ``amazon.aws`` requires Ansible ``>=2.17`` and current ansible-core
        milestone requires Python ``>=3.13``.
      - infra.ado.ec2_ami_copy - Declare ``amazon.aws`` as a collection dependency
        and fix module documentation metadata so ansible-test validate-modules passes.
      doc_changes:
      - README - Added collection purpose overview and a complete role index with
        one-line descriptions and links to each role README.
      - README - Documented modules alongside roles; detailed module usage lives under
        ``docs/modules/``.
      - README / docs - Ansible version compatibility updated to ``>=2.17.0``.
      minor_changes:
      - infra.ado.ec2_ami_copy - Added module to copy an AWS AMI between regions with
        wait, encryption, optional source-tag copy, and tag-based idempotency.
    fragments:
    - ci-changelog-galaxy-deps.yml
    - ec2_ami_copy.yml
    - readme-collection-overview.yml
    modules:
    - description: Copy an AMI between AWS regions.
      name: ec2_ami_copy
      namespace: ''
    release_date: '2026-08-07'
  1.2.0:
    changes:
      bugfixes:
      - 'AAP license attach now posts ``subscriptions_client_id`` /

        ``subscriptions_username`` field names expected by Controller

        ``/config/subscriptions/`` (bare ``client_id`` / ``username`` caused

        ``Missing subscription credentials`` on AAP 2.5+). Portal-style

        values in client ID (e.g. ``rh-ee-*``) are remapped to username/password.

        '
      - 'Clarify AAP license RHN attach failures for ``Missing subscription credentials``
        (AAP 2.5+ service account client_id/client_secret) and send the subscriptions
        POST body as a proper JSON object.

        '
      - 'Grafana OpenShift dashboards: remove broken ``origin_prometheus`` filters
        from

        K8S views (caused systemic No data on OCP), replace Keycloak SPI dashboards

        with RHBK Micrometer metrics (``jvm_*`` / ``http_server_*``), and make

        cert-manager expiry tiles show 0 instead of No data for empty windows.

        '
      - 'Prefer General-tab AAP hostname and admin password for license-only attach
        instead of stale Install AAP ``component_config.aap.hostname`` values, and
        surface RHN subscription-list HTTP errors without dumping secrets.

        '
      - aap_ocp_install - Detect an existing cluster-scoped AAP operator and skip
        creating another OperatorGroup/Subscription so a second namespace does not
        cause InterOperatorGroupOwnerConflict or break the original install.
      - aap_ocp_install - Fail when the requested AAP version differs from an existing
        cluster-scoped operator instead of installing a second operator.
      - aap_ocp_install - Prefer the operator-discovered controller/platform route
        host for RHN license attach instead of only the preflight hostname hint.
      - aap_ocp_install - RHN license activation now lists subscriptions and POSTs
        ``/config/attach/`` with a ``subscription_id`` instead of only posting username/password
        to ``/config/`` (which left new AAP installs on the subscription wizard).
      - aap_ocp_install_upstream - On AAP 2.5+ unified installs, Hub no longer gets
        a dedicated ``*-hub`` Route (API is on the platform gateway). Stop failing
        the install waiting for that missing route; fall back to the gateway URL for
        Hub readiness checks so license activation can run.
      - 'acs_report - Use ``#!/usr/bin/env bash`` on ``rhacs-report.sh`` (mode 0644

        in git). ansible-test allows that shebang on non-module files and

        shellcheck needs one; the role copies the script to ``/tmp`` as 0755.

        '
      - ado-preflight-ui - Remove playbook-adjacent vendored ``infra.ado`` before
        bootstrap so Ansible cannot shadow the staged collection tarball.
      - ado-preflight-ui - Restore Logs/Events search, fix DevSpaces config crash
        when defaults are missing, and replace Pre-installs with Install AAP / OpenShift
        agent checkbox cards.
      - bookstack_openshift - Use ``mariadb-admin`` probes, port 8080, PVC initContainer/subPaths,
        and integer Service/Deployment fields for Contoller EE.
      - 'bootstrap_controller - After project apply, set ``scm_url`` / ``scm_branch``

        on existing Contoller projects so a new git branch is used before sync.

        '
      - bootstrap_controller - Always create Contoller organizations on hub-update-only
        runs, and ensure the General organization exists even when generated configs
        list a different org.
      - bootstrap_controller - Clarify Hub collection IndexError warning as "version
        already present" and point operators at Force update or galaxy.yml bump.
      - 'bootstrap_controller - Contoller project create no longer sets ``update_project:
        true`` (sync-on-create), which failed during ``install_collections`` when
        Hub lacked ``infra.ado``. Projects are created first, then synced with actionable
        Hub guidance on failure.

        '
      - bootstrap_controller - Contoller project sync failure guidance no longer implies
        Hub republish is required; Hub update remains optional when ``infra.ado``
        is already present.
      - bootstrap_controller - Contoller project sync failures now fail with guidance
        to publish ``infra.ado`` to AAP Hub when ``collections/requirements.yml``
        cannot be satisfied.
      - bootstrap_controller - Do not create RHEL Compliance/STIG job templates from
        a Patching-only selection. Selecting ``rhel`` now only maps the patch-host
        job template; compliance and STIG require those components (or RHEL options)
        explicitly.
      - 'bootstrap_controller - Do not create an org-scoped ``Ansible Galaxy``

        credential. AAP ships that name as a platform-global credential; attach it

        to the organization instead of failing with already-exists.

        '
      - bootstrap_controller - Filter Satellite/IdM job templates and workflows by
        option keys (for example ``satellite_client_tools``, ``idm_client_tools``)
        instead of the coarse ``satellite``/``idm`` components.
      - bootstrap_controller - Hub EE push no longer hard-fails hub-update-only runs
        when the preflight/Dev Spaces host has no podman/docker; skips with guidance
        (optional skopeo path when pull-from-remote is enabled).
      - bootstrap_controller - Install AAP during bootstrap when ``install_aap`` is
        set, without requiring the AAP platform component or Using AAP / Contoller
        API fields.
      - 'bootstrap_controller - On hub-update-only runs, apply Galaxy/Hub API Token
        credentials and org attach before ``meta: end_host`` so Hub + Galaxy (or either
        alone) both work when selected.

        '
      - bootstrap_controller - On hub-update-only runs, reload ``aap_config_vars.yml``
        before applying Galaxy/Hub credentials so stale ``configs/controller`` does
        not skip credential create/attach when Galaxy setup is enabled.
      - bootstrap_controller - Prefer generated ``controller_bootstrap_environment_choices``
        over the old fixed survey list.
      - bootstrap_controller - Resolve AAP install flags when preflight omits ``component_config.aap``
        or ``pre_installs.aap`` (single-component bootstrap tests).
      - bootstrap_controller - Resolve OpenShift API host/token with empty-string
        defaults so Install AAP can build a kubeconfig when ``token`` is blank in
        another vars file.
      - 'bootstrap_controller - Skip create/update when an execution environment

        already exists (or GET returns 403). Org tokens can use a global EE on

        job templates but cannot PATCH it; bootstrap continues with projects and

        JTs.

        '
      - bootstrap_controller - Skip generating AAP job templates when their playbook
        was not generated into the project, preventing ``Playbook not found for project``
