---
# yamllint disable rule:line-length
# FQCN: infra.automation_development_office.aws.ec2.ado_ec2_instance_modify
# Modify an existing EC2 instance (state, type, tags, termination protection).
# Uses amazon.aws.ec2_instance — see module docs for state values:
# present | running | started | stopped | restarted | rebooted | terminated
#
# Required:
#   ec2_instance_ids: ["i-0123456789abcdef0"]
# Optional (set only what you want to change):
#   ec2_instance_state          e.g. stopped | running | restarted
#   ec2_instance_type
#   ec2_instance_tags
#   ec2_instance_purge_tags
#   ec2_instance_termination_protection
#   ec2_instance_region, ec2_instance_wait, ec2_instance_wait_timeout
# Auth: AWS env vars, aws_profile, or vault_aws_* keys

# Note: do not put empty-dict/list defaults in play vars — they override host
# facts promoted by bootstrap seeds before import_playbook.
- name: ADO | Modify EC2 instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert instance IDs for modify
      ansible.builtin.assert:
        that:
          - (ec2_instance_ids | default([]) | length) > 0
        fail_msg: Set ec2_instance_ids to the instance(s) to modify.

    - name: Assert at least one modify action
      ansible.builtin.assert:
        that:
          - >-
            (ec2_instance_state | default('') | string | length) > 0
            or (ec2_instance_type | default('') | string | length) > 0
            or (ec2_instance_tags | default({}) | length) > 0
            or (ec2_instance_termination_protection is defined)
        fail_msg: >-
          Set ec2_instance_state, ec2_instance_type, ec2_instance_tags,
          and/or ec2_instance_termination_protection.

    - name: Modify EC2 instance
      amazon.aws.ec2_instance:
        instance_ids: "{{ ec2_instance_ids }}"
        state: >-
          {{
            ec2_instance_state
            if (ec2_instance_state | default('') | string | length) > 0
            else omit
          }}
        instance_type: >-
          {{
            ec2_instance_type
            if (ec2_instance_type | default('') | string | length) > 0
            else omit
          }}
        tags: >-
          {{
            ec2_instance_tags
            if (ec2_instance_tags | default({}) | length) > 0
            else omit
          }}
        purge_tags: >-
          {{
            ec2_instance_purge_tags
            if (ec2_instance_purge_tags is defined)
            else omit
          }}
        termination_protection: >-
          {{
            ec2_instance_termination_protection
            if (ec2_instance_termination_protection is defined)
            else omit
          }}
        wait: "{{ ec2_instance_wait | default(true) | bool }}"
        wait_timeout: "{{ ec2_instance_wait_timeout | default(600) | int }}"
        region: >-
          {{
            ec2_instance_region
            if (ec2_instance_region | default('') | string | length) > 0
            else omit
          }}
        access_key: >-
          {{
            vault_aws_access_key_id
            if (vault_aws_access_key_id | default('') | length) > 0
            else omit
          }}
        secret_key: >-
          {{
            vault_aws_secret_access_key
            if (vault_aws_secret_access_key | default('') | length) > 0
            else omit
          }}
        session_token: >-
          {{
            vault_aws_session_token
            if (vault_aws_session_token | default('') | length) > 0
            else omit
          }}
        profile: >-
          {{
            aws_profile
            if (aws_profile | default('') | string | length) > 0
            else omit
          }}
      register: ado_ec2_instance_modify

    - name: Show modify result
      ansible.builtin.debug:
        msg:
          changed_ids: "{{ ado_ec2_instance_modify.changed_ids | default([]) }}"
          instance_ids: "{{ ado_ec2_instance_modify.instance_ids | default([]) }}"
          instances: "{{ ado_ec2_instance_modify.instances | default([]) }}"
# yamllint enable rule:line-length
