---
# yamllint disable rule:line-length
# Deploy only the Keycloak login-events Prometheus exporter.
# Does not install RHBK. Requires a reachable Keycloak admin API.

- name: ADO | Keycloak login events exporter
  hosts: localhost
  gather_facts: false
  vars:
    component: rhbk
    keycloak_login_events_exporter_enabled: true
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host | default('')) }}"
    K8S_AUTH_API_KEY: "{{ token | default('') }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | default(false) | bool) | ternary('yes', 'no') }}"
  pre_tasks:
    - name: ADO | Resolve Keycloak URL from RHBK hostname
      ansible.builtin.set_fact:
        rhbk_url: >-
          {{
            rhbk_url
            | default(
                'https://'
                ~ (
                  rhbk_hostname
                  | default(ocp_rhbk_hostname | default(rhbk_host | default('')), true)
                ),
                true
              )
            | regex_replace('/$', '')
          }}
  roles:
    - role: infra.ado.keycloak_login_events_exporter
