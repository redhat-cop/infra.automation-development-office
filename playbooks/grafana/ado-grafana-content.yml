---
# Standalone — folders then dashboards then alerts then datasources.
# Prefer the per-piece playbooks for Contoller JTs; use this for a one-shot
# content sync against an already-installed Grafana.
#
# Order: folders → datasources → dashboards → alerts
# (datasources before dashboards so pinned UIDs resolve).

- name: ADO | Grafana content sync (standalone)
  hosts: localhost
  gather_facts: false
  vars:
    grafana_alerts_enabled: true
  environment:
    K8S_AUTH_HOST: "{{ host | default(api_host | default('')) }}"
    K8S_AUTH_API_KEY: "{{ token | default('') }}"
    K8S_AUTH_VERIFY_SSL: "{{ (verify_ssl | default(false) | bool) | ternary('yes', 'no') }}"

  pre_tasks:
    - name: Load optional bootstrap group_vars when env is set
      when:
        - env is defined
        - (env | string | length) > 0
        - not (grafana_skip_group_vars | default(false) | bool)
      block:
        - name: Load infra_config_vars
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
          failed_when: false

        - name: Load vault_grafana
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_grafana.yml"
          failed_when: false

        - name: Load vars_grafana
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_grafana.yml"
          failed_when: false

    - name: Resolve component defaults when available
      ansible.builtin.include_role:
        name: infra.ado.bootstrap_resolve_component
      vars:
        component: grafana
      when: grafana_resolve_component | default(true) | bool

    - name: Enable alerts for combined content run
      ansible.builtin.set_fact:
        grafana_alerts_enabled: true

    - name: Assert Grafana target and auth
      ansible.builtin.assert:
        that:
          - (grafana_hostname | default('') | length) > 0
          - >-
            (grafana_api_key | default('') | length) > 0
            or (grafana_admin_password | default('') | length) > 0
        fail_msg: >-
          Set grafana_hostname and either grafana_api_key or
          grafana_admin_password.

  roles:
    - role: infra.ado.grafana_manage_folders
      when: >-
        (grafana_folders | default([]) | length) > 0
        or (grafana_folder | default('') | length) > 0
    - role: infra.ado.grafana_create_datasource
      when: >-
        (grafana_datasources | default([]) | length) > 0
        or (grafana_datasource_sources | default([]) | length) > 0
    - role: infra.ado.grafana_upload_dashboards
      when: >-
        (grafana_folders | default([]) | length) > 0
        or (grafana_dashboards | default([]) | length) > 0
    - role: infra.ado.grafana_upload_alerts
      when: (grafana_folders | default([]) | length) > 0
