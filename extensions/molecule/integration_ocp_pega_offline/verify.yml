---
- name: Reject images outside disconnected registries
  hosts: localhost
  gather_facts: false
  vars:
    ocp_pega_validate_only: true
    ocp_pega_database_mode: existing
    ocp_pega_chart_path: '{{ playbook_dir }}/chart'
    ocp_pega_values_file: '{{ playbook_dir }}/public-values.yml'
    ocp_pega_allowed_registries:
      - registry.example.test
  tasks:
    - name: Try public image validation
      block:
        - name: Invoke Pega offline validation
          ansible.builtin.include_role:
            name: infra.ado.ocp_pega
      rescue:
        - name: Record expected registry rejection
          ansible.builtin.set_fact:
            ocp_pega_rejected: >-
              {{ 'allowed disconnected registry' in
                 (ansible_failed_result.stderr
              | default('')) }}
    - name: Assert the public image was rejected
      ansible.builtin.assert:
        that: ocp_pega_rejected | default(false) | bool
    - name: Validate new database planning without contacting a cluster
      ansible.builtin.include_role:
        name: infra.ado.ocp_pega
      vars:
        ocp_pega_database_mode: new
        ocp_pega_database_chart_path: '{{ playbook_dir }}/chart'
        ocp_pega_database_values_file: '{{ playbook_dir }}/values.yml'
        ocp_pega_values_file: '{{ playbook_dir }}/values.yml'
    - name: Assert database first and initialization selected
      ansible.builtin.assert:
        that:
          - ocp_pega_releases[0].name == 'pega-database'
          - ocp_pega_releases[-1].name == 'pega'
          - ocp_pega_action == 'install-deploy'
