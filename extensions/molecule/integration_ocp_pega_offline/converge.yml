---
- name: Validate a local chart without cluster access
  hosts: localhost
  gather_facts: false
  vars:
    ocp_pega_validate_only: true
    ocp_pega_database_mode: existing
    ocp_pega_chart_path: '{{ playbook_dir }}/chart'
    ocp_pega_values_file: '{{ playbook_dir }}/values.yml'
    ocp_pega_allowed_registries: [registry.example.test]
  roles:
    - infra.ado.ocp_pega
