---
- name: Verify generated bootstrap content
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    bootstrap_generate_content_legacy_role_pattern: >-
      infra.ado.bootstrap_generate_env_vars|
      infra.ado.bootstrap_generate_playbook_repo|
      infra.ado.bootstrap_controller|
      infra.ado.bootstrap_flatten_vars|
      infra.ado.bootstrap_resolve_component|
      infra.ado.bootstrap_framework_defaults

  tasks:
    - name: Verify generated directories exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item }}"
      loop:
        - playbooks
        - configs
        - configs/controller
        - configs/job_templates
        - configs/workflows
        - group_vars/all/molecule
      register: generated_dirs

    - name: Assert generated directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Missing generated directory: {{ item.item }}"
      loop: "{{ generated_dirs.results }}"

    - name: Find generated playbooks
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/playbooks"
        patterns: "*.yml"
        recurse: true
        file_type: file
      register: generated_playbooks

    - name: Find generated controller config files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/configs/controller"
        patterns: "*.yml"
        recurse: true
        file_type: file
      register: generated_controller_configs

    - name: Find generated job template files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/configs/job_templates"
        patterns: "*.jt.yml"
        recurse: true
        file_type: file
      register: generated_job_templates

    - name: Find generated workflow files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/configs/workflows"
        patterns: "*.yml"
        recurse: true
        file_type: file
      register: generated_workflows

    - name: Verify Satellite Capsule bootstrap playbook exists
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/playbooks/satellite/ado-install-capsule-bootstrap.yml
      register: capsule_install_playbook

    - name: Verify Satellite Capsule bootstrap job template exists
      ansible.builtin.stat:
        path: >-
          {{ playbook_dir }}/configs/job_templates/ado-satellite-capsule-install-bootstrap.jt.yml
      register: capsule_install_job_template

    - name: Assert Satellite Capsule bootstrap artifacts exist
      ansible.builtin.assert:
        that:
          - capsule_install_playbook.stat.exists
          - capsule_install_playbook.stat.isreg
          - capsule_install_job_template.stat.exists
          - capsule_install_job_template.stat.isreg
        fail_msg: >-
          Missing Capsule bootstrap playbook or job template under the generated repo.

    - name: Assert generated file counts
      ansible.builtin.assert:
        that:
          - generated_playbooks.files | length >= 30
          - generated_controller_configs.files | length >= 5
          - generated_job_templates.files | length >= 30
          - generated_workflows.files | length >= 1
        fail_msg: |
          Generated counts were wrong:
          playbooks={{ generated_playbooks.files | length }}
          controller_configs={{ generated_controller_configs.files | length }}
          job_templates={{ generated_job_templates.files | length }}
          workflows={{ generated_workflows.files | length }}

    - name: Verify expected component playbook directories exist for all component
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/playbooks/{{ item }}"
      loop:
        - aap
        - acm
        - acs
        - aws
        - cert-manager
        - devspaces
        - dirsrv
        - eck
        - gitlab
        - gitops
        - grafana
        - idm
        - jira
        - kafka
        - oadp
        - ocp_compliance
        - openshift
        - pega
        - quay
        - minio
        - rhbk
        - rhel
        - satellite
      register: component_dirs

    - name: Assert expected component directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Missing component directory: playbooks/{{ item.item }}"
      loop: "{{ component_dirs.results }}"

    - name: Validate generated job template playbook references
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re
        import sys

        root = Path("{{ playbook_dir }}")
        jt_dir = root / "configs" / "job_templates"
        missing = []

        for jt in sorted(jt_dir.glob("*.jt.yml")):
            text = jt.read_text()
            m = re.search(r'(?m)^\s*playbook:\s*[\'"]?([^\'"\n]+)[\'"]?\s*$', text)
            if not m:
                missing.append(f"{jt.name}: missing playbook field")
                continue

            playbook = m.group(1).strip()
            if not (root / playbook).exists():
                missing.append(f"{jt.name}: references missing playbook {playbook}")

        if missing:
            print("\n".join(missing))
            sys.exit(1)

        print("All job template playbook references are valid.")
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify Grafana hostname inherits OpenShift apps domain
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import sys
        import yaml

        root = Path("{{ playbook_dir }}") / "group_vars" / "all" / "molecule"
        found = None
        for path in sorted(root.glob("*.yml")):
            data = yaml.safe_load(path.read_text()) or {}
            if data.get("grafana_hostname"):
                found = data.get("grafana_hostname")
                break
            grafana = (data.get("components_env") or {}).get("grafana") or {}
            if grafana.get("hostname"):
                found = grafana.get("hostname")
                break
        if found != "grafana.apps.example.test":
            print(f"expected grafana.apps.example.test, found {found!r}")
            sys.exit(1)
        print("Grafana hostname inherited openshift.apps_domain")
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify Quay MinIO option writes object-storage vars
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import sys
        import yaml

        root = Path("{{ playbook_dir }}") / "group_vars" / "all" / "molecule"
        data = {}
        for path in sorted(root.glob("vars_quay.yml")):
            data = yaml.safe_load(path.read_text()) or {}
        backend = data.get("ocp_quay_storage_backend") or (
            (data.get("components_env") or {}).get("quay") or {}
        ).get("storage_backend")
        if backend != "minio":
            print(f"expected ocp_quay_storage_backend=minio, found {backend!r}")
            sys.exit(1)
        host = data.get("ocp_quay_s3_hostname")
        if not host:
            print("expected ocp_quay_s3_hostname for Quay MinIO option")
            sys.exit(1)
        vault = yaml.safe_load((root / "vault_quay.yml").read_text()) or {}
        if not vault.get("vault_ocp_quay_s3_secret_key"):
            print("expected vault_ocp_quay_s3_secret_key in vault_quay.yml")
            sys.exit(1)
        if data.get("ocp_quay_admin_user") != "quayadmin":
            print(
                "expected ocp_quay_admin_user=quayadmin, found "
                f"{data.get('ocp_quay_admin_user')!r}"
            )
            sys.exit(1)
        if vault.get("vault_ocp_quay_admin_password") != "QuayFormPass1":
            print(
                "expected vault_ocp_quay_admin_password from Quay tab, found "
                f"{vault.get('vault_ocp_quay_admin_password')!r}"
            )
            sys.exit(1)
        print("Quay MinIO option set ocp_quay_storage_backend")
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify no old bootstrap role references remain
      ansible.builtin.shell: |
        set -euo pipefail
        if grep -R -E \
          '{{ bootstrap_generate_content_legacy_role_pattern }}' \
          "{{ playbook_dir }}/../../roles/bootstrap_" -n; then
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
