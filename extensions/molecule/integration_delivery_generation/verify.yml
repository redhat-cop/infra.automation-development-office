---
- name: Verify generated resources and guard invalid inputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read Application
      ansible.builtin.set_fact:
        application: >-
          {{ lookup('file', '/tmp/ado-molecule-delivery/gitops-applications/'
             ~ 'devspaces-molecule.yml') | from_yaml }}
        resources: >-
          {{ lookup('file', '/tmp/ado-molecule-delivery/gitops/molecule/'
             ~ 'devspaces/resources/resources.yml') | from_yaml_all | list }}
        policies: >-
          {{ lookup('file', '/tmp/ado-molecule-delivery/policies/'
             ~ 'namespace-label.yml') | from_yaml_all | list }}
    - name: Assert delivery contract
      ansible.builtin.assert:
        that:
          - >-
            application.spec.source.repoURL
            == 'https://git.example.test/platform.git'
          - >-
            application.spec.source.path
            == 'gitops/molecule/devspaces/resources'
          - application.spec.syncPolicy is not defined
          - application.metadata.finalizers is not defined
          - resources | length == 2
          - resources[1].kind == 'CheCluster'
          - resources[1].metadata.namespace == 'workspace-platform'
          - resources[1].spec.networking.domain is defined
          - policies | length == 5
          - policies[3].spec.remediationAction == 'inform'
          - policies[2].spec.clusterSets == ['production']
          - policies[4].placementRef.kind == 'Placement'
    - name: Reject missing cluster selection
      block:
        - name: Try invalid ACM policy
          ansible.builtin.include_role:
            name: infra.ado.ocp_acm_policy
          vars:
            ocp_acm_policy_cluster_set: ''
        - name: Fail if invalid policy was accepted
          ansible.builtin.fail:
            msg: Invalid policy unexpectedly accepted
      rescue:
        - name: Verify validation rejected the missing target
          ansible.builtin.assert:
            that:
              - "'Specify the namespace label' in ansible_failed_result.msg"
