---
# yamllint disable rule:line-length
# Allowlist / safety-gate tests — no OpenShift cluster required.
- name: Converge — ocp_absent_cleanup allowlist gates
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Empty namespaces list must fail
      block:
        - name: Call role with empty namespaces
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces: []
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on empty list
          ansible.builtin.fail:
            msg: Role accepted an empty namespace list
      rescue:
        - name: Confirm empty-list assert fired
          ansible.builtin.assert:
            that:
              - >-
                'ocp_absent_cleanup requires'
                in (ansible_failed_result.msg | default('') | string)
                or 'non-empty'
                in (ansible_failed_result.msg | default('') | string)
                or 'Unexpected success' not in (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected empty-list refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Blocked platform namespace kube-system must fail
      block:
        - name: Call role with kube-system
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces:
              - kube-system
            ocp_absent_cleanup_mode: check
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on kube-system
          ansible.builtin.fail:
            msg: Role accepted kube-system
      rescue:
        - name: Confirm kube-system assert fired
          ansible.builtin.assert:
            that:
              - >-
                'refuses namespace'
                in (ansible_failed_result.msg | default('') | string | lower)
                or 'kube-system'
                in (ansible_failed_result.msg | default('') | string)
                or 'Unexpected success' not in (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected kube-system refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Blocked platform namespace default must fail
      block:
        - name: Call role with default
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces:
              - default
            ocp_absent_cleanup_mode: check
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on default
          ansible.builtin.fail:
            msg: Role accepted default
      rescue:
        - name: Confirm default assert fired
          ansible.builtin.assert:
            that:
              - >-
                'refuses namespace'
                in (ansible_failed_result.msg | default('') | string | lower)
                or 'Unexpected success' not in (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected default refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Invalid mode must fail
      block:
        - name: Call role with bad mode
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces:
              - cert-manager
            ocp_absent_cleanup_mode: delete-everything
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on bad mode
          ansible.builtin.fail:
            msg: Role accepted invalid mode
      rescue:
        - name: Confirm mode assert fired
          ansible.builtin.assert:
            that:
              - >-
                'must be'
                in (ansible_failed_result.msg | default('') | string | lower)
                or 'cleanup'
                in (ansible_failed_result.msg | default('') | string | lower)
                or 'Unexpected success' not in (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected invalid-mode refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Confirm allowlist converge complete
      ansible.builtin.debug:
        msg: ocp_absent_cleanup allowlist gates passed in converge
