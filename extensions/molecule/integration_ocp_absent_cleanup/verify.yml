---
# yamllint disable rule:line-length
# Re-assert allowlist gates (converge + verify are separate ansible-playbook
# runs; set_fact does not persist).
- name: Verify — ocp_absent_cleanup allowlist gates
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Empty namespaces list must fail
      block:
        - name: Call role with empty namespaces
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces: []
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on empty list
          ansible.builtin.fail:
            msg: Role accepted an empty namespace list
      rescue:
        - name: Confirm empty-list assert fired
          ansible.builtin.assert:
            that:
              - >-
                'Unexpected success' not in
                (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected empty-list refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Blocked platform namespace kube-system must fail
      block:
        - name: Call role with kube-system
          ansible.builtin.include_role:
            name: infra.ado.ocp_absent_cleanup
          vars:
            ocp_absent_cleanup_namespaces:
              - kube-system
            ocp_absent_cleanup_mode: check
            ocp_absent_cleanup_fail_if_present: false
        - name: Unexpected success on kube-system
          ansible.builtin.fail:
            msg: Role accepted kube-system
      rescue:
        - name: Confirm kube-system assert fired
          ansible.builtin.assert:
            that:
              - >-
                'Unexpected success' not in
                (ansible_failed_result.msg | default('') | string)
            fail_msg: >-
              Expected kube-system refusal, got:
              {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Confirm allowlist verification complete
      ansible.builtin.debug:
        msg: ocp_absent_cleanup allowlist gates verified
