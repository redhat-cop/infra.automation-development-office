---
dependency:
  name: shell
  # community.general 14+ redirects keycloak_* to middleware_automation.keycloak.
  # Install that collection so converge can resolve keycloak_clientsecret_info.
  command: >-
    ansible-galaxy collection install middleware_automation.keycloak
    -p "${MOLECULE_EPHEMERAL_DIRECTORY}/collections"
    --force

driver:
  name: default

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: >-
      ${MOLECULE_EPHEMERAL_DIRECTORY}/collections:${ANSIBLE_COLLECTIONS_PATH}
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  playbooks:
    converge: converge.yml

scenario:
  test_sequence:
    - dependency
    - syntax
    - converge
