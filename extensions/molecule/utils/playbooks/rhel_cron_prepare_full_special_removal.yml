---
- name: Prepare - rhel_cron full special removal scenario
  hosts: localhost
  gather_facts: false
  become: true

  tasks:
    - name: Seed all special cron schedules before removal converge # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: infra.automation_development_office.rhel_cron
      vars:
        rhel_cron_type: special
        rhel_cron_state: present
        rhel_cron_yearly_jobs:
          - { name: "yearly_test", job: "test" }
          - { name: "yearly_prod", job: "prod" }
        rhel_cron_monthly_jobs:
          - { name: "monthly_test", job: "test" }
          - { name: "monthly_prod", job: "prod" }
        rhel_cron_hourly_jobs:
          - { name: "hourly_test", job: "test" }
          - { name: "hourly_prod", job: "prod" }
        rhel_cron_daily_jobs:
          - { name: "daily_test", job: "test" }
          - { name: "daily_prod", job: "prod" }
        rhel_cron_reboot_jobs:
          - { name: "reboot_test", job: "test" }
          - { name: "reboot_prod", job: "prod" }
        rhel_cron_weekly_jobs:
          - { name: "weekly_test", job: "test" }
          - { name: "weekly_prod", job: "prod" }
        rhel_cron_annual_jobs:
          - { name: "annual_test", job: "test" }
          - { name: "annual_prod", job: "prod" }
