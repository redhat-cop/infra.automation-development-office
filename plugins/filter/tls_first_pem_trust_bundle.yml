DOCUMENTATION:
  name: tls_first_pem_trust_bundle
  author: Automation Development Office
  short_description: Return the first PEM candidate that contains a certificate
  description:
    - Evaluate the piped value and any additional positional PEM candidates
      in order.
    - Return the first candidate that contains at least one PEM certificate
      block, normalized as a PEM bundle.
    - Return an empty string when none of the candidates contain a certificate.
  options:
    _input:
      description: First PEM candidate (piped input).
      type: str
      required: true
EXAMPLES: |
  {{ primary_ca | infra.automation_development_office.tls_first_pem_trust_bundle(fallback_ca) }}
RETURN:
  _value:
    description: First usable PEM trust bundle, or an empty string.
    type: str
