DOCUMENTATION:
  name: tls_trust_bundle_from_secret
  author: Automation Development Office
  short_description: Build a CA trust PEM from Kubernetes TLS Secret fields
  description:
    - Prefer O(_input) (decoded C(ca.crt)) when it contains one or more PEM
      certificates.
    - Otherwise use intermediate/root certificates from O(tls_crt)
      (the leaf / first certificate is dropped).
    - Returns an empty string when only a leaf certificate is present.
      That is an intentional design choice of this filter - a lone leaf is
      not treated as a CA trust anchor for building a verification bundle.
      A self-signed certificate can still be trusted explicitly when it is
      supplied as CA material in O(_input) / C(ca.crt); this filter simply
      refuses to promote a leaf-only C(tls.crt) into a trust store.
  options:
    _input:
      description:
        - Decoded C(ca.crt) value from a TLS Secret (piped input).
      type: str
      required: true
    tls_crt:
      description:
        - Decoded C(tls.crt) chain used when O(_input) has no certificates.
      type: str
      default: ""
EXAMPLES: |
  {{ ca_decoded |
     infra.automation_development_office.tls_trust_bundle_from_secret(
       tls_decoded) }}
RETURN:
  _value:
    description: CA trust PEM bundle, or an empty string.
    type: str
