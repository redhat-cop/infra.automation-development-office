DOCUMENTATION:
  name: tls_trust_bundle_from_secret
  author: Automation Development Office
  short_description: Build a CA trust PEM from Kubernetes TLS Secret fields
  description:
    - Prefer O(ca_crt) when it contains one or more PEM certificates.
    - Otherwise use intermediate/root certificates from O(tls_crt)
      (the leaf / first certificate is dropped).
    - Returns an empty string when only a leaf certificate is present,
      because a leaf cannot verify itself as a trust anchor.
  options:
    ca_crt:
      description:
        - Decoded C(ca.crt) value from a TLS Secret (piped input).
      type: str
      required: true
    tls_crt:
      description:
        - Decoded C(tls.crt) chain used when O(ca_crt) has no certificates.
      type: str
      default: ""
EXAMPLES: |
  {{ ca_decoded | infra.automation_development_office.tls_trust_bundle_from_secret(tls_decoded) }}
RETURN:
  _value:
    description: CA trust PEM bundle, or an empty string.
    type: str
