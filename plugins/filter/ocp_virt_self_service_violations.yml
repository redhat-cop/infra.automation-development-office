DOCUMENTATION:
  name: ocp_virt_self_service_violations
  author: Automation Development Office
  short_description: Return why OpenShift Virt VM launch values are outside the self-service policy
  description:
    - Compare the values the C(ocp_virtualization) role is about to use with the approved self-service policy.
    - Return a list of plain-language reasons. An empty list means the launch is allowed.
    - Used by the shared provision playbook in self-service mode so an out-of-policy value fails no matter where it came from.
  options:
    effective:
      description:
        - Final role-facing values such as vm_name, vm_namespace, source_name, preference,
          instance_type, storage_class, network_mode, multus_network_name, root_disk_size
          and vm_state, the login values cloud_user, ssh_public_key, cloud_user_password,
          root_password, enable_root_ssh and hostname, plus the survey size label as C(size).
      type: dict
      required: true
    policy:
      description: The C(openshift_virt_self_service_policy) variable generated by Bootstrap.
      type: dict
      required: true
EXAMPLES: |
  {{ effective | infra.automation_development_office.ocp_virt_self_service_violations(policy) }}
  # []
RETURN:
  _value:
    description: Reasons the launch is not allowed. Empty when allowed.
    type: list
    elements: str
